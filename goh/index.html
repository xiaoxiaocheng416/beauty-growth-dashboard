ciate the follow\n\nHey (name) just saw you commented on my post\n\nHey (name) saw you engaging with my story, appreciate it\n\ndoing some research on my audience, where abouts are you based?\n\nBtw what nationality are you I can’t tell\n\nBtw where are you based i’m doing some research\n\nDifferent people experience different levels of reply rates so its important to split test and track what works well and also feel free to brainstorm and split test your own ones and check back with me\n\nThen have short convo 3-4 messages around the outbound message - basic rapport\n\n## Follow Up Structure\n\nFOLLOW UP STRUCTURE\n\nTo active convos\n\n1 - it’s not a bot btw haha - after 24hrs\n\n2 - NAME - 2 days\n\n3 - reply to story/highlight - 3 days\n\n4 - lmk bro dont want you falling behind lol - 5 days\n\nFor Proposed Calls\n\n(One day)\n\nyou managed to book?\n\n(Two day)\n\nLet me know brother\n\n(Three day)\n\nbeen a few days, if i dont get your confirmation by tonight im gonna assume your not serious about xyz goal\n\n(Four day)\n\nlmk bro dont want you falling behind lol\n\nFor Booked Calls\n\n(24 hours)\n\nYoo see you tomorrow for the call brother, looking forward to it\n\n(3 hours)\n\nGot our call in three hours man, all good to go for it?\n\n(1 hour)\n\nHere’s the zoom link bro see you in an hour\n\n‘Zoom link’\n\n## Call Notes Structure\n\nCALL NOTES STRUCTURE\n\n(On the day of the call it is vital for setters to write out these call notes to give to the closer in order to provide context for them, the format can be seen below)\n\n- Lead’s Name + Date & Time of Call:\n\n- \n\n- Closer:\n\n- Location & Occupation:\n\n- \n\n- Motivation/Goal:\n\n- \n\n- Valuable Info About Their Current/Past Situation:\n\n- \n\n- What is Their Pain/Obstacle:\n\n- \n\n- How Much Do They Have to Invest:\n\n## Example Conversations\n\nEXAMPLE CONVERSATIONS\n\n## MIRO BOARDS\n\n\n\n## DIY: Important Link\n\nIMPORTANT LINKS\n\nCalendly: [https://calendly.com](https://calendly.com/creatorblueprint/ig-creator-blueprint-1-on-1-call)\n\nVSL:\n\n## Coach Info\n\nCOACH INFO\n\nName:\n\n- \n\nAge:\n\n- \n\nPost Booking Resource:\n\n- https://\n\nInstagram:\n\n- @coach\n\nLocation:\n\n- \n\nCoaching Offer:\n\n- Example\n\n- Group coaching: Self-paced modules, group chat, group calls\n\n- Private: All those three components + ability to book bi-weekly private 1-on-1 calls\n\nPricing:\n\n- Example - 3k (group) and 5k (private)\n\nCoaching Structure:\n\n- Example - Digital via Whop (modules), Discord (group chat), Google Meet (group calls)\n\nIdeal Client:\n\n- 1. Already creates content\n\n- 2. Wants to make money online, specifically content\n\n- @example\n\nTop Pain Points:\n\n- Unsure how to find brand deals\n\n- Unsure how to land high paying brand deals (many creators just land product exchanges )\n\n- Unsure how to build a personal brand\n\nLanguage In The DM’s:\n\n- “Yo what’s up”\n\n- “How’s life?”\n\n- “No , I get you”\n\n- “Let’s run it”\n\n- “GOD is good”\n\n- “Ok perfect”\n\n- “Bet”\n\nExperience:\n\n- \n\nBackstory:\n\n- \n\nHobbies:\n\n- \n\nClient Results:\n\n- \n\nTop Pieces Of Content:\n\n- \n\nInstagram Handles Of People That Have Closed:\n\n- \n"},{"badge":"93","group":"sales-setting","section":"Forms","title":"Setter EOD Form","description":"End-of-day setter reporting form.","status":"form_archived","format":"html","sourceUrl":"https://docs.google.com/forms/d/e/1FAIpQLScLveo0P_krMEWutG1UdmPqFXPy8MFYJd08RaDjGW5tjvTuvg/viewform","portalUrl":"https://gohconsulting.app/sops?sop=93","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Setter EOD Form\n\n- Source: https://docs.google.com/forms/d/e/1FAIpQLScLveo0P_krMEWutG1UdmPqFXPy8MFYJd08RaDjGW5tjvTuvg/viewform\n- Category: sales-setting / Forms\n- Captured: 2026-09-21T14:02:33.175284+00:00\n\nSetter EOD Form\n\nJavaScript isn't enabled in your browser, so this file can't be opened. Enable and reload.\n\nSetter EOD Form\n\nThis is a KPI/ Progress Tracker to make sure you' e + Time of Call *\n\nYour answer\n\nDid they Show? *\n\nYES\n\nNO\n\nRequired\n\nDid they Close *\n\nYES\n\nNO\n\nRequired\n\nIf \"YES\" how much cash collected? (USD) *\n\nYour answer\n\nIf \"YES\" how much Revenue Generated? (USD) *\n\nYour answer\n\nWhy do you think they Closed/Didn't Close? *\n\nYour answer\n\nWho set the lead? *\n\nYour answer\n\nAny Other Relevant Info about the lead that could help Marketing/Setting *\n\nYour answer\n\nPost-Call Notes Completed ✅\nLet's close some more leads in the next calls\n\nSubmit\n\nClear form\n\nNever submit passwords through Google Forms.\n\nThis form was created inside of Goh Consulting. Does this form look suspicious? Report\n\n Forms\n\nHelp and feedback\n\nContact form owner\n\nHelp Forms improve\n\nReport\n"},{"badge":"96","group":"sales-setting","section":"Forms","title":"Pre-call Notes","description":"Pre-call notes form.","status":"form_archived","format":"html","sourceUrl":"https://docs.google.com/forms/d/e/1FAIpQLSf1tgQ0iBI0uD58elm2bVGvidZ4fLENdDjzagu_B8AvMjmsTA/viewform","portalUrl":"https://gohconsulting.app/sops?sop=96","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Pre-call Notes\n\n- Source: https://docs.google.com/forms/d/e/1FAIpQLSf1tgQ0iBI0uD58elm2bVGvidZ4fLENdDjzagu_B8AvMjmsTA/viewform\n- Category: sales-setting / Forms\n- Captured: 2026-09-21T14:02:37.010821+00:00\n\nPre-Call Notes\n\nJavaScript isn't enabled in your browser, so this file can't be opened. Enable and reload.\n\nPre-Call Notes\n\nPlease make sure to write in bullet points and keep it concise \n\nSign in to Google to save your progress. Learn more\n\n* Indicates required question\n\nLead’s Name + Date & Time of Call:\n *\n\nYour answer\n\nCloser: *\n\nYour answer\n\nLocation & Occupation: *\n\nYour answer\n\nValuable Info About Their Current/Past Situation:\n *\n\nYour answer\n\nHow Much Do They Have to Invest? *\n\nYour answer\n\nSubmit\n\nClear form\n\nNever submit passwords through Google Forms.\n\nThis form was created inside of Goh Consulting. Does this form look suspicious? Report\n\n Forms\n\nHelp and feedback\n\nContact form owner\n\nHelp Forms improve\n\nReport\n"},{"badge":"25","group":"fulfillment","section":"Coaching","title":"1-1 Breakdown SOP","description":"How a 1-1 breakdown call is run.","status":"content_archived","format":"","sourceUrl":"https://docs.google.com/document/d/1maDzU37GJSMLWgXrdqibmhMiZ1QCJTmNfbiOUWKalm8/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=25","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# 1-1 Breakdown SOP\n\n- Source: https://docs.google.com/document/d/1maDzU37GJSMLWgXrdqibmhMiZ1QCJTmNfbiOUWKalm8/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n.1-1 BREAKDOWN SOP.\n\n.GOH CONSULTING.\n\nGoal: Give you the entire SOP so that you can recreate a one-on-one breakdown with ease, understand the entire process, and create inbound sales with 0 objections\n\nI have personally abused this format to build my following but most importantly, generate lots of sales. 94% of the PIFs I've received in the last 6 months have watched at least one of these breakdown videos. This is the most indepth SOP on how you can recreate this type of success for yourself\n\n![Embedded image](../assets/25/kix_g9n029g5kps8.png)\n\n![Embedded image](../assets/25/kix_setkf89r2n4d.png)\n\nWhat is this format: A simple one-on-one breakdown with a client or a prominent figure that shows your expertise by demonstrating what you would do in their current situation to achieve a desired outcome based on the obstacle that the person is facing.\n\n- Perfect to kill two birds with one stone: can tackle a client one-on-one session and also get a piece of content out of it (ideally in the earlier onboarding phase)\n\nWhy is it important: Anyone can script a video, anyone can script the reel, but you can't fake a live coaching session. This is the perfect format to show your expertise, handle objections that your prospects are facing, and differentiate your coaching style from everyone else\n\n- Bonus: you can actually document the progress after the coaching session and the results they have achieved. This is the perfect way to show proof about being salesy. You are simply documenting and showing what it looks like when someone applies the information that you teach.\n\n- Example: I did this with Alessio and Bryan with these 2 videos and we generated a lot of inbound bookings. People could see their transformation live in real time, and this allows the prospects to put themselves in your client’s shoes and think “i can achieve that same exact transformation as well”\n\nWhat type of content is this: This is MOF/ BOF content designed to kill all objections and create lay down sales (views DO NOT matter for this format). Your prospects are thinking about a million things:\n\n- Is this guy worth working with?\n\n- Is this guy really as good as he says he is?\n\n- Is his coaching style suited to me?\n\n- Will I enjoy actually working with him?\n\nThis format breaks down every single one of those objections in detail by just showing instead of telling\n\nThat is the most important part. Instead of us telling, we are letting our viewers come to the conclusion by themselves and figuring it out based on our style of coaching.\n\nFor example, a lot of you have chosen me because I am more direct, I'm more straightforward instead of beating around the bush and sugarcoating things.\n\nThat's also the same reason someone may not have chosen me. I’m attracting my specific tribe and pushing everybody else away. That is what you're doing with this format. Now let's get into how you can execute this\n\n.Choose The Person.\n\nGoal: We want to intentionally pick and choose the best person for this video. Just because it's convenient to go with someone that’s nearby does not mean you choose them. You want to be extremely intentional about this process\n\nIdeally choose someone who is your PERFECT ICP and in the situation that you can best help them\n\nIf you choose someone that’s convenient but starting from 0 that is still studying in college, you will naturally attract a lot of broke people\n\nHowever if you choose someone that was already doing 6 figures/ year in their corporate job, building this side hustle to replace his full time income, and paid in full, then you will attract a similar person\n\nShow someone in your content that you would want to actually work with\n\nFor example: I chose to do one with Emma Lavri, one of the clients in the program\n\n- We already scaled her from $30k/mo to $125k/mo and now i was mapping out the exact plan that i would take if i was her to go from $100k/mo to $200k/mo\n\nWhy did I do this?\n\n- She was in a position where she was extremely qualified ($100k/mo)\n\n- She faced similar problems that a high level ICP would face\n\n- She is very charismatic and entertaining on camera\n\n- We could film other videos as well (client interview, miro breakdown, etc)\n\nChecklist\n\n- Is the person im choosing perfect ICP\n\n- Does the person have similar problems/ pain points that a qualified audience can relate to\n\n- Are they charismatic and good on camera\n\n- BONUS: Does this person have a good network of people that are your exact ICP (especially for B2B)\n\n.Script.\n\nOnce we’ve decided on the person, we have to make sure we understand what the video is going to look like\n\nScript out the entire hook of the video so that you preframe exactly what the viewer is going to get. Lean into your credibility, what makes you stand out, and confirm the thumbnail and title of the video\n\n![Embedded image](../assets/25/kix_9u48v4bp9b0u.png)\n\nPart of creating a sick youtube video is the intention and leaving nothing up to chance. Yes you can have a good day and absolutely smash the 1-1 breakdown with no preparation\n\nBut we want to prepare for the worst case scenario so that the video is still going to perform and get views\n\nThere’s a bunch of ways you can go about preparing for this video\n\n1) Pure free flow (risky but fun)\n\nBlank notion page, get the customer’s current situation, obstacles they face, and rip it from there\n\nPros\n\n- Minimal friction: not much preparation needed\n\n- Can do extremely last minute if needed\n\n- Can get into flow state easily\n\nCons\n\n- Will have a lot of fluff/ repeated information in the video\n\n- Heavy on editing side, if you don’t have a good editor this video will not perform well\n\n- Will be boring for the viewer especially if you don’t understand youtube retention, interest peaks, and direct response\n\n2) 3 main things (perfect balance)\n\nMap out 3 main things that you want to cover in a video and break it down\n\n- Finding your zone of genius\n\n- How to build one of one brand identity\n\n- How to stand out from a saturated market\n\nThese were the three main points that I wanted to go over, I had in-depth examples and analogies that I knew I was going to bring up in the video.\n\nBonus: had cuts to make the video more engaging and more well put together\n\nPros\n\n- More structure to the video\n\n- Better value given if you understand what frameworks and analogies you want to use\n\n- Better retention for the viewer because you can script out the youtube video\n\nCons\n\n- Takes more time\n\n- Slightly hard to do if you don’t have people helping you\n\n.Location.\n\nGoal: We want to intentionally pick a nice location for this video so that we increase our brand perception, make it easier for the viewer to watch, and make it fun\n\nThis is very simple, don't overcomplicate it. Choose a location that your audience aspires to be in.\n\nCould be a nice high-rise, office, aesthetic place, etc. Don't overcomplicate this, here are a few examples\n\n- If you don’t have nice spots, check out these pearspace for spaces that you can rent for a few hours\n\n- Be creative with this, you can rent out airbnbs, co working spaces, offices, you don’t need to film it at your house\n\nThe more important thing is the lighting, camera set up, and audio quality.\n\n![Embedded image](../assets/25/kix_4az6eu1sycuj.png)\n\n![Embedded image](../assets/25/kix_fd7anldlgvk1.png)\n\n![Embedded image](../assets/25/kix_k9kzufwwb9cd.png)\n\n.Camera + Lighting Setup.\n\nEquipment List:\n\n- 3x Cameras\n\n- 2x Key Lights\n\n- 2x 24-70 lens\n\n- 1x 16 mm lens\n\n- 1x DJI Mic\n\n- 2x Shotgun Mics\n\nThis is personally what we use, but work with what you have. If you don’t have all the equipment, do not stress out and end up not filming the video. Actually creating the video is more important than anything, even using an iphone to film is not bad at all.\n\nHow to use each piece of equipment:\n\n- Setup 3 Cameras. One camera should be a dedicated wide angle that captures the entire scene. With the remaining two cameras, focus one on you and one on the client. You want to build a nice perspective, a blurry background, and a low f-stop to create depth.\n\n- Attach the 24-70 lens to the cameras focused on the subject\n\n- Attach the 1x 16 mm lens to the wide focus camera\n\n- Next, set up two keylights. There should be one dedicated keylight per subject.\n\n- Note that if there is natural lighting, a keylight may not be necessary. If the natural lighting is behind the subject (in the background) a keylight will be necessary.\n\n- To finalise everything, set up the audio. The DJI mic should be attached to the wide angle camera as this is the camera that will be rolling the entirety of the video. The shotgun mics should be attached to the dedicated subject cameras.\n\nNote: Make sure to run an audio check before you commence recording.\n\n.Post Production.\n\nGoal: leverage all 3 camera angles to create a high retention video that holds the viewer’s attention for 40-50 minutes and pre-handles their limiting beliefs or objections\n\nStep 1 - Sync all of the Footage\n\n- Upload all the footage to your Frame folders and label your angles clearly  Wide / Host / Client\n\n- Sync all 3 cameras (wide, you, client) using the audio waveform or timecode and build a multicam sequence\n\n- Pull the clean audio: DJI off the wide as your safety track, shotgun mics for each subject\n\nStep 2 - General Cuts\n\n- Remove any excess cuts to get your raw runtime down to the tightest possible cut where nothing is wasted\n\n- Every sentence should add something to the video by either providing value or opening a loop\n\n- If it doesn’t, this is your sign to remove it because it is just ‘fluff’\n\nStep 3 - Multicam Edit\n\n- Cut on the speaker, use the wide angle to reset or show context, and use reaction shots to add tension\n\n- Use camera changes to act as a pattern interrupt\n\nStep 4 - The Hook & Intro\n\n- Pay off the promise in the thumbnail and title immediately so the viewer reaffirms why they clicked on the video\n\n- Preframe exactly what they're going to get, then drop them into the breakdown\n\nStep 5 - Add Supporting Visuals\n\n- Text overlays for key points, frameworks, and numbers\n\n- Screen recordings, Miro boards, or whiteboard captures whenever you reference them live\n\nStep 6 - Colour + Audio Finishing\n\n- Have a consistent colour grade to support your visual identity\n\n- Level every speaker so no one is too loud or too quiet\n\n- Run noise reduction using tools like Adobe Podcast and mix in music where relevant\n\nStep 7 - Packaging & Repurposing\n\n- Use our Clipping SOP to find the clips with the most viral potential and convert these into Short Form videos\n\n- You can also watch through the video and search for clips manually\n\n- Add Chapters & Timestamps in YouTube Studio\n\nPS. If you have any questions on the camera setup + post production, ask the community. Yash and the team will get back to you, i did not write this section lol\n\n.Things To Note.\n\nIn order to execute this, watch a full video of me executing it live. You will pick up on specific nuances that I do that allow me to make this video perform better\n\n- Retention is everything\n\nGo over broad advice that can be applied to the majority of people instead of hyper-specific advice in the beginning. Think back to the content foundations on TOF, even though this is a MOF piece, we don't want to go full on ICP mode. Talk to your dream follower in the beginning, then your ICP in the middle\n\n- Pick and choose different dream ICPs\n\nIf you have different ICPs that you attract in your content, try to get every single type of ICP on this specific breakdown so that your setters can use these as sales assets to nurture them\n\nIf you do it right, the setting process will become extremely easy and smooth because the youtube videos literally handle all objections for them\n\n- Have fun with it\n\nThe best one-on-one breakdowns are where you have fun with it. Joke around with the client, show what your personality is like. Be yourself. Don't take it too seriously.\n"},{"badge":"55","group":"fulfillment","section":"Client Success","title":"Workflow + Communication With Us To Get Trained","description":"How to work with the team, and what to send to get feedback fastest.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/18x8FrG2YMspTqphjrTdFqXTtX9sLrA1zzpbvviaGJDE/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=55","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Workflow + Communication With Us To Get Trained\n\n- Source: https://docs.google.com/document/d/18x8FrG2YMspTqphjrTdFqXTtX9sLrA1zzpbvviaGJDE/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\nWORKFLOW + COMMUNICATION WITH US TO GET TRAINED\n\n#### First things first\n\ncall times with George:\n\n- monday 5pm UK\n\n- lounge time throughout the week (ask George if you need review or direction, closed mouths don't get fed)\n\ncall times with nick (you and your setter can join these)\n\n- mon - 6pm uk\n\n- wed - 6pm uk\n\n- fri - 6pm uk\n\nThe way we judge how good someone is at setting is by how problem aware they are in their setting process.\n\nThis means being aware of what's stopping you from booking 5 calls a day if you’re doing 2/day right now for example\n\nLead flow or volume of convos or lead quality is not an answer, look at your setting process, do end of week + month reviews and figure out what you can do in the DMs to convert more.\n\nAsk yourself:\n\n- Do you know where convos are dropping off?\n\n- Do you know your outbound reply rate?\n\n- Figure out the leaks and then start to look for solutions\n\n##### How to set up your workflow\n\n##### 1. You don't have a setter\n\nReally you want to work on setting during peak times to maximise your efficiency if you set for yourself > block out time during the day to focus and set for a set period of time (the more you can the more cash you’ll make so don't do 20 minutes, most people do about 2 hours).\n\nLeads who are trying to find ways to get out of their 9-5/older audience peak times are 11-1pm est and 4-6pm est\n\nIt can be offer dependant so to test: set throughout the whole day for 2-3 days and track hourly\n\nHour 1/2/3/4/5etc:\n\nOb + Fu:\n\nPitched:\n\nBooked:\n\nHow was the convos this hour:\n\nFrom here you will see which hours do best and you can book the same amount of calls from doubling down on those hours.\n\nYou also want to focus on the leads that are the ‘lowest hanging fruits’ this means using your tracking sheets to fu with the booked calls that:\n\n- didnt show/didnt close\n\n- the guys you pitched which never booked\n\n- the guys actively watching your stories\n\n- the people you sent yt vids to and left as touchpoints\n\nThe workflow everyone should be following though:\n\n- Call notes\n\n- Cancel DQ calls\n\n- Follow up with booked calls (Postbooking + set reminders to follow up for the calls so they show up)\n\n- Follow up with proposed calls\n\n- Clear inbox\n\n- Clear comments (videos promoting UGC)\n\n- Outbound\n\n- Follow ups (conversations that weren’t replied to)\n\n- Update trackers and tags\n\n#### 2. you have a setter\n\nthere are 2 parts to this if this applies to you\n\n- you’re making 30k/pm+\n\nin this case the most important thing is making sure you’re managing well and are aware of all problems in the setting process\n\nwhat that should look like:\n\nmanagement calls 3x a week\n\n- on these you can look at the setters eod’s and see how well they’ve been doing with their stats + how much they're working\n\n- hold them accountable to a higher standard\n\n- you should know your kpi’s needed to hit a record month (covered in modules) so hold them to that level\n\n- IF NOT on track with KPI’s then figure out why not, first ask them, but mostly you’ll need to discover the problems\n\n[ ] convos dropping off > check reply times\n\n[ ] convo vol issue > follow up / outbound amount and reply rate > test for a few days and see which ones work > get it to at least a 30% reply rate\n\nteam call 2x a week\n\n- holding the whole team accountable but hold the setter accountable in front of everyone and give flowers where flowers are due if he's crushing it\u000b\u000b b. you’re below 30k/pm\n\nstill run the same set up with team calls but the main difference is you should still be in the DMs\n\n- you want to show the setter what standard you have and that way if they drop off or dont get all the booked calls they should be you dont lose cash, you’ll make more and you’ll be able to understand setting to a higher level\n\n- keep times on calendar where you set\n\nAbove all show up in the 1 on 1 chats for George and Nick\n\nif you want to make more money with setting, make it easier for them and send regular convos to review and updates on your struggles\n"},{"badge":"65","group":"fulfillment","section":"Coaching","title":"Live Calls","description":"Running live calls so people leave with something to do.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1jN51YQGOXBzK4JSsrUGIM8zPWYJVqv2MYoQaipVqxSw/edit?tab=t.0#heading=h.wscqpazo4k4","portalUrl":"https://gohconsulting.app/sops?sop=65","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Live Calls\n\n- Source: https://docs.google.com/document/d/1jN51YQGOXBzK4JSsrUGIM8zPWYJVqv2MYoQaipVqxSw/edit?tab=t.0#heading=h.wscqpazo4k4\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### LIVE CALLS\n\nThis works extremely well because the prospect is in an emotional state already and very recently\n\nPitch the call the same way except after they say yes just say:\n\n“actually have time in the next hour are you free in 30 min or an hour to jump on a zoom call? it’ll be roughly 45 min”\n\nfor this you need to be in great contact with the setter or the closer needs to be but if you're the owner taking calls you should make an effort to do this your show up rate is going to be extremely high too since its right after the convo\n\nif they can’t just ask:\n\n“no problem what time today or tomorrow would work?”\n\nand then transition to using the calendly or book them manually\n\nthe more people you can hop on asap with the more you’ll close though until call volume gets very high and your calendar is too busy to take last min calls\n\nsmall trick that can make a big difference, some businesses doing $2m/month use this\n"},{"badge":"30","group":"systems","section":"Miro","title":"Miro SOP","description":"Loom walkthrough of how the Miro boards are used.","status":"archived","format":"mp4","sourceUrl":"https://www.loom.com/share/824d69f14fa64637af130817b4eaef16","portalUrl":"https://gohconsulting.app/sops?sop=30","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Miro SOP\n\nSource: https://www.loom.com/share/824d69f14fa64637af130817b4eaef16\n\nPlatform-generated transcript; retained verbatim, not human-verified.\n\nHey, man. Hope you're well. So, just to give you a very brief breakdown\non how to create a mirror board,\nuh, essentially what you have to do,\nbro, is pull out a document,\num, and write your entire script,\nright? Every single point that you need to have on that,\nuh, mirror that you're creating, right?\nUm, so create a document, whether on notion,\nwhether on Google Docs. Um,\nyou don't have that first. because,\nagain, that's going to give you a better idea on what to put on\nyour bureau. And then after you've done that,\nI recommend two ways you can go about building a bureau.\nSo a mind map such as this works great if\nyou're explaining, um, an entire structure,\num, and breakdowns,\nright? Because, um, that doesn't have to be linear.\nIt doesn't have to be a straight line, right? You can go back and\nforth and, um, just have an entire map to show people.\nFor example, in this two 24k month breakdown,\num, but you can go from here,\nuh, on the earnings review to like over here on six YouTube videos on\nover here, KPI and employment settings based on what you think should come next.\nright and it gives you easier access to explain things right it looks very\ngood as well and then again by zooming in and out like this you\ncan easily show your clients what they need to see while we\nare explaining the mirror on your YouTube video and everything,\nright? Um, but let's just say you have a,\nuh, you know, a linear structure that you have to follow,\nuh, for example, a onboarding process.\nSo for an onboarding process, your mirror will look something like this,\nright? This is us explaining our road map.\nNow the road map is, again, it's a very straight line from A to\nZ. So from that we're gonna start from phase one,\nphase zero to all the way to like, you know, our last phase so\nit needs to be a straight line. So, for that,\nwe're going to follow this sort of, you know, pattern.\nSo, again, it's, you know, just straight line,\nyou go down and down, explaining things and and again,\nthis is, uh, what you would do if you have,\nagain, something like an onboarding process,\nlike a road map, something that's very linear,\nyou have to pull a step by step by step by step, right?\nUm, other than that, that's about it. Um,\nif you'd like, you can get creative with it, you can also combine this\nwith a mind map structure as well.\nUm, any other, you know, you can have a radial structure,\nwhich means like a circular pattern as well, you can have a box pattern\nwhere you explain certain things as well. It depends on what you think looks\ngood and what you think, you know, it's gonna help you convey What you\nwant to to your audience, right?\nThis is what works best for us and, uh,\nyeah. So again, I'll repeat myself.\nIf you have a free flow pattern,\nI recommend a mind map structures similar to this,\nright? Of course, of course, have your notion or your google doc writing with\nyour entire script. And then again, if you have a free flow pattern,\nuse this. And then if you have a very linear pattern structure that you\nhave to follow step by step, then use, um,\nyou know, a straight structure like this. And I hope,\nuh, you know, everything is clear after this. Let me know.\n.\n"},{"badge":"64","group":"systems","section":"Miro","title":"Miro Board Monthly Breakdown","description":"The monthly breakdown run on the Miro board.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1HrveDL7fpXsxObD47moNaLcXDMODpXAoMdVZDljXbQc/edit?tab=t.0#heading=h.4m3z09us2yyn","portalUrl":"https://gohconsulting.app/sops?sop=64","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Miro Board Monthly Breakdown\n\n- Source: https://docs.google.com/document/d/1HrveDL7fpXsxObD47moNaLcXDMODpXAoMdVZDljXbQc/edit?tab=t.0#heading=h.4m3z09us2yyn\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### MIRO BOARD MONTHLY BREAKDOWN\n\nPeople are usually either unaware there is a problem in setting or keep the problem very surface level without going deep into it which limits their ability to find a solution\n\nWe do these monthly so you get a visual breakdown of your stats from the month, it gives you a time to scheme what to improve specifically in the appointment setting and to see where the inconsistencies are\n\ndocument how you found the month > day to day tasks / intentions so you know what to go back to doing if you drop off > workflow can be so important\n\nbreakdown of each lead that closed/booked if you have low volume so you can find similarities in the type of lead/convos youre having and you can double down on specific traits your audience have, that section could also be used to see what fu’s or outbounds are working well, what yt vids the closed guys have been sent ITS SO VERSATILE\n\nfinally set clear targets for yourself > without this you never push as hard or have a set standard to hit\n\na new thing we’ve added is setting clear skills for the setter to work towards each month, this is a team culture thing as well as a cash driver\n\n‘people dont leave companies. they leave lack of progress’ so in the same way push your team to work on themselves and push themselves each month for themselves which in turn helps the biz\n\nthis is something you can go back to on team calls and training calls to hold them accountable to\n\nweekly reviews are also something we do on miro boards, we know what stats we need to average for the month by this point so its as simple as seeing if we are on target, above target or below. and then documenting whats going well or becoming problem aware as to whats holding the booked calls back, and figuring out/testing different solutions to fix it.\n\nTRAINING\n\n- another use of our miro is training, so when convos are reviewed or when George/Nick gives feedback make a note and have the setter revise it so it really gets in their head not to do again\n\n- if your setter doesnt take feedback and keeps making the same mistakes, you know you need a new setter that will improve, but it also increases the likelihood they will and increases the speed at which they do so\n"},{"badge":"66","group":"systems","section":"Tracking","title":"How to use trackers","description":"The growth and ICP trackers, and what to do with what they show.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/18KKKT_e4GwhjwBgRaj_IGPF16C708Zf_wOKvEwRpPoQ/edit?tab=t.0#heading=h.kpwlf2b5sap","portalUrl":"https://gohconsulting.app/sops?sop=66","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# How to use trackers\n\n- Source: https://docs.google.com/document/d/18KKKT_e4GwhjwBgRaj_IGPF16C708Zf_wOKvEwRpPoQ/edit?tab=t.0#heading=h.kpwlf2b5sap\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### HOW TO USE TRACKERS\n\nThe icp leads tracker is meant mainly for guys getting under or around 20 follows a day or it won't be sustainable as it has to be tracked manually\n\nIf you have a very specific ICP e.g. barbers, coaches then you should do this tracker always as its unlikely you’re getting more than 20 ICP follows a day and the data is vital\n\nit helps you with what content to double down on and offers as a pipeline of all recent follows to speed up the nurturing process / easier follow ups\n\neveryone should be using the pitched call and booked call trackers\n\n[SETTING TRACKERS](https://docs.google.com/document/d/1Oo4KsD_PsVmRUiFaWeAdP9pHF03urFwlXDw9fOi-8zU/edit?usp=sharing)\n"},{"badge":"97","group":"systems","section":"Reporting","title":"Looker Studio Loom","description":"Loom walkthrough of the Looker Studio setup.","status":"archived","format":"mp4","sourceUrl":"https://www.loom.com/share/c9353643b31d4ea389afcd2a030d1e2f","portalUrl":"https://gohconsulting.app/sops?sop=97","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Looker Studio Loom\n\nSource: https://www.loom.com/share/c9353643b31d4ea389afcd2a030d1e2f\n\nPlatform-generated transcript; retaine yeah,\njust, just go ham. Do what you think looks best.\nAnd, uh, yeah. That's about it for the most part.\nThis same concept applies if you're adding in more scorecards,\nif you're adding in a another table,\nand then, um, you know, if you're adding in any sort of data,\nas well. is gonna apply for, you know, this.\nSo what I recommend is try creating it on your own\nand then as things come up.\nSo, you know, we can sort of go through,\nuh, how we would basically go about fixing those things and then we can\njust take it from there. So yeah, I hope this explains,\nuh, much about, uh,\nbasically how to set up a Looker Studio and then customize it to your\npreference and what you would need to get it started as well.\nSo yeah, I hope this makes sense, bro. And then after you're done,\nyour thing can look like this. You know,\nobviously you're a Dashboard, a DM Dashboard. Um,\nI don't recommend having YouTube, Instagram,\num, Dashboard at all. because these are mostly for vanity,\nI, if I would say so myself, um,\nads, only if you're running ads, then you can have this, um, and then\nyeah, should be good to\n"},{"badge":"98","group":"systems","section":"Reporting","title":"Looker Studio SOP","description":"Build and read the Looker Studio reporting.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1f1_-AYB3-buCLopVAr42Cas9cBWCYgbf8j56u5eaQkQ/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=98","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Looker Studio SOP\n\n- Source: https://docs.google.com/document/d/1f1_-AYB3-buCLopVAr42Cas9cBWCYgbf8j56u5eaQkQ/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n.LOOKER STUDIO.\n\n.COMPLETE SOP’s DOC.\n\nPURPOSE:\n\nThis is a step by step guide for working with Looker Studio dashboards. It is intended to ensure consistency, accuracy, and reliability across all reports while preventing common errors caused by data or configuration issues.\n\nDeviating from these steps may result in incorrect data, broken dashboards, or reporting inconsistencies.\n\nGeneral Rules:\n\n- MOST issues you will face are caused by the underlying data, not by Looker Studio itself.\n\n- DO NOT make changes to the sheet structure. Changing column names, deleting columns, reordering columns, or inserting new columns will break the dashboard and cause errors.\n\n- All formatting in the source sheets must remain consistent.\n\n- KPIs must remain numeric only. No text, symbols, or special characters are allowed in KPI fields.\n\n- Dates must follow the same format everywhere: Name of Month Date, Year (example: December 4, 2025).\n\n- Name and Lead Source filters will automatically update from the connected sheet. You do NOT need to manually change them\n\nThe Date Range Filter:\n\n![Embedded image](../assets/98/kix_45rdyntjumis.png)\n\n- Every dashboard page has a date range filter applied, you can find it on the top-right.\n\n- All metrics/bar graphs inside of it automatically have the filter applied on them\n\n- EVERY scorecard, chart, or metric MUST have its default date range set to AUTO.\u000b\n![Embedded image](../assets/98/kix_r53f0osug4oq.png)\n\n- If a metric is set to Custom instead of Auto, it will NOT follow the page level date filter, and will make the data look inconsistent or broken\n\nChanging Data Metrics:\n\n- Click on the scorecard you want to edit.\n\n- In the right hand panel, go to the Setup tab.\n\n- Under Primary Field, click on the currently selected metric.\u000b\n![Embedded image](../assets/98/kix_w5juozqn3yqi.png)\n\n- Select the new metric you want to display (for example, Calls Booked).\u000b\n![Embedded image](../assets/98/kix_hdpyk1t1jph5.png)\n\n- And that’s it!\n\nChanging the Formula:\n\n- Click on the scorecard.\n\n- In the Setup panel, click on the formula icon on the left of your metric\u000b\n![Embedded image](../assets/98/kix_vzmvjg9rkzld.png)\n\n- Make changes to the formula (use help of ChatGPT if need be)\u000b\n![Embedded image](../assets/98/kix_mojl5rfkbebb.png)\n\n- Play around with Data Type and Display Format as required.\n\nDuplicating A Page:\n\n- Click on the Page 2 of 4 in the top bar.\u000b\n![Embedded image](../assets/98/kix_wual7amo8t4w.png)\n\n- On the right bar, click on the ellipses and click on duplicate page\u000b\n![Embedded image](../assets/98/kix_ib1jr0cf85oc.png)\n\n- Click on the ellipses again to rename the duplicated page\n\nReconnecting a Data Source:\n\n- Click Resource in the top menu and select Manage added data sources.\u000b\n![Embedded image](../assets/98/kix_s07v5vkfpzvl.png)\n\n- Click Edit next to the affected data source.\u000b\n![Embedded image](../assets/98/kix_jq0b2zyn29ht.png)\n\n- Click on Edit Connection\u000b\n![Embedded image](../assets/98/kix_n22lygfz50dp.png)\n\n- Select the sheet and click Reconnect.\n\nChanging Aggregation:\n\n- Rule of Thumb\n\n- KPIs numbers should be sums\n\n- Percentages should be averages\n\n- Select the chart or scorecard.\n\n- Go to the Setup panel.\n\n- Click on the metric.\u000b\n![Embedded image](../assets/98/kix_smaxodlh0q67.png)\n\n- Set new data aggregation\u000b\n![Embedded image](../assets/98/kix_6t13ds44b8pk.png)\n\nAdding a Metric to a Bar Graph:\n\n- Click on the bar graph.\n\n- Open the Setup panel.\n\n- Under Metric - Y axis, click Add metric.\n\n- Select the metric you want\n\nChanging Style:\n\n- Select the bar graph.\n\n- Go to the Style tab in the right hand panel.\n\n- Adjust colors, bars, labels, and axes as required.\n\n- The same styling rules apply to all other elements such as scorecards, tables, and charts.\n"},{"badge":"100","group":"systems","section":"Team","title":"Managing Editors","description":"Manage editors day to day without becoming the bottleneck.","status":"archived","format":"pdf","sourceUrl":"https://drive.google.com/file/d/1DFnyd4QK3jdeMMl6dQlj_DQeh3KcEcku/view","portalUrl":"https://gohconsulting.app/sops?sop=100","origi  \nthemselves\n \nfrom\n \nachieving\n \n  \n \n \n\n### Page 2\n\nHow\n \nto\n \nprevent\n \nm ess-ups\n \n -  Teach  them  the  consequences  of  messing  up  and  not  ﬁxing  the  issues   -  Get  them  to  reverse  engineer  why  they  messed  up  (teaches  self  \naccountability\n -  Teach  them  the  importance  of  overdelivering  \n \nCom m unication\n \nChannels\n \n  You  want  to  ensure  that  editors  of  clear  channels  for  communication  to  occur  this  \nis\n \nhow\n \nyou\n \nremain\n \norganized\n \nwithin\n \nyour\n \nbusiness\n \nand\n \navoid\n \nclustered\n \nmessages\n \nwith\n \ndifferent\n \ndepartments\n \nin\n \nyour\n \nbusiness\n  \n \n \n \n \n \n \n \n \n \n \n \n \n \n\n\n### Page 3\n\n \nAccountability\n \nChannels\n \n \n  As  a  business  owner  you  always  want  an  understanding  of  what’s  happening  \nwithin\n \noperations\n  It  is  also  good  to  keep  your  editors  accountable  and  you  can  do  this  by  getting  \nthem\n \nto\n \nimplement\n \nan\n \nEOD\n \nreport\n \n \nContent\n \nSystem s\n \n  This  will  give  you  a  good  overview  of  what  content  is  in  the  pipeline  and  it  will  also  \nbe\n \na\n \nplace\n \nwhere\n \nyou\n \ncan\n \nlocate\n \nall\n \nvideos\n \nthat\n \nare\n \nbeing\n \nworked\n \non\n \n-\n \ninstead\n \nof\n \nscrolling\n \nup\n \na\n \nchat\n \nwhere\n \nvideos\n \ncan\n \nbe\n \nlost\n  \n\n\n### Page 4\n\nTemplate:  https://catna.notion.site/Template-261a52da711f80e1b117da2fb3236792?source=copy_link  \n"},{"badge":"108","group":"systems","section":"VSL","title":"VSL Template","description":"The VSL template to work from.","status":"link_only","format":"","sourceUrl":"https://gamma.app/docs/Template-VSL-a7uk78atvk6x4jg?mode=doc","portalUrl":"https://gohconsulting.app/sops?sop=108","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# SOP 108 · VSL Template\n\n[打开原始公开链接](https://gamma.app/docs/Template-VSL-a7uk78atvk6x4jg?mode=doc)\n\n- 栏目：systems / VSL\n-   <script>
(() => {

  const archivedStates = new Set(['archived', 'content_archived', 'form_archived']);
  let activePhase = data.roadmap[0]?.id || '';
  let activeGroup = 'all';
  let searchQuery = '';

  function escapeHtml(value = '') {
    return String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function safeExternal(url) {
    try {
      const parsed = new URL(url, document.baseURI);
      return ['http:', 'https:', 'file:'].includes(parsed.protocol) ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function assetUrl(pathValue, sop) {
    if (!pathValue) return '#';
    if (/^https?:\/\//i.test(pathValue)) return safeExternal(pathValue);
    if (pathValue.startsWith('__SOP_ROOT__/')) {
      return safeExternal(data.sopAssetBase + pathValue.slice('__SOP_ROOT__/'.length));
    }
    const snapshotMarker = '/2026-09-21/';
    if (pathValue.includes(snapshotMarker)) {
      const relative = pathValue.split(snapshotMarker).pop();
      return safeExternal(data.sopAssetBase + relative);
    }
    const base = new URL(data.sopAssetBase + (sop.sourceDir ? `${sop.sourceDir}/` : ''), document.baseURI);
    return safeExternal(new URL(pathValue, base).href);
  }

  function localFile(pathValue) {
    if (!pathValue) return '';
    return safeExternal(data.sopAssetBase + pathValue);
  }

  function inlineMarkdown(value, sop) {
    const source = String(value || '');
    const token = /(!?)\[([^\]]+)\]\(([^)]+)\)|\*\*([^*]+)\*\*|`([^`]+)`/g;
    let output = '';
    let last = 0;
    let match;
    while ((match = token.exec(source))) {
      output += escapeHtml(source.slice(last, match.index));
      if (match[2] !== undefined) {
        const url = assetUrl(match[3].trim(), sop);
        output += match[1]
          ? `<img src="${escapeHtml(url)}" alt="${escapeHtml(match[2])}" loading="lazy">`
          : `<a href="${escapeHtml(url)}" target="_blank" rel="noreferrer">${escapeHtml(match[2])}</a>`;
      } else if (match[4] !== undefined) {
        output += `<strong>${escapeHtml(match[4])}</strong>`;
      } else {
        output += `<code>${escapeHtml(match[5])}</code>`;
      }
      last = token.lastIndex;
    }
    return output + escapeHtml(source.slice(last));
  }

  function articleMarkdown(markdown, sop) {
    const lines = String(markdown || '').replace(/\r/g, '').split('\n');
    let index = 0;
    const skipBlank = () => {
      while (index < lines.length && !lines[index].trim()) index += 1;
    };
    const isArchiveMetadata = (line) => {
      const value = line.trim();
      return /^-\s*(Source|Category|Captured|Capture|Tab count):/i.test(value)
        || /^Source:\s*/i.test(value)
        || /^Platform-generated transcript;/i.test(value)
        || /^\[打开原始公开链接\]\(/.test(value)
        || /^-\s*栏目：/.test(value)
        || /^-\s*\[SOP 门户入口\]\(/.test(value)
        || /^-\s*(Miro 实际名称|门户条目|白板名称|来源|范围|整理方式|图中的观点)：/.test(value)
        || /^-\s*\[打开原始 Miro 白板\]/.test(value);
    };

    skipBlank();
    if (/^#\s+/.test(lines[index] || '')) index += 1;
    skipBlank();

    while (index < lines.length) {
      const value = lines[index].trim();
      if (!value) {
        index += 1;
        continue;
      }
      if (isArchiveMetadata(lines[index])) {
        index += 1;
        continue;
      }
      if (value === String(sop.title || '').trim()
        || value === String(sop.description || '').trim()
        || /^按用户要求保留公开链接/.test(value)
        || /^本地未保存来源的完整正文/.test(value)) {
        index += 1;
        continue;
      }
      break;
    }

    return lines.slice(index).join('\n').trim();
  }

  function renderMarkdown(markdown, sop) {
    const content = articleMarkdown(markdown, sop);
    if (!content) return '<p>这项资料当前只保留来源链接。</p>';
    const lines = content.split('\n');
    const html = [];
    let index = 0;
    let list = null;
    let code = false;
    let codeLines = [];

    const closeList = () => {
      if (list) {
        html.push(`</${list}>`);
        list = null;
      }
    };

    while (index < lines.length) {
      const line = lines[index];
      if (line.startsWith('```')) {
        closeList();
        if (code) {
          html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
          codeLines = [];
          code = false;
        } else code = true;
        index += 1;
        continue;
      }
      if (code) {
        codeLines.push(line);
        index += 1;
        continue;
      }
      if (!line.trim()) {
        closeList();
        index += 1;
        continue;
      }
      const heading = line.match(/^(#{1,4})\s+(.+)$/);
      if (heading) {
        closeList();
        const level = heading[1].length;
        html.push(`<h${level}>${inlineMarkdown(heading[2], sop)}</h${level}>`);
        index += 1;
        continue;
      }
      if (/^\s*[-*]\s+/.test(line)) {
        if (list !== 'ul') { closeList(); list = 'ul'; html.push('<ul>'); }
        html.push(`<li>${inlineMarkdown(line.replace(/^\s*[-*]\s+/, ''), sop)}</li>`);
        index += 1;
        continue;
      }
      if (/^\s*\d+[.)]\s+/.test(line)) {
        if (list !== 'ol') { closeList(); list = 'ol'; html.push('<ol>'); }
        html.push(`<li>${inlineMarkdown(line.replace(/^\s*\d+[.)]\s+/, ''), sop)}</li>`);
        index += 1;
        continue;
      }
      if (line.startsWith('> ')) {
        closeList();
        html.push(`<blockquote>${inlineMarkdown(line.slice(2), sop)}</blockquote>`);
        index += 1;
        continue;
      }
      if (line.includes('|') && lines[index + 1] && /^\s*\|?\s*:?-+/.test(lines[index + 1])) {
        closeList();
        const split = (row) => row.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((cell) => cell.trim());
        const headers = split(line);
        index += 2;
        const rows = [];
        while (index < lines.length && lines[index].includes('|') && lines[index].trim()) {
          rows.push(split(lines[index]));
          index += 1;
        }
        html.push(`<table><thead><tr>${headers.map((cell) => `<th>${inlineMarkdown(cell, sop)}</th>`).join('')}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${inlineMarkdown(cell, sop)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
        continue;
      }
      closeList();
      const paragraph = [line];
      index += 1;
      while (index < lines.length && lines[index].trim() && !/^(#{1,4})\s+/.test(lines[index]) && !/^\s*[-*]\s+/.test(lines[index]) && !/^\s*\d+[.)]\s+/.test(lines[index]) && !lines[index].startsWith('```') && !lines[index].startsWith('> ')) {
        paragraph.push(lines[index]);
        index += 1;
      }
      html.push(`<p>${inlineMarkdown(paragraph.join('\n'), sop).replaceAll('\n', '<br>')}</p>`);
    }
    closeList();
    if (codeLines.length) html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
    return html.join('');
  }

  function setActiveNav(route) {
    navLinks.forEach((link) => link.classList.toggle('is-active', link.dataset.route === route));
  }

  function renderStats(items) {
    return `<div class="signal-row">
      ${items.map(([value, label]) => `<div><strong>${escapeHtml(value)}</strong><span>${escapeHtml(label)}</span></div>`).join('')}
    </div>`;
  }

  function resourceLink(item) {
    return `<a class="resource-link" href="${escapeHtml(safeExternal(item.url))}" target="_blank" rel="noreferrer">${escapeHtml(item.label || 'Open resource')} ↗</a>`;
  }

  function stepMarkup(step, index) {
    const resources = [
      ...(step.sops || []).map((sop) => `<a class="resource-link is-sop" href="#/sop/${encodeURIComponent(sop.badge)}">SOP ${escapeHtml(sop.badge)} · ${escapeHtml(sop.title)}</a>`),
      ...(step.links || []).map(resourceLink),
      ...(step.guides || []).map((guide) => `<span class="resource-link">Guide · ${escapeHtml(guide.label)}</span>`),
    ].join('');
    const lessonList = (step.lessons || []).length
      ? `<p><strong>Related modules</strong><br>${step.lessons.map((lesson) => escapeHtml(lesson.title)).join('<br>')}</p>`
      : '';
    const detail = step.body || step.desc || lessonList || resources
      ? `<div class="step-body">${step.body ? `<p>${escapeHtml(step.body)}</p>` : ''}${step.desc && step.desc !== step.body ? `<p>${escapeHtml(step.desc)}</p>` : ''}${lessonList}${resources ? `<div class="resource-row">${resources}</div>` : ''}</div>`
      : '<div class="step-body"><p>这一步在当前快照里没有附加资源。</p></div>';
    return `<details class="roadmap-step ${step.completed ? 'is-done' : ''}">
      <summary>
        <span class="step-check">✓</span>
        <span class="step-title">${String(index + 1).padStart(2, '0')} · ${escapeHtml(step.text)}${step.desc ? `<small>${escapeHtml(step.desc)}</small>` : ''}</span>
        <span class="step-arrow" aria-hidden="true">→</span>
      </summary>
      ${detail}
    </details>`;
  }

  function renderRoadmap() {
    setActiveNav('roadmap');
    const phase = data.roadmap.find((item) => item.id === activePhase) || data.roadmap[0];
    activePhase = phase.id;
    const percent = phase.items.length ? Math.round((phase.completed / phase.items.length) * 100) : 0;
    workspace.innerHTML = `
      <header class="page-heading">
        <div>
          <p class="kicker">Program path · saved locally</p>
          <h1>你的 GOH Roadmap</h1>
          <p>按官网顺序保留全部阶段、步骤和资源。完成状态来自 2026-09-22 的账号快照。</p>
        </div>
        <aside class="snapshot-card"><p class="kicker">Current snapshot</p><strong>${data.stats.roadmapDone} / ${data.stats.roadmapSteps}</strong><span>当前 Roadmap 步骤已完成</span></aside>
      </header>
      ${renderStats([
        [data.stats.roadmapPhases, 'Phases'],
        [data.stats.roadmapSteps, 'Steps'],
        [data.stats.roadmapDone, 'Completed'],
        [data.stats.sops, 'Linked SOP Library'],
      ])}
      <nav class="phase-rail" aria-label="Roadmap phases">
        ${data.roadmap.map((item) => `<button class="phase-tab ${item.id === phase.id ? 'is-active' : ''}" type="button" data-phase="${escapeHtml(item.id)}"><span class="phase-num">${escapeHtml(item.num)}</span><span><strong>${escapeHtml(item.title)}</strong><small>${item.completed} / ${item.items.length} complete</small></span></button>`).join('')}
      </nav>
      <section class="roadmap-panel">
        <aside class="phase-intro">
          <span class="phase-label">Phase ${escapeHtml(phase.num)}</span>
          <h2>${escapeHtml(phase.title)}</h2>
          <p>${escapeHtml(phase.sub || '')}</p>
          <div class="progress-track" aria-label="${percent}% complete"><i style="width:${percent}%"></i></div>
          <div class="progress-copy"><span>${phase.completed} complete</span><span>${percent}%</span></div>
        </aside>
        <div class="step-list">${phase.items.map(stepMarkup).join('')}</div>
      </section>`;
    workspace.querySelectorAll('[data-phase]').forEach((button) => button.addEventListener('click', () => {
      activePhase = button.dataset.phase;
      renderRoadmap();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }));
  }

  function statusLabel(sop) {
    if (sop.status === 'screenshot_partial') return '截图补录';
    if (sop.status === 'link_only') return '公开链接';
    return '本地归档';
  }

  function sopDetail(sop) {
    if (!sop) return '<section class="sop-detail"><div class="empty-list">没有符合条件的 SOP。</div></section>';
    const actions = [
      sop.original ? `<a class="article-action primary" href="${escapeHtml(localFile(sop.original))}" target="_blank">打开原文件</a>` : '',
      sop.sourceUrl ? `<a class="article-action" href="${escapeHtml(safeExternal(sop.sourceUrl))}" target="_blank" rel="noreferrer">打开来源 ↗</a>` : '',
      sop.text ? `<a class="article-action" href="${escapeHtml(localFile(sop.text))}" target="_blank">Markdown</a>` : '',
    ].join('');
    const partial = !archivedStates.has(sop.status)
      ? `<div class="article-note">${sop.status === 'screenshot_partial' ? '这项内容来自 6 张可见区域截图；完整白板仍需通过来源链接访问。' : '这项资料当前只保留公开来源链接，尚未完整离线归档。'}</div>`
      : '';
    return `<section class="sop-detail" aria-live="polite">
      <header class="article-head">
        <div class="article-meta"><span>SOP ${escapeHtml(sop.badge)}</span><span>·</span><span>${escapeHtml(groupLabels[sop.group] || sop.group)}</span><span>·</span><span>${escapeHtml(statusLabel(sop))}</span></div>
        <h2>${escapeHtml(sop.title)}</h2>
        <p>${escapeHtml(sop.description || '')}</p>
        <div class="article-actions">${actions}</div>
      </header>
      <article class="article-body">${renderMarkdown(sop.body, sop)}</article>
      ${partial}
    </section>`;
  }

  function filteredSops() {
    const query = searchQuery.trim().toLowerCase();
    return data.sops.filter((sop) => {
      if (activeGroup !== 'all' && sop.group !== activeGroup) return false;
      if (!query) return true;
      return `${sop.badge} ${sop.title} ${sop.description} ${sop.body}`.toLowerCase().includes(query);
    });
  }

  function renderSops(selectedBadge = '') {
    setActiveNav('sops');
    const items = filteredSops();
    const selected = items.find((sop) => sop.badge === selectedBadge) || items[0] || null;
    const groups = [...new Set(data.sops.map((sop) => sop.group))];
    workspace.innerHTML = `
      <header class="page-heading">
        <div>
          <p class="kicker">Full-text local archive</p>
          <h1>SOP Library</h1>
          <p>搜索全部正文，按业务环节筛选，并直接打开本地附件或公开来源。</p>
        </div>
        <aside class="snapshot-card"><p class="kicker">Archive coverage</p><strong>${data.stats.archived} / ${data.stats.sops}</strong><span>已保存完整内容，其余保留链接或截图</span></aside>
      </header>
      ${renderStats([
        [data.stats.sops, 'Total SOPs'],
        [data.stats.archived, 'Archived'],
        [data.stats.linked, 'Public links'],
        [6, 'Business sections'],
      ])}
      <div class="library-toolbar">
        <div class="search-wrap"><label for="sop-search">搜索标题和全文</label><div class="search-box"><input id="sop-search" type="search" value="${escapeHtml(searchQuery)}" placeholder="例如：TOF、hooks、setting、offer"><span aria-hidden="true">⌕</span></div></div>
        <span class="result-count">${items.length} / ${data.sops.length} entries</span>
      </div>
      <div class="filter-row" aria-label="SOP categories">
        <button class="filter-chip ${activeGroup === 'all' ? 'is-active' : ''}" type="button" data-group="all">All</button>
        ${groups.map((group) => `<button class="filter-chip ${activeGroup === group ? 'is-active' : ''}" type="button" data-group="${escapeHtml(group)}">${escapeHtml(groupLabels[group] || group)}</button>`).join('')}
      </div>
      <section class="library-layout">
        <div class="sop-list" aria-label="SOP list">
          ${items.length ? items.map((sop) => `<button class="sop-item ${selected?.badge === sop.badge ? 'is-active' : ''}" type="button" data-sop="${escapeHtml(sop.badge)}"><span class="sop-badge">${escapeHtml(sop.badge)}</span><span><strong>${escapeHtml(sop.title)}</strong><small>${escapeHtml(sop.section)} · ${escapeHtml(statusLabel(sop))}</small></span><i class="status-dot ${archivedStates.has(sop.status) ? '' : 'link'}" aria-hidden="true"></i></button>`).join('') : '<div class="empty-list">没有找到匹配内容。</div>'}
        </div>
        ${sopDetail(selected)}
      </section>`;

    const search = workspace.querySelector('#sop-search');
    search?.addEventListener('input', (event) => {
      searchQuery = event.target.value;
      renderSops('');
      const replacement = workspace.querySelector('#sop-search');
      replacement?.focus();
      replacement?.setSelectionRange(searchQuery.length, searchQuery.length);
    });
    workspace.querySelectorAll('[data-group]').forEach((button) => button.addEventListener('click', () => {
      activeGroup = button.dataset.group;
      renderSops('');
    }));
    workspace.querySelectorAll('[data-sop]').forEach((button) => button.addEventListener('click', () => {
      location.hash = `#/sop/${encodeURIComponent(button.dataset.sop)}`;
    }));
  }

  function route() {
    const parts = (location.hash.replace(/^#\/?/, '') || 'roadmap').split('/');
    if (parts[0] === 'sops') renderSops('');
    else if (parts[0] === 'sop') renderSops(decodeURIComponent(parts[1] || ''));
    else renderRoadmap();
  }

  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
