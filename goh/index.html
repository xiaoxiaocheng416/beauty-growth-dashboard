behind\n \nit\n \nlands.\n \nA\n \nclaim\n \nwithout\n \none\n \nfeels\n \nhollow.\n  \nStep  4:  Prep  and  pre-frame  the  client  \nA  great  client  still  needs  preparing.  Do  this  before  the  ﬁlming  day.   1.  Send  them  the  journey  and  the  board  in  advance.  They  should  know  the  \nlessons\n \nand\n \nwhat\n \nthey\n \nwill\n \nbe\n \nasked\n \nto\n \ntalk\n \nabout.\n \nIt\n \nis\n \nwhat\n \nlets\n \nthe\n \nconversation\n \nﬂow\n \ninstead\n \nof\n \nstalling.\n 2.  Ask  them  to  prepare  two  or  three  analogies  or  frameworks  they  can  share  on  \ncamera.\n \nThese\n \nprepared\n \nlines\n \nare\n \noften\n \nthe\n \nmost\n \nquotable,\n \nmost\n \nshareable\n \nmoments\n \nin\n \nthe\n \nwhole\n \nvideo,\n \nand\n \nthey\n \nmake\n \nit\n \nfeel\n \nlike\n \na\n \ndiscussion\n \nbetween\n \ntwo\n \npeople\n \nwho\n \nknow\n \ntheir\n \ncraft.\n 3.  Pre-frame  the  depth.  Tell  them  that  ﬂat,  one-line  answers  kill  the  video.  An  \nanswer\n \nlike\n \n“I\n \nbroadened\n \nmy\n \ncontent”\n \nteaches\n \nthe\n \nviewer\n \nnothing.\n \nThey\n \nneed\n \nto\n \ngo\n \ninto\n \nthe\n \nwhy,\n \nthe\n \nfeeling,\n \nand\n \nthe\n \nspeciﬁcs.\n \nSet\n \nthis\n \nexpectation\n \nbefore\n \nyou\n \nroll,\n \nnot\n \nduring.\n  Prepping  the  client  is  not  scripting  them.  It  is  giving  them  the  runway  to  be  \ndetailed\n \nand\n \nnatural.\n  \nStep  5:  Run  the  interview,  free  ﬂow  over  structure  \nYou  present  the  board  with  the  client,  in  person,  on  camera,  and  walk  the  timeline  \ntogether.\n Follow  the  structure  below  loosely.  It  is  a  spine  so  you  never  get  lost,  not  a  script  to  \nread.\n \nThe\n \nnumber\n \none\n \nrule\n \nis\n \nfree\n \nﬂow.\n \nA\n \nreal\n \nconversation\n \nthat\n \nwanders\n \nand\n \ndigs\n \nwill\n \nalways\n \nbeat\n \na\n \nrigid\n \nchecklist.\n \n  The  loose  spine:   \n\n### Page 10\n\n1.  Open  on  the  transformation.  Lead  with  the  result.  2.  How  does  it  feel  now  3.  Take  it  back.  How  did  we  meet  4.  What  problems  were  you  facing  5.  Why  couldn’t  you  solve  them  on  your  own.  6.  How  frustrating  did  that  feel  7.  What  got  you  to  join,  and  why.  8.  First  impression  when  you  joined.  9.  Results  in  the  ﬁrst  three  weeks,  and  how  that  felt.  10.  What  was  the  ﬁrst  thing  you  actually  did.  11.  The  biggest  problem  we  solved  together.  12.  What  was  different  about  this  compared  to  everything  else  you  tried.  13.  If  you  hadn’t  joined,  where  would  you  be  now.  14.  Your  vision  for  the  next  year.  15.  What  would  you  say  to  someone  stuck  in  that  same  spot.  16.  To  anyone  thinking  about  joining,  what  would  you  say.   From  questions  12  -  16,  you  DON’T  need  the  journey  board.  Free  ﬂow  and  go  into  a  \nfull\n \non\n \nconversation\n \nwith\n \nthe\n \nclient.\n \nThis\n \nis\n \nwhere\n \nyou\n \nget\n \nthe\n \nreal\n \nmeat\n \nand\n \npotatoes\n \nthat\n \ngets\n \nhim\n \nto\n \nspeak\n \nabout\n \nhis\n \nexperience\n \nabout\n \nthe\n \nprogram\n \n(the\n \nreal\n \nclient\n \ninterview)\n  Your  real  job  during  the  interview  is  to  pull  the  teachable  direction  out  of  each  \nanswer.\n  When  the  client  says  something  ﬂat,  dig  deeper    -  Ask  why  it  worked,  what  changed  in  how  they  think,  what  they  would  tell  \nsomeone\n \nfacing\n \nthe\n \nsame\n \nthing.\n \n -  Turn  a  ﬂat  line  like  “I  broadened  my  content”  into  the  full  lesson  the  viewer  \ncan\n \nact\n \non:\n \ntarget\n \nwho\n \nyou\n \nactually\n \nwant\n \nto\n \nattract,\n \nnot\n \njust\n \nyour\n \nideal\n \nclient\n \non\n \npaper.\n \n\n### Page 11\n\n And  as  each  lesson  surfaces,  apply  the  core  rule  live.  Give  the  direction.  Show  a  little  \nof\n \nthe\n \nhow\n \nto\n \nprove\n \ncompetence\n  \nW hat\n \ngood\n \nlooks\n \nlike\n \nYou  have  done  this  right  when:  -  A  viewer  who  never  buys  still  leaves  with  real,  usable  direction.  -  The  featured  client  started  where  your  audience  starts,  and  the  \ntransformation\n \nis\n \nundeniable\n \nbecause\n \nthe\n \nproof\n \nis\n \non\n \nscreen.\n -  It  feels  like  a  genuine  conversation,  not  an  advertisement  and  not  a  \ntestimonial.\n -  Every  major  lesson  teaches  a  direction,  and  the  full  how  is  mostly  withheld,  \nleaving\n \nthe\n \nviewer\n \ncurious.\n -  The  target  viewer,  the  one  who  knew  you  were  good  but  not  how  you  could  \nhelp,\n \nﬁnishes\n \nin\n \na\n \nbuying\n \nstate\n \nwithout\n \never\n \nfeeling\n \nsold\n \nto.\n  \nCommon\n \nmistakes\n \nMaking  it  about  you.   -  This  has  everything  to  do  with  the  client  that  achieved  the  transformation,  \nmake\n \nthem\n \nfeel\n \nlike\n \nthey\n \nare\n \nthe\n \nhero\n \nand\n \nyou\n \nare\n \nthe\n \nguide\n \nthat\n \nhelped\n \nthem\n \nachieve\n \ntheir\n \ngoals\n  Giving  away  the  full  how.   -  Hand  over  the  entire  system  and  you  kill  both  the  curiosity  and  the  reason  to  \nbuy.\n \nYou\n \nalso\n \nlose\n \nthe\n \npositioning.\n \nShow\n \nenough\n \nto\n \nprove\n \ncompetence\n  Featuring  the  wrong  client.  -  A  starting  point  your  audience  cannot  relate  to,  or  a  result  they  do  not  \nactually\n \nwant,\n \nbreaks\n \nthe\n \nvideo\n \nbefore\n \nit\n \nstarts.\n \nSo\n \ndoes\n \na\n \nclient\n \nwho\n \ncannot\n \nhold\n \na\n \nconversation.\n  \n\n### Page 12\n\nAccepting  ﬂat  answers.   -  A  one-line  answer  with  no  detail  is  a  dead  beat.  Pre-frame  for  depth  and  dig  \nin\n \nthe\n \nmoment\n \nand\n \nknow\n \nexactly\n \nhow\n \nto\n \nget\n \nthe\n \nbest\n \nanswers\n \nout\n \nof\n \nyour\n \ncleint\n  Scripting  it  word  for  word.   -  A  read-out  script  kills  the  free  ﬂow  that  makes  this  feel  real.  The  structure  is  a  \nspine,\n \nnot\n \na\n \nteleprompter.\n  Skipping  the  proof.   -  Claims  without  screenshots  feel  like  talk.  The  evidence  is  what  makes  it  \nundeniable.\n   \nEdge\n \ncases\n \nand\n \nexceptions\n \nGreat  result,  but  the  client  is  not  articulate.  Coach  them  harder  in  the  pre-frame,  or  \nchoose\n \na\n \ndifferent\n \nclient.\n \nDo\n \nnot\n \nforce\n \nit.\n \nA\n \nquiet\n \nfeature\n \nis\n \na\n \nweak\n \nvideo.\n  The  numbers  are  not  dramatic,  but  the  lesson  is  strong.  Lead  with  the  relatability  \nand\n \nthe\n \nlesson\n \nrather\n \nthan\n \nthe\n \nchart.\n \nA\n \ntransformation\n \ncan\n \nbe\n \nqualitative,\n \na\n \nmindset\n \nor\n \na\n \nway\n \nof\n \nworking,\n \nnot\n \nonly\n \nrevenue.\n  Sensitive  numbers  the  client  will  not  share  publicly.  Agree  what  is  shareable  \nbefore\n \nyou\n \nﬁlm.\n \nUse\n \nranges,\n \nor\n \nlean\n \non\n \nother\n \nproof,\n \nrather\n \nthan\n \nputting\n \nthem\n \non\n \nthe\n \nspot\n \non\n \ncamera.\n  You  do  not  have  records  of  their  early  journey.  Reconstruct  it  with  the  client  during  \nthe\n \nbrief.\n \nTheir\n \nmemory\n \nplus\n \nwhatever\n \nproof\n \nexists\n \nis\n \nenough\n \nto\n \nmap\n \nthe\n \ntimeline.\n  \nThings\n \nto\n \nnote\n \n\n### Page 13\n\nRelatability  is  the  hook,  not  the  result.  The  viewer  commits  because  the  client  \nstarted\n \nexactly\n \nwhere\n \nthey\n \nare.\n \nChoose\n \nthe\n \nstarting\n \nline\n \nwith\n \nas\n \nmuch\n \ncare\n \nas\n \nthe\n \nﬁnish.\n  The  board  does  double  duty.  It  is  the  visual  that  makes  the  journey  easy  to  follow  \non\n \nscreen,\n \nand\n \nit\n \nis\n \nthe\n \nloose\n \nscript\n \nthat\n \nkeeps\n \nthe\n \nconversation\n \non\n \ntrack\n \nwithout\n \nfeeling\n \nscripted.\n \nBuild\n \nit\n \nwell\n \nand\n \nthe\n \ninterview\n \nalmost\n \nruns\n \nitself.\n  Free  ﬂow  is  a  skill.  The  structure  exists  so  you  are  never  lost,  but  the  value  is  in  \nfollowing\n \nthe\n \nenergy\n \nof\n \nthe\n \nconversation\n \nand\n \ndigging\n \nexactly\n \nwhere\n \nit\n \ngets\n \ninteresting.\n \nThe\n \nbest\n \nmoments\n \nare\n \nnever\n \non\n \nthe\n \nlist.\n  The  prepared  analogies  travel.  The  two  or  three  lines  the  client  brings  are  often  the  \nclips\n \nthat\n \nget\n \nshared.\n \nWyatt\n \ncomparing\n \nlearning\n \nfrom\n \nafar\n \nto\n \nreading\n \na\n \nmanual\n \non\n \nhow\n \nto\n \nﬁx\n \na\n \ncar\n \nversus\n \nliving\n \nwith\n \na\n \nmechanic\n \nis\n \nthe\n \nkind\n \nof\n \nline\n \nthat\n \nkeeps\n \nworking\n \nfor\n \nyou\n \nlong\n \nafter\n \nthe\n \nvideo\n \nis\n \nposted.\n  \nQuick\n \nchecklist\n \n Run  this  before  you  ﬁlm.  Every  answer  should  be  yes.    Does  the  featured  client  start  where  your  audience  starts?   Is  the  transformation  something  your  audience  actively  wants?   Can  this  client  hold  a  natural,  detailed  conversation  on  camera?   Is  the  journey  board  built,  with  a  Session,  Insight,  Action,  Result,  Proof  chain  for  each  beat?   Is  the  real  proof  gathered  for  every  claim  you  will  make?   Has  the  client  seen  the  journey  and  the  board,  and  prepared  two  or  three  analogies?   Have  you  pre-framed  them  to  go  deep,  with  no  ﬂat  answers?   For  every  lesson,  are  you  giving  direction  and  withholding  the  full  how?  \n\n### Page 14\n\n Would  a  viewer  who  never  buys  still  get  real  value  from  this?   Does  the  whole  thing  feel  like  a  conversation,  not  a  testimonial  or  an  ad?    \n"},{"badge":"10","group":"content","section":"Profile","title":"Optimized IG Profile","description":"Turn your Instagram profile into a conversion asset.","status":"content_archived","format":"","sourceUrl":"https://docs.google.com/document/d/1bVpNJX0T0SNrTy2AKgjSVxbjlaooFujLODx5oA0VorA/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=10","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Optimized IG Profile\n\n- Source: https://docs.google.com/document/d/1bVpNJX0T0SNrTy2AKgjSVxbjlaooFujLODx5oA0VorA/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n.PROFILE OPTIMISATION.\n\n.GOH CONSULTING.\n\nYour profile is the first thing somebody looks at when they come across your account. If it's unoptimized, it's working against you, and you are losing followers every single day.\n\nThe goal with this SOP is to help you optimize your profile so you can stand out from your market, create a first impression that sparks curiosity and get people to follow you\n\nYour Instagram is your funnel. You have to be extremely intentional about every aspect from your profile picture, bio, pinned post, everything. This could be the determining factor on whether someone chooses to work with you.\n\nThere are 5 Main Parts to an Optimised Profile:\n\n- Name\n\n- Profile Picture\n\n- Bio\n\n- Highlights\n\n- Pinned Posts\n\n1. Username\n\nThis is the most simple yet overlooked step of building an optimised profile. As obvious as it sounds, your username should just be your name.\n\nDON’T have underscores (_) full stops (.) or numbers in your name. Keep it clean and simple.\n\nTry not to have your niche with your username. You're building your personal brand, and it shouldn't be catered around your niche. Always remember that you are the niche.\n\n@sooweigoh\n\nIf your ideal username is taken, play around with it and see what's available\n\nFor example, Josh has the most basic asian name ever so he had to add “the” infront\n\n@thejoshchang\n\n2. Profile Picture\n\nYour profile picture is the most memorable part of your profile so it’s important that it leaves a positive impression.\n\nIt should be a clean headshot with your face filling the frame and a high contrast against the background. It shouldn’t show your full body, include other people or have a logo.\n\n- PS. I'm not even going to lie. I got to change my profile picture ASAP. I'm just waiting for the perfect picture\n\nHere are some examples of Good vs Bad Profile Pictures:\n\n![Embedded image](../assets/10/kix_aijnmq9gcuml.png)\n\n3. Bio\n\nNext is the bio. This is completely up to you and you should play around with it.\n\n![Embedded image](../assets/10/kix_iowvvxrp73ju.png)\n\nI just have mine super simple because I like to be different and I don't like to look like everybody else\n\n- I can do something like this because I have a media team that helps post on my company page, which nurtures and explains what I do.\n\n- If you don't have this, then please do not do the same. Just do what is recommended below.\n\n90% of people should follow a simple 3 Line Structure that summarises everything the viewer needs to know about you:\n\n- Your Offer: Who are you and what you do\n\n- Credibility: Why should they listen to you\n\n- CTA: What they should do next\n\nHere’s an example:\n\nI help coaches make money with content\n\nGenerated $10M+ in tracked client revenue\n\nYour CTA has 2 Options:\n\nOption 1 is direct to messages. Get them to DM you a keyword for a resource or explicitly to work with you.\n\nOption 2 is direct to YouTube. Setup a [urlgenius](https://app.urlgeni.us/) and direct your traffic to a specific long form video or your channel.\n\nWith both options, make sure you tie the YouTube video or resource back to a desired outcome so the viewer actually has an incentive to click.\n\nEg: “the strategy I used to generate over $400k/mo completely organically”\n\n![Embedded image](../assets/10/kix_cxkp8g2rn0so.png)\n\n4. Highlights\n\nYour highlights is where you should store your best Story Sequences after 24 hours of posting them. Here are the main highlights you can include:\n\nClient Results: showing the before versus after of working with you\n\nYouTube: directing viewers to specific long form videos tailored to your audience\n\nStart Here: an overview of your story, your results and a CTA\n\nLifestyle: showing the BTS beyond running your business\n\nIf you need help creating the stories for your highlights, you can check out our Story [Sequence SOP](https://docs.google.com/document/d/1vlcPJ3Wt1FP8eKP472CRQOv1gJVIE7WvvQRieGK8hSM/edit?usp=sharing) here.\n\nHere’s an example of model highlights you can recreate:\n\n![Embedded image](../assets/10/kix_8uoqknqpjd73.png)\n\n5. Pinned Posts\n\nThis is by far the most important part of the profile optimization. You need to make sure that the first piece of content that they watch from you really sparks an emotion and makes them want to follow you.\n\nThe best pinned posts you can have on your page are the following:\n\n- My Story Video\n\nAn overview of your personal life story and transformation: where you started, what went wrong, what changed, and where you are now.\n\n- Client Results Video\n\nShowcasing your biggest client wins and transformations to position you as an authority and build credibility.\n\n- ‘I Made It’ Video\n\nDocumenting a moment where you achieve a goal that your audience aspires to achieve.\n\nWe have a separate module breaking down the exact step-by-step frameworks you can follow to create your [Pinned Posts.](https://docs.google.com/document/d/1_l3tmTQ5nPifarMiK6TKho6W78XSwaNVJb6f7lJXlAs/edit?usp=sharing)\n\nQuick checklist\n\nRun this when reviewing your profile. Every box should be a yes:\n\n- Is your name clear and your real name?\n\n- Is your profile picture a clear headshot that fills the frame and doesn’t blend in with the background?\n\n- Does your bio follow a 3 Line Structure and include a Link?\n\n- Do your highlights show your Client Results, Lifestyle and direct people to your YouTube?\n\n- Have you created your 3 Pinned Posts following our frameworks?\n\nTo complete your Pinned Posts and Story Highlights, check out the SOPs below:\n\nPinned Posts\n\n[https://docs.google.com/document/d/1_l3tmTQ5nPifarMiK6TKho6W78XSwaNVJb6f7lJXlAs/edit?usp=sharing](https://docs.google.com/document/d/1_l3tmTQ5nPifarMiK6TKho6W78XSwaNVJb6f7lJXlAs/edit?usp=sharing)\n\nStory Highlights\n\n[https://docs.google.com/document/d/1vlcPJ3Wt1FP8eKP472CRQOv1gJVIE7WvvQRieGK8hSM/edit?usp=sharing](https://docs.google.com/document/d/1vlcPJ3Wt1FP8eKP472CRQOv1gJVIE7WvvQRieGK8hSM/edit?usp=sharing)\n"},{"badge":"11","group":"content","section":"Brand","title":"Visual Identity","description":"Define a consistent, recognizable visual brand across your content.","status":"content_archived","format":"","sourceUrl":"https://docs.google.com/document/d/1pn91ytFlMhRw-hE2v4QqlkGo06UPJfSDHtPZgbpW4k0/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=11","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Visual Identity\n\n- Source: https://docs.google.com/document/d/1pn91ytFlMhRw-hE2v4QqlkGo06UPJfSDHtPZgbpW4k0/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n.VISUAL IDENTITY.\n\n.GOH CONSULTING.\n\nIf you’re stuck charging low prices, reaching a low quality audience and getting low views, it all starts with this one overlooked element in your brand.\n\nI’ve spent the last 5 years obsessing over content and if there’s one thing I did that changed everything for me, it’s optimising my visual identity. The moment I did this, I went from charging $5k to $45k, scaled from 5,000 to over 125,000 followers and built a respectable brand\n\nIn this SOP, I’m going to break down the 5 Step Framework you can follow to optimise your visual identity and go from an overlooked creator to a one of one brand that demands respect\n\n![Embedded image](../assets/11/kix_i0jgdkxoapp9.png)\n\nOverview\n\nPeople make assumptions about you before you even talk. Before anyone hears your hook or decides whether to watch, they have already formed an opinion and that opinion is based entirely on how you look.\n\nIf your first impression doesn't communicate \"I'm someone worth listening to,\" nobody stays long enough to find out that you know what you're talking about.\n\nVisual Identity is made up of these 5 Pillars:\n\n- Environment & Location\n\n- Lighting\n\n- Camera Quality\n\n- Audio\n\n- How You Dress\n\n1. Environment & Location\n\nYour background communicates something whether you intend it to or not. Your ICP isn't only listening to what you say but they're looking at where you are and asking themselves: is this someone I want to be like?\n\nA plain white wall says nothing was intentional, and your content will look like everyone else's.\n\nIf you film in the same spot every time you make a video, three things will happen:\n\n- Creative Block: you go creatively flat with the same energy, same framing, same fee.\n\n- One Dimensional Brand: Your audience only ever sees one version of you\n\n- Same Packaging: The content will feel the same even though you’re saying something completely different\n\nInstead of filming in the same place, alternate between 3-4 spots consistently. You can\n\nHire a studio space for 2–3 hours to batch record\n\nBook an Airbnb in a nice location with an aesthetic interior\n\nCoffee shops, rooftops, co-working spaces, hotel lobbies\n\nAnywhere your ICP aspires to spend time\n\n![Embedded image](../assets/11/kix_sj3j32y5l7im.png)\n\nAction Item: Pick 3-4 repeatable locations to rotate between and plan out your next week of shoots. We block out Tuesday, Thursday and Saturday as filming days.\n\n2. Lighting\n\nLighting is the single highest-leverage change you can make to your content. Bad lighting makes you look unprofessional, tired and untrustworthy regardless of what you're saying. Good lighting does the opposite.\n\nThere are 3 Lights you need:\n\n1. Key Light\n\nThis is your main source of lighting and the most important. If there’s one light you should always have, it’s this. A ring light, a softbox, or a window facing you.\n\nHere’s how to set it up:\n\n- Angle: Imagine your camera is at 12 o'clock. Put the light at 10 o'clock or 2 o'clock. That is roughly 45 degrees off the line between you and the camera. Not dead centre.\n\n- Height: Slightly above your eye line, tilted down at your face by about 15 to 30 degrees.\n\n- Distance: Position it 1 to 1.5 metres from your face. If you are squinting or your forehead is blowing out white, move it back or turn it down.\n\n- Colour temperature: Set it to 5600K (daylight) if there is any window light in the room. Only use 3200K (warm) if the room is lit entirely by warm lamps.\n\n2. Fill Light: control shadow. The shadows your key light creates are what give your face depth and the fill softens them so they aren't harsh. That balance between light and shadow is what creates a cinematic look.\n\n- Position it on the opposite side of the camera to your key light.\n\n- If your key light is at 10 o'clock, the fill goes at 2 o'clock. It should be the same height but placed further back or turned down.\n\n- The fill light should be roughly half as bright as the key. If they match, you have flattened your face out and undone the work your key light was doing.\n\n3. Background Light: even a basic lamp works. It pulls the background out of darkness, adds depth, and makes the image feel 3D rather than flat.\n\nThis should be positioned behind you and out of frame, pointed at the wall rather than at you. Aim to keep it out of the camera frame.\n\n![Embedded image](../assets/11/kix_gcucszg2bq9e.png)\n\nYou don’t need to break the bank to achieve good lighting in your videos. Here’s are some options of lights to buy:\n\nLow Budget: [Neewer GL1 Pro](https://www.amazon.co.uk/NEEWER-Streaming-Lighting-Compatible-Recording/dp/B0FC62F4XT/ref=sr_1_1_sspa?crid=34SCY0852WGR1&dib=eyJ2IjoiMSJ9.WU7GW7PoQ-ldTQTLUAIeKEOMJFMIQSLGWyFqlYq8zR_izwZnMvRDpIhFYYhg9L0dXep8IBHBTIpgfHAOsaVVhNM9G6s2NSD6VI4liP5ntfwoPjnHusUD4A6dffjzFCk5figFsyCO34BjhzDOFjqvUmO1LTjAQEA_cJcDaHradPtinwiaAsVnXGHsDklv0MFptReFw0U8Hz87yMAmlpFEKYSZ1sRGua0_0mrqsZBAQIo.GUU9kVik7_UgoG34B4M8_N8skAzvD0d5q0CxhmgJzaw&dib_tag=se&keywords=neewer%2Bgl1%2Bpro&qid=1776167771&sprefix=neewer%2Bgl1%2B%2Caps%2C349&sr=8-1-spons&aref=Ri5rGk4zOI&sp_csd=d2lkZ2V0TmFtZT1zcF9hdGY&th=1)\n\nMid Budget: [Godox SL60W with Softbox](https://www.amazon.co.uk/SL-60W-Version-AMBITFUL-Installation-Carrying/dp/B08LZ13JXK/ref=sr_1_2_sspa?crid=1ESBX8Y3OR5L&dib=eyJ2IjoiMSJ9.b13H6BlUxRuXEse0Ok5ewZce8SdoQc45BtoxKsn1WcYkO_fYSKSw22Ow24N9B7ZoSkzdnrEUU__ZxqesPjfKaTMXT3HQYQ990DujXfBWtNNjMLXNXBv7gkewzjEyl9eR6Il_4byTEJlrpY7oiEz-kCDHK9c2-wj-SJTIUKQHE7bLqL8yNB2ufh0e1DHXoHkMyyfSjSlWvDzcD86Z8nTT-LjDimhD8nYWRqxHQbUyraU.DJkTXeI54MMmAQGrekdWRass5Uxvmo1ikmmzIR3Rrfs&dib_tag=se&keywords=godox%2Bsl60w&qid=1776167689&sprefix=godox%2Bsl60%2Caps%2C571&sr=8-2-spons&aref=qJWQOWALiO&sp_csd=d2lkZ2V0TmFtZT1zcF9hdGY&th=1)\n\nBacklight: [Neewer TL96 LED Bar](https://www.amazon.com/Magnetic-Handheld-Rechargeable-2500-8500K-Photography/dp/B0BKL88WND/ref=sr_1_2?crid=XA600DTDI9A1&dib=eyJ2IjoiMSJ9.m8lZ7vU7ZxzOUJQC59DY5bYBkYuPBReI0ztHoVAExr-IodZVtRGDoUkcdYHD93zbEEyidGKEJEvFqdQRHNd4diyNVPfT9jU-JF-73D76XjGKSB9kUSr39vSLd-g9aYQsGMxF5DdGpWdj_psNKV96zxV2czP46mU9vMiduFkHpcbkc-OfNBLlQPRTJPSOxTcCpzCns-8yUSLOeF_gRtmRkMXSg6kAgoUBqQlIt3_Bf-M.J8bgWD6-cLJSyFpB0cMoK49hA5CESaNEbDhdoafWQuU&dib_tag=se&keywords=neewer%2Btl96&qid=1776168094&sprefix=neewer%2Btl9%2Caps%2C200&sr=8-2&th=1)\n\n3. Camera Quality\n\nThe camera you choose plays a role in the style of brand you're building: iPhone, Osmo, or mirrorless. Everyone always asks me: “Do I need a camera, or can I use my phone?”\n\nHonest answer: your iPhone is enough to build real perception. Don't let gear be the reason you don't post content. That said, a dedicated camera does elevate the output. The image quality is higher and people feel it.\n\nYou can use both:\n\n- Camera for your main sit-down content, where production value matters\n\nGive them links to the camera they can buy here\n\n- iPhone raw footage for candid moments, talking-head on the go, behind the scenes\n\nRegardless of what you film on, there are 5 Factors you need to consider when filming:\n\nOrientation | Horizontal for YouTube and long-form. Vertical for Reels and Shorts.\n\nSafe areas | Keep anything that must be read inside the safe zone\n\nResolution (iPhone) | 4K 30fps. Apple optimises autofocus, colour science and stabilisation at 30fps, so you get the cleanest image there.\n\nResolution (camera) | 4K 24fps: the traditional film standard, and where the cinematic look comes from. UK and Europe: 25fps due to regional broadcast standards.\n\nFraming | Eye level or slightly above. Use the rule of thirds.\n\nInvesting in a camera is by far the best investment you can make to transform your visual identity and take your brand from looking cheap to looking premium. Here are some cameras and lenses for different budgets:\n\nLow Budget: DJI Osmo Pocket 3\n\nMid Budget: Sony a6700\n\nMid Budget: Sony FX30\n\nMid Budget: Sony ZV-E1\n\nHigh Budget: Sony FX3 Cinema Line\n\n4. Audio\n\nPeople will tolerate average video quality but they will not tolerate bad audio. If the audio quality is poor, they’re just going to scroll\n\n- A basic lapel or USB mic under $50 will change your content immediately. The DJI Mic Mini is the default recommendation. You don't need anything complicated.\n\n- Be mindful of where you're filming. A great mic in a loud environment still produces bad audio. Choose locations with minimal background noise.\n\n- Tell your editor to run audio processing in post. Tools like [Adobe Podcast](https://podcast.adobe.com/en) enhance your voice, reduce background noise and clean up the recording significantly.\n\nHow to attach a Lapel or DJI Mic:\n\nClip it 15 to 20cm below your chin, centred on your chest. Higher and it sounds boomy, lower and it sounds thin and distant.\n\nClip it to the outside edge of the fabric, not buried under a jumper or jacket.\n\nCheck nothing touches it. A necklace, a zip or a loose collar rubbing the capsule ruins the take and cannot be fixed in post.\n\nFit the furry windshield outdoors, always. Wind noise is unrecoverable.\n\nBefore every single take, follow this pre-recording checklist to make sure your audio is:\n\nSet your level so your voice peaks between -12dB and -6dB. If it touches 0 it clips, and clipping cannot be repaired.\n\nClap once and listen. If you hear a ring after the clap, the room is too echoey. Add a rug, curtains, a sofa or bookshelves, or move rooms.\n\nTurn off air conditioning, fans and anything with a fridge hum. Phone on airplane mode.\n\nRecord 10 seconds and listen back on headphones, not on the phone speaker. Then start.\n\nRun a backup on your phone voice memo app. If the main file fails you still have a usable take.\n\nNote: If when recording, the audio quality is altered by background noise or other people speaking, tools like [Adobe Podcast](https://podcast.adobe.com/en) allow you to clean your audio and adjust it in the post production process.\n\nHere are some mics for every budget:\n\nLow Budget: [Rode VideoMic Go II](https://www.amazon.co.uk/R%C3%98DE-Ultra-compact-Lightweight-Microphone-Filmmaking/dp/B09MRLGL7G/ref=asc_df_B09MRLGL7G?mcid=1a2ad2c0f5ea3f729b4b25797d7aebc8&th=1&psc=1&tag=googshopuk-21&linkCode=df0&hvadid=696385059991&hvpos=&hvnetw=g&hvrand=14957436723637376724&hvpone=&hvptwo=&hvqmt=&hvdev=c&hvdvcmdl=&hvlocint=&hvlocphy=9044965&hvtargid=pla-1599246533697&psc=1&hvocijid=14957436723637376724-B09MRLGL7G-&hvexpln=0&gad_source=1)\n\nMid Budget: [DJI Mic 3](https://www.amazon.co.uk/DJI-Charging-Microphone-Ultralight-Anti-Interference/dp/B0F995J8FR/ref=sr_1_1_sspa?crid=36A15SL1KFHGJ&dib=eyJ2IjoiMSJ9.B6yMbgj57M_INbQ2wZW0wnMsC1MY7uCvEMySXqzXhE2OdQak661HLJQMduThK5iO9tbtlE1abtGMmzsPD5CCvdcsUlkEqhAi5371nrZ9WE7KIIAo2smm5qP2vWV4dHuDAq2A95fIsWOuLfW3i5LTwyvExKxZYoBjFa8qBNpBZQnf0Zuu1ANm7vaTpKMHhi-_NataSP4vaWlF8ppixUZaqtnTDRWRx26j6KRn0UtZLDQmCSsDTw4MWMrcip1-9YDTPTeAFwmbsQ-51h3ALNruhuj5Hw-gHOdtLtYMA0Xru9w.7SsDA_HitzE7TbnEp9D9l3P--zuDXjpneNjvV0sBGeU&dib_tag=se&keywords=dji%2Bmic%2B3&qid=1776167618&sprefix=dji%2Bmic%2B%2Caps%2C280&sr=8-1-spons&aref=yh87cPUsYq&sp_csd=d2lkZ2V0TmFtZT1zcF9hdGY&th=1)\n\nHigh Budget: [Sennheiser MKE 400](https://www.amazon.co.uk/Sennheiser-Professional-Directional-Microphone-508898/dp/B08YS34YRS/ref=sr_1_1_sspa?dib=eyJ2IjoiMSJ9.VjEJ2IOK7FgRNg5ARUndsIrbVcnvdP72hBUUo70JN4B4BU0yYeU5Tk-OEcwl1y3n8vlTj_Bt-K8aVcEV8o_WEt4VcCYAB2PHTj7ilKNmWD06vR5mXj86XXBOxW5-H9OW3Cx8cY5hoEKEiBfZl_N0nFi-0i2a5bmBiCN5QMpUsYC5Tf_SFvTzn2AWI8SmkgiN5WlDTcfQ0XgqDsYPqyMK5q0bjIC6dEYGiOSmiHthCHA.vN8ykNG-OxlwIrpnSJmBEo_7eHnmw3SmdKSQTPBShxc&dib_tag=se&keywords=sennheiser%2Bmke%2B400&qid=1776167589&sr=8-1-spons&aref=jHZmGz8qGp&sp_csd=d2lkZ2V0TmFtZT1zcF9hdGY&th=1&currency=USD)\n\nHigh Budget: [Shure MV7+](https://www.amazon.co.uk/Shure-MV7-Microphone-Podcasting-Streaming/dp/B0CTJ8BSWN/ref=sr_1_2_sspa?crid=11360Q947T7XV&dib=eyJ2IjoiMSJ9.dGiZNF7RnisDvrJZ_IS_MyAG2nSPssPrbkbY1OnqwcQTL-qc1R-HI_ds4BLZeJQQNpCbIYpoMEsn23SmK5pGFjPZ_-XoGjL9p-OYRPU_S-mLVNx4Kb9rE3bdUGf6PmD3BUsNifuHQUeB8FNJeA5l49StVsrNyRhK-SCzcGvaSlQ1bjdUCIzCvR7qPBBRVdRoloHnNfxoZ-xmETe5vbSbqMIP5fhmThopnguIETTw2Tyba7zl8-xHuM4Bv1HSgJFW4UTu4zlam0bhPqB-vy11jkzvYqsyNCFW6bPEnM80AvU.0O7nT_fcntJUVfWu8U_WBuc6vAur7l5Dzy6zg3SVSFM&dib_tag=se&keywords=shure+mv7%2B&qid=1776167660&sprefix=shure+mv7%2B%2Caps%2C305&sr=8-2-spons&aref=pfAl32C4Ok&sp_csd=d2lkZ2V0TmFtZT1zcF9hdGY&psc=1)\n\n5. How You Dress\n\nWhat you wear communicates who you are before you've said a word. It tells your audience your level of professionalism, your taste and your self-awareness and it either gives them a reason to keep watching or a reason to scroll.\n\nHere’s a simple 3 Step Process you can follow:\n\nStep 1: Understand the image you want to portray\n\nWhat does your ideal self look like? How does that person dress? What does their aesthetic say about them?\n\nStep 2: Find your aesthetic\n\nLook at creators and leaders you respect. Look at your ICP: what do they respond to? What visual language speaks to them?\n\nStep 3: Build a small, intentional content wardrobe\n\nYou don't need to reinvent your closet. You need 5-10 outfits that are on-brand, that you feel confident in, and that look intentional on camera\n\nFor example, I designed a clean and minimal aesthetic and rotate between the following:\n\nSimple, quality basics - fitted t-shirts, clean polos, knitwear\n\n1 pair of pleated trousers for more formal content\n\n3 pairs of jeans - black, raw denim, dark blue\n\n1 statement piece - leather jacket\n\nFirst Impressions Checklist\n\nRun this every time before you record a video. Every box should be a yes:\n\nEnvironment\n\n- Is this location intentional, and is it somewhere your ICP aspires to be?\n\n- Is it different from the last two things you filmed?\n\n- Is the background clean and consistent with your brand image?\n\n- Is background noise low enough to record in?\n\nLighting\n\n- Key light on your face, not behind you?\n\n- Fill light softening the shadows?\n\n- Background light lifting the frame out of flatness?\n\n- Have you filmed five seconds and watched it back?\n\nCamera\n\n- Correct orientation for the platform: horizontal for YouTube, vertical for Reels and Shorts?\n\n- Highest available resolution: 4K 30fps on iPhone, 4K 24fps on camera (25fps in the UK/EU)?\n\n- Eye level or slightly above, framed on the rule of thirds?\n\n- Will everything that must be read sit inside the safe area?\n\nAudio\n\n- Mic on, tested, and levels checked on a real take?\n\n- Editor briefed to run audio processing in post?\n\nDress\n\n- Is this outfit from your intentional content wardrobe?\n\n- Does it communicate the image you're building, pushed slightly further than what feels natural?\n\n- Would a stranger price you at or above your ticket from this frame alone?\n"},{"badge":"12","group":"offer","section":"Positioning","title":"Crafting An Irresistible Offer","description":"Build an offer prospects feel stupid saying no to.","status":"archived","format":"pdf","sourceUrl":"https://gohconsulting.app/sops/crafting-an-irresistible-offer.pdf","portalUrl":"https://gohconsulting.app/sops?sop=12","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Crafting An Irresistible Offer\n\n- Source: https://gohconsulting.app/sops/crafting-an-irresistible-offer.pdf\n- Category: offer / Positioning\n- Captured: 2026-09-21T14:01:54.491702+00:00\n\n\n### Page 1\n\n.IRRESISTIBLE  OFFER.  .GOH  CONSULTING\n.\n   \nW hy\n \ncreate\n \nan\n \nirresistible\n \noffer?\n \nIt  is  the  single  biggest  lever  you  can  pull  to  generate  more  proﬁt  for  your  \nbusiness\n \nA  great  offer  makes  you  a  category  of  one  so  prospects  compare  you  to  \n“nothing”\n \ninstead\n \nof\n \ncompetitor\n \nLook  at  different  offers  that  exist  and  make  yourself  a  category  of  one  \n●  Position  your  offer  in  such  a  unique  way  that  they  can’t  compare  \nyou\n \nto\n \nothers\n ○  Never  constrained  by  price;  it’s  a  value  based  offer  \nMaster  your  offer  →  Sales  and  persuasion  becomes  easy  \n \nHow\n \ndo\n \nyou\n \ncreate\n \none?\n  There  are  4  variables  to  consider  when  establishing  an  irresistible  offer  \n1.  Extreme  pain  2.  Purchasing  power  3.  Easy  to  target  4.  Growing  market  \nRiches  in  the  niches:  Same  product  100x  the  price  \n●  I  help  people  achieve  their  dream  physique  ($20)  ●  I  help  skinny  people  bulk  up  and  put  on  muscle  ($500)  ●  I  help  busy  businessmen  be  more  energised  and  lose  weight  \nwithout\n \nspending\n \nmore\n \nthan\n \n1\n \nhour\n \nin\n \nthe\n \ngym\n \n($2000)\n \n \nThe  goal  of  great  writing  is  for  the  reader  to  understand  \nThe  goal  of  great  copy  is  for  the  prospect  to  feel  understood  \n\n### Page 2\n\n●  If  you  can  articulate  their  problems  better,  you  can  provide  the  \nsolutions\n \nto\n \ntheir\n \nproblems\n \nbetter\n \n \nThe  bigger  the  pain  the  prospect  experiences,  the  more  money  he  will  \npay\n \nupfront\n \n \nCore\n \noffer\n \ncomponents\n \n \n1.  Identify  dream  outcome  \nI  help  *speciﬁc  outcome*  in  *time  period*  without  *biggest  pain/fear*  \nEx.  I  help  business  owners/coaches  hit  $50k-100k/mo  in  60  days  without  \nhaving\n \nto\n \nspend\n \nall\n \nday\n \ndoing\n \noutreach\n \nand\n \nposting\n \nreels\n \n \n2.  List  out  all  perceived  problems  \nWhat  perceived  problems  would  the  client  have  about  your  offer?   \n●  Write  them  down  and  answer  all  of  them  \nEx.  Hire  bad  sales  reps  \n●  Have  a  huge  pipeline  because  of  my  training  and  been  in  sales  for  \nover\n \n2\n \nyears\n \nUse  this  template  to  help  you  really  craft  an  amazing  offer  \nTemplate |  My  Example \n \n3.  List  out  5  of  the  main  deliverables  your  core  offer  provides  \n \nThe  key  here  is  to  position  your  deliverables  as  solutions  that  will  beneﬁt  \nthe\n \nclient\n \n\n### Page 3\n\n \nExample:  \n \n-  DFY  Systems  and  Processes:  Track  every  single  one  of  your  leads  so  \nyou\n \ndon’t\n \nlose\n \nout\n \non\n \nany\n \nsales,\n \nsave\n \ntime\n \nby\n \nhaving\n \nDFY\n \nSOPs,\n \ncentralized\n \nsystem\n \nto\n \nscale\n \nup \n \n-  We  build  out  your  entire  Sales  CRM  (GHL),  Notion  Sales  Scripts,  \nDiscord\n \nChannel\n \nAutomations,\n \netc \n \n-  Offer  Blueprint:  Charge  $5-10k  upfront  for  your  offer  and  create  an  \noffer\n \nthat’s\n \na\n \ncategory\n \nof\n \none.\n \nNo\n \nmore\n \nprice\n \ncomparisons\n \nand\n \nobjections  \n-  How  to  build  a  completely  irresistible  high  ticket  offer  by  giving  you  \nour\n \nexact\n \noffer\n \nblueprint\n \nand\n \nnonstop\n \nconsulting  \n \n \n     4.  What  would  I  deliver  if  my  product  costs  10x  its  current  amount?  \nEx.  Run  ads  for  them,  train  setters  1-1,  hire  a  VA,  set  up  zapier,  inhouse  \neditor,\n \nautomations,\n \nsystems,\n \netc\n \nChoose  a  few  that  you  will  implement  into  your  own  program  \n \n \n \n     5.  What  would  I  deliver  if  my  product  costs  1/10th  its  current  cost  \nand\n \nhad\n  \nto\n \nprovide\n \nmore\n \nvalue\n \nthan\n \nI\n \ncurrently\n \nam\n \nat\n \nmy\n \ncurrent\n \nprice?\n \n\n### Page 4\n\nEx.  Crazy  group  training,  valuable  video  modules,  record  looms  for  \nbottlenecks,\n \ntons\n \nof\n \nrole\n \nplays,\n \naccountability\n \ncheck\n \nins,\n \netc\n \nImplement  every  single  thing  that  you  listed  down  here  \n \n \n"},{"badge":"13","group":"offer","section":"Positioning","title":"Product-Market Fit","description":"Validate that your offer matches real, paying market demand.","status":"archived","format":"pdf","sourceUrl":"https://gohconsulting.app/sops/product-market-fit.pdf","portalUrl":"https://gohconsulting.app/sops?sop=13","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Product-Market Fit\n\n- Source: https://gohconsulting.app/sops/product-market-fit.pdf\n- Category: offer / Positioning\n- Captured: 2026-09-21T14:01:55.789092+00:00\n\n\n### Page 1\n\n \nPRODUCT  MARKET  FIT \n GOH  CONSULTING   \nAccess  In  the  Goh  Consulting  App:  ●  Go  to  /Select  screen  ->  Recordings  ●  In  Recordings  ->  Click  Program  Modules  ->  Find  Product  market  ﬁt  module  \nand\n \nbelow\n \nit\n \naccess\n \nthis\n \ndocument\n               \n\n### Page 2\n\n \nOverview  This  guide  is  all  about  understanding  your  audience’s  needs  deeply.  Gather  as  much  \ndata\n \nas\n \nyou\n \ncan\n \nfrom\n \nyour\n \nmarket\n \nresearch\n \nto\n \nget\n \nthe\n \nbest\n \nresults,\n \nand\n \nrefer\n \nto\n \nyour\n \nnotes\n \nand\n \nrecordings\n \nfor\n \ninsights.\n  \nCurrent\n \nsituation  Start  by  understanding  the  problems  your  avatar  faces  right  now.  Overall  problems  list \n   \n Deep-rooted  problem •  What  is  the  deep-rooted  problem  that  keeps  them  up  at  night?  •  Example:  it’s  not  actually  working  the  job  he  hates  —  it’s  kno he  data,  just  stop  it  and  say:  remember  to  just  say  “Awesome,  just  got  the  data!”  \n \nCHATGPT  PROMPT Cool!  Here’s  the  key  features  and  beneﬁts  of  my  consulting  product:  (insert  all  key  features  and  beneﬁts)  Side  note  —  if  ChatGPT  starts  working  on  the  data,  just  stop  it  and  say:  remember  to  just  say  “Awesome,  just  got  the  data!”  \n \n\n### Page 7\n\nNow  ChatGPT  is  fuelled  up  with  the  power  of  data.  It’s  time  to  get  the  marketing  \navatar\n \nin\n \ndetail…\n \nCHATGPT  PROMPT Now  I  want  to  create  a  marketing  avatar  using  the  audience’s  data  above.  This  avatar’s  name  is  Steve.  Using  all  of  the  data  above,  describe  who  Steve  is  by  answering  the  questions  below.  Expand  on  descriptions  that  need  expanding.  Describe  your  avatar’s  background  and  current  lifestyle.  What  is  their  occupation  or  daily  work  routine?  How  do  they  typically  spend  their  time  during  the  week,  both  professionally  and  personally?  What  sources  do  they  rely  on  for  news  and  information  outside  of  their  work?  What  is  their  ﬁnancial  situation  like?  How  satisﬁed  or  dissatisﬁed  are  they  with  their  current  job  or  income  level?  What  are  their  main  concerns  and  priorities  in  life?  How  do  their  personality  traits  and  life  circumstances  impact  the  way  you  approach  marketing  your  product  to  them?  Share  some  key  experiences  or  events  from  your  avatar’s  past  that  have  shaped  who  they  are  today.  How  do  they  feel  about  these  events,  and  how  have  they  inﬂuenced  their  current  aspirations  and  interests?  Consider  signiﬁcant  past  jobs,  experiences,  or  life-changing  moments  that  have  played  a  role  in  shaping  their  goals.  Discuss  their  family  and  relationship  status.  Are  they  married,  single,  or  divorced?  Do  they  have  children,  and  if  so,  how  many?  How ":"Pricing Your Offer","description":"Price for value and profit without scaring off buyers.","status":"archived","format":"pdf","sourceUrl":"https://gohconsulting.app/sops/pricing-your-offer.pdf","portalUrl":"https://gohconsulting.app/sops?sop=14","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Pricing Your Offer\n\n- Source: https://gohconsulting.app/sops/pricing-your-offer.pdf\n- Category: offer / Pricing\n- Captured: 2026-09-21T14:01:55.274687+00:00\n\n\n### Page 1\n\n.PRICING  YOUR  OFFER.  .GOH  CONSULTING\n.\n  \nFoundation\n \n \n  \nMost\n \npeople\n \nprice\n \nto\n \nget\n \nmore\n \nyesses\n \n-  We  price  to  maximize  proﬁt  and  peace  of  mind  \nThat  means  saying  no  to  clients  even  if  they  have  enough  money  because  \nwe\n \nwill\n \nmake\n \nmore\n \nwhen\n \nwe\n \ncharge\n \nmore\n \n(in\n \nthe\n \nlong\n \nrun)\n \n-  Better  client  expectations  -  Better  quality  of  client  -  Less  fulﬁllment/  stress  -  More  proﬁt  \nFirst  lets  understand  what  gets  someone  to  buy  \n-  People  buy  when  perceived  value  >  price  \nGoal:  make  it  feel  like  buying  “money  at  a  discount”  \n-  Ex.  $100k  of  value  for  $10k  \nWhen  you  can  achieve  this,  you  have  a  money  printing  machine  \n \nThe\n \nValue\n \nEquation\n \nDream  outcome  x  Perceived  likelihood  of  success  \n—-----------------------------------------------------------------------    =  VALUE  \n               Time  delay  x  Effort  and  sacriﬁce  \n \nDream  outcome:  Is  the  end  result  meaningful  to  them?  \nPerceived  likelihood  of  success:  Do  they  think  they’re  actually  going  to  \n\n### Page 2\n\nsucceed?  \nTime  delay:  How  long  will  it  take  them  to  see  the  ﬁnal  result?  \nEffort  and  sacriﬁce:  Additional  costs  to  achieve  XYZ  \n \nThe  goal  is  to  get  the  bottom  to  0  \n●  Decrease  time,  effort,  and  sacriﬁce  ●  How  can  i  make  it  more  convenient,  seamless,  and  less  effort  \nThen  focus  on  increasing  the  top  \n●  Increase  meaningfulness  of  the  end  result  ●  Increase  the  likelihood  they  they  will  succeed  \n \nAvoid\n \nthis\n \nm istake\n \nWhat  most  coaches  do  \n1.  Look  at  market  place  2.  See  what  everyone  else  offers  and  take  the  average  3.  Price  slightly  below  to  remain  “competitive”  4.  Provide  what  their  competitors  offer  with  “a  little  more”  5.  End  up  at  a  value  proposition  for  “more  for  less”  \nHigh  prices  =  high  value  \nExperiment  conducted  on  a  blind  taste  test  on  wine  \nCheap,  medium,  expensive  \nAll  of  them  were  the  same  wine  but  with  different  price  tags  \nPeople  perceived  more  value  because  the  price  was  higher  \n \nGoal:  Be  so  expensive  that  a  consumer  must  pause  and  think  “this  can't  \nbe\n \nthe\n \nsame\n \ncategory\n \nof\n \nsolution\n \nas\n \neveryone\n \nelse”\n \nmaking\n \nyou\n \na\n \ncategory\n \nof\n \none\n \n\n### Page 3\n\n \nHow\n \nto\n \nprice\n \nyour\n \noffer?\n \nStep  1:  Deﬁne  your  “conservative  outcome”  \n-  What  is  a  reasonable  5  month  outcome  your  ideal  client  would  get  \nif\n \nthey\n \nimplemented\n \nhalf\n \nof\n \nwhat\n \nyou\n \ntaught\n \nthem?\n -  Ex.  Revenue  added,  Revenue  saved,  Value  of  time  saved  \n \nStep  2:  Apply  the  ROI  rule  \n-  Charge  roughly  1-3  months  of  that  outcome  as  your  core  price  so  it  \nfeels\n \nlike\n \nthey’re\n \nbuying\n \nthis\n \nvalue\n \nat\n \na\n \ndiscount\n -  Ex.  $100k  of  value  for  $10k  \nStep  3:  Final  check  \n-  Your  client  should  be  able  to  comfortably  earn  back  the  fee  halfway  \nthrough\n \nyour\n \nprogram\n \nin\n \n3-6\n \nmonths\n \nof\n \nstarting.\n \nIf\n \nnot,\n \nimprove\n \nthe\n \noffer\n \nor\n \nlower\n \nthe\n \nprice\n \n \nP aym ent\n \nP lan\n \nArchitect\n \n \nYou  never  want  to  have  just  “one  price”  ->  Structure  how  they  pay  \n \nfacing)\n \nI  know  you  mentioned  that  (obstacle)  has  been  stopping  you  from  \nmoving\n \nforward,\n \nso\n \nwhen\n \nI\n \nwas\n \nputting\n \nthis\n \nprogram\n \ntogether\n \nit\n \nreminded\n \nme\n \nof\n \nour\n \nconversation\n \nWant  me  to  send  you  more  info  on  how  this  works  \nNo  worries  if  you’re  not  interested,  just  thought  i’d  reach  out  \n \nTemplates  #2  \nHey  (name)  I’m  in  the  middle  of  launching  something  for  (niche)  who  \nwant\n \n(result)\n \nand\n \nI\n \nthought\n \nyou\n \nmight\n \nknow\n \nsomeone\n \nwho’d\n \nbe\n \ninterested\n \nDoes  anyone  come  to  mind?  \nBtw  if  they  sign  up,  will  send  over  $1000  as  a  thank  you  \n \nAction  Items  \n1.  Make  sure  your  offer  for  this  cash  campaign  is  actually  good  \nWhat  does  your  price  increase,  bonuses,  and  guarantees  look  like?  \n-  What  is  this  offer  for,  who  is  it  for,  what  is  the  outcome?  \n \n2.  Create  a  time  frame  where  you  will  actually  launch  this  price  \nincrease\n \ncampaign\n \nand\n \nschedule\n \nout\n \ncontent\n \nat\n \nleast\n \n3\n \ndays\n \nin\n \nadvance\n \n \n\n### Page 7\n\nKnow  when  you’re  launching,  what  content  you’re  going  to  post  on  each  \nday,\n \nand\n \nhave\n \npure\n \nclarity\n \non\n \nwhat\n \nyou\n \nwill\n \nbe\n \ndoing\n \n \n3.  Increase  value  perception  (ROI  and  COI)  \nBrainstorm  how  you  will  make  your  prospects  understand  the  ROI  and  \nthe\n \nCOI\n \nof\n \nyour\n \nprogram\n \n-  What  will  they  get  out  of  it?  Why  should  they  join  it?  \n \n4.  Social  proof  \nHave  your  best  social  proof  and  client  testimonials  ready  to  post   \n \n5.  Create  2  lists  of  people  that  you  will  be  reaching  out  to  privately  \nonce\n \nyou\n \nlaunch\n \nthis\n \ncampaign\n \nList  1:  People  that  showed  interest  in  your  program  but  didn’t  end  up  \nbuying\n \nList  2:  People  that  potentially  know
