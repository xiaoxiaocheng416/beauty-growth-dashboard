em back into booked calls.","status":"archived","format":"pdf","sourceUrl":"https://gohconsulting.app/sops/revive-past-leads.pdf","portalUrl":"https://gohconsulting.app/sops?sop=18","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Revive Past Leads\n\n- Source: https://gohconsulting.app/sops/revive-past-leads.pdf\n- Category: cash-injection / Lead Nurturing\n- Captured: 2026-09-21T14:01:58.431063+00:00\n\n\n### Page 1\n\n.REVIVE  PAST.LEADS.  .GOH  CONSULTING\n.\n  \nGoal\n \nGoal:  Look  through  your  past  clients  who  booked  a  call  with  you  but  did  \nnot\n \nbuy\n \nAND\n \npast\n \nclients\n \nthat\n \nstopped\n \nworking\n \nwith\n \nyou\n \n-  Chances  are  they’re  still  stuck  at  the  same  spot  and  if  you  reach  out  \nto\n \nthem\n \nThese  are  the  lowest-hanging  fruit  and  we  want  to  get  cash  in  your  \nbusiness\n \nASAP\n \n \nP rocess\n \nGo  to  Calendly,  GHL,  or  wherever  people  schedule  calls  with  you  \n-  Look  at  past  calls  in  the  last  12  months  and  reach  out  to  every  single  \none\n \nof\n \nthem\n \nthrough\n \nInstagram\n \n \nSend  a  voice  note,  to  make  it  extremely  personalised  and  increase  the  \nchances\n \nof\n \nthem\n \nresponding\n \nto\n \nyou\n \n-  “Hey  NAME,  it's  been  awhile  since  we  last  spoke.  *small  talk  here*  \nWhat\n \nhave\n \nyou\n \nbeen\n \nup\n \nto?”\n \nOnce  they  reply,  with  how  things  are  going,  ask  them  if  they’ve  \nachieved\n \ntheir\n \ngoal\n \nyet\n \n-  “That’s  awesome,  did  you  manage  to  achieve  your  DESIRED  GOAL  \nbtw?”\n \nIf  they  say  no,  you  want  to  act  shocked  and  in  disbelief  \n-  “Oh  wow  how  come?   \nThey’ll  explain  blah  blah  and  if  they  don't  say  the  obstacle  then  say  this  \n-  “What’s  stopping  you  from  achieving  GOAL?”  \n\n### Page 2\n\nIf  they  do  say  their  obstacle,  then  propose  a  call  \n-  “Honestly  would  love  to  see  if  we  can  revisit  the  convo  we  had  last  \nmonth/\n \nyear\n \nand\n \nsee\n \nif\n \nwe\n \ncan\n \nhelp\n \nyou\n \nsolve\n \nPROBLEM\n \nto\n \nachieve\n \nGOAL.\n \nDown\n \nto\n \nhop\n \non\n \na\n \ncall\n \nand\n \ndiscuss\n \nmore\n \ndetails?”\n \n \nDo  not  follow  this  script  word  for  word,  this  is  just  an  example  \n-  The  most  important  part  about  everything  is  that  you  trust  your  \ngut,\n \ngenuinely\n \ncare\n \nabout\n \nthe\n \nclient,\n \nand\n \ndon't\n \ncome\n \nacross\n \nas\n \ntoo\n \nsalesy\n \nIf  you  run  an  established  coaching  business,  you  should  generate  a  \ngood\n \namount\n \nof\n \nmoney\n \nfrom\n \nthis\n \n \n"},{"badge":"19","group":"fulfillment","section":"Client Success","title":"Maximizing Goh Consulting","description":"How clients get the most out of the program.","status":"archived","format":"pdf","sourceUrl":"https://gohconsulting.app/sops/maximizing-goh-consulting.pdf","portalUrl":"https://gohconsulting.app/sops?sop=19","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Maximizing Goh Consulting\n\n- Source: https://gohconsulting.app/sops/maximizing-goh-consulting.pdf\n- Category: fulfillment / Client Success\n- Captured: 2026-09-21T14:01:59.757725+00:00\n\n\n### Page 1\n\n \n.HOW  TO  MAXIMIZE.  .GOH  CONSULTING.  .GOH  CONSULTING. \n \nGoal\n \nGet  the  most  out  of  Goh  Consulting  and  increase  your  chances  of  success  \n-  The  most  successful  clients  I’ve  worked  with  do  this,  and  it’s  led  to  \ndoubling/\n \ntripling\n \ntheir\n \nbusiness\n \nin\n \na\n \nspan\n \nof\n \nmonths\n \n \nCom m on\n \nP atterns\n \nOf\n \nSuccessful\n \nClients\n \nAll  of  the  most  successful  clients  doing  consistent  6  ﬁgures  to  high  5  \nﬁgures\n \na\n \nmonth\n \nfollow\n \nthese\n \ncommon\n \npatterns:\n \n●  Lead  with  value  ﬁrst  approach  ->  highest  leverage  thing  you  can  do  ●  Watch  all  the  video  modules  and  implement  ●  Join  group  calls  and  learn  ●  Network  with  people  ahead  of  you  ○  DM  them,  be  active  in  the  community  \n \nGroup\n \nCalls\n \nExposure  is  huge.  When  you’re  around  guys  who  are  doing  more  than  \nyou,\n \nyou\n \nget\n \nexposed\n \nto\n \nwhat\n \nis\n \nreally\n \npossible\n \n-  Comfort  and  complacency  are  the  killers  of  growth  -  Group  calls  give  you  exposure  to  people  in  the  community  who  are  \ndoing\n \nbetter\n \nthan\n \nyou,\n \nwhom\n \nyou\n \ncan\n \ndirectly\n \nconnect\n \nwith\n \n \n\n### Page 2\n\n \nNetworking\n \nEverybody  in  Goh  Consulting  is  an  expert  in  a  speciﬁc  ﬁeld  \n-  Reach  out  to  people  ahead  of  you  or  people  better  than  you  at  \ncertain\n \naspects\n \nof\n \nbusiness\n \nthat\n \nyou’re\n \nweak\n \nat.\n \n \nFor  example,  if  your  A+  problem  is  appointment  setting,  reach  out  to  \nsomeone\n \nwho’s\n \nmastered\n \nthat\n \nskill\n \n \nValue\n \nFirst\n \nProvide  value  ﬁrst  and  expect  nothing  in  return  \n-  Celebrate  your  wins  -  Celebrate  other  people’s  wins  -  Ask  questions  -  Provide  value  \n"},{"badge":"23","group":"content","section":"Scripting","title":"Scripting Hooks","description":"Write hooks that stop the scroll, and the patterns behind the ones that do.","status":"content_archived","format":"","sourceUrl":"https://docs.google.com/document/d/1lUEp4HGWHtdy4VUW7WZgcCdI_vz37n0rTiWBvspTpB0/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=23","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Scripting Hooks\n\n- Source: https://docs.google.com/document/d/1lUEp4HGWHtdy4VUW7WZgcCdI_vz37n0rTiWBvspTpB0/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 2\n\n## Hooks\n\n.SCRIPTING HOOKS.\n\n.GOH CONSULTING.\n\nBy far, the most important part of every video after the idea is the hook. No matter how good the value is, the hook decides whether or not the viewer actually sticks around to listen. If the hook isn't dialled in, nothing else in the video matters.\n\nOverview\n\nEvery single month, I’m able to attract over 5 million new viewers to my account and 1000s of qualified leads completely organically, simply because I mastered the one skill of hooks.\n\nHooks control 3 key factors that determine the success of your video:\n\n- Reach: how many people can your piece of content actually be shown to\n\n- Lead Quality: which type of people does your video attract\n\n- Retention: how long your viewers actually spend watching your video\n\nIn this SOP, I’m going to break down exactly how you can master hooks to maximise the amount of people your content is shown to while also ensuring it’s shown to the RIGHT people.\n\nWhat Determines a Good Hook?\n\nA good hook will allow you to reach the right audience, keep your audience’s attention and be broad enough to appeal to a mass market.\n\nIt creates questions without trying and open loops to keep the viewer interested until the end of a video.\n\n![Embedded image](../assets/23/kix_9oazqzhnkryj.png)\n\nWatch the start of every Mr Beast YouTube video\n\nHe established a huge open loop by creating a question that you want answered and establishing massive stakes so you want to know what happens\n\n![Embedded image](../assets/23/kix_lxhmyc7k6cqj.png)\n\nThere is no “uninteresting” video because his only objective is to get as many views as possible\n\nThe key here is to leverage open loops and curiosity in your hooks while still catering to a qualified ICP audience\n\nExample:\n\n[https://www.instagram.com/reel/DavyRS5M0VC/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==&igsi=MzRlODBiNWFlZA==](https://www.instagram.com/reel/DavyRS5M0VC/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==&igsi=MzRlODBiNWFlZA==)\n\n“I’m dropping another $250,000 into the S&P 500, I'm trying to do this every single month, and let me tell you something that nobody on social media will tell you”\n\nThis hook not only appeals to my ICP, but my dream follower\n\n- It makes you think “what does this guy do? What does he sell? He looks young, is he a scammer?”\n\nThe best hooks create open loops that are completely unrelated to the video without trying\n\nUnderstanding these factors is going to be the difference between you staying stuck in 2000 view jail or having videos perform like this:\n\n![Embedded image](../assets/23/kix_p94gl74r903u.png)\n\nWhat Determines a Bad Hook?\n\nA bad hook will speak to a low quality audience, appeal to a niche market and lose your audience’s attention in the first three seconds, resulting in them scrolling.\n\nIt doesn't have a big enough open loop for someone to stay till the end of the video. You would not watch it yourself again because it’s “boring”\n\nIt's all about yourself. There's nothing for the viewer, no real benefit for the viewer in the first 5-10 seconds\n\nRemember, it's not all about giving value. You also want to satisfy their dopamine and get their questions answered if something sparks their interest.\n\nThere are three ways you can go about perfecting your hooks.\n\n1 - Visual Hooks\n\nThe visual hook is what the viewer sees in the first frame of the video. There are 3 types of visual hooks you can lean into:\n\n- Object or Prop\n\nAn object that ties back to what you're talking about in the video and helps explain a concept. This could be: a physical book, a phone, a whiteboard etc. The goal of this is to act as a pattern interrupt or help explain a certain concept.\n\n- Location\n\nThe question the environment has to answer is: does this make you want to stay? This could mean filming somewhere unexpected like a rooftop, a highrise, a car park, or a private jet.\n\nAvoid filming in low quality environments as that will decrease the perceived value of your content and appeal to a less qualified audience.\n\n- Motion\n\nHumans are wired to track movement, a static frame gives the eye nothing to follow whereas adding motion stops the viewer in their scroll. This could be placing down your camera, sitting down, pouring water into a glass, etc.\n\nHere’s some examples:\n\n![Embedded image](../assets/23/kix_jy1vzlv5pf03.png)\n\n2 - Text Hooks\n\nThe text hook is an on-screen caption/overlay in the opening frames of the video. Its goal is to do one of three things:\n\n- Create curiosity: open a loop the viewer needs closed before they scroll\n\n- Direct callout: name the person the video is for, so they self-select in\n\n- Shock factor: a number or claim that stops the scroll\n\nNote: It should mirror or sharpen the verbal hook, not be a copy of it. If the text says exactly what you're saying, you've wasted the retention layer.\n\nUse it to add more context and detail so while your viewer is listening to the verbal hook, they’re reading the text hook as a result, increasing the likelihood of stopping their scroll.\n\n![Embedded image](../assets/23/kix_kybh74nhesj9.png)\n\nExample 1: “pov: you get your moms live reaction to you making $150k/m at 19”\n\n- This is extremely broad allowing it to appeal to the mass market\n\n- “$150k/m at 19” sparks curiosity opening a loop in the viewers mind\n\n- Making your mom proud is a desirable outcome that lots of people either want or can relate to\n\n- “Live reaction” gives the viewer context encouraging them to stay\n\nExample 2: “the reason why you’re still stuck at $30k-$40k”\n\n- This is too niche. It only appeals to people making $30k-$40k and struggling to scale\n\n- The TAM is too narrow meaning it won’t be shown to many people as it doesn’t resonate with the mass market\n\nIf you are using a text hook, you need to know the exact text hook before you film the video, the same way you should know the title and thumbnail of a YouTube video before you film.\n\nAlways master packaging first, and then film.\n\n3 - Verbal Hooks\n\nThe verbal hook is what you say in the first 1-3 seconds of the video. Typically, this will be the first line of your script. The goal of this is to create either curiosity, tension, or a pattern interrupt.\n\nThere are five main parts to a verbal hook. You won't use all five in every hook, but the strongest ones use 4-5:\n\n- Subject word\n\nEstablishes who the video is actually about. Direct address is a pattern interrupt: it calls out your ICP so they know you're talking to them. This is the key to attracting qualified viewers versus unqualified viewers.\n\n- Action word\n\nWhat the subject is doing or did. Eg. “scaled, trapped, fired, doubled, quit.”\n\n- Outcome word\n\nThe result or the transformation. Make it extremely specific: numbers have more of a shock factor and makes it more believable. Eg. \"$100k/mo\" > \"a lot of money\" just make sure to show proof.\n\n- Contrast word\n\nThis is the gap between point A, where they started, and point B, where they finished. \"From $5k to $50k.\" Contrast is what makes the outcome feel earned instead of made up.\n\n- Time word\n\nCompresses the outcome into a timeframe that feels extremely fast or extremely slow. \"In 14 days.\" This is what creates urgency.\n\nFor Example\n\n[https://www.instagram.com/reel/DUBxSt1jCVf/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==](https://www.instagram.com/reel/DUBxSt1jCVf/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n\"I helped this guy make over $150,000 a month and buy a Lamborghini Urus in just 7 months.\"\n\nElement | The words | Why it works\n\nSubject word | \"I helped this guy\" | Focus is on me. It positions me as the authority and as the solution.\n\nAction word | \"make over\" | Sets up the outcome that follows.\n\nOutcome word | \"$150,000 a month and a Lamborghini Urus\" | Describes the audience's dream outcome, and it's specific enough to picture instantly.\n\nContrast word | \"I helped this guy go from [current situation] to [dream outcome]\" | Answers where he was before: without the before, the after means nothing.\n\nTime word | \"in just 7 months\" | Creates urgency, feels extremely fast, and ties back to the sales process.\n\nHook Examples\n\n[https://www.instagram.com/reel/DXC2yLFjPeI/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==&igsi=MzRlODBiNWFlZA==](https://www.instagram.com/reel/DXC2yLFjPeI/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==&igsi=MzRlODBiNWFlZA==)\n\n“Here’s how i spent my $311,000 pay check last month. First things first i spent $50,000 on index funds ”\n\n- Hook that is hard to replicate and creates massive open loops\n\n- creates HUGE open loop\n\n- what does this guy do?\n\n- is he lying?\n\n- what does he spend his money on?\n\n- what does he sell?\n\n- is he a scammer?\n\nReel that not a lot of people can copy even if they tried because of the wow factor\n\n- The harder your hook is to replicate by other people, the better -> simply means that it is more unique\n\n- Find out what you can talk about that nobody else can\n\n[https://www.instagram.com/reel/DSkqJ5XjIO0/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==](https://www.instagram.com/reel/DSkqJ5XjIO0/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n“Content in 2026 is the exact same as investing in Bitcoin in 2013, You will get rich for life if you do it the right way.\n\nI built a 3 million dollar per year business by simply posting content and this is the one thing that no one will tell you. People will try to avoid building a strong brand by running ads to grow their business”\n\n- Hook that attracts ICP and dream follower, then niches down in the second line -> perfect MOF video\n\nQuick checklist\n\nRun this when writing your hooks. Every box should be a yes:\n\n- Verbal hook lands in under three seconds, with no preamble\n\n- At least four of the five verbal elements are present\n\n- The text hook is on screen in frame one and doesn't duplicate the verbal hook\n\n- Text is readable in one glance and clear of the platform safe zone\n\n- The first frame has a prop, an unexpected location, or motion\n\n- Topic clarity: a stranger knows what the video is about immediately\n\n- Direct curiosity: you callout your audience and set the expectation for either information or entertainment value\n\n## Scripting\n\n.SCRIPTING.\n\n.GOH CONSULTING.\n\nEveryone I speak to, all face this One Bottleneck in common, regardless of how much they’re making or how long they’ve been in the game.\n\nIt's that they sit down to film and don't actually know what they're going to say. So they wing it, the video comes out flat and they blame the wrong thing.\n\nI'll be honest with you: scripting isn't a skill you pick up overnight. I've spent 3 years and 100s of videos getting good at this, and most of that time was spent making bad videos and working out why they were bad. But you can skip the guesswork…\n\nOverview\n\nBy the end of this, you should have a repeatable framework you can follow any time you need to script a video.\n\nWhile scripting, there are 3 things worth having at your disposal:\n\nYour ICP: who this is for, specifically\n\nYour Content Pillars: the 3–5 things you talk about\n\nYour Language Bank: the phrases your buyers used about their own problem (from the Buyer Mirror Form)\n\nThis will help you tailor your content to your target audience\n\nThe scripting process all starts with the idea. You can pull content ideas from everywhere and by doing these 5 exercises each week, you’ll always have videos in the pipeline:\n\nYour DMs: Pinpoint the last 20 questions people asked you in the DMs and break them down in videos\n\nSales Calls: Take the 10 most recent objections from your sales calls and pre-handle each one in a video\n\nNew Client Onboarding: Write the 5 things you explain to every single new client in their first week. If you've said it more than five times, it's a video you haven't made.\n\n1-1 & Group Calls: Find the most commonly asked questions you get on your calls. Anything you find yourself answering twice in the same call becomes a pillar, not a video.\n\nYour Own Outliers: Take all your outlier videos (the videos that performed 5-10x better than the average one) and recreate these with a new angle or positioning.\n\n0. The Vision\n\nBefore writing a single line, you need to get clear on the actual intention behind the video. This includes why you think it will work and who it is actually designed for. Without these, you’re just throwing ideas at a wall and hoping they stick.\n\n\"This video is for [WHO], about [WHAT], and after watching it they should [DO / BELIEVE / FEEL WHAT].\"\n\nIf the video is for YouTube, this is also where you should plan the packaging (title and thumbnail) prior to scripting.\n\nThe goal is to have the entire video outlined in the pre production process so all that’s left to do is sit down, press record and then hand the footage over to the editors.\n\n![Embedded image](../assets/23/kix_ureociboxyu3.png)\n\n1. Hook\n\nNext we need to plan the most important part of the script: the hook. This is everything included within the first 3 seconds of the video and is the make or break of the video.\n\nA Good Hook will act as a pattern interrupt that stops the viewer's scroll and incentivises them to watch the rest of the video. A Bad Hook will encourage the viewer to scroll. Repeatedly failing to hook your viewer means you’re subconsciously training them to scroll, losing you active followers.\n\nThere are 3 Main Types of Hooks you need to understand:\n\n- Visual Hook\n\nWhat the viewer sees in the first frame of the video\n\n- Verbal Hook\n\nWhat you say in the first 1-3 seconds of the video\n\n- Text Hook\n\nAn on-screen caption/overlay in the opening frames of the video\n\n![Embedded image](../assets/23/kix_oeq7oqf1g0ph.png)\n\nYou can access our in-depth [Hooks SOP](https://docs.google.com/document/d/1QxIry7ibp5rVFodqzjrXRF_PshISGM6QqkBpUbkRbtM/edit?usp=sharing) here.\n\n2. Build Up\n\nProvide 2 lines of some background or context. This gives the viewer clarity on what the video is going to be about, why they should listen and what they’re actually going to gain from it.\n\nFor storytelling focused videos, this is where you should talk about your before state, where you were, giving specific examples and details.\n\nIf it’s more of a value video, this is where you’ll share credibility and give people a reason to actually listen to you.\n\nIf the video is focused around your client, this should be an overview of where they were before working with you - their main bottlenecks and limiting beliefs\n\n3. Body\n\nThis is the main value segment of the video and it is the reason the viewer is even watching in the first place.\n\nIf your video is focused on delivering value, this portion should be extremely actionable. You should provide the value, explain why it’s important and tie it to an outcome.\n\nAsk yourself: “Is it actionable enough to the point where the viewer can implement it tomorrow and see a result?”\n\nFor more storytelling focused videos, you need to make sure the messaging is extremely clear and that the viewer actually understands the importance of the message you’re delivering.\n\nThe video should be focused around ONE message. Otherwise, it just becomes confusing and hard to consume.\n\nHere are some examples of body structures that work:\n\n3 Steps\n\n- Breaking down a problem or into 3 Key Steps\n\n- The goal of this is to show the WHAT, WHY it generates results but NOT how to actually do it\n\nProblem, Cause, Fix\n\n- Call out what people are doing wrong and explain how this is holding them back. Tie it back to your audience’s pain points\n\n- Show the solution and link it back to how it’s going to help them achieve an outcome\n\nBefore, Turning Point, After\n\n- Where you were, the exact moment it changed and where you are now\n\nMyth, Reality, Proof\n\n- Call out a common belief in the industry\n\n- Explain why it is wrong, breakdown what’s actually true and share proof to support your claim\n\n4. Takeaway\n\nEvery video should have a strong lasting message. This is 1-2 lines that determines whether the viewer feels like the video was actually worth watching.\n\nWhat does this piece of value or story actually mean for the viewer? It should almost act as a summary to tie the video together.\n\nCheck out the end of this video:\n\n[https://www.instagram.com/reel/DbrIOy8xjwX/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==](https://www.instagram.com/reel/DbrIOy8xjwX/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n“So many founders fail to realise that the best content they can film, is content that already happened they just didn’t capture it”\n\nThis is perfect because it does two things:\n\n- It doubles down on one core message: I see too many people try to throw everything they want to say into one script and hope for the best but all this does is create noise and the main message gets lost\n\n- There’s an actionable piece of advice attached to the video which our ICP can take away and implement TODAY into their content\n\n5. CTA\n\nThere are a couple rules to follow with CTAs to ensure they have a high conversion rate and are actually effective in your content:\n\n- Give BEFORE you take\n\nFocus on using CTAs in your most value heavy videos. Most people place CTAs in random videos where the viewer doesn’t even feel like they’ve gained anything.\n\nLimit how many videos you use them in because you need to GIVE before you ask for something in return.\n\n2. Lead Magnets\n\nLeverage Freebies & Lead Magnets to get your audience in the DMs. You can use these within Carousels, Reels and Stories.\n\nSetup your ManyChat and once you’ve got them in the DMs, you can follow up with them and ask how they found it.\n\nFind out your audience’s Pain Points in the DMs and send them personalised FREE Resources tailored to their bottlenecks.\n\nFor example, a video like this is perfect for a CTA and Lead Magnet:\n\n[https://www.instagram.com/reel/DTIvgFzjOZc/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==](https://www.instagram.com/reel/DTIvgFzjOZc/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n- We provide so much FREE Value that we’ve earned the right to ask the viewer for something in return\n\n- The FREE Value is so good that the viewer is left wanting more increasing the likelihood of them commenting\n\nChecklist\n\nRun this when writing your scripts. Every box should be a yes:\n\n- Do I have a visual, verbal and text hook?\n\n- Is there a clear takeaway or action item from the video?\n\n- Would I pay $5 to watch this reel?\n\n- Is it under 75 seconds MAX after being filmed and cut?\n\n- After 3 seconds, does the viewer want to keep watching?\n\n- Are there clear links back to our Target Audience?\n\n- Is there ONE clear message from the video?\n"},{"badge":"24","group":"content","section":"Production","title":"Trial Reels","description":"Test an idea on non-followers with a trial reel before committing to it.","status":"content_archived","format":"","sourceUrl":"https://docs.google.com/document/d/1C3pL1xHPyMffsh18dlYzqFsSLAV24W-6IpZnwrUKv9U/edit?tab=t.gl00v9p9ux6l","portalUrl":"https://gohconsulting.app/sops?sop=24","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Trial Reels\n\n- Source: https://docs.google.com/document/d/1C3pL1xHPyMffsh18dlYzqFsSLAV24W-6IpZnwrUKv9U/edit?tab=t.gl00v9p9ux6l\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Trial Reels\n\n.TRIAL REELS.\n\n.GOH CONSULTING.\n\nGoal: take the videos that have already proven they work, create iterations of them, and push them to new people only so your reach becomes predictable instead of hopeful.\n\nOverview\n\nThere is a Trial toggle on the final share screen before you post a reel. Turn it on and the reel is shown to non-followers only.\n\n- It does not appear on your grid, your Reels tab, or your followers' feeds\n\n- Only you can see that it is a trial\n\n- It sits in your profile alongside your drafts\n\n- You can share it to everyone later with one tap\n\nRequirements: public account, professional account.\n\nFind Your Outliers\n\nAn outlier is any video that performed at least 3-5x better than your average.\n\nIf you average 20k views, a 60k to 100k video is an outlier.\n\nYour Growth Tracker is where these live. Fill it out at the end of every month, once posts have had time to pick up momentum. For each outlier, log the hook, the transcript, the topic and the format.\n\nHere is access to our [Growth Tracker Template](https://nickel-binder-b69.notion.site/Growth-Tracker-be0d2a33e63382ea9a5c01c5c518c8ff?source=copy_link)\n\nDiagnose Why It Worked\n\nBefore you recreate anything, break the outlier down. There are five components:\n\n- Hook\n\nWhat were the first one to three seconds? Was it a text hook, a verbal hook, a visual hook, or all three?\n\n- Angle\n\nWhat was the perspective? Controversial, aspirational, relatable? Who did it call out?\n\n- Format\n\nHow was the message delivered? Talking head, raw talk iPhone, B-roll, reaction, green screen, split screen?\n\n- Emotional Trigger\n\nWhat did the viewer actually feel? Hope, fear, validation, curiosity, FOMO?\n\n- Topic\n\nWhat was the subject? A pain point, a desire, a belief being challenged?\n\nThe hook is the component you should be most careful with. It is the single biggest determiner of whether the iteration performs, because the hook is the reason people stay and watch at all.\n\nFor a more detailed version of this, check out the SOP on [Reverse Engineering Viral Videos](https://docs.google.com/document/d/1MM1bYoNb0EXhGo3CEOWUJbTqVD78IZjM0C6SjBDnmGA/edit?usp=sharing)\n\nBuild The Iterations\n\nCreate 3-5x variations of each outlier. You are not reshooting the video, you are making small incremental changes so it does not get registered by the algorithm as a straight repost.\n\nThat matters, because a flagged repost can get taken down. Things to change:\n\n- The music\n\n- The B-roll, especially the couple of seconds under the hook\n\n- The title hook or text overlay\n\n- The verbal hook, the first spoken line\n\n- The format itself, eg. the same video redone as a sit-down talking head instead of a raw iPhone video\n\nChecklist\n\nRun this before you post a Trial Reel. Every box should be a yes:\n\n- Have I kept the hook and the topic intact?\n\n- Have I made a genuine incremental change so Instagram does not read it as a repost?\n\n- Do I have 3-5 variations of this video, not just one?\n\n- Am I under five trial reels for the day?\n\n- Is my main feed cadence still running, with trials sitting on top of it?\n\n- Is this top of funnel content, not proof or offer content?\n\n- ☐ Does it still clear the Visual Identity standard? A cold buyer is judging the brand on this.\n\nRun this after:\n\n- Has the momentum died down before I move it to the main feed?\n\n- If I am reposting to the main feed instead, has it been at least 30 to 45 days?\n\n- Is the result logged against the original outlier in the Growth Tracker?\n"},{"badge":"26","group":"content","section":"Research","title":"Buyer Mirror Form","description":"Ask existing clients why they bought, then market on their answers.","status":"content_archived","format":"","sourceUrl":"https://docs.google.com/document/d/1dW3IJrJgNXewJCYu4V-bEL3nkg4bmzzW8ywWnFnmpOg/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=26","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Buyer Mirror Form\n\n- Source: https://docs.google.com/document/d/1dW3IJrJgNXewJCYu4V-bEL3nkg4bmzzW8ywWnFnmpOg/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n.BUYER MIRROR FORM.\n\n.GOH CONSULTING.\n\nThe goal of this SOP is to help you find the unique messaging and positioning that you can leverage in your personal brand to stand out from competitors in your industry. In a time where everybody looks the same, feels the same, and says the same things, we can stand out by directly asking our clients what made them choose us over everybody else.\n\nThe biggest mistake people make is they try to figure out their messaging themselves instead of asking the people that bought from them in the first place. You can solve 99% of your problems by simply asking your clients. Your positioning and messaging are no different, the best way to start is by asking our clients.\n\nOverview\n\nA Buyer Mirror Form allows you to reverse engineer exactly why your clients chose you so you can double down on this in the marketing and attract more of the same people.\n\nThe goal of the form is to get the people who have actually paid you to explain, in their own words, what made them buy and then use those exact words to rebuild your content, your funnel and your sales call.\n\nThis should be sent to every Current Client and every Past Client. Do not send it to leads, followers, or your audience. Non-buyers will tell you what they like where as buyers tell you what they paid for.\n\n- If you want to go a step further, you can send this only to the top 20% of ICP so that the data you collect is extremely accurate and pinpointed towards targeting your favorite client, not just any client.\n\n![Embedded image](../assets/26/kix_kisyj3cufbxg.png)\n\nQuestions\n\nThe form is built around 13 Questions which will give you clarity on exactly what you should double down on showing in the marketing:\n\nWhat's your name?\n\nWhere did you first find me? Tells you which channel produces buyers and specifically which video they came from.\n\nWhy did you decide to do this?\n\nHow long did it take you to decide to start working with me? This gives you clarity on the typical duration of your sales cycle.\n\nWhat made you want to work with me?.\n\nWhat finally pushed you to book a call? This is the trigger event which you can double down on to increase urgency in your audience.\n\nBefore the call, on a scale of 1–10, how convinced were you that you'd sign up?\n\nWhat were your biggest hesitations before joining? These are objections you can take and directly integrate into the content.\n\nThere are other online coaches - why did you choose me?\n\nWhat did I say in my content that made you consider joining?\n\nWhat are the most valuable aspects of the programme you didn't realise were included until our call? Make note of this and show more of it within the content.\n\nWas there a weird or random reason you were attracted to working with me?\n\nWhat are some hobbies of yours?\n\nHow To Use It\n\nOnce you’ve collected the data, we now need to understand how to actually leverage it within your content.\n\nIf the answers are surface level, this won't work well. I would recommend hopping on calls with your favorite clients and going a layer deeper and asking them why they said this specific thing and really getting to the root cause of it.\n\nFor example\n\nThere are other online coaches - why did you choose me?\n\n- I chose you because I felt like you actually cared about client results and fulfillment and would actually want me to succeed.\n\n- Why is that important to you?\n\n- Because I've tried other mentors before, I felt like they didn't care about my results, and I got burned in the past.\n\n- Why does that matter?\n\n- I have a fear of investing again because I lost trust from my previous investment, and it did not make me feel good about myself.\n\n- What would make you feel like this is different?\n\n- You speaking with your clients, hanging out with them, showing your interactions, showing the relationships you've built, et cetera\n\nIn this scenario, we went from getting a surface-level answer on caring about client results to uncovering the real pain, which was the prospect saying that he's been burned before. The way we can combat this in our marketing is to show more client-facing content where we show the relationship that we've built with our client. An example would be:\n\n- posting a vlog on a client retreat\n\n- doing more client interviews\n\n- showing sit-down client conversations\n\n- etc.\n\nYour best marketing material will come from getting the deep-rooted answer that will take a bit longer to find, but once you have it, You can create content that builds trust like no other person in your industry\n\n- Build A Language Bank\n\nOpen a doc and copy the most common phrases buyers used about their problem, fear, goal, and you.\n\nCopy and paste this prompt into claude along with your responses you’ve received\n\n“This is a list of reasons why my clients chose me over my competitors. I want you to take this information and distill it into the most common phrases that buyers use about their problems, fear, goals, and everything you think is important, so that I can use this as marketing material in my content. Be concise, use their exact wording, and elaborate so that I fully understand how I can leverage this information in my content.”\n\n- Objection Handling Content\n\nTake your most common hesitations and convert it into pieces of content:\n\nName it: say the objection out loud in their exact words\n\nEvidence: a client who had that objection, and what happened\n\nMechanism: the part of how you work that makes it not apply\n\nCopy and paste this prompt into claude along with your responses you’ve received\n\n“I want you to map out the biggest reasons that could stop someone from working with me based on the responses that I got from my clients. Based on this, give me specific content ideas and formats that I could potentially post about to solve these objections directly so that we don't hear these objections on sales calls again.”\n\nDon’t overlook Question 12 and 14. These are going to be extremely important to pinpoint WHY they bought into YOU as a person.\n\n- For example, I’ve had people buy into me because they like the fact that I’m Asian or that I play basketball. These are all small things that I double down on and refer back to in my content.\n\nI use this in a lot of my YouTube hooks, and it works extremely well because instead of me telling people that I'm productive, I'm showing them\n\n- Example: [https://www.instagram.com/sooweigoh/reel/DYNhqo8Muy3/](https://www.instagram.com/sooweigoh/reel/DYNhqo8Muy3/)\n\nI could be basic and say that I'm super productive, but I decided to leverage my own internal life and what people said in the buyer mirror in this hook that made it feel different and made me stand out.\n\nNow you have a tool in your marketing arsenal to be able to leverage every time you feel like you don't have any good ideas.\n\nChecklist\n\n- Have I listed every person who has ever paid me, current and past?\n\n- Is the form built with all 13 Questions and a required name field?\n\n- Have I booked 3x LIVE Interviews with my best clients?\n\n- On the calls, am I asking \"why\" at least twice per answer?\n\n- Which 3x changes have I executed this week?\n"},{"badge":"27","group":"content","section":"Production","title":"Camera Presence","description":"Look and sound natural on camera so delivery does not undercut the script.","status":"content_archived","format":"","sourceUrl":"https://docs.google.com/document/d/1QnyyBudDOHq8M5W9DWedr8OPChsGfTstCw4GD5Gs75g/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=27","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Camera Presence\n\n- Source: https://docs.google.com/document/d/1QnyyBudDOHq8M5W9DWedr8OPChsGfTstCw4GD5Gs75g/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n.CAMERA PRESENCE.\n\n.GOH CONSULTING.\n\nBefore you read through this SOP, watch some of my earliest reels. I started out reading word for word off a script, I had a flat voice and it took 30 takes just to get one video which I still hated. These are some of my old reels:\n\n[https://www.instagram.com/reel/Cx--2VQMd-5/?igsh=MW45NGMwczB3NGhldA==](https://www.instagram.com/reel/Cx--2VQMd-5/?igsh=MW45NGMwczB3NGhldA==)\n\n[https://www.instagram.com/reel/C0JwjVmiddZ/?igsh=dnF4NzNvbG1mdmlk](https://www.instagram.com/reel/C0JwjVmiddZ/?igsh=dnF4NzNvbG1mdmlk)\n\n[https://www.instagram.com/reel/C0jaB1zirQ9/?igsh=ZjVlbDgzNm5vN2Y](https://www.instagram.com/reel/C0jaB1zirQ9/?igsh=ZjVlbDgzNm5vN2Y1)\n\nAnd then look at the recent ones.\n\n[https://www.instagram.com/reel/DYNhqo8Muy3/?igsh=aW54NXRwMDF1cWJn](https://www.instagram.com/reel/DYNhqo8Muy3/?igsh=aW54NXRwMDF1cWJn)\n\n[https://www.instagram.com/reel/DbgnxA8R9YJ/?igsh=Y25qMzcxdmI4cWY4](https://www.instagram.com/reel/DbgnxA8R9YJ/?igsh=Y25qMzcxdmI4cWY4)\n\n[https://www.instagram.com/reel/DWwyzGxDHQ7/?igsh=MTMyaDl1azVpd3ZwZw==](https://www.instagram.com/reel/DWwyzGxDHQ7/?igsh=MTMyaDl1azVpd3ZwZw==)\n\nThe goal with this SOP is to collapse everything i know to show you how to achieve this transformation in half the time.\n\nThe key to having good camera presence is practice and repetition. As boring as it sounds, this is what it takes. I personally have an in-person communication coach that gives me live feedback based on the videos and reels we analyze. You can really go as far as you want with this.\n\nThe most influential people in the world all know how to carry themselves and communicate in a way that lands with the audience. I'm going to show you exactly what has worked for me and how I've been able to increase my conviction on camera.\n\nOverview\n\nMost people are terrible on camera because nobody ever taught them how to communicate in a way that lands.\n\nThe gap between what someone knows and what they can communicate on camera is enormous. You can hold the single best insight in your industry, and if you can't deliver it in a way that holds attention, it's worth nothing.\n\nThe good news is that this is a skill, not a personality trait. It can be trained by following these 5 Steps:\n\n- Pinpoint your Flow State\n\n- Pre-production Checklist\n\n- 5 Rules of Conviction\n\n- Scripting Frameworks\n\n- 3 Drills\n\n1. Pinpoint Your Flow State\n\nYour content looks forced because it is forced. You turn on the camera and you try to express something that doesn't feel right in the moment. The key here is to capture when you're in flow state and not forced.\n\nEveryone has a context where they communicate at their best. This is where conviction is at an all-time high and the words come out effortlessly.\n\nEarly on I did what everyone else does: turned the camera on in my room, tried to speak value, and it came out flat and forced.\n\nThe fix wasn't better delivery. It was changing where the filming happened. Instead of trying to manufacture a performance, I started filming my actual calls and packaging the moments where I’m naturally at my best.\n\nYour Flow State might be different:\n\n- After a workout\n\n- During a 1-1 call\n\n- A specific environment\n\n- Walking, driving, in conversation with someone else in the room\n\nThis is when you're in your zone of genius. Think about times throughout the week where your tonality, conviction, and speech are at their all-time high, and capture those moments.\n\n![Embedded image](../assets/27/kix_69jsw1rnfhxl.png)\n\n[During A Team Call](https://www.instagram.com/reel/DVJ9cs6DCsg/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n[Post Recording Session](https://www.instagram.com/reel/DXfN-hqET-o/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n[At A Mastermind](https://www.instagram.com/reel/DTThCmADJlZ/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\nThe best reels that I've personally filmed with the most amount of conviction have been documentation. It was not filming specifically for a reel, but it was me doing something, and the camera just captured the moment.\n\nYour best content already happened, you just didn't capture it\n\nAction Item: Write down 3 contexts where you communicate best. Then either film inside that context, or manufacture it.\n\n2. Pre-production Checklist\n\nBefore filming anything, ask one question: Am I giving my viewer at least 5 Reasons to keep watching? This is everything the viewer takes in before they hear a single word:\n\n- Background: Are you positioned in a way that communicates authority? Is there something behind you that gives the viewer a reason to respect you before you speak?\n\n- Clothing: Does what you're wearing reinforce the image of someone worth listening to?\n\n- Presentation: Is everything in the frame intentional? Does it look like someone who takes their work seriously?\n\n- Communication: Is your tonality strong? Is your conviction clear from the first word?\n\n- Overall Image: If someone screenshotted this video right now, what impression would they form?\n\nIf you're not giving the viewer these 5 Reasons to stay before your first word, you're making your hook do all the work and no hook is strong enough to overcome a bad first impression.\n\nDon't film close to the wall where there's no depth, wear a wife beater and have terrible lighting. You need to be intentional about the way you present and the way you first come across.\n\nBefore you even let yourself speak, would you listen to yourself by simply looking at your visual identity?\n\n- If you struggle with this, I highly recommend checking out the Visual Identity SOP.\n\n3. 5 Rules of Conviction\n\nConviction is the difference between someone who speaks to the camera versus someone who captures their audience’s attention.\n\nHere’s 5 Rules to make sure you actually have conviction on camera:\n\nRule 1: Only talk about what you've experienced\n\nThe fastest way to lose conviction is talking about things you haven't experienced. Build your content almost entirely around your own experiences: what you've tested, results you've seen, mistakes you've made\n\nRule 2: Slow down\n\nMost people talk too fast on camera. It's a nervous habit. Aim to speak slightly slower than feels natural (not painfully slow) as this will show confidence.\n\nRule 3: Use pauses intentionally\n\nMost people are afraid of silence. You need to get comfortable with it. A well-placed pause before a key point creates anticipation, makes the viewer lean in, and signals that what's coming next holds value.\n\nRule 4: Make eye contact with the camera\n\nThe camera is your audience. Look directly into it and the viewer feels like you're talking to them personally.\n\nRule 5: Talk to one person\n\nImagine the exact person from your Dream Follower Worksheet sitting on the other side of the lens. This is what makes communication direct instead of broadcast.\n\n4. Analyze Your Content\n\nAfter filming content, replay exactly what you said and ask yourself what you can improve. Oftentimes, you'll notice that you speak too fast or you don’t have enough tonality.\n\n- Note them down and intentionally film it again, and play both back\n\nThis exercise makes you so much more intentional when you're filming because you are subconsciously aware of what you could have improved in the last recording session.\n\nThe key here is to watch back a raw video with no editing, no animations. Just keep it raw and watch it back.\n\nIf you get bored simply by listening to yourself, then you are not speaking with enough emotion and conviction. The goal here is to pinpoint what that is, change it, and make it better. You can do that by doing the exercises below\n\n5. 3 Drills\n\nWhen I first started creating content, I was doing 30 takes to get one usable video. It wasn’t a confidence problem, it was a mechanics problem. My articulation, my pace and my breath couldn’t keep up with what my brain was trying to say.\n\nThese drills fix both layers. The Warm-Up trains the hardware: your mouth, your pace, your breath. The 3 Drills train the delivery: fluency, clarity, conviction.\n\nThe Warm-Up: 10 Minutes Before You Hit Record\n\n- Warm-Up before every filming session. One of the 3 Drills, 3x a week.\n\nMost people never train the hardware. They try to fix their delivery when the real problem is that their articulation, pace and breath physically can’t keep up with their brain. That is what causes 30 takes.\n\n- Tongue Twisters: 3 mins\n\nPull the top 50 tongue twisters off Google or ChatGPT. Pick one, read it out loud 5 times, faster on every single rep. A tongue twister is built to trip you up, so speed without articulation fails instantly. That’s the point. It forces the muscle in your lips and tongue to catch up.\n\nWhy it matters on camera: speed without articulation is mumbling. Speed with articulation reads as authority.\n\n- The Rate Ladder: 2 mins\n\nFind any 300-word story. Start a 1-minute timer, read out loud, stop dead at the minute, mark where you got to and count the words. That number is your words-per-minute baseline. Every session after, add 10 words: 110, then 120, then 140, then 160. If you plateau, don’t push harder, diagnose. Nine times out of ten your mouth can’t keep up, which sends you straight back to tongue twisters.\n\nWhy it matters on camera: rate of speech is the only part of your delivery you can actually measure. Everything else is opinion.\n\n- Breath Control: 3 mins\n\nTwo parts, both starting from a deep belly breath (diaphragm, not chest).\n\nPart 1: hold an “sssss” until you completely run out of air. Go as long as you possibly can.\u000bPart 2: count 1 to 21 on a single breath, giving every number the exact same amount of air and the exact same energy.\n\nMost people dump all their air on the first few words, strain through the rest, and finish in vocal fry. You want breath to ease out of you, not get pushed out of you.\n\nWhy it matters on camera: trailing off on the last three words is the single most common reason a strong line lands weak.\n\n- Box Breathing: 2 mins, before high-pressure filming\n\nFully exhale. In for 4, hold for 4, out for 4, hold for 4. That’s one cycle. Do 3 to 5.\n\nWhy it matters on camera: anxiety impairs your ability to think clearly and it is visible on camera. Do this in the car, before the call, before you hit record.\n\nAction Items\n\n- Identify your flow state: write down the Top 3 Contexts where you communicate best\n\n- Film 60 seconds inside that context: unscripted, unfiltered.\n\n- Watch it back and score yourself on the 5 Filters: background, dress, presentation, communication, overall image.\n\n- Film the same 60 seconds again, this time deliberate about all five\n"},{"badge":"28","group":"content","section":"Profile","title":"Pinned Post","description":"The pinned posts a profile needs, and the job each one has to do.","status":"content_archived","format":"","sourceUrl":"https://docs.google.com/document/d/1_l3tmTQ5nPifarMiK6TKho6W78XSwaNVJb6f7lJXlAs/edit?tab=t.gl00v9p9ux6l","portalUrl":"https://gohconsulting.app/sops?sop=28","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Pinned Post\n\n- Source: https://docs.google.com/document/d/1_l3tmTQ5nPifarMiK6TKho6W78XSwaNVJb6f7lJXlAs/edit?tab=t.gl00v9p9ux6l\n- Capture: Google Docs API, all returned tabs\n- Tab count: 4\n\n## Pinned Posts\n\n.PINNED POSTS.\n\n.GOH CONSULTING.\n\nThe most important part of your profile is making sure that you have the right pinned posts that make your viewer feel like you are different from everybody else. The outcome we’re looking for is to convert someone who lands on your profile from a viewer to a follower by delivering them enough information about you in the shortest timespan possible\n\nWe can design the first impression our viewers have of us by being intentional about this.\n\nOverview\n\nA profile viewer makes a follow-or-leave decision in seconds, and the three pinned posts are the only content on your page you get to choose for them.\n\nYour Pinned Posts have 3 Main Roles:\n\n- Admirable: Show who you are and why should people care about you\n\n- Credible: Provide proof that you are who you say you are\n\n- Aspirational: Position yourself as likeable and trustable\n\nBy executing your pinned posts the right way, they will nurture your viewer by selling them on you as a person, building authority and positioning yourself as someone who can help them.\n\nGo on the left tab to see which videos you should create.\n\n## My Story Video\n\n.MY STORY VIDEOS.\n\n.GOH CONSULTING.\n\nGoal: A ‘My Story’ Video shows a full transformation across time, and the viewer buys in because they recognise the starting point as their own.\n\nOverview\n\nA ‘My Story’ Video compresses a long transformation into under a minute: where you started, what went wrong, what changed, and where you are now.\n\nThis should be one of your Pinned Posts and your First Video you create as it delivers the viewer a complete summary of who you are in the shortest time period possible and instead of being focused on the product, it sells them on YOU as a person.\n\n![Embedded image](../assets/28/kix_1i0qt0vbgyrq.png)\n\nThere are different ways of executing My Story Videos. Here are some proven examples:\n\n- [Talking Head](https://www.instagram.com/reel/DJUjf_Jir5c/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n- [B Roll Montage](https://www.instagram.com/reel/DLk142piCNi/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n![Embedded image](../assets/28/kix_fqets23uloyt.png)\n\nThe Process\n\nStep 1 - Choose your Starting Point\n\nWrite down where your audience is right now: their current situation, their limiting beliefs, the pain points they face. Then find a moment from your own story that matches it.\n\nThis should be the opening of your video, regardless of whether it is the actual chronological start of the story.\n\nBe specific and paint the picture. Your description should be so clear and concise that your audience can visualise it\n\n- Bad Example: “I was struggling”\n\n- Good Example: “I had no team, I was working twelve hour days, and I was making seven thousand a month”\n\nStep 2 - Choose your End Point\n\nNow write down where you are today. This will typically be the direct opposite of the starting point you just chose.\n\nThe end point has to answer the same question as the starting point. If you opened with a focus on income, close on income. If you opened with a focus on on time, close on time.\n\nOnce you have both poles, all you need to do is fill in the middle with the highs, lows, turning point and redemption arc.\n\nThe easiest way to fill the gaps is to do a brain dump of all the key parts of your journey that you want to include.\n\nDon’t feel the need to include every single one, just pinpoint the most relevant. Remember any other subplots you want to talk about can be turned into their own storytelling videos.\n\nStep 3 - Write the Hook\n\nThis is the most important part as it’s going to set the tone for the video and determine if the viewer actually stays or scrolls.\n\nThere are 3 hook variations you can choose from:\n\n- Then Vs Now Contrast\n\n“I went from [specific low] to [specific high] in [timeframe].”\n\n- Question\n\nIs it possible to [outcome viewer wants] at [unlikely circumstance]?\n\nOther variations: ‘What happens when…’ or ‘Would you…’\n\n- Key Event\n\n[Year]: [Significant life event]\n\nStep 4 - Write the script\n\nHere’s a general framework you can follow when scripting your ‘My Story’ video:\n\nHook: Choose from Step 3\n\nStarting Point: Your before state, where you were, giving specific examples and details\n\nThe Attempt: What you tried and failed\n\nThe Low Point: The moment everything nearly ended.\n\nThe Turn: What was the main change and turning point. This could be a key decision, realisation or person.\n\nThe Climb: What came after the turning point. This is the bridge between where you were versus where you are today.\n\nNow: Where you are today. This should contrast with the starting state.\n\nThe Message: A one liner on what this means for the viewer. There should be a strong lasting message and payoff that rewards the viewer for watching until the end.\n\nStep 5 - Production\n\nChoose whether you want to execute the video as a ‘Talking Head’ or ‘B Roll Montage’\n\nTalking Head: here you're carrying the whole story with delivery, so it lives or dies on pacing. Shoot in one take and cut every dead beat. Have clear captions to mark each stage of the story so the viewer can see progress even with their sound off.\n\nB Roll Montage: use it if you have real footage from the period you're describing. Clear captions and visuals will carry the video.\n\nRules for both:\n\n- There should be a visual change every 3 seconds to keep the viewer engaged\n\n- Cut every pause, breath and filler word. The video should be under 75 seconds total\n\n- Captions should be visible the entire time\n\n- The music, visuals and story should all be in sync; use hopeful music for the highs and sad music for the lows\n\nBefore you export: watch it on mute. The viewer should be able to follow the arc from visuals and captions alone.\n\nReference Videos\n\nHere are some other ‘My Story’ video examples you can refer to for inspiration:\n\nTalking Heads\n\n[Video 1](https://www.instagram.com/reel/DQPk1efDM3Q/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n[Video 2](https://www.instagram.com/reel/DNTSEhkoPwS/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n[Video 3](https://www.instagram.com/reel/DPJmIqICOy0/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\nB Roll Montages\n\n[Video 1](https://www.instagram.com/reel/DAXXuQFOlnL/?utm_source=ig_web_copy_link&igsh=NTc4MTIwNjQ2YQ==)\n\n[Video 2](https://www.instagram.com/reel/DElNMVqS8p3/?utm_source=ig_web_button_share_sheet&igsh=MzRlODBiNWFlZA==)\n\n[Video 3](https://www.instagram.com/reel/DR7S9CPjNm8/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n## 'I Made It' Video\n\n'.‘I MADE IT’ VIDEOS.\n\n.GOH CONSULTING.\n\nThe entire goal of this video is to build admirability for people to care about the future content that you post because you are living the exact life that they want to live\n\nWhile it may not directly lead to inbound leads or sales, this will build a strong reason for viewers to consume your middle funnel content to get them nurtured.\n\nOverview\n\nAn ‘I Made It’ Video documents a moment where you achieve a goal that your audience aspires to achieve.\n\nBy showcasing a Desired Outcome that everybody wants to achieve (not only your ICP but also your Dream Follower) this allows you to attract a wide TAM while peaking curiosity and positioning you as an authority.\n\n![Embedded image](../assets/28/kix_fxe17aie6f83.png)\n\nTypically, these videos won’t be scripted as they’re more focused on capturing raw and authentic moments. That means to capture these videos we follow a slightly different process:\n\nThe Process\n\nStep 1 - Pinpoint The Outcome\n\nFind the Dream Outcome that your viewer truly wants. This could be anything from a financial, health or personal goal as long as it’s something your viewer aspires to achieve.\n\nFor Example\n\nBuying your Dream Car\n\nTelling your Mom How Much You Made in a Month\n\nBuying a Big Gift For a Loved One\n\nStep 2 - Documentation\n\nOnce you’ve pinpointed the outcome, you need to find a way to film it that feels authentic and natural.\n\nIf your video involves other people, maybe to capture a reaction, the best way to do this authentically is by setting up a hidden camera or making sure the subject is unaware that they are being filmed. This will make the video feel natural and not forced.\n\nIf the video only involves you, it helps having a camera man who you are comfortable with, filming you and asking questions or prompts behind the camera.\n\n- NOTE: Do not make your loved ones feel awkward just because you want to film the video. Make them feel natural. Get them used to the camera. The first time you film them, you shouldn't be filming them for this video.\n\n- This is why I like to film only their voice and not them, because they are not as comfortable on camera. The moment should take the number one priority, and the camera should just feel like it's there as if no one notices it.\n\n- Your camera man ideally is a family member, someone that the subject knows very, very well and is comfortable with it.\n\n- IPhone videos will do extremely well because people are used to taking pictures all the time.\n\nFor example: [https://www.instagram.com/reel/DagVlBOMQ94/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==](https://www.instagram.com/reel/DagVlBOMQ94/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\nStep 3 - Post Production\n\nThis is the make or break for the video. Since it’s less scripted and a more raw approach, the post production is extremely important to ensure the message is not lost within the video and it’s still engaging to consume.\n\nThere are two main aspects of the post production you need to consider:\n\n- Clipping\n\nFocus on removing the least engaging parts and fluff. When watching the footage, ask yourself two questions:\n\n“Does this add to the main message of the video?” and “if I remove this will it impact the video?”\n\nIf the answer to both of those questions is NO, then remove this part of the clip as it is fluff.\n\n- Hook\n\nThe one key factor that separates the best performing ‘I Made It’ videos versus the worst is the hook.\n\nIf you look at the reference videos at the top of this page, they all have very clear title, visual and verbal hooks.\n\nTitle Hook: shows the desired outcome, sparks curiosity and boosts retention by suggesting it’s a LIVE reaction\n\nVisual Hook: shows a human reaction, eg: laughing or crying\n\nVerbal Hook: captures the main moment of the reaction and evokes a strong emotion eg: happiness, excitement etc\n\nYou can access our [Clipping SOP](https://docs.google.com/document/d/1pK4JXa8mo-cGeA5Vk8kHbWYmZmofimCKhLgNznAQri8/edit?usp=sharing) and our [Hooks SOP](https://docs.google.com/document/d/1QxIry7ibp5rVFodqzjrXRF_PshISGM6QqkBpUbkRbtM/edit?usp=sharing) here.\n\nNote: give your editor a reference video of good examples and guide them on how you want the video to look. This will ensure the execution matches the proven examples.\n\nReference Videos\n\nHere are some ‘I Made It’ video examples you can refer to for inspiration:\n\n[Video 1](https://www.instagram.com/reel/DJM2HaOifEk/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n[Video 2](https://www.instagram.com/reel/DPbnjXZjbGU/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n[Video 3](https://www.instagram.com/reel/DP1mwuLEXEa/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n## Case Study Video\n\n.CASE STUDY VIDEOS.\n\n.GOH CONSULTING.\n\nGoal: increase the perceived value of your insights by either borrowing other people’s results to teach your principle or leveraging your own client transformations\n\nOverview\n\nA case study takes an outcome and reverse-engineers the mechanism that produced it. The outcome is what captures the viewers attention. The transferable principle is what they stay for and what they take away.\n\n![Embedded image](../assets/28/kix_g5xyltrmkcw.png)\n\nThere are 3 main ways you can execute a Case Study Video\n\n- [Storytelling Talking Head](https://www.instagram.com/reel/DUBxSt1jCVf/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\nHere you’re taking your biggest client case studies and breaking down where they were before working with you versus where they are after working with you and the 3 biggest changes you implemented to help them achieve this outcome.\n\nThis works because it gives your audience clarity on what it looks like to work with you and ties back to their bottlenecks positioning you as the solution.\n\n- [Creator Breakdown](https://www.instagram.com/reel/DCjbiTizOIq/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\nThis is the perfect solution if you don’t have many client results. It involves leveraging other creators or brands and breaking down what they’re doing to achieve a specific outcome.\n\nThis allows you to borrow authority from bigger creators and brands and hijack their existing audience.\n\n- [Client Testimonials](https://www.instagram.com/reel/DSa5R0XjEkn/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\nClip the best moments of your Client Interviews and convert them into testimonial videos.\n\nExecute it either as a montage of the best clips OR specific client testimonials where you show them speaking about the ‘Before working with you’ versus ‘After working with you’\n\nThe Process\n\nStep 1 - Choose the Result\n\nThe result has to be all of the following: surprising, specific and verifiable.\n\nSurprising means the outcome does not match the input. For example: a cheap thing beating an expensive one, a short timeframe producing a crazy outcome\n\nSpecific means a number, a timeframe, or a visible state change. You always need to give evidence to back your claims.\n\nVerifiable means the viewer could check it. This ties into sharing proof.\n\nStep 2 - Pinpoint the Mechanism\n\nBefore you script anything, get clear on the transferable principles you’re going to share with the viewer. This is the actual value behind the video and should be tailored to the pain points of your clients.\n\nAsk yourself: could someone apply this value tomorrow into their business and solve a bottleneck or generate a similar outcome.\n\nStep 3 - Write the Hook\n\nThe video should open on the result. Aim to lead with a number or the specifics. Here are some examples of hooks:\n\n- I helped [person] [achieved result] in [timeframe]\n\n- This [person] built a [$ amount] [thing] in [timeframe] using [method]\n\n- So [unexpected person] just [achievement] in a [$ size] industry\n\n- The [worst possible thing] won [prestigious outcome]\n\n- [Known name] generated [massive result] for [specific thing]\n\nStep 4 - Scripting\n\nHere’s a general framework you can follow when scripting your ‘Case Study’ video:\n\nHook: [Subject] + [specific result] + [timeframe or scale].\n\nContext: Provide some background or context. If the video is focused around your client, this should be an overview of where they were before working with you - their main bottlenecks and limiting beliefs\n\nThe Mechanism: What they actually did. This is the body and the main value.\n\nProof: Show the evidence: the screen, the number, the before and after. Whenever you make a claim, it needs to be backed with proof.\n\nAction Items: Provide a general rule or action the viewer can take away and implement for themselves.\n\nThe Takeaway: This is the lasting message and determines if the viewer feels the video is valuable or not.\n\nClose: A Follow or a keyword CTA if you have a resource on the mechanism.\n\nStep 5 - Show Proof\n\nThis format relies on credibility, and credibility needs to be shown with visuals.\n\n- Show the actual thing: the post, payment dashboard, product etc. The easiest way to display this is a screen recording or screenshot.\n\n- Show the before and after together where one exists. The contrast between the two is what hits the viewer.\n\nReference Videos\n\nHere are some other ‘Case Study’ video examples you can refer to for inspiration:\n\nStorytelling Talking Heads\n\n[Video 1](https://www.instagram.com/reel/DUBxSt1jCVf/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n[Video 2](https://www.instagram.com/reel/DSYSTtHjKtb/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\nCreator Breakdowns\n\n[Video 1](https://www.instagram.com/reels/DGwq98PNVHb/)\n\n[Video 2](https://www.instagram.com/reels/DEFU-4cTF64/)\n\n[Video 3](https://www.instagram.com/reels/DYj9DFyhRoc/)\n\nClient Testimonials\n\n[Video 1](https://www.instagram.com/reel/DOT8MWDDPfC/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n[Video 2](https://www.instagram.com/reel/DRX9cUfjK8h/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n"},{"badge":"29","group":"content","section":"Scripting","title":"Mastering Hooks","description":"Go deeper on hook construction and why certain openings hold attention.","status":"content_archived","format":"","sourceUrl":"https://docs.google.com/document/d/1QxIry7ibp5rVFodqzjrXRF_PshISGM6QqkBpUbkRbtM/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=29","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Mastering Hooks\n\n- Source: https://docs.google.com/document/d/1QxIry7ibp5rVFodqzjrXRF_PshISGM6QqkBpUbkRbtM/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n.MASTERING HOOKS.\n\n.GOH CONSULTING.\n\nI've watched hundreds of videos die in the first three seconds because although the idea was good and the value was strong, nobody stayed long enough to see any of it. If the hook isn't dialled in, nothing else in the video matters.\n\nOverview\n\nEvery single month, I’m able to attract over 5 Million new eyeballs to my account and 100s of qualified leads completely organically, simply because I mastered the one skill of hooks.\n\nHooks control 3 key factors that determine the success of your video:\n\n- Reach: how many people can your piece of content actually be shown to\n\n- Lead Quality: which type of people does your video attract\n\n- Retention: how long your viewers actually spend watching your video\n\nIn this SOP, I’m going to break down exactly how you can master hooks to maximise the amount of people your content is shown to while also ensuring it’s shown to the RIGHT people.\n\nGood Vs Bad Hooks\n\nA good hook will allow you to reach the right audience, keep your audience’s attention and be broad enough to appeal to a mass market.\n\nA bad hook will speak to a low quality audience, appeal to a niche market and lose your audience’s attention in the first three seconds, resulting in them scrolling.\n\nUnderstanding these factors is going to be the difference between you staying stuck in 2000 view jail or having videos perform like this:\n\n![Embedded image](../assets/29/kix_p94gl74r903u.png)\n\n1 - Visual Hooks\n\nThe visual hook is what the viewer sees in the first frame of the video. There are 3 types of visual hooks you can lean into:\n\n- Object or Prop\n\nAn object that ties back to what you're talking about in the video and helps explain a concept. This could be: a physical book, a phone, a whiteboard etc. The goal of this is to act as a pattern interrupt or help explain a certain concept.\n\n- Location\n\nThe question the environment has to answer is: does this make you want to stay? This could mean filming somewhere unexpected like a rooftop, a highrise, a car park, or a private jet.\n\nAvoid filming in low quality environments as that will decrease the perceived value of your content and appeal to a less qualified audience.\n\n- Motion\n\nHumans are wired to track movement, a static frame gives the eye nothing to follow whereas adding motion stops the viewer in their scroll. This could be placing down your camera, sitting down, pouring water into a glass, etc.\n\nHere’s some examples:\n\n![Embedded image](../assets/29/kix_jy1vzlv5pf03.png)\n\n2 - Text Hooks\n\nThe text hook is an on-screen caption/overlay in the opening frames of the video. Its goal is to do one of three things:\n\n- Create curiosity: open a loop the viewer needs closed before they scroll\n\n- Direct callout: name the person the video is for, so they self-select in\n\n- Shock factor: a number or claim that stops the scroll\n\nNote: It should mirror or sharpen the verbal hook, not be a copy of it. If the text says exactly what you're saying, you've wasted the retention layer.\n\nUse it to add more context and detail so while your viewer is listening to the verbal hook, they’re reading the text hook as a result, increasing the likelihood of stopping their scroll.\n\n![Embedded image](../assets/29/kix_kybh74nhesj9.png)\n\nExample 1: “pov: you get your moms live reaction to you making $150k/m at 19”\n\n- This is extremely broad allowing it to appeal to the mass market\n\n- “$150k/m at 19” sparks curiosity opening a loop in the viewers mind\n\n- Making your mom proud is a desirable outcome that lots of people either want or can relate to\n\n- “Live reaction” gives the viewer context encouraging them to stay\n\nExample 2: “the reason why you’re still stuck at $30k-$40k”\n\n- This is too niche. It only appeals to people making $30k-$40k and struggling to scale\n\n- The TAM is too narrow meaning it won’t be shown to many people as it doesn’t resonate with the mass market\n\n3 - Verbal Hooks\n\nThe verbal hook is what you say in the first 1-3 seconds of the video. Typically, this will be the first line of your script. The goal of this is to create either curiosity, tension, or a pattern interrupt.\n\nThere are five main parts to a verbal hook. You won't use all five in every hook, but the strongest ones use 4-5:\n\n- Subject word\n\nEstablishes who the video is actually about. Direct address is a pattern interrupt: it calls out your ICP so they know you're talking to them. This is the key to attracting qualified viewers versus unqualified viewers.\n\n- Action word\n\nWhat the subject is doing or did. Eg. “scaled, trapped, fired, doubled, quit.”\n\n- Outcome word\n\nThe result or the transformation. Make it extremely specific: numbers have more of a shock factor and makes it more believable. Eg. \"$100k/mo\" > \"a lot of money\" just make sure to show proof.\n\n- Contrast word\n\nThis is the gap between point A, where they started, and point B, where they finished. \"From $5k to $50k.\" Contrast is what makes the outcome feel earned instead of made up.\n\n- Time word\n\nCompresses the outcome into a timeframe that feels extremely fast or extremely slow. \"In 14 days.\" This is what creates urgency.\n\nFor Example\n\n[https://www.instagram.com/reel/DUBxSt1jCVf/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==](https://www.instagram.com/reel/DUBxSt1jCVf/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==)\n\n\"I helped this guy make over $150,000 a month and buy a Lamborghini Urus in just 7 months.\"\n\nElement | The words | Why it works\n\nSubject word | \"I helped this guy\" | Focus is on me. It positions me as the authority and as the solution.\n\nAction word | \"make over\" | Sets up the outcome that follows.\n\nOutcome word | \"$150,000 a month and a Lamborghini Urus\" | Describes the audience's dream outcome, and it's specific enough to picture instantly.\n\nContrast word | \"I helped this guy go from [current situation] to [dream outcome]\" | Answers where he was before: without the before, the after means nothing.\n\nTime word | \"in just 7 months\" | Creates urgency, feels extremely fast, and ties back to the sales process.\n\nQuick checklist\n\nRun this when writing your hooks. Every box should be a yes:\n\n- Verbal hook lands in under three seconds, with no preamble\n\n- At least four of the five verbal elements are present\n\n- The text hook is on screen in frame one and doesn't duplicate the verbal hook\n\n- Text is readable in one glance and clear of the platform safe zone\n\n- The first frame has a prop, an unexpected location, or motion\n\n- Topic clarity: a stranger knows what the video is about immediately\n\n- Direct curiosity: you callout your audience and set the expectation for either information or entertainment value\n"},{"badge":"31","group":"content","section":"Scripting","title":"Viral Hook Library","description":"A running library of proven hooks to adapt instead of writing from a blank page.","status":"archived","format":"xlsx","sourceUrl":"https://docs.google.com/spreadsheets/d/1RhtlKnVHsED56F7fXM7xKO0UQmmZlZ8ut_vchrkJFLY/edit?gid=1614901158#gid=1614901158","portalUrl":"https://gohconsulting.app/sops?sop=31","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Viral Hook Library\n\n- Source: https://docs.google.com/spreadsheets/d/1RhtlKnVHsED56F7fXM7xKO0UQmmZlZ8ut_vchrkJFLY/edit?gid=1614901158#gid=1614901158\n- Category: content / Scripting\n- Captured: 2026-09-21T14:02:02.997380+00:00\n\n## Hook Templates\nHook Templates\tViral Examples\tFilled-In\nStrong Opinion-based Hooks\tStrong Opinion-based Hooks\tStrong Opinion-based Hooks\nPeople are so [insert controversial opinion]…\tI Love [insert type of people]\t\nI think [insert here]...\tTo get to [dream or aspiration] is not hard\t\nIf your [action] isn’t working, this is why [insert reason]\tHow to know if you have [Insert problem]\t\nQuestion Hooks\tQuestion Hooks\tQuestion Hooks\nHow much is this [show item]?\tQuestion Hook\t\nDo you agree with [blank]?\tCan I tell you my [Insert superlative topic]?\t\nWhat’s your thoughts on [insert topic, person, place thing]?\tQuestion Hook\t\nWhat’s wrong with [insert action, person, place, thing]?\tWhat's your biggest fear in life? [my biggest fear is...]\t\nWhat’s the truth about [insert topic]?\tQuestion Hook\t\nWant to make [insert $ amount] a month?\tWhat's the truth about [insert topic]?\t\nDoes [action] actually help with [insert thing]?\tWhat makes [insert topic] worth it?\t\nWhy does nobody talk about [insert topic]?\tQuestion Hook\t\nShould you [insert action]?\tWhy do we [insert popular action]?\t\nHow do you [insert action]?\t[Action] doesn't help with [insert something that action is believed to help with]?\t\nCelebrity Hooks\tCelebrity Hooks\tCelebrity Hooks\n[Celebrity] + [insert popular fact/story about them]\tCelebrity Hook\t\n[Celebrity] recently [insert story]…\tCeleb + Money + Story\t\n[Celebrity] said [insert quote]…\tWhat do you think of [celebrity or celebrity project]\t\n[Celebrity] did this [story]…\tWhy [Celebrity] is [insert something positive]?\t\n[Celebrity] secret to [insert anything]\tCelebrity Hook\t\nWhy doesn’t anyone talk about these [#] things [celeb] does before [action]?\tCelebrity Story\t\nHow [celebrity] does [insert action]\t[Celebrity] [Insert Negative thing that happened to them]\t\nMost people don't know that [celebrity] actually [insert anything]\t[Celebrity] is [insert shocking accusation]\t\nSomebody did [insert action] to [celebrity]\t[Celebrity] do you know [insert something that's not widely known]\t\n[Celebrity] is [insert shocking accusation]\tCelebrity + Story Hook\t\nStory Hooks\tStory Hooks\tStory Hooks\nQuick story on the one time that [insert
