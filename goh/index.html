eeds to be surface level or you just tell them exactly what to do and they will go away and try it out first instead of realizing they need your help\n\nNow If someone knows the solution and gives you a good answer\n\n- agree + sauce through acknowledgement\n\n- nurture more through relevant long form >\n\nwith a sophisticated icp they may know what to do right now but they may get stuck in a month, that's where you make sure you are known as an authority in the market to them\n\nUse good marketing/yt vids or even private resources you can send them out and this will build a lot of trust\n\nthen you follow up in a couple weeks and repeat the process> since the trust is there they will tell you if its not going to their plan and you're already close to booking\n\nTHE OTHER TYPICAL SCENARIOS ARE:\n\nA) they'll agree and open up more and ask about your offer\n\nB) they'll realise they need you but have a logistical issue > nurture and keep close tabs until they're ready\n\n##### Step 6 — pitch\n\n##### Goal: have them accept the call\n\n##### Actions:\n\nthe pitch is basically a template which is specialized for each leads situation\n\nkey points:\n\n- mention case studies\n\n- talk about the transformation they can have\n\n- mention their specific issue to recap\n\n- build scarcity through couple slots\n\n- positioned in their best interests\n\nmore importantly its about reading a lead:\n\n- are they ready for a pitch - problem and solution aware\n\n- make sure you've got their full perspective so you have handled any upcoming objections before the pitch\n\n- is the problem big enough?\n\ntemplates:\n\ngot a couple time slots in the next few days, can run a call and show you exactly how i helped XYZ dial in their XYZ and how it would work for you to\n\ngot a couple time slots in the next few days, let's run a call and i'll show you exactly how I fixed/dialled in/built out my XYZ and how it would work for you too\n\n##### Step 7 — Post booking\n\nGoal: nurture and build rapport\n\nActions:\n\nFollow the post booking SOP\n\nyou want to spend the most time with the leads closest to buying\n\nits easier to make more of your bookings close than find a ton more leads to book in\n\n- send relevant long form\n\n- get them to fw you more through rapport\n\n- build frame with the closer/csm\n\n- if low budget on the calendar then clear that up so qual leads are on the cal\n\nbook in for as soon as possible\n\ngive the closer good call notes\n\nremind them about the call on the day\n\nOutput: Lead is most likely to buy\n\n##### Step 8 — Log & Tag\n\nGoal: Maintain data integrity for KPI and CRM tracking.\u000b Actions:\n\n- Update CRM tag → Proposed.\n\n- Record in KPI tracker:\n\n- Convos Started (#)\n\n- Follow-Ups (#)\n\n- Proposed Calls (#)\n\n- Leave note if lead requested later follow-up (e.g., “Next week”).\u000b Output: All leads properly tracked for Step 2 of conversion pipeline.\n\n#### Quality Assurance (QA) Checklist\n\nQA Item | Description | Responsible\n\nRapport built before value dropped | 3+ friendly exchanges before offer mention | Setter\n\nGoal + Pain identified | Lead clearly expressed both | Setter\n\nValue line or proof shared | 1 concrete authority statement used | Setter\n\nCall proposed naturally | No abrupt or pushy transition | Setter\n\nCRM + KPI updated | Conversation logged same day | Setter Manager\n\n#### Roles & Responsibilities\n\nRole | Duties | Stage Involved\n\nSetter | Execute framework, move lead to “Proposed” | All Steps\n\nSetter Manager | Audit convos weekly, track message tone & data | QA\n\nCloser | Receives booked leads post-proposal | Step 7 onward\n\nOps Lead | Maintain CRM tag automation & conversation library | Continuous\n\n#### Common Errors & Fixes\n\nError | Cause | Solution\n\nAsking too many questions upfront | Rigid script adherence | Follow curiosity, not checklist\n\nPitching before pain | Rushing to book call | Identify gap before offering help\n\nUsing generic “bro talk” or slang | Over-familiar tone | Mirror client tone, stay professional-casual\n\nNot confirming intent | Skipping Step 6 | Always check readiness before link\n\nFailing to log in CRM | Forgetting post-DM admin | Include “Log Lead” in EOD checklist\n\n#### Tools & Automations\n\n- Instagram / Discord — Conversation platform\n\n- Google Sheets / Notion CRM — Lead tracking & tagging\n\n- Calendly / Google Calendar — Call scheduling\n\n- Zapier / Make (Integromat) — Automate tag updates when call booked\n\n- Slack / Discord Reports Channel — Daily summary visibility\n\n#### Outputs\n\n- Qualified, “Proposed” leads ready for conversion\n\n- Updated CRM and KPI data\n\n- Clear DM transcript for audit / coaching\n\n- Warmed lead primed for high booking conversion\n\n#### Definition of Done (DOD)\n\n✅ Rapport established and pain identified\u000b ✅ Authority line and value delivered naturally\u000b ✅ Lead verbally agreed to book call\u000b ✅ Tagged “Proposed” in CRM + KPI logged\u000b ✅ Conversation link dropped for review (if required)\n"},{"badge":"43","group":"sales-setting","section":"DMs","title":"Lead Research & Qualification (Before DM Starts)","description":"Research and qualify before the first DM, so the outreach lands.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1CzdnQb8_qrot5CwH2XtK-kE3_-Z5zO5QAQBqDfNKDA8/edit?tab=t.0#heading=h.4e9x3yvbvdmu","portalUrl":"https://gohconsulting.app/sops?sop=43","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Lead Research & Qualification (Before DM Starts)\n\n- Source: https://docs.google.com/document/d/1CzdnQb8_qrot5CwH2XtK-kE3_-Z5zO5QAQBqDfNKDA8/edit?tab=t.0#heading=h.4e9x3yvbvdmu\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### Lead Research & Qualification (Before DM Starts)\n\nVersion: 1.0\n\nPurpose:\u000b To standardize how setters identify, research, and qualify potential leads before outreach.\u000b This SOP guarantees that every DM sent is to a high-fit, financially capable, and contextually relevant prospect — reducing wasted time and improving conversion from “Conversation Started → Booked Call.”\n\n#### Inputs Required\n\nInput | Description | Example\n\nICP Document | Defines target audience, problems, desired outcomes | “Online fitness coaches earning $3–10k/mo wanting to scale to $20k+”\n\nOffer Summary | Core transformation and pricing details | “6-month mentorship to build a consistent client-acquisition system (£4k–£8k)”\n\nLead Source | Where leads are found | Instagram followers, comments, hashtags, Discord, ads\n\nQualification Criteria | Filters for ideal clients | Age, niche, content style, follower quality, bio indicators\n\nCRM or Lead Sheet | Database to log pre-DM lead data | Notion CRM / Google Sheet\n\nChrome or Mobile Access | Tools for scanning profile info efficiently | Instagram desktop / mobile app\n\n#### Step-by-Step Workflow\n\n##### Step 1 — Locate Potential Leads\n\nGoal: Source new prospects from validated environments.\u000b Actions:\n\n- Pull from:\n\n- Followers / Engagers on client pages.\n\n- Commenters on niche content.\n\n- Referrals from existing calls.\n\n- Add 20–30 new profiles per day into CRM for qualification.\u000b Output: Daily list of raw leads pending screening.\n\n##### Step 2 — Profile Audit\n\nGoal: Visually assess profile credibility and ICP alignment.\u000b Actions:\u000b Check the following in under 60 seconds:\n\nCheckpoint | Green Flag | Red Flag\n\nProfile Picture | Clear, professional / personal-brand vibe | No face, anime, spam style\n\nBio / Description | Mentions coaching, niche, or mission | Crypto, Forex, dropshipping spam\n\nContent Quality | Clear niche, educational or motivational posts | Random reposts or inactive\n\nFollowers Range | 500–50k (authentic engagement) | 50 or <1% engagement\n\nLocation | Target country (US, UK, CA, AU, EU) | Non-target regions unless relevant\n\nOutput: “Qualified” or “Disqualified” status per profile.\n\n##### Step 3 — Financial Readiness Check\n\nGoal: Identify affordability and investment capacity indicators.\u000b Actions:\u000b Look for visible cues:\n\n- Travel photos, gym memberships, fashion, car content, business setup.\n\n- Occupation mentions (entrepreneur, manager, business owner).\n\n- Paid promotions or ads on their profile.\u000b If uncertain: flag as “Neutral” (don’t reject outright).\u000b Output: Tag lead as High / Medium / Low budget confidence in CRM.\n\n##### Step 4 — Contextual Relevance\n\nGoal: Ensure the prospect’s goals match the offer’s outcomes.\u000b Actions:\n\n- Skim their last 3–5 posts or stories.\n\n- Identify if their focus aligns with what the offer helps with (e.g., “scaling coaching business,” “building consistency,” “healing journey”).\n\n- If content or caption tone fits, note their likely pain driver (e.g., inconsistent clients, burnout, confusion).\u000b Output: Context note in CRM (“struggling with consistent leads,” “mentions burnout,” etc.).\n\n##### Step 5 — Categorize & Tag\n\nGoal: Sort leads for pipeline management and prioritization.\u000b Actions:\n\nTag | Description\n\nA-Tier | Perfect ICP + high-budget signals + strong content\n\nB-Tier | ICP fit but unclear financial readiness\n\nC-Tier | Weak indicators or non-target region — nurture only\n\nDQ (Disqualified) | Obvious mismatch, spam, or irrelevant industry\n\nOutput: Clean daily CRM segmentation ready for outreach.\n\n##### Step 6 — Prep DM Angle\n\nGoal: Personalize opener before message 1 is sent.\u000b Actions:\n\n- Note 1 relatable element for rapport hook:\n\n- Example: “saw your post on burnout” → use as opener.\n\n- Example: “noticed you’ve been doing X full-time” → ask about it.\n\n- Store in CRM column “Rapport Hook.”\u000b Output: Each lead has personalized message context pre-written.\n\n#### Quality Assurance (QA) Checklist\n\nQA Item | Description | Responsible\n\nAll leads match ICP | No random or off-niche leads | Setter\n\nVisual credibility checked | Profile passes spam filter | Setter\n\nBudget confidence tagged | All leads labeled High/Med/Low | Setter\n\nRapport hook written | Custom hook line prepared | Setter\n\nCRM updated daily | No missing qualification notes | Setter Manager\n\n#### Roles & Responsibilities\n\nRole | Duties | Stage Involved\n\nSetter | Execute research and tagging | Steps 1–6\n\nSetter Manager | Spot-check 10% of leads daily | QA\n\nOps Lead | Maintain CRM template & automation rules | Continuous\n\nCloser | Review A-Tier pipeline for next-day calls | Post-qualification\n\n#### Common Errors & Fixes\n\nError | Cause | Solution\n\nMessaging unqualified leads | No ICP reference used | Always cross-check ICP doc\n\nWrong location/time zone | Didn’t verify country | Confirm via bio or content tags\n\nFinancial mismatch | Ignored visual cues | Use lifestyle indicators before messaging\n\nDuplicate profiles | Manual logging error | Use “Duplicate Check” filter in CRM\n\nMissing rapport hook | Rushing prep | Set 15-min pre-outreach audit window\n\n#### Tools & Automations\n\n- Instagram / Discord / TikTok — Lead sourcing\n\n- Google Sheets / Notion CRM — Qualification & tagging\n\n- Zapier / Make — Auto-sync lead data into CRM\n\n- Loom / Screenshot Tool — For manager audits\n\n- Time Zone Buddy / World Clock — Confirm local times\n\n#### Outputs\n\n- Qualified daily lead list (A/B/C-Tier)\n\n- CRM with updated status and notes\n\n- Pre-written rapport hook for each outreach\n\n- Reduced DQ rate and improved DM conversion metrics\n\n#### Definition of Done (DOD)\n\n✅ 20–30 leads researched and tagged per day\u000b ✅ 100% have budget confidence + rapport hook noted\u000b ✅ All data synced to CRM with no duplicates\u000b ✅ A-Tier list ready for immediate outreach\u000b ✅ Manager audit spot-check completed\n"},{"badge":"45","group":"sales-setting","section":"Team","title":"Daily Setter Workflow (“Closest-to-Cash First”)","description":"The daily setter workflow, worked closest-to-cash first.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1sE5PmsrTFd-TqBeiMZzj6CFdzLJYSFYjJooofzY-140/edit?tab=t.0#heading=h.i28lrta65wlo","portalUrl":"https://gohconsulting.app/sops?sop=45","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Daily Setter Workflow (“Closest-to-Cash First”)\n\n- Source: https://docs.google.com/document/d/1sE5PmsrTFd-TqBeiMZzj6CFdzLJYSFYjJooofzY-140/edit?tab=t.0#heading=h.i28lrta65wlo\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### Daily Setter Workflow      (“Closest-to-Cash First”)\n\nVersion: 1.0\n\nPurpose:\u000b To systemize the daily execution flow of all appointment setters, ensuring the highest leverage activities (closest to conversion) are prioritized first. This guarantees consistent booking volume, high show-up rates, and efficient use of setter working hours.\n\n#### Inputs Required\n\nInput | Description | Example\n\nCRM / DM Inbox | Platform where conversations occur | Instagram DMs, Discord, Slack, WhatsApp, Facebook Messenger\n\nCalendar Access | Centralized booking calendar for all client calls | Calendly, Google Calendar\n\nDaily Tracker | Sheet or Notion dashboard logging KPIs | “Setter KPI Sheet” – includes Booked, Proposed, Show-Up %\n\nNotification System | Alarm or automation to trigger reminders | iPhone alarm, Zapier Slack reminder, Google Tasks\n\nCall Notes Template | Pre-formatted doc for post-booking summaries | “Client Snapshot” section inside Notion CRM\n\n#### Step-by-Step Workflow\n\n##### Step 1 — Review Calendar (Start of Day)\n\nGoal: Identify immediate and next-day booked calls to prepare for reminders and rapport follow-up.\u000b Actions:\n\n- Open the shared Google Calendar or Calendly dashboard.\n\n- List all calls today and tomorrow in your Daily Tracker.\n\n- Note client name, time, and timezone.\u000b Output: A “Calls Overview” list ready for follow-ups.\n\n##### Step 2 — Execute Post-Booking Touchpoints\n\nGoal: Ensure all booked calls are nurtured for high show-up rates.\u000b Actions:\n\n- Send these messages sequentially:\n\n- 24 hours before:\u000b\u000b\u000b “Hey [Name], excited for our chat tomorrow at [Time]! Where are you based again? Just want to double-check timezone so everything lines up.”\n\n- 3 hours before:\u000b\u000b\u000b “Just confirming for later — you’ll get the link here 15 mins before we start. Anything specific you’d like us to cover first?”\n\n- 1 hour before:\u000b\u000b\u000b “On in an hour — can’t wait to dive in with you.”\n\n- Mark “✅ 24H/3H/1H sent” beside each call in tracker.\u000b Output: Client fully prepped and emotionally committed to showing up.\n\n##### Step 3 — Follow Up on Proposed Calls\n\nGoal: Convert previously proposed calls into booked slots.\u000b Actions:\n\n- Filter all convos tagged as “Proposed.”\n\n- Apply 4-touch follow-up sequence:\n\n- “Lmk when you lock it in bro”\n\n- “Not seen anything come through yet ^”\n\n- “Let’s get this scheduled properly — I’ve got Tues 3:30 or Wed 10:00 open.”\n\n- “Recorded a group call going over XYZ problem they’ve faced, should check this out since it will help a lot for you rn + private group call”\n\nPretty much going to nurture a bit further and then push for a call after the follow ups\n\nOutput: Higher Proposed→Booked ratio logged in KPI sheet.\u000bin\n\n##### Step 4 — Clear Inbox (Active Conversations)\n\nGoal: Prevent backlog and maintain conversation momentum.\u000b Actions:\n\n- Reply to all unread DMs.\n\n- Prioritize ongoing sales convos over new outbound.\n\n- Use “1 question per bubble” rule to keep flow.\u000b Output: Inbox cleared; zero unread messages from hot leads.\n\n##### Step 5 — Warm Outbound\n\nGoal: Engage followers or past engagers most likely to convert.\u000b Actions:\n\n- DM story viewers, comment engagers, and inactive warm leads.\n\n- Message example:\u000b\u000b\u000b “Saw you viewed the story on [topic] — where are you at with [goal] right now?”\u000b Output: 20–40 new convos from engaged audience segment.\n\n##### Step 6 — Cold Outbound\n\nGoal: Expand total lead volume by reaching qualified cold ICPs.\u000b Actions:\n\n- Use ICP filters:\n\n- 20–35, English-speaking, fitness or mindset-oriented profiles.\n\n- Check for money signals (travel, tech, fitness gear).\n\n- Message example:\u000b\u000b\u000b “Appreciate the follow — curious, what got you into [goal/topic]?”\n\n- Send 50–80 per day depending on offer type.\u000b Output: Daily volume target hit; new conversations initiated.\n\n##### Step 7 — Log KPIs in EOD Sheet\n\nGoal: Record performance metrics for visibility and improvement.\u000b Actions:\n\n- Enter daily totals for:\n\n- Outbound Sent\n\n- Replies\n\n- Proposed Calls\n\n- Booked Calls\n\n- Show-Up %\n\n- Add notes for any learning or objections patterns.\u000b Output: Daily report completed and reviewed by team lead.\n\n#### Quality Assurance (QA) Checklist\n\nQA Item | Description | Responsible\n\nAll 24h / 3h / 1h reminders sent | Confirmed in CRM or manual tracker | Setter\n\nProposed leads tagged + followed up 4x | Ensure no lead left unreplied | Setter\n\nInbox cleared by end of shift | 0 unread sales messages | Setter\n\nEOD tracker submitted | Daily KPI logged by 11:59 PM local | Setter\n\nCalendar reviewed | All tomorrow’s calls listed | Setter\n\n#### Roles & Responsibilities\n\nRole | Duties | Stage Involved\n\nSetter | Execute entire workflow | All steps\n\nSetter Lead / Manager | Monitor EOD tracker, audit convos weekly | QA & Review\n\nCloser | Receive updated call notes post-booking | Step 2 & 7\n\nOps Lead | Maintain KPI sheets & automations | System Management\n\n#### Common Errors & Fixes\n\nError | Cause | Solution\n\nMissing 24h reminder | Forgetting daily calendar review | Set recurring 9 AM reminder/alarm\n\nLeads ghost after proposal | No micro-commitment pre-pitch | Ask “Is this a priority for you right now?” before dropping link\n\nInbox backlog | Working cold before hot leads | Follow “closest-to-cash-first” hierarchy\n\nInconsistent EOD data | Manual entry skipped | Use automated Google Form submission with required fields\n\n#### Tools & Automations\n\n- Calendly / Google Calendar – booking management\n\n- CRM or DM platform – conversation log\n\n- Notion or Google Sheets – EOD & KPI tracker\n\n- Zapier / Slack reminders – automate 24h + 3h reminders\n\n- Alarm app / Google Tasks – manual safeguard reminders\n\n#### Outputs\n\n- Updated KPI sheet (daily)\n\n- Booked + nurtured calls with reminders scheduled\n\n- Organized inbox with no pending hot convos\n\n- Follow-up report for “proposed” pipeline\n\n#### Definition of Done (DOD)\n\n✅ All booked calls have 3 reminders scheduled\u000b ✅ All proposed calls have 4-touch follow-ups\u000b ✅ Inbox cleared (no unread leads)\u000b ✅ Outbound volume target met\u000b ✅ Daily KPI sheet submitted\n\n\n\n\n"},{"badge":"56","group":"sales-setting","section":"Discovery","title":"Whats been holding them back","description":"Surface what has genuinely blocked them, not what they say first.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1zDisr23u812OYBghEZYk3J2UBNJsDL347SfdBF6fra0/edit?tab=t.0#heading=h.sci550yz4qpe","portalUrl":"https://gohconsulting.app/sops?sop=56","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Whats been holding them back\n\n- Source: https://docs.google.com/document/d/1zDisr23u812OYBghEZYk3J2UBNJsDL347SfdBF6fra0/edit?tab=t.0#heading=h.sci550yz4qpe\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### WHATS BEEN HOLDING THEM BACK\n\nThe whole point of this section is to bridge the gap between you and the lead and to show you have the solution to their problems and that you understand them and their issues\n\nGoing into layer 3 of pain: getting a timeline “how long have you been trying to reach XYZ goal?”\n\nAfter a response to layer 3 asking for a time line you want to acknowledge their goals/ pain points heavy so you can transition into “whats been holding you back?”\n\nOne of the main principles about this stage is not letting them project external reasons as to why they have not reached their goals\n\ne.g. diet held me back > what held you back from sticking to the diet > what makes you say that?\n\n- so then you’ve shifted the responsibility to them\n\nWhat have you tried during (X time)?\n\ninto\n\nWhy do you feel like that hasn't worked?\n\n- if its more short term I’d prefer this as we can have tangible leverage over whats not got them to their goal and we can also get an internal reason\n\nOr\n\nI see its been quite a long time then\n\nwhat do you think is holding you back from (goal) right now?\n\n- same with this one where we will look for an internal reason but i dont want someone thats been trying for 5 years to tell us their life story !!\n"},{"badge":"57","group":"sales-setting","section":"DMs","title":"Voice Notes","description":"Use voice notes in the DMs to shift a conversation that has stalled.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1871pt3bMfdXxQkdgYZF3B3NEdI7zoxe5dpyxv1Fbi7k/edit?tab=t.0#heading=h.5i0zzcm7oyqc","portalUrl":"https://gohconsulting.app/sops?sop=57","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Voice Notes\n\n- Source: https://docs.google.com/document/d/1871pt3bMfdXxQkdgYZF3B3NEdI7zoxe5dpyxv1Fbi7k/edit?tab=t.0#heading=h.5i0zzcm7oyqc\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### VOICE NOTES\n\nEveryone looks the same and there’s a “trust recession”\n\nso what can we do to stand out and give people that certainty its us ?\n\nrecord voice notes\n\nscript out different lines for common objections you’re getting in a couple different ways you’ve pitched before\n\nif you have a specific offer where you tell them in depth replies script some out for ‘dropping sauce’\n\nsame way for fitness if you are acknowledging the journey youve been through do it in a voice note\n\nHow to record and send them:\n\n1 - choose an ig account to message (personal account/your setter)\n\n2 - send the voice note to them & label it under in a short message\n\n3 - hold down on it and forward it to your lead when needed works very well, if you dont have these, add them now\n"},{"badge":"58","group":"sales-setting","section":"Discovery","title":"Tonality/phrasing (how to get the answer you want)","description":"Tonality and phrasing - how the question shapes the answer.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1vgttjQUNB8TPhkYoq4HFd2A6arkEUxCjyxZPDAX__bc/edit?tab=t.0#heading=h.25vrgh9mk68a","portalUrl":"https://gohconsulting.app/sops?sop=58","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Tonality/phrasing (how to get the answer you want)\n\n- Source: https://docs.google.com/document/d/1vgttjQUNB8TPhkYoq4HFd2A6arkEUxCjyxZPDAX__bc/edit?tab=t.0#heading=h.25vrgh9mk68a\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### TONALITY/PHRASING\n\n### (HOW TO GET THE ANSWER YOU WANT)\n\nA huge issue people have when setting is having tricky replies from leads or not getting the answer they want\n\nand people reply in a combative manner or ask leading questions as a result to force them down a route\n\nif you put words in a lead’s mouth it is a lot less effective and will limit the depth of a convo\n\nhigh ticket is all about having deeper convos about their real goals/pain which they won’t have told everyone else\n\nif its surface level or forced it’s a lot less likely they’ll buy or even book\n\nthe solution is asking better questions and understanding each stage of a set so you can lead it\n\nbetter questions means using the context they’ve already gave you and incorporating it\n\nanother reason leads dont give the answers you want is because they dont even knwo what you’re getting at exactly: what we can do here is relate with OUR answer and they’ll reply with their version\n\nfor example:\n\nwhat would that mean to you to be at 15% body fat after 2 years? it would mean i’d be a lot more confident > not the answer we want\n\ni feel you man it was the same for me. I used to be checking myself in the mirror all the time and be pulling at my shirt, confidence was always a huge thing for me that stopped me doing a lot what makes you say you’re not as confident now as you could be?\n\nthis shows from our answer that we want it to be a deeper convo and they’ll match our energy\n"},{"badge":"59","group":"sales-setting","section":"DMs","title":"Speed to lead","description":"Why response time decides the conversation, and how to hold it.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1o9mKtDd21b_tgUC_2RSrF4QBQb4Z8tQ4XtsKfgn424g/edit?tab=t.0#heading=h.8o12adv0so73","portalUrl":"https://gohconsulting.app/sops?sop=59","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Speed to lead\n\n- Source: https://docs.google.com/document/d/1o9mKtDd21b_tgUC_2RSrF4QBQb4Z8tQ4XtsKfgn424g/edit?tab=t.0#heading=h.8o12adv0so73\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### SPEED TO LEAD\n\n##### \n\n##### Organic\n\n- following a person is a big difference from a like on a post get a convo going asap to have a touch point at the minimum\n\nif you contact a lead within 5 minutes your chances of making a sale are 100x more likely\n\n##### Cold traffic\n\n- they've been seeing ads all the time and only now did they opt in to yours\n\n- you want to message them asap to dig into what peaked their interest so much to opt in\n\nYou should be reviewing speed to lead often if you have setters in place so you know you’re not missing out on calls\n\nan easy way to fix the issue is to have set times where the setter is purely active and then encoruaging to be on active convos during the day at off peak times as soon as someone replies\n"},{"badge":"60","group":"sales-setting","section":"Discovery","title":"solution awareness","description":"Move a prospect from knowing the problem to wanting this solution.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1DeMv8Vl7AjA2Cyu7YzBlITkl5bogb9AlMCm-rm7sB8Y/edit?tab=t.0#heading=h.8lk1nur6vjtl","portalUrl":"https://gohconsulting.app/sops?sop=60","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# solution awareness\n\n- Source: https://docs.google.com/document/d/1DeMv8Vl7AjA2Cyu7YzBlITkl5bogb9AlMCm-rm7sB8Y/edit?tab=t.0#heading=h.8lk1nur6vjtl\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### SOLUTION AWARENESS\n\nChallenge + present yourself as the solution\n\nGood:\n\n- Work out the lead's perspective (do they know the solution or no?), ‘why do you think XYZ is an issue?’\n\n- long form to change perspectives\n\n- understanding your line of questioning so you're not poking around\n\n- building doubt e.g how comes doing XYZ?\n\n- curiosity - how comes not doing XYZ?\n\nBad:\n\n- Trying to sell them something thats not their true issue\n\n- increasing sales pressure in the tonality\n\n- going way too in detail with the solution so they diy obj\n\nStructure:\n\n- ‘what have you tried so far to (get more eyes on your page/improve lead quality) and scale to $x/month?’\n\n- build doubt e.g how comes doing XYZ?\n\n- understand why they're choosing to do things the way they are\n\n- how comes not doing XYZ?\n\n- curiosity and starting to make solution aware with\n\n- If they know the solution: Agree + sauce\n\n- If they don’t know and they say they don’t know: Give them sauce\n\n- They say the wrong thing: Challenge + sauce\n\nShowing yourself as the solution is the last thing before a pitch\n\nyou do this once you know their full perspective so you can make sure they don't disagree and you have the frame\n\nthe situations are:\n\n- Either they know the solution or they don’t\n\n- If they know the solution and are showing signs they wont want help: Agree + sauce so even if they solve issue one / help them solve issue 1 - they’ll trust u and come back for issue 2\n\nnurturing a lead heavy is NOT a bad thing over pushing hard and making ti obvs its a setter\n\nwith a sophisticated icp they may know what to do right now but they may get stuck in a month thats where you make sure you are known as an authority in the market to them if you have good marketing/yt vids or even private resources you can send them out and this will build a lot of trust\n\nthen you follow up in a couple weeks and repeat the process since the trust is there they will tell you if its not going to their plan and you're already close to booking\n\n- If they don’t know and they say they don’t know: Give them sauce\n\n- They say the wrong thing: Challenge + sauce\n\nwhen giving sauce you need to go in detail but it needs to be surface level or you just tell them exactly what to do and they will go away and try it out first instead of realizing they need your help\n\n- this sometimes can be 2 paragraphs if u need to go more in detail\n\n- i think of it as explaining their problems in a lot of detail, which is like pointing out everything going wrong specifically so it’s like of course you would be able to help\n\nsee how they respond to the sauce\n\nA) they'll agree and open up more and ask about your offer\n\n- pitch\n\nB) they'll realise they need you but have a logistical issue > nurture and keep close tabs until they're ready\n\n- push a bit depending on what they say but remember not to be too salesy to hold frame and show its not a setter\n\n- also in these situations its a good idea to script a reply and have the offer owner send it so shift perspective\n"},{"badge":"61","group":"sales-setting","section":"Discovery","title":"Qualifying Leads","description":"Qualify properly so the calendar fills with people who can buy.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1y0ID-0QhYlWgs9Y5gmpwmLNFmX-STUd6Xpnld5KEtyA/edit?tab=t.0#heading=h.fkgyqdmspdt0","portalUrl":"https://gohconsulting.app/sops?sop=61","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Qualifying Leads\n\n- Source: https://docs.google.com/document/d/1y0ID-0QhYlWgs9Y5gmpwmLNFmX-STUd6Xpnld5KEtyA/edit?tab=t.0#heading=h.fkgyqdmspdt0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### QUALIFYING LEADS\n\nEarly on in the conversation:\n\nif you're having a high volume of DMs and are booking a lot of DQ calls it makes sense to qualify earlier on in the convo, for example if your offer is UGC then a lot of your ICP is in college/uni so you don't want to push qualified leads away but it is much higher leveraged to check their budget.\n\nthe way you’d do it would be:\n\n- rapport\n\n- transition\n\n- are you doing ugc now or are you planning to get into it? (or a similar Q)\n\n- oh fr what do you do now? i started in college lmao\n\nnow if they say theyre in college\n\n- do you work or do any other side hustles or only studying now bro?\n\n- do you have money saved up to invest into your UGC journey? just to get a better understanding\n\n- if they dont it’ll be quite obvious and you can probe to double check and nurture with yt vids\n\nif they do have money then continue convo and qualify further in calendly\n\nand if they say a dq budget give them a dial to check\n\nhard qualify if:\n\n- they say low/no budget on the booking form\n\n- they have a low paying job\n\n- they tell u they are broke/unemployed\n\n“just for transparency on the call there would be an investment to get started with us and it does vary around 2/4k usd, if everything makes sense is that something that would be manageable for you?”\n\nthen\n\n“okay not an issue i get it but lets say it did all make sense how much would you be working with to get started with somwthing like this?”\n\nthen if dq\n\n“no worries think for now since not ready to get started check out these yt vid and reach out in a few weeks when in a better position to get started”\n\nsoft qualify if:\n\nworks a good job/signs they do have money but they gave bad answer on form\n\n“just for transparency on the call there would be an investment to get started with us, if everything makes sense is that something that would be manageable for you?” then if they ask how much:\n\nif lead asks how much is it?\n\n“right now $0 because we havent ran the call and I really dont know what i’d be able to offer right now but lets say it did all make sense. How much would you be working with to get started with something like this?”\n"},{"badge":"62","group":"sales-setting","section":"Discovery","title":"Problem Awareness","description":"Bring a prospect to problem awareness before offering a solution.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1MfRBZqf5PGbwrQqHQ5ghazdXc5ByH9JPYAqj6Wo0gv4/edit?tab=t.0#heading=h.ptg8podrugjn","portalUrl":"https://gohconsulting.app/sops?sop=62","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Problem Awareness\n\n- Source: https://docs.google.com/document/d/1MfRBZqf5PGbwrQqHQ5ghazdXc5ByH9JPYAqj6Wo0gv4/edit?tab=t.0#heading=h.ptg8podrugjn\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### PROBLEM AWARENESS\n\nThe most important stage…\n\nIf a lead is in denial about their problems or if they dont know and understand them - they won't be buying\n\nfor your offer you need to understand the different types of issues your leads have and the reasons behind those issues in order to dig\n\nthis way you can understand earlier in the convo and lead the prospect to admitting that or coming to that realisation much cleaner\n\nDifferent Issues That Leads Experience:\n\nSymptoms of Issues:\n\n- Low lead flow\n\n- Dq leads\n\n- Low conversion rate\n\n- Limiting beliefs (already doing good, complacency, blaming external circumstances like algorithm not pushing content, people need free clients or charge super low to grow, need to grow personal brand before charging low ticket)\n\nReasons Behind Issues:\n\n- Too much working in the biz\n\n- No clarity on what to work on\n\n- For low lead flow, bad TOF content\n\n- For DQ leads, bad MOF and not hitting ICP\n\n- For low conversion rate, bad sales process + middle of funnel\n\nHow Do We Find These Issues?\n\n- Check profile in detail, all links, content, engagement, highlights, check youtube\n\n- How’s it going? (any sign of it being bad we dig deeper)\n\n- check the problem finding chart (make your own custom)\n\nfor example:\n\nthis can be done through just looking at their page and our setter can figure out the issue to sell them on\n\nthis always starts with\n\n- How's it going?\n\nand if someone says good it could be\n\n- they dont want to be sold / dont want to drop ego and say problems right away\n\n- they are not problem aware as to whats the issue\n\nif you had a good transition and rapport it’ll always really be b but its pretty clear to tell from the convo if someone doesnt like you.\n\nfor a) i’d talk about their biz more and get them to mess w you more, and also send long form / resources / recordings to get them more nurtured\n\nfor b) we follow this as a framework\n\n2.     Fire bro seen your xyz doing well\n\n- pick something out that looks decent to make you guys more on the same level and show you’re actually interested\n\nwhere are you tryna scale the biz to?\n\n- most people love talking about their goals and if we compliment then ask and we get their goal we know that they are not where they want to be so the gap is built.\n\n- Then we can push as to why theyre not there yet\n\n3.    acknowledge\n\nwhat do you thinks stopping you from $X so far?\n\n- they wont always reply with the honest answer but this is where we start to dig into the problem awareness stage since we have enough leverage to ask from the prev message\n\n- its also very open, a lot of people start to either hype them up too much here like you’ll get it brother! but dont do that, just make them think about it\n\nif they dont give us a clear answer this is where we have to help them out a bit with the questioning. we always want it to come from them instead of assuming.\n\nwhy? because if you want to help someone out with their biz you need to have them feel like you understand it first.\n\nif we try and drop game here or do too much its just gonna be like giving advice to a football player without knowing their position.\n\n4.     what makes you say that?\n\n- we need a proper answer (low leads, dq leads, low conversion) as mentioned in the breakdown of the framework, so make sure you get that, and on top of it - why do they say that is? this is because on top of their issue we want more context of what theyve seen in the biz\n\n- if it continues to not go anywhere we can give them a binary (this or that) such as:\n\n- it is more an issue of lead flow, lead quality or actually converting them to sales?\n\n- this can also be custom to your offer\n\nTransition to solution awareness\n\nwhat have you tried so far to (get more eyes on your page/improve lead quality) and scale to $x/month?\n\nonce you’re sure you know their issue and THEY know their issue we transition to solution awareness by checking what solutions they’ve tried\n"},{"badge":"63","group":"sales-setting","section":"Booking","title":"Post Booking Process","description":"What happens after the booking so the call actually gets held.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1-0EIYrpZJk71GgGFaNHouijfc1S3WHgcUux2fmnm--8/edit?tab=t.0#heading=h.lvvjp87o5b7q","portalUrl":"https://gohconsulting.app/sops?sop=63","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Post Booking Process\n\n- Source: https://docs.google.com/document/d/1-0EIYrpZJk71GgGFaNHouijfc1S3WHgcUux2fmnm--8/edit?tab=t.0#heading=h.lvvjp87o5b7q\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### POST BOOKING PROCESS\n\nhave your post booking vid attached to your calendly so when they book it auto directs them\n\n- saw you booked a time in, did you get the google calendar invite or able to set a reminder?\n\n- now go back into rapport to build personal connection and reduce sales pressure\n\n- e.g. also bro where abouts are you based? > unique rapport about that location what are the gyms like out there/ offer specific rapport\n\n- what are the gyms like out there?\n\n3.    after a short period ask > what did you think of the video after booking in btw?\n\n- if they didnt watch it:\n\n- no worries here's the link make sure to check it out, will give you a lot of clarity and value on the first steps to (xyz goal)incentivices them to watch\n\n4.    last steps are call reminders\n\n- 1 - the day before - all good for our call tomorrow btw\n\n- 2 - morning - see you on the call in x hours\n\n- 3 - 1-3 hours - here’s the link incase you dont have it\n\n- 4 - hopping on now, join upp\n\n5.      If they're not on call:\n\n- text them on IG\n\n- call them on phone / whatsapp > double dial\n\n- email them\n\nadd to the DISPATCHED tag (if following my tagging process) so they are labelled as a priority fu and you are on them to get back on the calendar\n\n##### EXTRA NOTES\n\n- have your setter or yourself make a list of great resources (group calls from the inside, best yt vids, private resources etc) to send out to somebody\n\n- these are the lowest hanging fruits so nurture super heavy\n\n- you want a show up rate of 70%+ and if its not there then there are problems\n\n- ours is about 90-95%\n\nExample:\n"},{"badge":"67","group":"sales-setting","section":"Objections","title":"How to re-pitch someone that didnt book","description":"Re-pitch someone who did not book, without starting over.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1h6J4IGwOak-NAVRGUqPIF83KIDgrmHhbGJW9abDUDtk/edit?tab=t.0#heading=h.obz8s5g3h3lg","portalUrl":"https://gohconsulting.app/sops?sop=67","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# How to re-pitch someone that didnt book\n\n- Source: https://docs.google.com/document/d/1h6J4IGwOak-NAVRGUqPIF83KIDgrmHhbGJW9abDUDtk/edit?tab=t.0#heading=h.obz8s5g3h3lg\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### HOW TO RE-PITCH SOMEONE THAT DIDN’T BOOK\n\nBefore you re-pitch you need to understand why they didn't book last time\n\ncurrent situation\n\ntangible goal\n\nintangible goal\n\nwhats held them back\n\npriority\n\npitch\n\nwhich stage did you do wrong?\n\nyou need to nail this down or you’ll be sending yourself in circles\n\nto actually pitch:\n\nGo deeper on urgency\n\nAnd is this something you are looking to deal with right now man?\n\nClassic Pitch In that case bro I think I could definitely help you out Got a couple time slots open in the next few days Let’s jump on a call and I’ll show you exactly how I can help you with (talk about their pain here) You down?\n\nsame as regularly just doubling down on why now/priority > dont need to change phrasing\n"},{"badge":"68","group":"sales-setting","section":"Discovery","title":"How to become problem aware in your setting process","description":"Build problem awareness into the setting process itself.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1g341uVrRLc4ANR7baJNR6v6iH3QbLKWnTrBRLlZ2BEs/edit?tab=t.0#heading=h.b9ohm5hskdnu","portalUrl":"https://gohconsulting.app/sops?sop=68","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# How to become problem aware in your setting process\n\n- Source: https://docs.google.com/document/d/1g341uVrRLc4ANR7baJNR6v6iH3QbLKWnTrBRLlZ2BEs/edit?tab=t.0#heading=h.b9ohm5hskdnu\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### HOW TO BECOME PROBLEM AWARE IN YOUR SETTING PROCESS\n\nHave a look at the last month and go backwards and see where the issue lies\n\nHere is the list of things to consider if its an issue\n\n- closing\n\n- show up rate\n\n- post booking\n\n- people not booking when you send link / pitch - pitch:book\n\n- do people drop off too much mid convo? and where? and why?\n\n- hows the reply rate to follow ups + follow up process?\n\n- track every fu and reply rate > build bank of successful fu’s\n\n- is there a big drop off after the first message/ first 2?\n\n- is there an issue with the outbound?\n\nfigure out where the actual issues are and then bring those to call in a setting coaching call so we can provide a custom solution.\n\nsetter ramp up:\n\n- communication\n\n- on training calls with coaches\n\n- on training/development/accountability calls with you\n\n- review his kpi’s > understand whats always stopping from booking more\n\n- tracking\n\n- hourly tracking to ramp up - use sheet\n\n- daily convos for review\n\n- note down all feedback so theres a bank of feedback to look back on + makes the ramp up in future 10 X easier\n\ndaily actionables:\n\n- tracking\n\n- where is the bottlneck\n"},{"badge":"69","group":"sales-setting","section":"Discovery","title":"GOAL (TANGIBLE AND INTANGIBLE)","description":"Separate the tangible goal from the intangible one behind it.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1w6k3P9NhSPVhp77kDnLlM-_e-CTEuYvWthRz1QAY_rM/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=69","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# GOAL (TANGIBLE AND INTANGIBLE)\n\n- Source: https://docs.google.com/document/d/1w6k3P9NhSPVhp77kDnLlM-_e-CTEuYvWthRz1QAY_rM/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\nGOAL (TANGIBLE AND INTANGIBLE)\n\nThe goal is layer one of pain\n\nIntangible goal: not measurable, more subjective\n\nTangible goal: measurable and quantifiable\n\nWhen you ask what goal, the leads will likely give a more broad/generic answer (intangible goal)\n\nGet specific on their goal (tangible goal):\n\n- How much they want to make specifically\n\n- Picture of graph on fat loss\n\n- Describe physique when trying to gain muscle\n\nThought Process:\n\nIt's important to get a specific tangible goal because when pitching you will link back to his goals\n\n- this will make the lead feel more special and your coaching is more tailored to their needs specifically\n"},{"badge":"70","group":"sales-setting","section":"Discovery","title":"DIGGING PAIN","description":"Dig past the surface answer to the pain that drives the decision.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1MvXICm_wDKXdphCuyAosMPAuOImKyAeUhgc5K0ItpgA/edit?tab=t.0#heading=h.5boogfsfpjyx","portalUrl":"https://gohconsulting.app/sops?sop=70","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# DIGGING PAIN\n\n- Source: https://docs.google.com/document/d/1MvXICm_wDKXdphCuyAosMPAuOImKyAeUhgc5K0ItpgA/edit?tab=t.0#heading=h.5boogfsfpjyx\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### DIGGING PAIN\n\nDigging pain is the most important part of the convo, it creates an incentive for someone to want to hop on a call let alone join your program\n\nI see TOO MANY of you guys follow the framework and not probe enough on the pain points a lead has\n\nThis part of the convo is the most important so you can sit in the pocket for longer If a lead doesn't give a good enough response/ doesn't open up about it ask the question in another way\n\nWhen digging pain make sure you're acknowledging and relating to your own personal story:\n\n- if you open up the lead is more likely to open up\n\n- relating to yourself will make the lead feel like “this guy actually understands my problems and he’s overcome them” which links the solution to their problem back to yourself\n\nFitness:\n\nProbe into any emotions a lead gives when you ask why do you want to reach Tangible Goal specifically?\n\nEmotions you guys want to probe on:\n\n- Confidence\n\n- Discipline\n\n- Resilient\n\nQuestions to ask to probe:\n\n- “In what areas of your life do you feel like you're not (disciplined, resilient etc) right now?\n\n- “What makes you say you’re not (confident, resilient etc) right now?”\n\n- How would reaching XYZ goal change your life?\n\nBiz op:\n\nProbe into what the money will actually do for them\n\nQuestions to ask:\n\n- “What would that money do for you specifically?”\n\n- “How would that change your life right now?”\n\nKey Takeaways:\n\n- The point of probing questions is to make them expand on their pain which heightens their emotions and realise they shouldn’t stay in their current situation\n\n- When digging pain make sure you're acknowledging and relating to your own personal story\n\nLayer 1:\n\nGoal + Tangible Goal\n\nLayer 2:\n\nWhat makes you want to reach XYZ goal?\n\nProbe on what they say\n\nLayer 3:\n\nHow long have you been wanting to reach XYZ goal?\n"},{"badge":"71","group":"sales-setting","section":"Discovery","title":"Calendly questions (each niche)","description":"The booking questions to ask, per niche.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1Z9Lyeapi0UaMxAbKixBj-YVtdxVIp7AgxCG25flRmSA/edit?tab=t.0#heading=h.dp5k5cxu0hqc","portalUrl":"https://gohconsulting.app/sops?sop=71","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Calendly questions (each niche)\n\n- Source: https://docs.google.com/document/d/1Z9Lyeapi0UaMxAbKixBj-YVtdxVIp7AgxCG25flRmSA/edit?tab=t.0#heading=h.dp5k5cxu0hqc\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### CALENDLY QUESTIONS\n\n### (EACH NICHE)\n\n#### Fitness\n\nName\n\nEmail\n\nPhone\n\nInstagram\n\nWhat’s is the main goal you want to achieve through possibly working with me?\n\nKnowing it only takes 3-6 months of dedicated hard work to achieve them goals, how much do you have to invest in yourself at the moment?\n\n$0\n\n$500-$1000\n\n$1000-$3000\n\n$3000+\n\nWhat do you feel is internally holding you back from reaching your goals the most right now?\n\nFinally, have you watched our youtube videos and client interviews?\n\n- Yes, Im familiar with your client results\n\n- No, but Ill check it out after I fill in this form\n\nBy booking a call, you agree to show up at the scheduled time. If you do not show up, you will not be able to schedule another call. Do you agree to show up at the scheduled time?\n\n- Yes, I’ll be on the meeting in a quiet space (not driving!)\n\n- No, I’ll find another time where I can be\n\n#### Biz op\n\nbest if you can match the creators tonality with questions\n\n2 x examples:\n\nhey its @creator\n\nso your call with my team is productive\n\n- please make sure any partners, brothers, mothers, cats, dogs, needed to make a decision are on call :)\n\n- be in a quiet space, on a computer\n\n- turn your camera on (so we can see your pretty faces)! this is obviously a female coach\n\nlet’s start here! what’s your phone number? someone from my team will text/call you to confirm your call! :\n\n+1\n\nwhat’s your instagram handle? i promise not to stalk you :-) (ok maybe just a little):\n\nwhere are you located?:\n\nlmk in 2-4 sentences, why do you rly want to be a ugc creator? any details are highly encouraged!\n\nwhats your main bottleneck to becoming a succesful UGC creator? feel free to check ALL that apply:\n\n✅ I did not lie about any answers on my application\n\n✅ I will show up on time\n\n✅ I will be on a computer and not a phone\n\n✅ I will show my pretty face on camera :)\n\nCancellation Policy: if you need to cancel, please let us know at least 12 hours in advance tyyyyy\n\n- Yes, I’ll be on the meeting in a quiet space (not driving!)\n\n- No, I’ll find another time where I can be\n\nex 2\n\nname\n\nnumber\n\nsocial media/IG\n\n+\n\n![Embedded image](../assets/71/kix_iy0yvct5h5g1.png)\n\nB2B\n"},{"badge":"72","group":"sales-setting","section":"B2C","title":"B2C Urgency","description":"Create real urgency rather than manufactured pressure.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1F75cD7tGyYqDIGsO4tjMpPJHoCixt2lDNAJdsT6PS2Q/edit?tab=t.0#heading=h.ihdzdkk5u68z","portalUrl":"https://gohconsulting.app/sops?sop=72","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# B2C Urgency\n\n- Source: https://docs.google.com/document/d/1F75cD7tGyYqDIGsO4tjMpPJHoCixt2lDNAJdsT6PS2Q/edit?tab=t.0#heading=h.ihdzdkk5u68z\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### URGENCY\n\nUrgency is to dig more pain and for the lead to justify why they need to make a change now\n\nYou’ve been trying to reach XYZ goal for X amount of time, did something happen recently that made you want to make a change now?\n\nor\n\nI mean, is dealing with XYZ (their pain) something that you are looking to actually get help with so you can XYZ (their goal)?\n\n- this is almost like permission or leverage TO pitch\n\nif they have any doubt or if they aren't very bought in this will come out and we can decide to nurture more or dive back into which stage needs more touching on\n\n- after we've pitched its a lot harder to go back and fix things since you’ve shown your cards as to what you want, so before you do move forwards with urgency stage make sure you’ve been throught the other stages properly\n"},{"badge":"73","group":"sales-setting","section":"B2C","title":"B2C Transition","description":"Transition from rapport into the actual conversation.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1YM62Fmlx1i_834Vsj8LNRXuCduJrHH0-1lrkp-KnC5k/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=73","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# B2C Transition\n\n- Source: https://docs.google.com/document/d/1YM62Fmlx1i_834Vsj8LNRXuCduJrHH0-1lrkp-KnC5k/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\nTRANSITION\n\nThe most important thing about transitioning is to make sure your outbound message is linked to how you can transition into whatever your offer is\n\nHow to transition for fitness:\n\nThe best type of transition is to build rapport around something that can be linked to the gym/working out\n\n- Car\n\n- Sports\n\n- Location\n\nFor example:\n\nBuilding rapport around a car > transition into “you use it to drive to the gym?”\n\nBuilding rapport about sports > “very demanding on the body so need to be careful with how you balance both” > “you workout usually?”\n\nHow to transition for biz op:\n\nWith biz op you want to focus a lot on location in the rapport stage which is a good gate way to transition\n\nExamples after rapport about location:\n\n- What is it you do out there? > “Oh fr I know a couple guys that used to do that, but I’m curious what brought you to my page then?\n\n- “Most people that follow me are making money online, you in the space too?”\n\n- “You meet any other guys that do online money around you?”\n\nYou can then build “offer” rapport after these transitions: ”How long you been doing XYZ for?” ”What got you into it?”\n\nGood transition:\n\n- Subtle\n\n- Not forced\n\n- Links to the previous line\n\n- Clear path to transition into goals\n\n- The questions you ask allows the lead to bring up gym/making money online first\n\nBad Transition:\n\n- Close ended\n\n- Randomly bringing up the offer (fitness making online) when theres no rapport\n"},{"badge":"74","group":"sales-setting","section":"B2C","title":"B2C Rapport","description":"Build rapport on a B2C call without burning the first ten minutes.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1YM62Fmlx1i_834Vsj8LNRXuCduJrHH0-1lrkp-KnC5k/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=74","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# B2C Rapport\n\n- Source: https://docs.google.com/document/d/1YM62Fmlx1i_834Vsj8LNRXuCduJrHH0-1lrkp-KnC5k/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\nTRANSITION\n\nThe most important thing about transitioning is to make sure your outbound message is linked to how you can transition into whatever your offer is\n\nHow to transition for fitness:\n\nThe best type of transition is to build rapport around something that can be linked to the gym/working out\n\n- Car\n\n- Sports\n\n- Location\n\nFor example:\n\nBuilding rapport around a car > transition into “you use it to drive to the gym?”\n\nBuilding rapport about sports > “very demanding on the body so need to be careful with how you balance both” > “you workout usually?”\n\nHow to transition for biz op:\n\nWith biz op you want to focus a lot on location in the rapport stage which is a good gate way to transition\n\nExamples after rapport about location:\n\n- What is it you do out there? > “Oh fr I know a couple guys that used to do that, but I’m curious what brought you to my page then?\n\n- “Most people that follow me are making money online, you in the space too?”\n\n- “You meet any other guys that do online money around you?”\n\nYou can then build “offer” rapport after these transitions: ”How long you been doing XYZ for?” ”What got you into it?”\n\nGood transition:\n\n- Subtle\n\n- Not forced\n\n- Links to the previous line\n\n- Clear path to transition into goals\n\n- The questions you ask allows the lead to bring up gym/making money online first\n\nBad Transition:\n\n- Close ended\n\n- Randomly bringing up the offer (fitness making online) when theres no rapport\n"},{"badge":"75","group":"sales-setting","section":"B2C","title":"B2C Pitch","description":"The B2C pitch itself.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1ReqHvLczOADxuiVLbZ4ZoWT1QnNrcJEqwL2_iEDVkys/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=75","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# B2C Pitch\n\n- Source: https://docs.google.com/document/d/1ReqHvLczOADxuiVLbZ4ZoWT1QnNrcJEqwL2_iEDVkys/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\nPITCH\n\npitch is very easy you just need to:\n\n- [ ] make sure every stage is completed\n\n- [ ] you can feel if the lead is ready to be pitched, dont do it if not\n\n- [ ] bring their pain points back into the message so they feel it hard\n\n- [ ] make it a bit nonchalant so theres frame and scarcity\n\nIn that case bro I think I could definitely help you out\n\nGot a couple time slots open in the next few days\n\nLet’s jump on a call and I’ll show you exactly how I can help you with (talk about their pain here)\n\nYou down?\n"},{"badge":"76","group":"sales-setting","section":"B2C","title":"B2C follow up + outbound","description":"Follow-up and outbound after a B2C call that did not close.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1wTHcJQXMz5np0q7Bto8bqdW6jltBb3J9x8I-VQqYq1U/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=76","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# B2C follow up + outbound\n\n- Source: https://docs.google.com/document/d/1wTHcJQXMz5np0q7Bto8bqdW6jltBb3J9x8I-VQqYq1U/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\nB2C FOLLOW UP + OUTBOUND\n\nYou want to outbound to\n\n- New followers\n\n- Story viewers\n\n- Current followers (dont spam 10-15/hr)\n\n- engagement\n\nBad:\n\n- Unnatural to say out loud\n\n- Generic (what made you follow?)\n\nGood:\n\n- Hyper specific\n\n- Rapport based\n\n- Something biz owner would actually be interested in / something you would pu to\n\n- Specific to real world events\n\n- Plan about how to transition\n\nExamples:\n\n- ‘Yo saw your post in Italy looks dope bro’ ‘Where were you staying?’ ‘Thinking of heading out’\n\n- Any location question, where are they at, how are they finding it/what to do out there,, saying we are going to head out there soon, etc. - performs good, but has to be specific (are you at XYZ)\n\n- Any car question - good, especially if you know the model and ask how they are finding it, because we wanna buy one in Miami + a lot of people post their cars\n\n- Gym location question, or if they are in Miami how are they finding the gym - decent level, best if you can mention a specific gym (does NOT have to be right just sounds v specific)\n\n- How do you know xyz person? saw you guys follow each other - perfect for any mutuals/refferals to start convo\n\n- what nationality are they in general (where are you from? can’t tell by the language) - good level\n\n- How long have you been boxing? Had a few sessions since summer might go all into it /how are you finding it (or any time of sport) - does well, especially if they are into the sport they like to talk abt it\n\nThese all need to be used when you see something on their page you can talk about, you’ll stand out 100 X more if used correctly and will transition into “biz” talk very smoothly\n\nNow if there is NOTHING specific to ask them or they are private with no pfp you can rip one of these:\n\nHey (name) appreciate the follow\n\nHey (name) just saw you commented on my post\n\nHey (name) saw you engaging with my story, appreciate it\n\n- [ ] doing some research on my audience, where abouts are you based?\n\n- [ ] Btw what nationality are you I can’t tell\n\n- [ ] Btw where are you based i’m doing some research\n\nDifferent people experience different levels of reply rates so its important to split test and track what works well and also feel free to brainstorm and split test your own ones and check back with me\n\nThen have short convo 3-4 messages around the outbound message - basic rapport\n\nTo Summarise\n\nfollow ups to new outbounds\n\n1 - it’s not a bot btw haha - after 24hrs 2 - NAME - 2 days 3 - reply to story/highlight - 3 days 4 - lmk bro dont want you falling behind lol - 5 days\n\nMid Convo\n\n1 - like message\n\n2 - story reaction or name?\n\n3 - custom to their goals\n\nafter sending link to book\n\n1 - what time did you book? 2 - NAME 3 - lmk bro dont want you falling behind lol 4 - been a few days, if i dont get your confirmation by tonight im gonna assume your not serious about xyz goal\n\nProcess\n\n- go through story viewers (active followers)\n\n- new followers (speed to leads\n\n- current followers\n\n- scroll down in the inbox > can go back real far to revive leads use the notion tracking sheets when you have long term data\n\nhow many to do an hour?\n\n10-20/hr focusing on the highest quality leads > nurtured leads or guys where a conversation dropped off closest to booking as priority\n"},{"badge":"77","group":"sales-setting","section":"Frameworks","title":"2026 Fitness Setting Framework","description":"The 2026 setting framework for the fitness niche.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1RgC478_IE25GV8RZbfZ-KOhHhw94U42HRmD61UsuEb0/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=77","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# 2026 Fitness Setting Framework\n\n- Source: https://docs.google.com/document/d/1RgC478_IE25GV8RZbfZ-KOhHhw94U42HRmD61UsuEb0/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 7\n\n## Framework\n\n2026 FITNESS SETTING FRAMEWORK\n\n[Setting Slides](https://www.canva.com/design/DAG7Cs1VeaI/FSAvfBhb8k0HO4rpPYoHNg/view?utm_content=DAG7Cs1VeaI&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=hb9e2beb60f)\n\nStructure\n\n- Rapport\n\n- Goal\n\n- Specific goal/Current situation\n\n- Motivation behind the goal (emotional)\n\n- What’s holding them back\n\n- URGENCY\n\n- PITCH\n\n- POST BOOKING RAPPORT\n\nIntro\n\nIf audience is warmer/higher vol of leads:\n\nHey (name) appreciate you reaching out  [INBOUND]\n\nHey (name) appreciate the follow\n\nHey (name) just saw you commented on my post\n\nHey (name) saw you engaging with my story, appreciate it\n\nReaching out to a couple followers today and was wondering how you’re fitness journey is going atm?\n\nAre you mainly looking to get leaner or pack on more muscle?\n\nMay have some resources i can send over\n\nIf audience is colder/lower vol of leads lead with rapport:\n\nBest form of outreach will be something specific to their story/post/highlight if you can: think travel, food, real world events, location, cars etc\n\nOr\n\ndoing some research on my audience:\n\n- where abouts are you based in the US/UK/AUS?\n\n- What type of videos have you liked most/found most helpful?\n\n- Btw what nationality are you?\n\n> followed on by something specific about that for a few lines before transitioning\n\nIf the lead seems DQ:\n\n‘What do you do for work btw?’\n\n’Just asking because people underestimate how big an impact their job can have on their fitness’\n\nTransition with something that marks them say something around fitness:\n\n- What brought you to my page btw?\n\n- What are the gyms like near you btw?\n\n- You workout btw bro?\n\nLAYER ONE\n\nNice man, what are you working on?\n\nOr\n\nNice man, what fitness goals are you currently working towards?\n\n(get a clear tangible goal)\n\nAcknowledge\n\n**get clearer on the goal so they visualise it / create gap to where they are now (more so if lose weight is the goal)**\n\nLAYER TWO\n\nGotchu bro and based on this chart so I have clarity on how far you need to go, where would you say your current physique is at?\n\n*acknowledge*\n\nAnd also where would you say is your dream physique?\n\nFor more muscle growth instead of the chart would be\n\nSo where would you say you are right now compared to where you need to be?\n\nLAYER THREE\n\nWhat makes you want to XYZ? (build more muscle and get healthier)\n\nOr\n\nWhat would it mean to you if you lost 50lbs/20% body fat (OR can be) had more confidence?\n\nLAYER FOUR\n\nAcknowledgement\n\nDo you mind if I ask you man, why is XYZ (emotional driver) actually important to you specifically?\n\nIf you want them to expand:\n\nWhy was that the first/main thing that came to mind?\n\nOr\n\n*Acknowledgement*\n\nWhat makes you say that you aren’t as confident/healthy as you could be right now?\n\nIF SOMEONE HAS A BIG ISSUE WE CAN INFER THERE HAS BEEN LONG TERM ISSUES - IN THIS CASE WE WANT TIME FRAMES\n\nHow long have you felt like xyz for?\n\nHow long have you been wanting to achieve xyz goal physique for man?\n\nWhat’s holding them back\n\nWhat have you tried during (X time)\n\nWhy do you feel like that hasn't worked?\n\nOr\n\nI see its been quite a long time then\n\n+\n\nwhat do you think is holding you back from (goal) right now?\n\nTransition\n\n**Build urgency**\n\nDid something happen recently that made you want to make a change to xyz problem / to achieve xyz goal now?\n\nOr\n\nI mean, is dealing with XYZ (their pain) something that you are looking to actually get help with so you can XYZ (their goal)?\n\n(if weird answer)\n\nWhat makes you say that?\n\nProposing the call\n\nIn that case bro I think I could definitely help you out\n\nGot a couple time slots open in the next few days\n\nLet’s jump on a call and I’ll show you exactly how I can help you with (talk about their pain here)\n\nYou down?\n\nBooking them in\n\nCool man here’s my calendar\n\n*Calendly link*\n\nJust about to head out to the gym so lock that in now for me so I can send over some resources for before the call before I head out\n\nPost booking\n\nStart a normal conversation with the lead to build rapport before the call\n\nIf DQ:\n\n(If they say they have no financial resources)\n\nJust saw that come through for X, looking forward to it\n\nBtw, saw you put on your form that you would have less than X to invest if it was a fit, was that a mistake or?\n\nIf Qual:\n\nJust saw that come through for (day of call), looking forward to it man\n\nWhere you based btw?\n\nHow’s life in X btw?\n\nor\n\nsaw you booked a time in, did you get the google calendar invite or able to set a reminder?\n\nAfter qualification and conversation to build rapport send VSL\n\nMake sure you give this a watch before the call as well, should be super helpful for X\n\nSend postbooking\n\n- Continue rapport\n\nHow’d you find it brother?\n\n- drop yt vids in where applicable > make sure it makes sense and u incentivise them to watch it\n\n*24 hour reminder*\n\n*3 hour reminder*\n\n*1 hour reminder + send over zoom link*\n\n## Workflow\n\nWORKFLOW\n\n- Call notes\n\n- Cancel DQ calls\n\n- Follow up with booked calls (Postbooking) (set reminders to follow up for the calls)\n\n- Follow up with proposed calls\n\n- Clear inbox\n\n- Clear comments (videos promoting UGC)\n\n- Outbound\n\n- Follow ups (conversations that weren’t replied to)\n\n- Update trackers and tags\n\n## Follow Up Structure\n\nFOLLOW UP STRUCTURE\n\nTo active convos\n\n1 - it’s not a bot btw haha - after 24hrs\n\n2 - NAME - 2 days\n\n3 - reply to story/highlight - 3 days\n\n4 - lmk bro dont want you falling behind lol - 5 days\n\nFor Proposed Calls\n\n(One day)\n\nyou managed to book?\n\n(Two day)\n\nLet me know brother\n\n(Three day)\n\nbeen a few days, if i dont get your confirmation by tonight im gonna assume your not serious about xyz goal\n\n(Four day)\n\nlmk bro dont want you falling behind lol\n\nFor Booked Calls\n\n(24 hours)\n\nYoo see you tomorrow for the call brother, looking forward to it\n\n(3 hours)\n\nGot our call in three hours man, all good to go for it?\n\n(1 hour)\n\nHere’s the zoom link bro see you in an hour\n\n‘Zoom link’\n\n## Call Notes Structure\n\nCALL NOTES STRUCTURE\n\n(On the day of the call it is vital for setters to write out these call notes to give to the closer in order to provide context for them, the format can be seen below)\n\n- Lead’s Name + Date & Time of Call:\n\n- \n\n- Closer:\n\n- Location & Occupation:\n\n- \n\n- Motivation/Goal:\n\n- \n\n- Valuable Info About Their Current/Past Situation:\n\n- \n\n- What is Their Pain/Obstacle:\n\n- \n\n- How Much Do They Have to Invest:\n\n## Example Conversations\n\nEXAMPLE CONVERSATIONS\n\n## Coach Info\n\nCOACH INFO\n\nName:\n\n- \n\nAge:\n\n- \n\nPost Booking Resource:\n\n- https://\n\nInstagram:\n\n- @coach\n\nLocation:\n\n- \n\nCoaching Offer:\n\n- Example\n\n- Group coaching: Self-paced modules, group chat, group calls\n\n- Private: All those three components + ability to book bi-weekly private 1-on-1 calls\n\nPricing:\n\n- Example - 3k (group) and 5k (private)\n\nCoaching Structure:\n\n- Example - Digital via Whop (modules), Discord (group chat), Google Meet (group calls)\n\nIdeal Client:\n\n- 1. Already creates content\n\n- 2. Wants to make money online, specifically content\n\n- @example\n\nTop Pain Points:\n\n- Unsure how to find brand deals\n\n- Unsure how to land high paying brand deals (many creators just land product exchanges )\n\n- Unsure how to build a personal brand\n\nLanguage In The DM’s:\n\n- “Yo what’s up”\n\n- “How’s life?”\n\n- “No , I get you”\n\n- “Let’s run it”\n\n- “GOD is good”\n\n- “Ok perfect”\n\n- “Bet”\n\nExperience:\n\n- \n\nBackstory:\n\n- \n\nHobbies:\n\n- \n\nClient Results:\n\n- \n\nTop Pieces Of Content:\n\n- \n\nInstagram Handles Of People That Have Closed:\n\n- \n\n## Important Links\n\nIMPORTANT LINKS\n\nCalendly: [https://calendly.com](https://calendly.com/creatorblueprint/ig-creator-blueprint-1-on-1-call)\n\nVSL:\n"},{"badge":"78","group":"sales-setting","section":"Frameworks","title":"2026 Bizop Setting Framework","description":"The 2026 setting framework for the business-opportunity niche.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1zM-VZsL-6wKmnuJEu-1PF5GBqXgszXe6vscOQ12zLPk/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=78","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# 2026 Bizop Setting Framework\n\n- Source: https://docs.google.com/document/d/1zM-VZsL-6wKmnuJEu-1PF5GBqXgszXe6vscOQ12zLPk/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 10\n\n## Framework\n\n2026 BIZOP SETTING FRAMEWORK\n\n[Setting Slides](https://www.canva.com/design/DAG7Cs1VeaI/FSAvfBhb8k0HO4rpPYoHNg/view?utm_content=DAG7Cs1VeaI&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=hb9e2beb60f)\n\nStructure\n\n- Rapport\n\n- Goal\n\n- Specific goal/Current situation\n\n- Motivation behind the goal (emotional)\n\n- What’s holding them back\n\n- URGENCY\n\n- PITCH\n\n- POST BOOKING RAPPORT\n\nIntro\n\nIf audience is warmer/higher vol of leads:\n\nHey (name) appreciate you reaching out  [INBOUND]\n\nHey (name) appreciate the follow\n\nHey (name) just saw you commented on my post\n\nHey (name) saw you engaging with my story, appreciate it\n\nAre you mainly looking to get leaner or pack on more muscle?\n\nMay have some resources i can send over\n\nIf audience is colder/lower vol of leads lead with rapport:\n\nBest form of outreach will be something specific to their story/post/highlight if you can: think travel, food, real world events, location, cars etc\n\nOr\n\ndoing some research on my audience:\n\n- Where are you based in the US/UK/AUS?\n\n- What type of videos have you liked most/found most helpful?\n\n- Btw what nationality are you?\n\n> followed on by something specific about that for a few lines before transitioning\n\nIf the lead seems DQ:\n\n’For me to get a better understanding of your current situation, what do you do for work at the moment?’\n\n- Just to be transparent with you — my coaching does require an investment of around £1–2k to get started. Is that manageable for you at the moment?\n\n- Totally get it — money can be tight in this day and age. I’ll reach back out to you in a couple of weeks, but if anything changes before then, feel free to let me know.\n\n- In the meantime, here’s a video that’ll help you out massively:\u000b (send YouTube link)\n\nTransition with something that marks them say something around fitness:\n\n- What brought you to my page btw?\n\n- You into the online space btw bro? (testing)\n\n- Custom > e.g. location to talking abt how u can travel when mmo > what would ur goal be?\n\nLAYER ONE\n\nNice man, what got you interested in making money online?\n\n*Acknowledge*\n\nA lot of people want to be able to travel/leave their job (wtv goal is) but what are you hoping to achieve with that?\n\n**get clearer on the goal so they visualise it / create gap to where they are now **\n\n*LAYER TWO - you can use one/multiple of these they are examples to have a lead expand > the goal is a deep personal answer so thats as far as you need to take it*\n\nWhy is that the first thing that comes to mind?\n\nor\n\nFor you to be at xyz goal what would that mean to you?\n\nOr\n\nWhat makes you say that you cant (look after kids/take care of x) as much as you could be right now?  -   read this one back bcs only fits certain goals\n\nLAYER THREE\n\nIF SOMEONE HAS A BIG ISSUE WE CAN INFER THERE HAS BEEN LONG TERM ISSUES - IN THIS CASE WE WANT TIME FRAMES\n\nRelate to them\n\nHow long have you felt like xyz for?\n\nHow long have you been wanting to achieve goal for man?\n\nWhat’s holding them back\n\nAcknowledge heavy so transition is clean\n\nWhat have you tried during (X time)?\n\nXyz > Why do you feel like that hasn't worked?\n\nNothing yet > What would you say has internally stopped you from going out there and achieving it brother?\n\nAnother route\n\nI see its been quite a long time then\n\n+\n\nwhat do you think has been internally holding you back from (goal) so far?\n\nIf you've been getting dry answers ask this so we can tailor pitch:\n\nWhat do you feel like you need now to be able to get to (GOAL)?\n\nTransition\n\n**Build urgency**\n\nDid something happen recently that made you want to make a change to xyz problem / to achieve xyz goal now?\n\nOr\n\nI mean, is dealing with XYZ (their pain) something that you are looking to actually get help with so you can XYZ (their goal)?\n\n(if weird answer)\n\nWhat makes you say that?\n\nProposing the call\n\nIn that case bro I think I could definitely help you out\n\nGot a couple time slots open in the next few days\n\nLet’s jump on a call and I’ll show you exactly how I can help you with (talk about their pain here)\n\nYou down?\n\nBooking them in\n\nCool man here’s my calendar\n\n*Calendly link*\n\nJust about to head out to the gym so lock that in now for me so I can send over some resources for before the call before I head out\n\nPost booking\n\nStart a normal conversation with the lead to build rapport before the call\n\nIf DQ:\n\n(If they say they have no financial resources)\n\nJust saw that come through for X, looking forward to it\n\nBtw, saw you put on your form that you would have less than X to invest if it was a fit, was that a mistake or?\n\nIf Qual:\n\nJust saw that come through for (day of call), looking forward to it man\n\nWhere you based btw?\n\nHow’s life in X btw?\n\nor\n\nsaw you booked a time in, did you get the google calendar invite or able to set a reminder?\n\nAfter qualification and conversation to build rapport send VSL\n\nMake sure you give this a watch before the call as well, should be super helpful for X\n\n*Send postbooking*\n\n- Continue rapport\n\nHow’d you find it brother?\n\n- drop yt vids in where applicable > make sure it makes sense and u incentivise them to watch it\n\n*24 hour reminder*\n\n*3 hour reminder*\n\n*1 hour reminder + send over zoom link*\n\n## Inbound Framework\n\nINBOUND FRAMEWORK\n\n##### Intro\n\nHey, appreciate you reaching out\n\nYou already doing X biz model or looking to get started?\n\n(follow outbound structure not this all the time + track your outbound reply rate bi-weekly to make sure its over 30%)\n\n##### Qualify\n\nIf they’re already doing it:\n\nThat’s sick man, are you full time with it or balancing with work/school?\n\nIf they’re just starting / curious:\n\nThat’s awesome bro, what got you interested in starting?\n\n*Acknowledge*\n\nNice and would you be looking at doing that full time or are you working or in college?\n\n(If working)\n\nSick, what you doing for work?\n\n(If college)\n\nNice bro, what are you studying? You working part time too or mainly focused on that?\n\n##### Pain Discovery\n\n(Now that you know where they’re at, start digging gently.)\n\nWhat would be the main goal with UGC?\n\nWhere are you at right now in terms of UGC?\n\nHow long have you been wanting to do UGC for now?\n\nDid something happen now that meant you needed to start?\n\nBridge Gap:\n\nWhat do you feel is the main thing holding you back from (GOAL)\n\nOR\n\nWhat do you feel like you need now to be able to get to (GOAL)?\n\n##### Urgency Building\n\n(Anchor the pain and make them realize it's lasting longer than it should.)\n\nHow long have you been feeling stuck with that?\n\nIs this something you’re actually looking to get help with right now?\n\nOR\n\nHow much of a priority is getting to (GOAL) for you right now?\n\nDo you feel like if you had guidance with (Solution to pain) you would be able to get to (Goal) (faster?)?\n\n##### Pitch the Call\n\n##### Tell you what man, what I can do for you is schedule you in for a call with my business partner, he will run you down exactly how we could help you (fix pain) and (get to goal)\n\n##### You down?\n\n## Workflow\n\nWORKFLOW\n\n- Call notes\n\n- Cancel DQ calls\n\n- Follow up with booked calls (Postbooking) (set reminders to follow up for the calls)\n\n- Follow up with proposed calls\n\n- Clear inbox\n\n- Clear comments (videos promoting UGC)\n\n- Outbound\n\n- Follow ups (conversations that weren’t replied to)\n\n- Update trackers and tags\n\nLabelling SOP\n\n- For any good lead - LEAD\n\n- For  a prioritised lead to follow up with e.g. no close / asks you to give them time - DISPATCHED\n\n- For a proposed call - ORDERED\n\n- For a booked call - BOOKED\n\n- For a sale - PAID\n\n## Outbound Structure\n\nOUTBOUND STRUCTURE\n\nYou want to outbound to\n\n- New followers\n\n- Story viewers\n\n- Current followers (dont spam 10-15/hr)\n\n- engagement\n\nBad:\n\n- Straight into biz talk\n\n- Unnatural to say out loud\n\n- Generic (what made you follow?)\n\nGood:\n\n- Hyper specific\n\n- Rapport based\n\n- Something biz owner would actually be interested in / something you would pu to\n\n- Specific to real world events\n\n- Plan about how to transition\n\nExamples:\n\n- ‘Yo saw your post in Italy looks dope bro’ ‘Where were you staying?’ ‘Thinking of heading out’\n\n- Any location question, where are they at, how are they finding it/what to do out there,, saying we are going to head out there soon, etc. - performs good, but has to be specific (are you at XYZ)\n\n- Any car question - good, especially if you know the model and ask how they are finding it, because we wanna buy one in Miami + a lot of people post their cars\n\n- Gym location question, or if they are in Miami how are they finding the gym - decent level, best if you can mention a specific gym (does NOT have to be right just sounds v specific)\n\n- How do you know xyz person? saw you guys follow each other - perfect for any mutuals/refferals to start convo\n\n- what nationality are they in general (where are you from? can’t tell by the language) - good level\n\n- How long have you been boxing? Had a few sessions since summer might go all into it /how are you finding it (or any time of sport) - does well, especially if they are into the sport they like to talk abt it\n\nThese all need to be used when you see something on their page you can talk about, you’ll stand out 100 X more if used correctly and will transition into “biz” talk very smoothly\n\nNow if there is NOTHING specific to ask them or they are private with no pfp you can rip one of these:\n\nHey (name) appre
