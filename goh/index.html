u  switched  offers  tomorrow,  or  sold  hats  with  just  your  logo  and  \nmission\n \non\n \nthem,\n \ncould\n \nyou\n \nstill\n \nsell\n \nout?\n \nIf\n \nthe\n \nanswer\n \nis\n \nno,\n \nyou\n \nare\n \nover-reliant\n \non\n \nyour\n \noffer\n \nand\n \nyou\n \nneed\n \nto\n \nmake\n \npeople\n \nfall\n \nin\n \nlove\n \nwith\n \nwho\n \nyou\n \nare.\n \nThat\n \nis\n \nwhat\n \nTOF\n \ncontent\n \nis\n \nfor.\n \n \nBonus:  get  this  right  once  and  it  compounds.  The  hardest  thing  in  content  is  landing  \nthat\n \nﬁrst\n \ngenuinely\n \nstrong\n \nvideo.\n \nOnce\n \nyou\n \nhave\n \none,\n \nyou\n \ncan\n \nreverse\n \nengineer\n \nit\n \ninto\n \nan\n \nalmost\n \nendless\n \nrun\n \nof\n \nideas\n \n(covered\n \nin\n \nthe\n \nprocess\n \nbelow).\n \n \nExample  (threaded  through  this  SOP):  my  \"I  ﬂew  14  hours  to  surprise  my  family\"  video.  \nIt\n \nopens\n \non\n \nmy\n \nfamily\n \nscreaming\n \nwhile\n \nI\n \nclimb\n \nout\n \nof\n \na\n \nbox,\n \nsays\n \nnothing\n \nabout\n \nbusiness\n \nfor\n \nthe\n \nﬁrst\n \nhalf,\n \nand\n \nsits\n \nat\n \nover\n \n800,000\n \nviews\n \n(close\n \nto\n \na\n \nmillion).\n \nI\n \ncome\n \nback\n \nto\n \nthis\n \none\n \nvideo\n \nat\n \nevery\n \nstep\n \nbelow,\n \nbecause\n \nit\n \nshows\n \nthe\n \nwhole\n \nmethod\n \nworking\n \nat\n \nonce:\n \na\n \nbroad\n \nhook,\n \nan\n \nopen\n \nloop,\n \na\n \nnarrow-to-ICP\n \nturn,\n \nreal\n \nemotion,\n \nand\n \na\n \npain\n \npoint\n \nI\n \nlater\n \nspun\n \ninto\n \na\n \ndozen\n \nmore\n \nvideos.\n \n \nW hen\n \nto\n \nuse\n \nthis\n \n \nUse  it  for  every  piece  of  organic  short  form  content  whose  job  is  reach:  reels,  shorts,  \nand\n \nTOF\n \ncarousels.\n \nUse\n \nit\n \nafter\n \nyour\n \nvisual\n \nidentity\n \nand\n \nyour\n \ncommunication\n \nare\n \nalready\n \ndialled\n \nin,\n \nbecause\n \na\n \nbroad\n \nhook\n \nstill\n \nneeds\n \nconviction\n \nand\n \na\n \nstrong\n \nﬁrst\n \nimpression\n \nto\n \nland\n \n(those\n \nare\n \nthe\n \nearlier\n \nmodules,\n \nand\n \nthey\n \nare\n \nthe\n \ncause\n \nbehind\n \nthis\n \neffect).\n \n \nWhen  not  to  use  it:  do  not  use  TOF  rules  on  content  whose  job  is  to  qualify  or  sell.  \nAnd\n \naccept\n \nthe\n \ntrade-off\n \nup\n \nfront:\n \nthere\n \nis\n \nno\n \norganic\n \nstrategy\n \nthat\n \nattracts\n \nonly\n \nqualiﬁed\n \nleads.\n \nIf\n \nyou\n \nare\n \nnot\n \nwilling\n \nto\n \nmake\n \ncontent\n \nthat\n \nnon-ICP\n \nviewers\n \nalso\n \nenjoy,\n \ndo\n \nnot\n \ndo\n \norganic.\n \n \n\n### Page 3\n\nW ho\n \nowns\n \nit\n \n \nYou,  the  creator,  own  the  idea,  the  hook,  and  the  emotion.  Nobody  can  reverse  engineer  your  life  for  you.   \nYour  editor  owns  the  execution  of  the  packaging  once  you  have  briefed  it.  If  you  track  numbers  closely,  a  data  or  analytics  lead  can  own  the  metrics  side  (internally  that  is  Aiden's  job,  so  send  hard-metric  questions  there).  Everything  in  this  SOP  can  still  be  run  solo.   \nBefore\n \nyou\n \nstart\n \n \nDialled-in  visual  identity  and  communication  from  the  earlier  modules.  Packaging  is  downstream  of  how  you  look  and  speak  on  camera.   Your  Dream  Follower  Worksheet.  This  is  the  internal  document  where  you  deﬁned  your  ICP  in  detail.  You  will  mine  it  for  pain  points.  (Internal  resource,  see  Gaps  to  conﬁrm.)   A  way  to  capture  moments  the  instant  they  happen  (see  Edge  cases  for  the  exact  setup).   An  editor  plus  a  brieﬁng  system,  so  the  packaging  in  your  head  actually  makes  it  into  the  edit.   \nThe\n \nprocess,\n \nstep\n \nby\n \nstep\n \n \nThe  engine  has  ﬁve  moves:  understand  the  job,  use  open  loops,  build  the  broad-to  narrow  hook,  engineer  emotion,  and  reverse  engineer  your  winners  into  more  content.  Package  everything  so  the  idea  actually  lands.   \nStep  1:  Lock  in  the  one  job  of  TOF  content   \nGoal:  stop  trying  to  do  everything  in  one  video.   \nSay  it  out  loud  before  you  write:  this  video  exists  to  get  a  stranger  to  stop,  watch,  and  follow.  That  is  it.  The  moment  a  TOF  video  tries  to  sell,  qualify,  explain  the  offer,  or  ﬂex  results,  it  narrows  too  fast,  strangers  scroll,  and  the  algorithm  buries  it.   \nWhy  this  matters  mechanically:  when  you  post,  the  platform  shows  the  video  to  about  \n\n### Page 4\n\n10%  of  your  audience  ﬁrst.  If  they  do  not  like,  comment,  or  watch,  it  ﬂags  the  video  as  weak,  cuts  your  reach,  and  stops  showing  it  to  new  people,  so  you  do  not  grow.  If  engagement  and  retention  are  high,  it  pushes  to  another  20%  plus  non-followers,  that  drives  more  engagement,  and  the  loop  repeats  until  you  are  at  100,000  views  or  wherever  it  lands.  Your  job  at  TOF  is  simply  to  win  that  ﬁrst  10%.   \nStep  2:  Build  open  loops   \nGoal:  create  enough  curiosity  in  the  ﬁrst  ﬁve  seconds  that  scrolling  past  feels  uncomfortable.  An  open  loop  is  curiosity  by  design.  It  runs  on  a  ﬁxed  three-part  \nchain:  Introduction  →  Delay  →  Resolve   \nIntroduction:  open  a  question,  a  mystery,  or  tension.   Delay:  withhold  the  payoff  or  the  resolution.   Resolve:  close  the  loop  later  in  the  video,  or  deliberately  keep  it  open.   \nThis  is  why  unpredictable  creators  dominate.  With  Speed,  you  are  watching  to  see  what  he  will  do  next.  With  Mr  Beast,  you  are  watching  to  see  who  wins  the  challenge.  You  cannot  predict  the  payoff,  so  you  keep  watching  to  close  the  loop,  and  the  satisfaction  pulls  you  back  next  time.  If  you  are  not  getting  views  or  steady  new  followers,  you  are  almost  always  not  building  enough  curiosity.   \nThe  trap:  running  the  same  format  and  the  same  concept  over  and  over.  Your  audience  already  knows  what  you  will  say,  so  there  is  no  loop  to  close.  Combat  predictability  by  testing  new  formats  and  new  ideas.  The  lie  detector  video  worked  precisely  because  no  one  in  the  space  had  seen  it,  so  the  whole  video  became  one  big  open  loop.   \nThe  example  in  action:  the  surprise  video  opens  on  people  screaming  and  me  climbing  out  of  a  box.  Within  ﬁve  seconds  your  brain  is  asking  \"why  are  they  screaming,  why  is  he  in  a  box?\"  That  is  the  introduction  and  delay.  The  reveal  at  the  end,  me  surprising  my  family,  is  the  resolve.   \nStep  3:  Write  the  broad-to-narrow  hook   \nGoal:  stop  the  maximum  number  of  people  while  still  making  your  ICP  feel  it  was  made  for  them.   \nThe  single  most  important  concept  in  TOF  content  is  that  your  hook  should  be  as  broad  as  possible  without  being  irrelevant.  The  structure  is  always  the  same  shape:   \n\n### Page 5\n\nFirst  1  to  3  sentences  (broad):  plain,  simple,  general  language  anyone  can  answer  or  feel.  No  industry  words  yet.   Around  15  to  20  seconds  in  (narrowing):  introduce  your  ICP's  language  and  buzzwords  (for  business  it  is  words  like  leverage,  inputs,  workﬂow,  data).  Middle  to  end  (ICP):  now  it  feels  made  speciﬁcally  for  your  ideal  client.   \nStructure  the  script  itself  in  three  sections:  TOF  (broad),  MOF  (turning  toward  the  ICP),  BOF  (fully  speaking  their  language).  Non-ICP  viewers  will  drop  off  partway  through,  and  that  is  completely  ﬁne.  They  already  did  their  job:  they  gave  the  algorithm  the  engagement  that  carried  your  video  to  your  ICP,  who  stay  for  the  whole  thing  and  feel  like  you  made  it  just  for  them.   \nTwo  hooks,  same  insight,  opposite  results:  Broad  win:  \"How  many  of  you  work  on  Sundays?\"  Almost  anyone  over  20  can  answer  it,  so  it  pulled  in  a  wide  audience  and  did  40,000  views,  even  though  the  real  message  underneath  was  niche  business  advice  about  leverage  and  inputs.   Niche  ﬂop:  \"If  you're  not  booking  calls  from  your  content...\"  Of  100  strangers  shown  that,  maybe  3  are  coaches  struggling  to  book  calls.  The  other  97  scroll  instantly,  the  platform  ﬂags  it  as  weak,  and  it  dies.   \nThe  example  in  action:  the  surprise  video  says  nothing  about  business  for  the  ﬁrst  half.  \"Surprise\"  is  something  everyone  relates  to.  Only  halfway  through  do  I  mention  wanting  to  stay  in  London  for  business  before  choosing  family,  which  is  the  moment  the  business  owner  in  the  audience  feels  spoken  to.  The  broad  hook  bought  the  reach;  the  mid-video  turn  delivered  the  ICP.   \nStep  4:  Engineer  the  emotion   \nGoal:  make  the  viewer  feel  something,  because  content  that  creates  no  emotion  does  not  get  shared,  saved,  or  pushed.   \nBefore  you  ﬁnish  any  piece  of  content,  ask:  which  emotion  am  I  creating?  If  you  cannot  answer  clearly,  rewrite  it  until  you  can.  Four  emotions  drive  the  most  engagement:   \nInspiration:  \"I  want  to  live  like  that\"  or  \"that's  possible  for  me.\"   Curiosity:  \"I  need  to  know  how  this  ends\"  or  \"I've  never  heard  it  framed  that  way.\"  Validation:  \"that's  exactly  what  I've  been  feeling\"  or  \"ﬁnally  someone  said  it.\"  Urgency:  \"I  need  to  change  something  now\"  or  \"this  is  costing  me  more  than  I  realised.\"   \n\n### Page 6\n\nShow,  do  not  tell.  There  are  already  a  hundred  million  videos  a  day  telling  people  what  to  do.  Instead  of  telling,  show  yourself  doing  the  thing,  then  talk.  Do  not  say  \"here's  how  I  manage  my  team,\"  show  yourself  confronting  an  underperforming  editor.  That  editor  confrontation  video  stacked  three  emotions  at  once  (curiosity,  tension,  and  the  frustration  every  business  owner  knows)  and  did  50,000  to  60,000  views  with  3,500  likes,  because  a  stranger  wanted  to  know  why  the  guy  was  being  scolded,  while  the  business  owner  saw  their  own  life  on  screen.   \nThe  example  in  action:  the  surprise  video  hits  curiosity  in  the  hook,  then  validation  in  the  middle  (prioritising  family  over  business).  That  mix  is  also  what  made  me  likable,  not  just  watchable,  which  is  the  real  payoff  of  TOF:  people  who  share  your  morals  think  \"this  guy  is  sick,\"  save  it,  and  want  to  work  with  you.  Step  5:  Reverse  engineer  your  winners   \nGoal:  never  stare  at  a  blank  page  again.  Turn  one  strong  video  into  an  almost  endless  list  of  ideas.   \nStop  trying  to  invent  content  ideas.  Start  reverse  engineering  the  emotions  and  insights  that  already  worked.  The  named  drill  is  ask  why  three  times:   \n1.  Take  your  best-performing  piece  (strong  engagement,  lots  of  DMs,  or  actual  leads,  not  just  view  count).   2.  Ask  \"why  did  it  perform?\"  three  times,  past  the  surface,  until  you  hit  the  underlying  emotion.  For  the  editor  video:  it  built  curiosity,  because  there  was  tension,  because  it  was  a  real  business  moment  that  was  not  going  smoothly.   3.  From  that  core  emotion,  brainstorm  10  new  ideas  that  create  the  same  feeling  through  completely  different  angles.   \nOne  pain  point,  inﬁnite  ideas.  The  surprise  video's  core  emotion  was  parental  validation,  huge  in  Asian  culture  and  a  pillar  of  my  brand.  From  that  single  pain  point:  how  my  mum's  opinion  of  me  changed,  how  I  felt  when  my  dad  stopped  questioning  my  decisions,  how  it  felt  sending  money  to  my  parents,  buying  them  gifts,  proving  the  doubters  wrong,  growing  up  being  told  this  path  was  not  real.  None  of  those  videos  look  like  the  original,  but  each  carries  the  same  power.   \nTo  ﬁnd  your  own  pillars,  go  back  to  your  Dream  Follower  Worksheet  and  list  the  pain  points  that  also  resonate  with  the  general  public.  Mine  are  three:  making  family  proud,  work-life  balance,  and  making  more  money.   \nStep  6:  Package  it  so  the  idea  actually  lands   \nGoal:  protect  the  video  from  dying  in  the  edit.  Packaging  is  the  number  one  thing  to  \n\n### Page 7\n\nget  right,  before  the  content  itself.   \nPackaging  is  the  title,  the  on-screen  text,  the  background  music,  the  emotional  beats,  the  conviction  in  your  delivery,  and  your  visual  identity,  all  working  together.  The  same  footage  can  hit  20,000  views  or  a  million  depending  on  it.   \nDeliver  from  the  right  emotional  state  and  with  real  conviction.  My  \"$10k  a  month  is  the  new  minimum  wage\"  video  ﬂopped  because  I  did  not  believe  it:  I  smirked,  stuttered,  ﬁlmed  on  a  plain  white  background  with  bad  lighting.  If  I  had  said  something  I  actually  believed,  with  conviction,  good  lighting,  and  a  city-view  background,  it  could  have  performed  ten  times  better.  Only  make  content  you  genuinely  believe.   \nAsk  of  every  edit:  is  the  editing  helping  this  video  or  taking  away  from  it?  On  the  \"my  mum's  live  reaction  to  me  making  150k  a  month  at  19\"  video,  the  slow  instrumental  under  the  build  and  the  upbeat  guitar  on  the  reveal  were  both  intentional,  and  they  were  the  difference  between  20,000  views  and  a  million.   \nThree  ways  to  make  sure  the  packaging  in  your  head  reaches  your  editor  (use  them  together):   \n1.  Record  a  1  to  2  minute  Loom  per  video  (Loom  is  a  quick  screen-and-voice  recording  tool).  Spell  out  the  title  hook,  the  music  feel,  and  the  exact  emotion  on  each  beat.  Pros:  fastest  way  to  kill  variables  on  a  single  important  video.  Cons:  you  do  it  every  time.   2.  Build  format  SOPs  and  a  music  library  the  editor  rotates  through.  Big  brands  run  8  to  10  ﬁxed  formats,  each  with  its  editing  style  and  background  music  documented,  which  is  why  they  produce  so  easily.   Pros:  scales,  less  room  for  error.  Cons:  upfront  work  to  build.   3.  Score  ideas  before  you  ﬁlm  them.  Run  an  ideation  scoring  system  (for  example,  will  this  get  100k  views,  pre-selling  power,  proven  concept,  ICP  resonance,  stakes,  on  brand)  and  only  produce  ideas  above  a  rising  threshold,  starting  around  75  and  climbing.   Pros:  trains  you  and  your  team  to  raise  the  bar  every  week.  Cons:  self-scoring  is  rough  until  you  reﬁne  it.   \nW hat\n \ngood\n \nlooks\n \nlike\n \n \nA  strong  TOF  video  passes  the  TOF  Test,  and  you  should  be  able  to  answer  all  three  before  posting:   \n\n### Page 8\n\nWhat  pain  point  does  it  hit?   Does  it  appeal  to  a  wide  audience?  (Yes  /  No)   Does  it  build  curiosity  within  ﬁve  seconds?  (Yes  /  No)   \nBeyond  the  test:  the  hook  is  broad  enough  for  a  stranger  yet  turns  to  your  ICP  mid-video,  there  is  a  clear  open  loop  in  the  ﬁrst  ﬁve  seconds,  you  can  name  the  single  emotion  it  creates,  you  are  showing  rather  than  telling,  and  the  packaging  (title,  music,  delivery,  background)  is  intentional.  Even  middle  of  funnel  pieces  should  clear  this  bar,  or  almost  no  one  sees  them.   \nCommon\n \nmistakes\n \n \nPutting  the  niche  hook  ﬁrst.  Why  it  hurts:  97  of  100  strangers  scroll,  the  platform  ﬂags  the  video,  reach  dies.  Instead:  lead  with  a  line  anyone  can  answer,  narrow  later.  Using  ICP  buzzwords  in  the  ﬁrst  sentences.  Why  it  hurts:  you  signal  \"this  isn't  for  you\"  to  the  broad  audience  that  would  have  carried  your  reach.  Instead:  plain  language  ﬁrst,  buzzwords  after  about  15  to  20  seconds.   \nTelling  instead  of  showing.  Why  it  hurts:  it  is  boring,  only  niche,  and  replicable  by  anyone.  Instead:  show  yourself  doing  the  thing,  then  talk.   \nIgnoring  packaging  and  dumping  raw  footage  on  the  editor  to  \"cook  something  up.\"  Why  it  hurts:  an  untrained  editor  cannot  read  your  intent,  so  a  potential  million-view  video  lands  at  20,000.  Instead:  brief  the  title,  music,  and  emotion  (Loom,  format  SOPs,  or  both).   \nSaying  things  you  do  not  believe  for  views.  Why  it  hurts:  the  lack  of  conviction  shows  on  camera  and  the  video  falls  ﬂat,  like  the  $10k  minimum  wage  ﬂop.  Instead:  only  make  content  you  genuinely  believe,  delivered  from  the  right  emotional  state.   \nPosting  replicable  montages.  Why  it  hurts:  a  plain  \"me  working\"  montage  invokes  no  emotion  and  anyone  could  make  it,  so  it  ﬂops.  Instead:  add  a  creative  layer  only  you  could  pull  off.   \nTrying  to  invent  ideas  from  scratch.  Why  it  hurts:  you  burn  out  and  stall.  Instead:  reverse  engineer  a  winner  with  the  ask-why-three-times  drill.   \nEdge\n \ncases\n \nand\n \nexceptions\n \n \nCarousels.  The  script  and  structure  stay  the  same,  just  delivered  as  text  and  visuals.  \n\n### Page 9\n\nRip  your  best  hook  straight  into  text  format.   \nOn-screen  text  hooks.  Same  rule  as  the  spoken  hook:  as  broad  as  possible  while  still  making  the  ICP  care.  Tie  a  broad  ﬂex  to  a  curiosity  point,  for  example  \"how  I  bought  a  $2m  car  at  19  for  my  mum\"  rather  than  a  ﬂat  \"buying  a  $2.4m  car.\"   \nWatch-through  metrics.  You  do  not  need  to  chase  a  speciﬁc  percentage.  The  working  gut  test  is:  would  a  nine-to-ﬁver  or  a  six-ﬁgure  earner  care  up  to  this  point,  and  would  my  ICP  watch  the  whole  thing?  If  you  are  numbers-driven,  take  exact  watch-through  questions  to  your  analytics  lead.   \nA  great  unplanned  moment  happens.  Keep  capture  friction  near  zero.  Keep  cameras  on  tripods  permanently  set  up  where  you  work  (key  light  already  positioned)  so  you  can  ﬁlm  the  instant  ﬂow  hits.  A  MagSafe  phone  tripod  is  a  fast,  cheap  alternative,  and  worst  case,  ﬁlm  it  on  your  phone's  back  camera,  because  capturing  it  beats  losing  it.   \nYour  idea  list  is  mostly  B2B.  Separate  B2B  from  B2C  and  cut  the  B2B-only  items  for  TOF,  since  they  will  not  travel  to  a  broad  audience.  \"Anyone  could  rip  this  idea.\"  Filter  it:  if  someone  copied  it,  would  their  version  be  as  outstanding  as  yours?  Win  by  being  ﬁrst  to  bring  a  format  over  from  another  industry,  or  by  adding  a  creative  layer  (a  match-cut  transition,  a  lie  detector)  so  a  copy  just  looks  like  they  are  copying  you.   \nThings\n \nto\n \nnote\n \n \nPackaging  beats  script.  Even  average  words  land  if  the  packaging  and  positioning  are  strong.  The  lie  detector  for  a  refund  video,  with  lighting  and  someone  off-camera  asking  the  hard  question,  beat  any  talking-head  version  of  the  same  point.  Go  the  extra  mile,  treat  content  as  an  art.   \nMake  what  only  you  can  make.  The  strongest  TOF  pieces  are  the  ones  no  one  else  could  create.  Ask  \"what  can  I  talk  about  that  nobody  else  can?\"  and  tie  it  back  to  making  yourself  likable.   \nBuy  into  you  before  the  offer.  Inﬂuence  is  the  asset.  Build  a  brand  people  would  follow  even  if  you  changed  what  you  sold.   \nThe  ﬁrst  winner  is  the  hard  part.  Landing  one  genuinely  strong  video  is  the  whole  battle.  After  that,  reverse  engineering  does  the  heavy  lifting,  so  document  and  record  constantly  to  catch  the  real  moments.   \n\n### Page 10\n\nQuick\n \nchecklist\n \n \nRun  this  before  you  post  any  TOF  piece.  Aim  for  every  box  ticked.   \nThe  TOF  Test   \n☐  Can  I  name  the  pain  point  this  hits?   ☐  Does  it  appeal  to  a  wide  audience,  not  just  my  ICP?   ☐  Does  it  build  curiosity  within  the  ﬁrst  ﬁve  seconds?   \nHook  and  structure   \n☐  Are  my  ﬁrst  1  to  3  sentences  broad  and  free  of  industry  buzzwords?  ☐  Does  the  video  narrow  to  my  ICP  around  15  to  20  seconds  in?   ☐  Is  there  a  clear  open  loop  (Introduction,  Delay,  Resolve)  up  top?   \nEmotion  and  delivery   \n☐  Can  I  name  the  single  emotion  this  creates  (inspiration,  curiosity,  validation,  or  urgency)?  ☐  Am  I  showing  rather  than  telling?   ☐  Do  I  actually  believe  this,  and  am  I  delivering  it  with  conviction?   \nPackaging   \n☐  Is  the  title  or  text  hook  strong  enough  to  stop  a  stranger?   ☐  Is  the  music  chosen  to  match  the  emotional  beats?   ☐  Have  I  briefed  the  editor  (Loom  or  format  SOP)  so  the  packaging  survives  the  \nedit?  This  week's  actionables   \n☐  Have  I  written  5  TOF  hooks,  each  answerable  by  anyone,  not  just  my  ICP?  ☐  Have  I  taken  my  best  video  and  asked  \"why\"  three  times  to  reach  the  core  emotion?  ☐  Have  I  brainstormed  10  new  ideas  that  create  that  same  emotion  through  different  angles?   ☐  Have  I  ﬁlmed  one  TOF  piece  and  scored  it  on  the  Emotion  Test  before  posting?   \nGaps\n \nto\n \nconfirm\n \n \nReferenced  in  the  source  but  needing  a  human  to  conﬁrm  before  this  SOP  is  handed  out:   \nDream  Follower  Worksheet.  Attach  the  current  version  and  access,  since  Step  5  \n\n### Page 11\n\ndepends  on  it.  Internal.   Ideation  scoring  system.  Conﬁrm  the  exact  scoring  criteria,  the  current  threshold,  and  where  the  template  lives.  It  was  described  as  self-scoring  for  now,  with  an  AI  scored  version  planned.  Internal.   Tools.  Conﬁrm  the  current  stack  referenced  for  revisions  and  brieﬁng:  Frame  (review),  Whisperﬂow  (voice-to-text  feedback),  and  Loom.  Internal.   Background  music  library.  A  format-by-format  music  and  editing  SOP  was  said  to  live  in  Notion.  Attach  it.  Internal.   Hook  review.  Best  hooks  are  reviewed  live  by  the  founder  in  the  community  lounge  and  general  chat.  Conﬁrm  the  current  process  and  timing.  Internal.  View  and  like  counts  quoted  here  (surprise  video  800k  plus,  Sunday  hook  40k,  editor  video  50k  to  60k  with  3.5k  likes,  mum  reaction  video  near  1m,  paycheck  video,  lie  detector  30k)  are  the  founder's  recollections.  Verify  against  analytics  before  publishing  exact  \nﬁgures.\n \n"},{"badge":"07","group":"content","section":"Funnel","title":"Middle of Funnel Content SOP","description":"Nurture warm viewers and move them toward booking a call.","status":"archived","format":"pdf","sourceUrl":"https://gohconsulting.app/sops/mof-content-sop.pdf","portalUrl":"https://gohconsulting.app/sops?sop=07","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Middle of Funnel Content SOP\n\n- Source: https://gohconsulting.app/sops/mof-content-sop.pdf\n- Category: content / Funnel\n- Captured: 2026-09-21T14:01:51.495200+00:00\n\n\n### Page 1\n\n \nMOF  CONTENT  SOP \n GOH  CONSULTING   \nGoal  Turn  the  objections,  hesitations,  and  questions  your  prospects  raise  before  they  buy  \ninto\n \na\n \nrepeatable\n \ncontent\n \nsystem\n \nthat\n \ndissolves\n \nthose\n \nobjections\n \nat\n \nscale\n \n—\n \nso\n \nleads\n \narrive\n \nwarm\n \nand\n \nthe\n \nsales\n \ncall\n \nonly\n \nconﬁrms\n \na\n \ndecision\n \nthey\n \nhave\n \nalready\n \nmade.\n \nTHE  ONE  RULE\n The  real  job  of  MOF  content  is  to  eliminate  every  single  reason  your  ICP  has  NOT  to  buy.  Every  objection  is  a  content  piece.  If  it  comes  up  more  than  once,  it  becomes  a  content  piece.  If  it  comes  up  every  week,  it  becomes  a  content  pillar.  \n  \nWhat\n \nthis\n \nis  MOF  (middle-of-funnel)  content  lives  between  the  moment  someone  ﬁrst  ﬁnds  you  \nand\n \nthe\n \nmoment\n \nthey\n \npay.\n \nMost\n \npeople\n \nthink\n \nit’s\n \njust\n \ntestimonials\n \nand\n \ncase\n \nstudies\n \n—\n \nthat’s\n \na\n \nfraction\n \nof\n \nit.\n \nThe\n \nreal\n \njob\n \nis\n \nto\n \nmove\n \na\n \nprospect\n \none\n \nstep\n \ncloser\n \nto\n \nbuying\n \nwith\n \nevery\n \npiece,\n \nby\n \nanswering\n \nthe\n \nquestions\n \nrunning\n \nthrough\n \ntheir\n \nhead\n \nbefore\n \nthey’ll\n \never\n \nbook\n \na\n \ncall:\n •  Is  this  person  legit? •  Can  they  actually  help  someone  like  me? •  Is  it  worth  the  money? •  Will  it  work  for  my  speciﬁc  situation? Every  one  of  those  questions  is  an  objection.  MOF  content  solves  them  before  the  \nprospect\n \never\n \nreaches\n \nyou\n \n—\n \nwhich\n \nis\n \nwhat\n \nleads\n \nto\n \nPIFs\n \n(paid\n \nin\n \nfull)\n \nand\n \nto\n \nsales\n \ncalls\n \nthat\n \nno\n \nlonger\n \nfeel\n \nlike\n \nsales\n \ncalls.\n  \nWhy\n \nit\n \nmatters  \n\n### Page 2\n\nThe  sales  call  is  not  where  someone  decides  to  buy  —  it’s  where  they  conﬁrm  what  \nthey’ve\n \nalready\n \ndecided.\n \nIf\n \nyour\n \ncontent\n \ndid\n \nits\n \njob,\n \nthe\n \ndecision\n \nis\n \nmade\n \nbefore\n \nthe\n \ncall\n \nstarts.\n Here’s  the  leverage:  for  every  prospect  who  voices  an  objection  on  a  call,  there  are  \nhundreds\n \nin\n \nyour\n \naudience\n \nthinking\n \nthe\n \nexact\n \nsame\n \nthing\n \nand\n \nquietly\n \nnever\n \nbooking\n \nbecause\n \nof\n \nit.\n \nMake\n \ncontent\n \nthat\n \naddresses\n \nthat\n \nobjection\n \nand\n \nall\n \nof\n \nthose\n \npeople\n \nfeel\n \nseen\n \n—\n \nand\n \na\n \nshare\n \nof\n \nthem\n \nconvert\n \nwithout\n \nyou\n \never\n \nspeaking\n \nto\n \nthem.\n \nHandle\n \nobjections\n \none\n \nat\n \na\n \ntime\n \non\n \ncalls\n \nand\n \nyou\n \nhelp\n \none\n \nperson;\n \nhandle\n \nthem\n \nin\n \ncontent\n \nand\n \nyou\n \nhelp\n \neveryone\n \ncarrying\n \nthat\n \nobjection\n \nin\n \nsilence.\n  \nWhen\n \nto\n \nuse\n \nit\n \n(and\n \nwhen\n \nnot)  Use  this  system  when:  •  Running  calls:  You’re  already  running  sales  calls  and  hearing  real  objections  \nevery\n \nweek.\n •  Have  clients:  You  have  existing  clients  you  can  ask  why  they  chose  you.  •  Cold  leads:  You’re  getting  attention  (TOF  is  working)  but  leads  arrive  cold,  \nunconvinced,\n \nor\n \nprice-sensitive.\n •  Heavy  calls:  Your  close  rate  is  lower  than  you  want,  or  calls  feel  like  heavy  \nconvincing.\n Do  not  lean  on  this  when:  •  No  audience  yet:  Fix  top  of  funnel  ﬁrst  —  you  can’t  mine  objections  you  aren’t  \nyet\n \nhearing.\n •  No  clients  or  calls:  Start  with  the  closest  proxy  —  your  own  buying  process  (Step  \n3)\n \n—\n \nthen\n \nlayer\n \nin\n \nreal\n \nobjection\n \ndata\n \nas\n \nit\n \narrives.\n  \nWho\n \nowns\n \nit  The  founder  or  coach  owns  the  positioning  and  buying-process  work,  because  it  \ncomes\n \nfrom\n \ninside\n \nthem.\n \nThe\n \nsales\n \nteam\n \nand\n \ncontent\n \nteam\n \nshare\n \nthe\n \nobjection\n \nloop.\n \nIf\n \nyou’re\n \na\n \nsolo\n \noperator\n \nyou\n \nwear\n \nall\n \nthree\n \nhats,\n \nbut\n \nthe\n \nweekly\n \nobjection\n \nreview\n \nstill\n \nhappens\n \n—\n \nwith\n \nyourself,\n \non\n \npaper.\n  \nBefore\n \nyou\n \nstart  •  Access  to  your  recent  sales  calls,  notes,  or  recordings. \n\n### Page 3\n\n•  Your  last  10  onboarding  or  application  forms. •  A  list  of  your  top  20%  of  clients  and  a n \ncalls\n \nevery\n \nweek\n \n—\n \nevery\n \nobjection,\n \nhesitation,\n \nand\n \nquestion\n \na\n \nprospect\n \nraises.\n \nThe\n \nproblem\n \nis\n \nthat\n \ninformation\n \ndies\n \nin\n \nthe\n \ncall\n \nand\n \nnever\n \nmakes\n \nit\n \ninto\n \nyour\n \ncontent.\n •  The  mechanism:  Once  a  week,  sales  and  content  sit  down  for  30  minutes  with  \none\n \nagenda\n \nitem:\n \nwhat\n \nobjections\n \ncame\n \nup\n \nthis\n \nweek?\n \nThen,\n \nfor\n \neach,\n \ntrace\n \nit\n \nback.\n \nWORKED  EXAMPLE  —  THE  OBJECTION-TO-PILLAR  PIPELINE\n Objection  heard  on  calls:  “I  don’t  have  enough  time  to  create  content.”  Because  it  kept  coming  up  week  after  week,  it  wasn’t  treated  as  a  one-off  —  it  became  the  video  “How  I  created  10  Reels  and  1  YouTube  video  in  2  hours.”  It  performed  well  enough  (~60,000–70,000  views  on  the  original)  that  the  format  got  \n\n### Page 4\n\nreused  three  to  four  times,  with  reworked  versions  pushing  toward  100,000  views.  One  recurring  objection,  mined  from  calls,  became  a  repeatable  content  pillar  and  pre-handled  that  objection  for  hundreds  of  silent  prospects.  \n Trace  each  objection  through  three  questions:  OBJECTION  (what  did  they  say?)  →  \nWHAT\n \n(what\n \ncontent\n \npiece\n \ndid\n \nthey\n \nﬁrst\n \nwatch?)\n \n→\n \nWHY\n \n(why\n \ndid\n \nthat\n \ncontent\n \nresonate?).\n \nThen\n \nask\n \nwhether\n \nyour\n \nhigher-level\n \nICP\n \nresonates\n \nwith\n \nthat\n \nsame\n \ncontent.\n \nMap\n \nobjection\n \nto\n \ncontent\n \ntype:\n –  “I  don’t  have  enough  time  to  create  content”:  A  workﬂow  video  showing  \nexactly\n \nhow\n \nfast\n \ncontent\n \ncan\n \nbe\n \nmade.\n –  “I’ve  tried  every  format  but  nothing  works”:  A  video  on  how  to  ﬁnd  formats  \nthat\n \ngive\n \nyou\n \nenergy.\n –  “I  don’t  know  if  it  will  work  in  my  niche”:  A  client  case-study  breakdown  (e.g.  a  \nclient\n \ntaken\n \nfrom\n \n10,000\n \nto\n \n151,000,\n \nor\n \na\n \nmobility\n \ncoach\n \nreaching\n \n~70,000\n \nviews\n \non\n \na\n \n“how\n \nto\n \nkick\n \nhigher”\n \npiece).\n •  The  rule  for  prioritising:  If  an  objection  comes  up  more  than  once,  it  becomes  a  \ncontent\n \npiece.\n \nIf\n \nit\n \ncomes\n \nup\n \nevery\n \nweek,\n \nit\n \nbecomes\n \na\n \ncore\n \ncontent\n \npillar.\n \nThe\n \nobjections\n \nyou\n \nhear\n \nmost\n \noften\n \nare\n \nyour\n \nmost\n \nimportant\n \ncontent.\n  \nStep\n \n3:\n \nreverse-engineer\n \nyour\n \nOWN\n \nbuying\n \nprocess  Goal:  ﬁnd  your  positioning  by  understanding  why  you  buy,  because  the  same  \nreasons\n \ndrive\n \nwhy\n \nyour\n \nclients\n \nbuy.\n \nAsk\n \nyourself\n \nwhy\n \nyou\n \nchose\n \nto\n \nbe\n \nin\n \nthis\n \nprogram,\n \nand\n \nlook\n \nback\n \nat\n \nthe\n \nform\n \nyou\n \nﬁlled\n \nout.\n \nThe\n \nreasons\n \nyou\n \nchose\n \nyour\n \ncoach\n \nare\n \nlikely\n \nthe\n \nsame\n \nreasons\n \nyour\n \nclients\n \nchose\n \nyou\n \n—\n \nyou\n \nsaw\n \nsomething\n \nin\n \nthem\n \nyou\n \nrecognise\n \nin\n \nyourself.\n •  The  10  reasons  +  ask-why-3x  drill –  List  10  reasons:  Write  down  every  reason  you  chose  to  work  with  your  mentor  —  \nget\n \nto\n \n10.\n –  Ask  why  three  times:  For  each  reason,  go  three  layers  deeper.  –  Read  the  list:  These  are  the  exact  reasons  your  clients  will  choose  you,  if  you  \nmake\n \nthem\n \nvisible\n \nin\n \nyour\n \ncontent.\n \nWORKED  EXAMPLE  —  GOING  THREE  LAYERS  DEEP\n Surface  reason:  “They  seemed  to  actually  care.  It  didn’t  feel  transactional.”  Why  did  that  matter?  Because  I’d  spent  money  before  with  people  who  took  the  check  and  disappeared.  I  needed  to  know  someone  would  still  show  up  when  things  got  hard.  \n\n### Page 5\n\nWhy  was  that  important?  Because  the  hardest  moments  in  business  aren’t  strategy  problems  —  they’re  moments  you  want  to  quit  and  nobody  takes  it  seriously.  I  was  investing  in  someone  being  in  my  corner,  not  just  in  information.  And  underneath  that?  I’d  done  this  alone  for  a  long  time  and  was  exhausted  by  the  silence.  I  didn’t  just  want  a  coach  —  I  wanted  to  stop  feeling  alone  in  it.  What  this  means  for  your  content:  show  what  happens  after  the  sale.  A  clip  from  a  group  call,  a  message  you  sent  a  client  late  at  night,  a  win  you  celebrated  together.  People  watching  aren’t  seeing  a  service  —  they’re  seeing  what  it  feels  like  to  be  supported.  \n •  Where  to  dig  for  positioning:  Your  backstory,  a  unique  experience,  your  values,  \ncontrarian\n \nbeliefs,\n \npersonal\n \nand\n \nclient\n \nresults,\n \na\n \nsacriﬁce\n \nyou\n \nmade,\n \nand\n \nhow\n \nyou\n \ncommunicate.\n •  On  niching  down:  The  fear  is  that  niching  down  excludes  clients  —  the  opposite  \nis\n \ntrue.\n \nContent\n \nthat\n \ntries\n \nto\n \nresonate\n \nwith\n \neveryone\n \nresonates\n \nwith\n \nno\n \none\n \ndeeply\n \nenough\n \nto\n \nact.\n \nSpeak\n \nwith\n \nextreme\n \nspeciﬁcity\n \nto\n \none\n \nexact\n \nperson\n \nand\n \npeople\n \noutside\n \nthat\n \nproﬁle\n \nstill\n \nfeel\n \nit,\n \nbecause\n \nspeciﬁcity\n \nis\n \nwhat\n \nmakes\n \ncontent\n \nfeel\n \nreal.\n •  Mine  your  top  20%:  Ask  what  speciﬁc  problem  they  were  solving  when  they  \nfound\n \nyou,\n \nwhat\n \nmade\n \nthem\n \nchoose\n \nyou,\n \nand\n \nwhat\n \nyou\n \nhelped\n \nthem\n \nsee.\n \nBook\n \nshort\n \ncalls\n \nand\n \nask\n \ndirectly:\n \n“What\n \nwas\n \nthe\n \none\n \nthing\n \nthat\n \nmade\n \nyou\n \ndecide\n \nto\n \nwork\n \nwith\n \nme?\n \nWhat\n \nspeciﬁc\n \ncontent\n \ngot\n \nyou\n \nto\n \nreach\n \nout?”\n •  Sharpen  your  contrarian  take:  What  does  everyone  in  your  space  say  that  you  \nfundamentally\n \ndisagree\n \nwith?\n \nAngles\n \nthat\n \nalready\n \nwork:\n \norganic\n \nvs.\n \npaid\n \nads,\n \nyour\n \nprocess\n \nvs.\n \nthe\n \nstandard\n \napproach,\n \nyour\n \nonboarding\n \nprocess\n \n(over\n \n$600,000\n \nin\n \nreferrals),\n \nyour\n \npost-booking\n \nprocess\n \n(closing\n \n$25,000\n \ndeals),\n \nmanaging\n \nan\n \nunderperforming\n \nteam\n \nmember,\n \nand\n \nhow\n \nyour\n \nsales\n \ncall\n \nsets\n \nexpectations\n \nand\n \nonly\n \ntakes\n \non\n \ngood-ﬁt\n \nclients.\n  \nStep\n \n4:\n \nrun\n \nthe\n \nBuyer\n \nMirror\n \nForm,\n \nmake\n \nyour\n \nvalues\n \nvisible  Goal:  get  feedback  on  what’s  actually  working,  in  your  clients’  own  words,  and  turn  it  \ninto\n \ncontent.\n \nThese\n \nanswers\n \ndon’t\n \ntell\n \nyou\n \nwhat\n \nyou\n \nthink\n \nis\n \nworking\n \n—\n \nthey\n \ntell\n \nyou\n \nwhat\n \nis\n \nactually\n \nworking,\n \nin\n \nthe\n \nexact\n \nwords\n \nyour\n \nclients\n \nuse.\n \nRead\n \nthrough\n \nthem\n \nand\n \nthe\n \npatterns\n \nbecome\n \nyour\n \ncontent\n \nand\n \nmessaging.\n •  Make  your  values  visible –  Show  how  you  handle  a  difﬁcult  client  situation.  –  Show  what  you  will  not  compromise  on.  \n\n### Page 6\n\n–  Show  how  your  decisions  are  driven  by  something  beyond  making  money.  When  Step  4  is  working,  MOF  content  is  tracking  objections,  dissolving  beliefs,  and  \npre-handling\n \nthoughts\n \nyour\n \nICP\n \nhasn’t\n \neven\n \nvoiced\n \nyet.\n \nLeads\n \nstop\n \nbeing\n \ncold;\n \nby\n \nthe\n \ntime\n \nthey\n \nreach\n \nout,\n \nthe\n \nsale\n \nis\n \nalready\n \nhalf\n \nmade.\n \nBuild\n \nthe\n \nsystem,\n \nstay\n \nconsistent,\n \nand\n \nyour\n \nsales\n \ncalls\n \nwill\n \nnever\n \nfeel\n \nlike\n \nsales\n \ncalls\n \nagain.\n  \nChoosing\n \nyour\n \napproach\n \nto\n \nobjection\n \ncontent  There’s  more  than  one  valid  way  to  turn  an  objection  into  content  —  pick  based  on  \nthe\n \nobjection\n \ntype.\n •  A.  Workﬂow  /  demonstration  video:  Show,  don’t  tell.  Best  for  practical  or  \nlogistical\n \nobjections\n \n(“I\n \ndon’t\n \nhave\n \ntime”,\n \n“it’s\n \ntoo\n \nhard”).\n –  Pros:  Highly  credible,  hard  to  argue  with,  evergreen  and  reusable  as  a  pillar.  –  Cons:  More  production  effort;  needs  a  real  process  to  show.  •  B.  Client  case-study  breakdown:  Best  for  “will  it  work  for  me  /  my  niche”  \nobjections.\n \nBreak\n \ndown\n \na\n \nspeciﬁc\n \nclient\n \nresult\n \nand\n \nthe\n \npath\n \nto\n \nit.\n –  Pros:  Removes  doubt  with  proof;  transferable  across  niches  when  framed  well.  –  Cons:  Needs  client  permission  and  real  numbers;  weak  without  speciﬁcity.  •  C.  Story  /  perspective  shift:  Best  for  belief-level  and  identity  objections.  Shift  the  \nbelief\n \nthrough\n \na\n \nstory,\n \nnot\n \nan\n \nargument.\n –  Pros:  Moves  people  emotionally,  hard  for  competitors  to  copy,  builds  positioning.  –  Cons:  Requires  vulnerability  and  speciﬁcity;  surface-level  stories  fall  ﬂat.   \nWhat\n \ngood\n \nlooks\n \nlike  •  You  can  name  the  top  5  objections  you  hear  and  point  to  a  content  piece  for  \neach. •  Recurring  objections  have  been  promoted  to  content  pillars,  not  one-off  \nposts. •  Your  content  uses  your  clients’  exact  language,  pulled  from  calls  and  the  \nBuyer\n \nMirror\n \nForm. •  Leads  arrive  on  calls  already  warm,  referencing  your  content,  needing  less  \nconvincing. •  The  weekly  sales-plus-content  sync  is  actually  happening  and  feeding  the  \ncontent\n \ncalendar.  \n\n### Page 7\n\nCommon\n \nmistakes  •  Treating  MOF  as  testimonials  only:  Testimonials  are  a  slice  —  the  job  is  \neliminating\n \nevery\n \nreason\n \nnot\n \nto\n \nbuy.\n •  Letting  objections  die  in  the  call:  If  they  never  leave  the  sales  conversation,  \nhundreds\n \nof\n \nsilent\n \nprospects\n \nstay\n \nstuck.\n •  Answering  an  objection  once  and  moving  on:  If  it  recurs,  it’s  a  pillar,  not  a  \nfootnote.\n •  Selling  to  the  past  version  of  yourself:  Assuming  you  already  know  how  your  \nICP\n \nthinks\n \nstops\n \nyou\n \nfrom\n \nactually\n \nlistening.\n •  Staying  broad  to  avoid  excluding  anyone:  Speaking  to  everybody  means  \nrelating\n \nto\n \nnobody.\n •  Settling  for  surface-level  answers:  The  power  in  the  buying-process  drill  is  \nthree\n \nlayers\n \ndeep.\n •  Arguing  people  out  of  beliefs:  Beliefs  shift  through  story  and  perspective,  not  \ndebate.\n  \nEdge\n \ncases\n \nand\n \nexceptions  •  No  clients  yet:  You  can’t  run  the  Buyer  Mirror  Form  —  start  with  Step  3  on  \nyourself\n \nand\n \ntreat\n \nyour\n \nown\n \nbuying\n \nprocess\n \nas\n \nthe\n \nproxy\n \nuntil\n \nreal\n \nclient\n \ndata\n \nexists.\n •  Few  or  no  sales  calls:  Objection  mining  is  thin  —  prioritise  top  of  funnel,  and  \npull\n \nobjections\n \nfrom\n \nDMs,\n \ncomments,\n \nand\n \ndiscovery\n \nconversations\n \nmeanwhile.\n •  An  objection  that’s  really  a  ﬁt  problem:  Not  every  objection  should  be  \ndissolved\n \n—\n \nsome\n \ncorrectly\n \nﬁlter\n \nout\n \npeople\n \nwho\n \naren’t\n \na\n \ngood\n \nﬁt.\n \nSetting\n \nexpectations\n \nand\n \nonly\n \ntaking\n \nthe\n \nright\n \nclients\n \nis\n \npart\n \nof\n \nthe\n \nsystem.\n •  Solo  operator:  The  weekly  objection  sync  still  happens  —  with  yourself  and  your  \nnotes.\n  \nThings\n \nto\n \nnote  •  Frequency  is  the  signal:  How  often  an  objection  recurs  tells  you  whether  it’s  a  \npost\n \nor\n \na\n \npillar.\n •  Exact  wording  matters:  Use  the  language  clients  use,  not  the  language  you’d  \nuse\n \nto\n \ndescribe\n \nyour\n \nown\n \nwork.\n \n\n### Page 8\n\n•  Speciﬁcity  beats  reach:  The  more  speciﬁc  the  content,  the  more  real  it  feels  —  \neven\n \nto\n \npeople\n \noutside\n \nthe\n \nexact\n \nproﬁle.\n •  This  is  a  loop,  not  a  launch:  Collect,  feedback,  improve,  repeat  —  forever.   \nQuick\n \nchecklist  ☐   Set  up  a  weekly  30-minute  call  between  sales  and  content.  Only  agenda  item:  \nwhat\n \nobjections\n \ncame\n \nup\n \nthis\n \nweek?\n ☐   Go  through  your  last  10  onboarding  forms  and  ﬁnd  out  WHY  clients  chose  you.  \nTurn\n \nthese\n \ninto\n \nyour\n \nnext\n \n3\n \npieces\n \nof\n \ncontent.\n ☐   Write  down  the  5  most  common  objections  you  hear  on  calls  and  identify  the  \nunderlying\n \nbelief\n \nbehind\n \neach.\n ☐   For  each  belief,  outline  one  piece  of  content  that  shifts  it  through  story  or  \nperspective,\n \nnot\n \nargument.\n ☐   Write  down  the  3  most  common  limiting  beliefs  your  ICP  holds  and  plan  a  piece  \nof\n \ncontent\n \nfor\n \neach\n \nfrom\n \nyour\n \nown\n \nexperience.\n ☐   Identify  your  clearest  point  of  difference  and  make  one  piece  of  content  this  \nweek\n \nthat\n \ndemonstrates\n \nit.\n ☐   Do  the  ask-why-3x  drill:  10  reasons  you  chose  your  mentor,  each  taken  three  \nlayers\n \ndeep.\n ☐   Book  calls  with  your  top  20%  of  clients  and  ask  what  made  them  decide  and  \nwhat\n \ncontent\n \ngot\n \nthem\n \nto\n \nreach\n \nout.\n  \nGaps\n \nto\n \nconfirm  •  Buyer  Mirror  Form:  The  exact  questions  and  where  it  lives  —  referenced  as  a  \nnamed\n \nStep\n \n4\n \nasset\n \nbut\n \nnot\n \nfully\n \nshown.\n •  View  counts  &  client-result  ﬁgures:  Conﬁrm  the  “10  Reels  in  2  hours”  video  \nviews\n \nand\n \nreuse\n \nmultiple\n \nagainst\n \nreal\n \nanalytics\n \nbefore\n \npublishing\n \nexternally.\n •  Referral  &  deal  ﬁgures:  The  $600,000  in  referrals  and  $25,000  deal  size  —  \nconﬁrm\n \ncurrent\n \nnumbers\n \nand\n \nany\n \ncommission\n \nstructure\n \nbefore\n \nquoting.\n •  Sync  cadence:  Whether  the  30-minute,  both-teams  weekly  cadence  is  ﬁxed  or  \nadjustable\n \nper\n \nteam\n \nsize.\n \n"},{"badge":"08","group":"content","section":"Story","title":"Story Sequences","description":"Structure Instagram story sequences that build trust and convert.","status":"content_archived","format":"","sourceUrl":"https://docs.google.com/document/d/1vlcPJ3Wt1FP8eKP472CRQOv1gJVIE7WvvQRieGK8hSM/edit?tab=t.6k8ogpt5zgsf","portalUrl":"https://gohconsulting.app/sops?sop=08","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Story Sequences\n\n- Source: https://docs.google.com/document/d/1vlcPJ3Wt1FP8eKP472CRQOv1gJVIE7WvvQRieGK8hSM/edit?tab=t.6k8ogpt5zgsf\n- Capture: Google Docs API, all returned tabs\n- Tab count: 2\n\n## Story Sequence Frameworks\n\n.STORY SEQUENCES.\n\n.GOH CONSULTING.\n\nStory sequences are one of the most efficient ways to nurture your audience, build trust, and generate clients through Instagram. It's a way for you to document without overthinking and show the audience a side of you that you don't show through Reels or YouTube videos.\n\nA big mistake that people make is they completely follow their own framework and treat stories with no intention. While you want to be a bit more loose on your stories, you still want to maintain the overall real structure that you use in short form. Stories still need a strong hook for people to care enough so they keep coming back.\n\nIf people are constantly skipping past your stories, you won't get a lot of story views and your effort will be diminished\n\nThe goal of this SOP is to give you six main story sequences that you can alternate between so that you never run out of ideas and can always post on your story every single day.\n\nOverview\n\nHere’s a breakdown of the 6 Sequences:\n\n- Student Wins: turn a client transformation into proof that drives DMs\n\n- FREE Resource: lead with outcome + mission, give away an exclusive resource\n\n- YouTube Video Launch: peak interest then nurture with long-form content\n\n- Q/A Sticker: answer personalised questions to deepen connection\n\n- Documentation: showcase what’s happening in your life BTS\n\n- Business BTS: exclusive access to what you’re working on internally\n\n3 Golden Rules\n\n1 - Max 1-2 CTAs per week\n\nDo not overdo CTAs on your stories. It will just build a lot of buyer-resistance.\n\n2 - Mix sequence intents\n\nDon’t run the same type of sequence two days in a row. This helps us prevent content fatigue. By running the same type of stories back to back, we’re subconsciously training the viewer to scroll because it feels the same.\n\n3 - Build, then harvest\n\nWarm the audience up with engagement first (polls, sliders, Q/As) to generate views and then drop the CTA. This allows us to maximise how many people actually view the story.\n\nNote: stories function the same as reels in the algorithm. The higher the engagement rate, the larger amount of your audience they will be shown to.\n\n1. Student Wins\n\n![Embedded image](../assets/08/kix_kktqew50fbtw.png)\n\nThe goal of this sequence is to turn a client’s transformation into proof that drives the viewer into your DMs.\n\nThis should be used when you have a clear client before → after with proof to back it (DM screenshots, dashboards, payments)\n\nThis is perfect to build urgency and trust. By showcasing an ICP client, calling out their pain points and breaking down how you solved them, you’re positioning yourself as a solution.\n\nYou are the bridge between where your prospect is right now (their current situation) and where they want to be (their desired outcome)\n\nSlide 1 - Summarise the Transformation\n\nCompare their current situation (where they were when they joined the program) vs dream outcome (where are they now) the timeframe and an open loop.\n\nExample\n\n“Wyatt went from $7k to $105k cash collected / 9k followers to 27k followers / 35% close rate to 100% close rate / all in a span of 30 days… so what did he do?\"\n\nSlide 2/3/4 - Overview of Changes\n\nEach slide should: appeal to a different pain point, explain WHAT you did and WHY, hint at your fulfilment structure and provide proof.\n\nStructure: Problem → Solution → Outcome\n\nExample\n\nSlide 2: Positioning: \"we dialled in his positioning\" → wider TOF hooks → wider TAM → more ICP leads → tripled following.\n\nSlide 3: Conversion infrastructure: \"we built the conversion infrastructure\" → a system that booked leads faster, more value in the DMs, problem-aware leads, a repeatable B2B process → packed calendars.\n\nSlide 5 - CTA\n\nOptional: direct the viewer to a relevant Freebie or a Long Form Video\n\nExample\n\n\"I just filmed a 45-minute video breaking down step-by-step exactly how we did this…\"\n\nDM CTA → \"reply [KEYWORD] and I'll send it to you\"\n\n2. FREE Resource\n\n![Embedded image](../assets/08/kix_gpayq3bmm8sk.png)\n\nThe goal of this sequence is to lead with an outcome and your mission, prove it with client or personal results and then give away an “exclusive” FREE resource to drive DMs.\n\nYou need to GIVE before you ask for anything in return. By giving them FREE Value, you’re putting your audience in value debt and this gives you the right to ask for something in return, eg: booking in a call.\n\nSlide 1 - Mission Statement\n\nShowcase your goal and mission, backed by proof that you're achieving it.\n\nExample\u000b“4 months ago I started working with SooWei and we set out on a mission to scale to $1m/mo. Since then we've generated over 25,000 qualified followers and scaled to a record $408k in our first full month together. Now it's our goal to help as many others do the same.\"\n\nSlide 2 - Client Results\n\nStack proof from multiple clients in different markets. For each result showcase: Point A vs. Point B, the mechanism, the outcome and proof.\n\nThe aim is to make the transformation extremely clear while showcasing exactly how we’ve helped them to achieve it.\n\nSlide 3 - CTA\n\nOffer the exclusive free resource while creating scarcity.\n\nExample\n\nExclusivity: \"I hosted a 60-minute group call inside our community breaking down the exact workflow that makes numbers like this possible.\"\n\nScarcity: \"I'm giving it to the first 10 people who reply with [KEYWORD]\" — limited spots × timeframe.\n\nThen include your DM CTA\n\n3. YouTube Video Launch\n\n![Embedded image](../assets/08/kix_detbjxiqujip.png)\n\nThe goal of this sequence is to peak your viewers’ interest, then nurture them with long-form content directing as much traffic from IG to your YouTube as possible when a video drops.\n\nThis sequence should open a gap in their thinking, prove your point with a result, then send them to the video to close it.\n\nThere’s 3 Main Reasons why this sequence works so well:\n\n- Your audience needs to spend at least 7 hours with you before they buy so directing them to the Long Form content and nurturing them allows us to shorten the buyers journey.\n\n- On top of this, it opens the conversation in the DMs. By leveraging a CTA, you maximise your inbounds and reduce sales resistance because the conversation in the DMs now feels like a natural follow up.\n\n- And once again, you need to GIVE before you ask for anything in return. This is another way of delivering your audience FREE Value.\n\nSlide 1 - Limiting Belief\n\nThe aim is to address the limiting belief, call out the pain point and go against the grain.\n\nExample\n\n“The biggest mistake I see people make is posting niche content to a specific audience. If there's one piece of advice I can give you, NEVER niche down. It kills your reach and the algorithm will never push your content to the right people.\"\n\nSlide 2 - Proof\n\nAttach the value to a result to build credibility and give people a reason to listen. Show a screenshot, either a personal result, payment dashboard or client result.\n\nNote: when sharing client results always mention where they were before working with you (Point A) versus where they are after working with you (Point B) and show proof\n\nSlide 3 - Optional CTA\n\nDouble down on the outcome: \"by changing the way he built his brand, he went from $7.5k/mo to $312k cash collected in 90 days\"\n\nDirect the audience to YouTube: \"go watch the entire transformation, breaking everything down step by step.\"\n\nDM CTA as the backup capture (reply [KEYWORD] for the link → Manychat → setter).\n\n4. Q/A\n\n![Embedded image](../assets/08/kix_egt41ejtonzq.png)\n\nThe goal of this sequence is to answer personalised questions directly from your audience to deepen connection, boost reach, and gather market research.\n\nInteractions on stories (Q/A stickers, polls, sliders) push your stories to more people: so this sequence both connects and earns reach.\n\nSlide 1 - Open the Q/A\n\nDrop the question sticker and invite responses.\n\nSlide 2+ - Answer Questions\n\nPick and choose what you answer. Aim for a spread across:\n\n- Personal: let people get to know you\n\n- Opinions: contrarian or strong takes that spark debate\n\n- Support: graciously receive praise / appreciation\n\n- Insights: drop genuine value on business / mindset\n\n- BTS / Hiring: behind the scenes, or point to careers\n\nPositioning\n\nThere are 2 Main Ways that you can position a Story Q/A.\n\n- Authenticity\n\n- Position it as a friendly check-in for your audience to get to know you more\n\n- “I haven’t done one of these in a while…”\n\n- Focus on answering the more personal questions\n\n- Value\n\n- Ask your audience what they’re specifically struggling with and share insights that tackle their pain points\n\n- Be selective with the questions you solve\n\n- BONUS: Submit your own questions based on what you know your audience cares about on a separate account\n\n5. Documentation\n\n![Embedded image](../assets/08/kix_2tqbo16t8m95.png)\n\nThe goal of this sequence is to showcase what’s happening in your life BTS and connect it back to your mechanism.\n\nThis works well to build a deeper connection with your audience and showcase areas of your life that viewers typically wouldn’t see in the average reels.\n\nFor example, this could include:\n\nShowing you travelling\n\n- Show the view, villa, restaurant, etc. of the place you're traveling to\n\n- Document what you get up to each day and how you balance work with pleasure\n\nYou working on other aspects of your life, not just business\n\n- Hitting the gym, what your workout split is, etc\n\n- Spending time with friends and family, social activities\n\n- Other hobbies like sports or reading\n\nLife update on what has been happening the last few days\n\n- Things you've done that are interesting, collapsed into a 3-story sequence\n\n- This could be masterminds you’ve hosted or attended, trips you’ve been on, crazy purchases you’ve made\n\nSlide 1 - BTS\n\nPattern interrupt, callout, vulnerability or desirable moment\n\nExample\n\n“Hosted a London mastermind yesterday for clients. Covered high level topics like how to build a niche brand. The clients came for free, absolutely loved it.”\n\nSlide 2 - Wins\n\nInsert examples of personal wins or client wins. Make sure to include screenshots as proof.\n\nThis should show a contrast between your personal life / the BTS and your business, which is still generating results.\n\nExample\n\n“Dialing in fulfillment and the clients are doing better than ever. $5K PIFs on the regular for B2C offers”\n\nSlide 3 - Mechanism\n\nBriefly explain WHY this is happening. Tie it back to systems, habits, strategies, mindset shifts and create a feeling of FOMO or exclusivity.\n\nExample\n\n“Been building SOPs for every single problem you can face when scaling. It’s what nobody focuses on but that’s where we have our edge and the best results in the game. Since I’m feeling generous… DM me your main problem and I’ll send you an exact SOP on how to solve it”\n\nHere are some other examples of Documentation Format Stories:\n\n![Embedded image](../assets/08/kix_pbbqit2zs60w.png)\n\n6. Business BTS\n\n![Embedded image](../assets/08/kix_nrbzq37e9rvw.png)\n\nOn top of showing the BTS of your personal life, stories are also an opportunity to go a layer deeper and show what you’re working on internally, within your business.\n\nBy showing the type of clients you’re working with and how your program is tailored to a specific ICP, this allows you to attract more of the same people, increasing referrals and helps your viewers feel understood.\n\nShow an ICP client joining in\n\n- Glimpse of a 1-1 call with them, tag them, and talk about the transformation they are going to go through\n\n- Now you can attract more of the same ICP\n\nShow a new change you added into the fulfillment\n\n- Behind-the-scenes access of what we're doing to make the product better\n\n- Key here is to document what you are doing which sets you apart from everyone else who is only showing client results\n\nRenewals or Upsells\n\n- Show clients renewing or upselling into another package you offer and film their live reaction on why they did it\n\n- Subconsciously this makes people think you have a great product without you even having to tell them\n\nHere are some other examples of Business BTS Format Stories:\n\n![Embedded image](../assets/08/kix_xtvmecdl9gra.png)\n\nPosting Cadence\n\nAs we mentioned earlier, it is super important to be aware of your posting cadence for story sequences to prevent content fatigue. Below is an example week structure:\n\n- Monday: Q/A (warm up, earn reach)\n\n- Tuesday: Student Wins (Soft CTA 1)\n\n- Wednesday: Documentation\n\n- Thursday: Engagement Farming or Q/A\n\n- Friday: FREE Resource (Soft CTA 2)\n\n- Weekend: Documentation / personal\n\nQuick Checklist\n\nRun this before you post a Sequence. Every answer should be yes.\n\nThe Story\n\n- Is the hook short and scroll-stopping?\n\n- Is the text easy to read?\n\n- Does the sequence have a clear purpose?\n\n- Does the viewer gain value, clarity, or connection?\n\n- If you're showing a result is it framed as Point A → Point B with a timeframe?\n\n- Is every claim backed by proof? (a screenshot, dashboard or payment)\n\nThe CTA\n\n- Is there only ONE clear CTA, with a simple [KEYWORD] to reply?\n\n- Is the DM CTA connected to Manychat and working?\n\nThe Cadence\n\n- Is this a different sequence type to what you posted yesterday?\n\n- Are you still within 1-2 CTAs this week (and one hard CTA per month max)?\n\n## YouTube Video Launch Sequences\n\n.YOUTUBE VIDEO LAUNCH. .STORY SEQUENCES.\n\n.GOH CONSULTING.\n\nGoal: generate maximum awareness and direct as much traffic from IG to YT when a long form video is posted\n\nOverview\n\nThere are 3 Main Story Sequences you should run when launching a YouTube Video. The sequence you choose is dependent on the format of the video.\n\nHere’s a breakdown of the 3 Sequences:\n\n- Pain Point Callout\n\n- FREE Resource\n\n- Client Case Study\n\n1. Pain Point Callout\n\nSlide 1 - Limiting Belief\n\nThe aim is to address the limiting belief, call out the pain point and go against the grain.\n\nExample\n\n“The biggest mistake I see people make is posting niche content to a specific audience. If there's one piece of advice I can give you, NEVER niche down. It kills your reach and the algorithm will never push your content to the right people.\"\n\nSlide 2 - Proof\n\nAttach the value to a result to build credibility and give people a reason to listen. Show a screenshot, either a personal result, payment dashboard or client result.\n\nNote: when sharing client results always mention where they were before working with you (Point A) versus where they are after working with you (Point B) and show proof\n\nSlide 3 - CTA\n\nDouble down on the outcome: \"by changing the way he built his brand, he went from $7.5k/mo to $312k cash collected in 90 days\"\n\nDirect the audience to YouTube: \"go watch the entire transformation, breaking everything down step by step.\"\n\nDM CTA as the backup capture (reply [KEYWORD] for the link → Manychat → setter).\n\n![Embedded image](../assets/08/kix_3m2qyzi3sl8u.png)\n\n2. FREE Resource\n\nSlide 1 - Mission Statement\n\nShowcase your goal and mission, backed by proof that you're achieving it.\n\nExample\u000b“4 months ago I started working with SooWei and we set out on a mission to scale to $1m/mo. Since then we've generated over 25,000 qualified followers and scaled to a record $408k in our first full month together. Now it's our goal to help as many others do the same.\"\n\nSlide 2 - Client Results\n\nStack proof from multiple clients in different markets. For each result showcase: Point A vs. Point B, the mechanism, the outcome and proof.\n\nThe aim is to make the transformation extremely clear while showcasing exactly how we’ve helped them to achieve it.\n\nSlide 3 - CTA\n\nOffer the exclusive free resource while creating scarcity.\n\nExample\n\nExclusivity: \"I hosted a 60-minute group call inside our community breaking down the exact workflow that makes numbers like this possible.\"\n\nScarcity: \"I'm giving it to the first 10 people who reply with [KEYWORD]\" — limited spots × timeframe.\n\nThen include your DM CTA\n\n![Embedded image](../assets/08/kix_eg259otir89d.png)\n\n3. Client Case Study\n\nSlide 1 - Summarise the Transformation\n\nCompare their current situation (where were they when they joined the program) vs dream outcome (where are they now) the timeframe and an open loop.\n\nExample\n\n“Wyatt went from $7k to $105k cash collected / 9k followers to 27k followers / 35% close rate to 100% close rate / all in a span of 30 days… so what did he do?\"\n\nSlide 2-4 - Overview of Changes\n\nEach slide should: appeal to a different pain point, explain WHAT you did and WHY, hint at your fulfilment structure and provide proof.\n\nStructure: Problem → Solution → Outcome\n\nExample\n\nSlide 2: Positioning: \"we dialled in his positioning\" → wider TOF hooks → wider TAM → more ICP leads → tripled following.\n\nSlide 3: Conversion infrastructure: \"we built the conversion infrastructure\" → a system that booked leads faster, more value in the DMs, problem-aware leads, a repeatable B2B process → packed calendars.\n\nSlide 5 - CTA\n\n\"I just filmed a 45-minute video breaking down step-by-step exactly how we did this…\"\n\nDM CTA → \"reply [KEYWORD] and I'll send it to you\"\n\n![Embedded image](../assets/08/kix_eas3ad9mi5zp.png)\n\nWhen to use\n\nEach sequence should be used depending on the format of the long form video posted. Here’s a breakdown of which formats required which sequence.\n\n- Pain Point Callout: Solution Specific Videos\n\n- FREE Resource: Group Calls / Mastermind Recordings\n\n- Client Case Study: Client Interview / 1-1 Client Business Breakdown\n\nExamples of Pain Point Callout Videos\n\n[https://www.youtube.com/watch?v=ZSMbBhpn13Q](https://www.youtube.com/watch?v=ZSMbBhpn13Q)\n\n[https://www.youtube.com/watch?v=deS3tmWUXpQ&t=52s](https://www.youtube.com/watch?v=deS3tmWUXpQ&t=52s)\n\nExamples of Free Resource Videos\n\n[https://www.youtube.com/watch?v=xRDV9129xjw&t=1s](https://www.youtube.com/watch?v=xRDV9129xjw&t=1s)\n\n[https://www.youtube.com/watch?v=Va3AAHANFkM&t=23s](https://www.youtube.com/watch?v=Va3AAHANFkM&t=23s)\n\nExamples of Client Case Study Videos\n\n[https://www.youtube.com/watch?v=STbx_jgCwnU&t=2s](https://www.youtube.com/watch?v=STbx_jgCwnU&t=2s)\n\n[https://www.youtube.com/watch?v=XurJSWZ-U6E&t=258s](https://www.youtube.com/watch?v=XurJSWZ-U6E&t=258s)\n\nQuick checklist\n\nRun this before you post a Sequence. Every answer should be yes.\n\n- Have I identified the video type and chosen the matching sequence?\n\n- Is my entry slide leading with proof or a limiting belief?\n\n- Does each middle slide have its own distinct piece of proof?\n\n- Am I giving direction and withholding the full how?\n\n- Is the featured client's starting point relatable and their result desirable?\n\n- Is there exactly one clear DM keyword, easy to type?\n\n- Is Manychat set to that keyword and deliver the correct asset?\n\n- Does the setter know the sequence is live and what to follow up on?\n"},{"badge":"09","group":"content","section":"Long-Form","title":"YouTube Video Launch Story Sequences","description":"Story sequences to launch and promote a new YouTube video.","status":"archived","format":"pdf","sourceUrl":"https://gohconsulting.app/sops/youtube-launch-story-sequences.pdf","portalUrl":"https://gohconsulting.app/sops?sop=09","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# YouTube Video Launch Story Sequences\n\n- Source: https://gohconsulting.app/sops/youtube-launch-story-sequences.pdf\n- Category: content / Long-Form\n- Captured: 2026-09-21T14:02:01.271240+00:00\n\n\n### Page 1\n\n.YOUTUBE  VIDEO  LAUNCH. .STORY  SEQUENCES.  \n.GOH  CONSULTING\n.\n  Goal:  generate  maximum  awareness  and  direct  as  much  trafﬁc  from  IG  to  YT  when  \na\n \nlong\n \nform\n \nvideo\n \nis\n \nposted\n  \nOverview\n \nThere  are  3  Main  Story  Sequences  you  should  run  when  launching  a  YouTube  Video.  \nThe\n \nsequence\n \nyou\n \nchoose\n \nis\n \ndependent\n \non\n \nthe\n \nformat\n \nof\n \nthe\n \nvideo.\n \n  Here’s  a  breakdown  of  the  3  Sequences:   -  Pain  Point  Callout  -  FREE  Resource  -  Client  Case  Study   \n1.\n \nP ain\n \nP oint\n \nCallout\n \n Slide  1  -  Limiting  Belief  The  aim  is  to  address  the  limiting  belief,  call  out  the  pain  point  and  go  against  the  \ngrain.\n  Example  “The  biggest  mistake  I  see  people  make  is  posting  niche  content  to  a  speciﬁc  \naudience.\n \nIf\n \nthere's\n \none\n \npiece\n \nof\n \nadvice\n \nI\n \ncan\n \ngive\n \nyou,\n \nNEVER\n \nniche\n \ndown.\n \nIt\n \nkills\n \nyour\n \nreach\n \nand\n \nthe\n \nalgorithm\n \nwill\n \nnever\n \npush\n \nyour\n \ncontent\n \nto\n \nthe\n \nright\n \npeople.\"\n  Slide  2  -  Proof  \n\n### Page 2\n\nAttach  the  value  to  a  result  to  build  credibility  and  give  people  a  reason  to  listen.  \nShow\n \na\n \nscreenshot,\n \neither\n \na\n \npersonal\n \nresult,\n \npayment\n \ndashboard\n \nor\n \nclient\n \nresult.\n  Note:  when  sharing  client  results  always  mention  where  they  were  before  working  \nwith\n \nyou\n \n(Point\n \nA)\n \nversus\n \nwhere\n \nthey\n \nare\n \nafter\n \nworking\n \nwith\n \nyou\n \n(Point\n \nB)\n \nand\n \nshow\n \nproof\n  Slide  3  -  CTA  Double  down  on  the  outcome:  \"by  changing  the  way  he  built  his  brand,  he  went  \nfrom\n \n$7.5k/mo\n \nto\n \n$312k\n \ncash\n \ncollected\n \nin\n \n90\n \ndays\"\n  Direct  the  audience  to  YouTube:  \"go  watch  the  entire  transformation,  breaking  \neverything\n \ndown\n \nstep\n \nby\n \nstep.\"\n  DM  CTA  as  the  backup  capture  (reply  [KEYWORD]  for  the  link  →  Manychat  →  setter).   \n  \n\n\n### Page 3\n\n2.\n \nFREE\n \nResource\n \n Slide  1  -  Mission  Statement  Showcase  your  goal  and  mission,  backed  by  proof  that  you're  achieving  it.   Example  \n“4\n \nmonths\n \nago\n \nI\n \nstarted\n \nworking\n \nwith\n \nSooWei\n \nand\n \nwe\n \nset\n \nout\n \non\n \na\n \nmission\n \nto\n \nscale\n \nto\n \n$1m/mo.\n \nSince\n \nthen\n \nwe've\n \ngenerated\n \nover\n \n25,000\n \nqualiﬁed\n \nfollowers\n \nand\n \nscaled\n \nto\n \na\n \nrecord\n \n$408k\n \nin\n \nour\n \nﬁrst\n \nfull\n \nmonth\n \ntogether.\n \nNow\n \nit's\n \nour\n \ngoal\n \nto\n \nhelp\n \nas\n \nmany\n \nothers\n \ndo\n \nthe\n \nsame.\"\n  Slide  2  -  Client  Results  Stack  proof  from  multiple  clients  in  different  markets.  For  each  result  showcase:  \nPoint\n \nA\n \nvs.\n \nPoint\n \nB,\n \nthe\n \nmechanism,\n \nthe\n \noutcome\n \nand\n \nproof.\n  The  aim  is  to  make  the  transformation  extremely  clear  while  showcasing  exactly  \nhow\n \nwe’ve\n \nhelped\n \nthem\n \nto\n \nachieve\n \nit.\n  Slide  3  -  CTA  Offer  the  exclusive  free  resource  while  creating  scarcity.    Example  Exclusivity:  \"I  hosted  a  60-minute  group  call  inside  our  community  breaking  down  \nthe\n \nexact\n \nworkﬂow\n \nthat\n \nmakes\n \nnumbers\n \nlike\n \nthis\n \npossible.\"\n  Scarcity:  \"I'm  giving  it  to  the  ﬁrst  10  people  who  reply  with  [KEYWORD]\"  —  limited  \nspots\n \n×\n \ntimeframe.\n  Then  include  your  DM  CTA   \n\n### Page 4\n\n  \n3.\n \nClient\n \nCase\n \nStudy\n \n Slide  1  -  Summarise  the  Transformation  Compare  their  current  situation  (where  were  they  when  they  joined  the  program)  \nvs\n \ndream\n \noutcome\n \n(where\n \nare\n \nthey\n \nnow)\n \nthe\n \ntimeframe\n \nand\n \nan\n \nopen\n \nloop.\n  Example  “Wyatt  went  from  $7k  to  $105k  cash  collected  /  9k  followers  to  27k  followers  /  35%  \nclose\n \nrate\n \nto\n \n100%\n \nclose\n \nrate\n \n/\n \nall\n \nin\n \na\n \nspan\n \nof\n \n30\n \ndays…\n \nso\n \nwhat\n \ndid\n \nhe\n \ndo?\"\n  Slide  2-4  -  Overview  of  Changes  Each  slide  should:  appeal  to  a  different  pain  point,  explain  WHAT  you  did  and  WHY,  \nhint\n \nat\n \nyour\n \nfulﬁlment\n \nstructure\n \nand\n \nprovide\n \nproof.\n  Structure:  Problem  →  Solution  →  Outcome  \n\n\n### Page 5\n\n Example  Slide  2:  Positioning:  \"we  dialled  in  his  positioning\"  →  wider  TOF  hooks  →  wider  TAM  →  \nmore\n \nICP\n \nleads\n \n→\n \ntripled\n \nfollowing.\n  Slide  3:  Conversion  infrastructure:  \"we  built  the  conversion  infrastructure\"  →  a  \nsystem\n \nthat\n \nbooked\n \nleads\n \nfaster,\n \nmore\n \nvalue\n \nin\n \nthe\n \nDMs,\n \nproblem-aware\n \nleads,\n \na\n \nrepeatable\n \nB2B\n \nprocess\n \n→\n \npacked\n \ncalendars.\n  Slide  5  -  CTA  \"I  just  ﬁlmed  a  45-minute  video  breaking  down  step-by-step  exactly  how  we  did  \nthis…\"\n DM  CTA  →  \"reply  [KEYWORD]  and  I'll  send  it  to  you\"   \n \nW hen\n \nto\n \nuse\n \nEach  sequence  should  be  used  depending  on  the  format  of  the  long  form  video  \nposted.\n \nHere’s\n \na\n \nbreakdown\n \nof\n \nwhich\n \nformats\n \nrequired\n \nwhich\n \nsequence.\n  \n\n\n### Page 6\n\n-  Pain  Point  Callout:  Solution  Speciﬁc  Videos  -  FREE  Resource:  Group  Calls  /  Mastermind  Recordings  -  Client  Case  Study:  Client  Interview  /  1-1  Client  Business  Breakdown   Examples  of  Pain  Point  Callout  Videos  https://www.youtube.com/watch?v=ZSMbBhpn13Q https://www.youtube.com/watch?v=deS3tmWUXpQ&t=52s  Examples  of  Free  Resource  Videos  https://www.youtube.com/watch?v=xRDV9129xjw&t=1s https://www.youtube.com/watch?v=Va3AAHANFkM&t=23s  Examples  of  Client  Case  Study  Videos  https://www.youtube.com/watch?v=STbx_jgCwnU&t=2s https://www.youtube.com/watch?v=XurJSWZ-U6E&t=258s   \nQuick\n \nchecklist\n \n Run  this  before  you  post  a  Sequence.  Every  answer  should  be  yes.   ●  Have  I  identiﬁed  the  video  type  and  chosen  the  matching  sequence?  ●  Is  my  entry  slide  leading  with  proof  or  a  limiting  belief?  ●  Does  each  middle  slide  have  its  own  distinct  piece  of  proof?  ●  Am  I  giving  direction  and  withholding  the  full  how?  ●  Is  the  featured  client's  starting  point  relatable  and  their  result  desirable?  ●  Is  there  exactly  one  clear  DM  keyword,  easy  to  type?  ●  Is  Manychat  set  to  that  keyword  and  deliver  the  correct  asset?  ●  Does  the  setter  know  the  sequence  is  live  and  what  to  follow  up  on?    \n"},{"badge":"22","group":"content","section":"Long-Form","title":"Client Value Interview","description":"A client interview disguised as a value video — map their journey on camera and teach the direction, not the how.","status":"archived","format":"pdf","sourceUrl":"https://gohconsulting.app/sops/client-value-interview.pdf","portalUrl":"https://gohconsulting.app/sops?sop=22","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Client Value Interview\n\n- Source: https://gohconsulting.app/sops/client-value-interview.pdf\n- Category: content / Long-Form\n- Captured: 2026-09-21T14:02:01.835226+00:00\n\n\n### Page 1\n\n.CLIENT  VALUE  \nINTERVIEW.  \n.GOH  CONSULTING\n.\n  Goal:  Give  you  our  exact  process  for  creating  a  powerful  sales  asset  that  will  move  \nviewers\n \nto\n \na\n \nbuying\n \nstate\n \nwithout\n \nbeing\n \nsold\n \nto.\n \nPerfect\n \nfor\n \nturning\n \ncold\n \nprospects\n \ninto\n \nready\n \nto\n \nbuy\n \nstate\n \nfast.\n  \nW hat\n \nthis\n \nis\n \nA  sit-down  conversation  where  you  walk  a  client  back  through  their  actual  journey  \nin\n \nthe\n \nprogram,\n \nstart\n \nto\n \nﬁnish.\n \nThe\n \njourney\n \nis\n \nmapped\n \non\n \na\n \nvisual\n \nmiro\n \nboard\n \nyou\n \npresent\n \ntogether\n \non\n \ncamera,\n \nand\n \nevery\n \nlesson\n \nis\n \ndesigned\n \nto\n \nteach\n \nthe\n \nviewer\n \na\n \nlesson\n \nand\n \nprove\n \nthe\n \ntransformation\n \nwith\n \nreal\n \nevidence.\n  Examples:   -  Emma  Value  Interview -  Wyatt  Value  Interview  In  short,  this  is  a  client  interview  disguised  as  a  value  video  to  get  more  views  and  \nattention\n  The  whole  format  rests  on  one  rule:  give  the  viewer  the  direction,  not  the  how.  You  tell  them  where  to  go.  You  show  enough  of  the  how  to  prove  you  know  what  \nyou\n \nare\n \ndoing.\n \nBut\n \nyou\n \nhold\n \nthe\n \nfull\n \nhow\n \ninside\n \nthe\n \nprogram.\n \nThat\n \ngap\n \nis\n \nwhat\n \nmakes\n \nthe\n \nvideo\n \nboth\n \nvaluable\n \nand\n \nmagnetic.\n  \n\n### Page 2\n\n   \nW hy\n \nit\n \nm atters\n \nMost  client  interviews  are  selﬁsh.  They  are  built  around  the  idea  of  why  someone  \nshould\n \nwork\n \nwith\n \nyou,\n \nand\n \nthat\n \nonly\n \nlands\n \nwith\n \na\n \nbottom-of-funnel\n \nviewer\n \nwho\n \nis\n \nready\n \nto\n \nbuy.\n \nEveryone\n \nearlier\n \nin\n \nthe\n \nbuyer's\n \njourney\n \ntunes\n \nout,\n \nbecause\n \nthe\n \nvideo\n \ngives\n \nthem\n \nnothing\n \nthey\n \ncan\n \nuse.\n \n  \n Client  interviews  always  tank  in  views,  feels  salesy,  and  not  suitable  for  a  main  \nchannel\n \nvideo\n  \n\n\n### Page 3\n\nThe  Client  Value  Interview  ﬂips  that.  Because  every  decision  you  go  through  \nteaches\n \na\n \nreal\n \nlesson,\n \nit\n \npulls\n \nthe\n \ntop\n \nand\n \nmiddle\n \nof\n \nfunnel\n \nviewers\n \n(the\n \npeople\n \nwho\n \ndo\n \nnot\n \nyet\n \nknow\n \nthey\n \nneed\n \nyou).\n \nThey\n \nget\n \nvalue,\n \nthey\n \ntrust\n \nyou\n \nmore,\n \nand\n \nthey\n \nleave\n \ncurious\n \nabout\n \nthe\n \npart\n \nyou\n \ndid\n \nnot\n \nshow\n \nthem.\n \n  -  Direction  without  the  how  is  what  makes  this  video  effective.  It  creates  \nthe\n \npull\n \ninstead\n \nof\n \npushing\n \nthe\n \nsale.\n  Example:  Wyatt’s  video  teaches  the  viewer  that  going  broad  beats  going  niche,  that  \nyou\n \nbuild\n \nthe\n \nbrand\n \nbefore\n \nyou\n \nlead\n \nwith\n \nvalue,\n \nand\n \nthat\n \ncontent\n \ncompounds.\n \nA\n \nviewer\n \ncan\n \nact\n \non\n \nall\n \nof\n \nthat\n \ntoday\n \nwithout\n \nbuying\n \nanything.\n \nBut\n \nthe\n \nexact\n \nsystem\n \nstays\n \ninside\n \nthe\n \nprogram,\n \nso\n \nthe\n \nviewer\n \nwho\n \nwants\n \nthe\n \nhow\n \nhas\n \nonly\n \none\n \nplace\n \nto\n \nget\n \nit.\n  \nW hen\n \nto\n \nuse\n \nthis\n \nUse  this  when  you  want  to  reach  the  viewer  who  already  senses  you  are  good  at  \nwhat\n \nyou\n \ndo\n \nbut\n \ndoes\n \nnot\n \nyet\n \nunderstand\n \nexactly\n \nhow\n \nyou\n \nwould\n \nhelp\n \nthem.\n \nThat\n \nviewer\n \nis\n \nwarm\n \nbut\n \nnot\n \nsold.\n \nThey\n \ndo\n \nnot\n \nneed\n \nmore\n \nproof\n \nthat\n \nyou\n \nexist.\n \nThey\n \nneed\n \n\n\n### Page 4\n\nto  see  the  path,  mapped  on  someone  like  them,  so  they  can  picture  themselves  on  \nit.\n  -  When  not  to  use  it.  Do  not  use  this  format  to  close  a  bottom-of-funnel  \naudience\n \nthat\n \nis\n \nalready\n \ndeciding,\n \nthey\n \nwant\n \nspeciﬁcs\n \nand\n \noffer\n \ndetail,\n \nnot\n \na\n \njourney\n \nstory\n   \nBefore\n \nyou\n \nstart\n \nConﬁrm  all  of  the  following  are  in  place  before  you  book  a  ﬁlming  date:  -  A  featured  client  who  meets  all  four  selection  criteria  and  has  agreed  to  \nappear.\n -  Their  real  journey  mapped  out:  the  key  sessions,  the  turning  points,  the  \nactions\n \nthey\n \ntook,\n \nand\n \nthe\n \nnumbers.\n -  A  built  journey  board.  Do  not  ﬁlm  without  it.  -  Wyatt  Example -  The  real  proof  for  every  claim  you  plan  to  make:  screenshots,  stats,  earnings,  \nview\n \ncounts,\n \netc\n -  The  client  briefed  and  pre-framed.  -  A  ﬁlming  setup   \nStep\n \nby\n \nStep\n \nP rocess\n \nGoal  of  this  section:  produce  an  interview  where  every  lesson  teaches  a  direction  \nand\n \nproves\n \nthe\n \ntransformation,\n \nwhile\n \nstill\n \nfeeling\n \nlike\n \na\n \ngenuine\n \nconversation\n \nStep  1:  Choose  the  right  client  to  feature  \nThe  client  makes  or  breaks  the  video.  Choose  someone  who  meets  all  four  of  these   1.  They  achieved  a  transformation  your  audience  actively  wants.  The  end  state  \nhas\n \nto\n \nbe\n \na\n \nresult\n \nyour\n \nideal\n \nviewer\n \ndreams\n \nabout.\n \n\n### Page 5\n\n2.  They  started  where  your  audience  starts.  This  is  the  one  people  underrate.  \nThe\n \nviewer\n \nbuys\n \nin\n \nbecause\n \nthe\n \nclient\n \nbegan\n \nexactly\n \nwhere\n \nthey\n \nare\n \nnow.\n \nRelatability\n \nis\n \nthe\n \nhook.\n 3.  The  change  was  drastic  and  clearly  came  from  the  program.  A  vague  or  \nmodest\n \nshift\n \ndoes\n \nnot\n \ncarry\n \na\n \nlong-form\n \nvideo.\n 4.  They  can  hold  a  natural,  detailed  conversation  on  camera.  If  they  freeze  or  \ngive\n \none-line\n \nanswers,\n \nit\n \nturns\n \ninto\n \na\n \nboring\n \nvideo\n \nand\n \nloses\n \nthe\n \nviewer\n  Pick  the  starting  line  as  carefully  as  the  ﬁnish.  The  result  is  what  they  want.  The  \nstarting\n \npoint\n \nis\n \nwhy\n \nthey\n \nbelieve\n \nit\n \nis\n \npossible\n \nfor\n \nthem.\n   -  Example:  Wyatt  started  with  no  team,  working  12  hours  per  day,  content  not  \nlanding,\n \nwhich\n \nis\n \nexactly\n \nwhere\n \na\n \nstruggling\n \ncoach\n \nsits.\n \nHe\n \nwent\n \nto\n \nthree\n \nstraight\n \nsix-ﬁgure\n \nmonths.\n \nRelatable\n \nstart,\n \ndream\n \nﬁnish,\n \nand\n \nhe\n \ncould\n \ntalk.\n \n    \nStep  2:  Brief  the  team  and  build  the  journey  board  \nThe  journey  board  is  the  visual  you  present  on  camera  and  the  loose  script  for  the  \nconversation.\n \nIt\n \ndoes\n \nboth\n \njobs\n \nat\n \nonce.\n  You/  your  CSM  gives  the  Production  Team  the  context:  the  transformation,  the  \nsessions\n \nthe\n \nclient\n \nwent\n \nthrough,\n \nthe\n \nmoments\n \nthings\n \nchanged,\n \nand\n \nthe\n \nresults.\n \nThey\n \nbuild\n \nthe\n \nboard\n \nas\n \na\n \nleft-to-right\n \ntimeline\n \nof\n \nthe\n \nclient’s\n \nreal\n \njourney.\n  -  You  can  easily  use  Claude  to  scrape  all  the  data  from  the  Fathom  call,  ask  the  \nclient\n \nwhat\n \nthey\n \nfeel\n \nlike\n \nwere\n \nthe\n \nthree\n \nbiggest\n \nchanges,\n \nand\n \nbuild\n \nthe\n \nboard\n \naround\n \nthat\n  \n\n### Page 6\n\nThe  board  is  different  for  every  client.  There  is  no  ﬁxed  template.  What  stays  \nconstant\n \nis\n \nthe\n \nlogic:\n \nyou\n \nare\n \nmapping\n \nthe\n \nclient’s\n \nreal\n \njourney\n \nas\n \na\n \nteaching\n \ntimeline.\n \nBuild\n \nit\n \nfrom\n \nthese\n \ncard\n \ntypes:\n  -  Transformation  header:  A  simple  chart  of  the  numbers  over  time,  so  the  \npayoff\n \nis\n \nvisible\n \nfrom\n \nthe\n \nﬁrst\n \nsecond.\n \nFor\n \nWyatt:\n \n$7k\n \nin\n \nJanuary,\n \nthen\n \n$105k,\n \nthen\n \n$95k,\n \nthen\n \n$112.5k\n \nprojected.\n  \n  -  Starting  state:  The  pain  that  the  viewer  is  facing  as  well.  For  Wyatt:  no  team,  \ncannot\n \nleverage\n \ncontent,\n \n$7k\n \na\n \nmonth,\n \nno\n \nmomentum,\n \ndrowning.\n  \n  -  Intervention  chains:  This  is  the  heart  of  the  board.  For  each  turning  point,  lay  \nout\n \na\n \nshort\n \nchain:\n \nSession\n \n(the\n \ncall\n \nor\n \ntouchpoint),\n \nto\n \nInsight\n \n(the\n \ndirection\n \n\n\n### Page 7\n\ngiven),  to  Action  (what  the  client  did),  to  Result  (what  happened),  with  a  \npiece\n \nof\n \nproof\n \nattached.\n  \n  -  Proof:  A  real  screenshot  hung  on  the  relevant  beat:  a  post,  an  earnings  ﬁgure,  \na\n \nview\n \ncount,\n \nfollower\n \nand\n \nideal-client-follower\n \nstats,\n \na\n \nreposted\n \nstory.\n  \n  -  Closing  state:  Where  they  are  now,  and  their  vision  for  what  comes  next.   \n\n\n### Page 8\n\n  Map  the  journey  as  a  chain  of  Session,  Insight,  Action,  Result,  Proof.  That  structure  is  \nwhat\n \nlets\n \nthe\n \nviewer\n \nfollow\n \nthe\n \npath\n \nand\n \nbelieve\n \nit\n \nat\n \nthe\n \nsame\n \ntime.\n \n  We  map  this  on  Miro,  a  visual  whiteboard,  because  it  presents  cleanly  on  screen  \nand\n \nlets\n \nyou\n \nwalk\n \nthe\n \ntimeline\n \nleft\n \nto\n \nright\n  \nStep  3:  Gather  the  proof  for  every  claim  \nGoal:  make  every  claim  in  the  video  undeniable.   For  each  lesson  you  plan  to  hit,  pull  the  real  evidence:  screenshots  of  the  client’s  \nposts,\n \ntheir\n \nearnings\n \ndashboard,\n \nview\n \ncounts,\n \nfollower\n \nand\n \nideal-client-follower\n \nnumbers,\n \nindividual\n \nvideo\n \nperformance,\n \ndirect\n \nmessages,\n \nreposts.\n  Get  these  from  the  client  directly  and  from  your  own  records  and  past  call  \nrecordings.\n \nThe\n \nEditor\n \nlays\n \neach\n \none\n \non\n \nscreen\n \nat\n \nthe\n \nmatching\n \nmoment,\n \nso\n \nthe\n \n\n\n### Page 9\n\nviewer  sees  the  proof  exactly  as  the  client  describes  it.  A  claim  with  a  screenshot  \n
