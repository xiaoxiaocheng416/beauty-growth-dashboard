ion]\tList + Gender Hook\t\nWhat people don't realize about being [insert character trait]... \tThis is why I don't [Insert action]\t\nThe best [insert action] you can do in your [insert age range]\tGender + Relationship Hook\t\nList Hooks\tList Hooks\tList Hooks\n3 ways to [make incredible thing happen]…\t[Insert number] things every guy should do before [Insert age bracket]\t\nMy top 7 [insert anything]…\tList Hook\t\n3 [insert thing, \"books\", \"movies\", etc] that changed my life…\tThese are my [Insert number] favorite [Insert anything]\t\n5 signs you should [action]\tList Hook\t\n3 ways to get [solution] fast..\t[Insert number] things every guy should do in their [Insert age bracket]\t\n[specific #] things about [niche] I wish I knew earlier\tThere are [Insert number] things you need to come to terms with in life [insert things] \t\nHere’s [#] underestimated [hack/tip/trick]\tThere are [Insert number] things you need to accept about [Insert topic]\t\n[#] things that feel illegal to know\t[Insert number] things that should happen to your before you're [Insert age]\t\nMy top 7 tips on [valuable topic that is rare / hard to accomplish]\t[Insert number] you shouldn't do after you finish [Insert action]\t\nThe 1 thing you need to know about [insert topic]\tList Hook\t\nMoney Hooks\tMoney Hooks\tMoney Hooks\nHow I made [$ specific dollar amount] doing [insert action]\tMoney is [insert belief about money and justify it]\t\nThis 1 mistake could be costing you [insert $ amount]\tWhat it takes for you to get [Insert dream] in [Insert time frame]\t\nRules about money I regret not knowing sooner [insert rules]\tQuestion + Money Hook\t\nHow to make [insert specific $ amount] in [insert time frame]\tStory + Money + Celebrity Hook\t\nWant to make more money? Stop [insert action]\tAge + Money + Story Hook\t\nWhy I pay [insert specific $ amount] for [insert anything]\tI recommend [insert action]\t\nIf you're just getting started in [insert niche] do this to earn more money [insert advice]\tWant to make more money? Stop [insert action]\t\nMoney is [insert belief about money and justify it]\tMoney (Sales Tip) Hook\t\nThe best investment you can make is [insert your favorite/best investment and why]\tQuestion + Money Hook\t\nIf you're broke, stop [insert action] and do this instead [insert action]\tWhy I pay [insert specific $ amount] for [insert anything]\t\nRelationship Hooks\tRelationship Hooks\tRelationship Hooks\nI wish I knew [insert anything] before getting maried \tWhen I was single, I would [insert anything]\t\nWhen I was single, I would [insert anything]\tQuestion + Relationship Hook\t\nWhen you break up, do this [insert advice]\tRelationship Hook\t\nPick up lines to use if you're single that work every time [insert pick up lines]\tYour [boyfriend/girlfriend] dumped you, [insert action]\t\nOne time my buddy and I [insert story]\tIf he/she can [Insert action] you need to [Insert action]\t\nHow to approach [person, man, woman, celeb, etc], [insert method]\tWhen you break up, do this [insert advice]\t\nIf you're going to have a long term relationship, you better [insert action]\tRelationship Hook\t\nHow to become friends with anyone [insert advice]\tQuestion + Relationship Hook\t\nBefore you start dating, make sure you [insert advice]\tRelationship Hook\t\nThis is the easiest way to meet new people [insert method]\tStory + Relationship Hook\t\n"},{"badge":"33","group":"content","section":"Platform","title":"New Meta Restrictions","description":"What Meta now restricts, and how to keep content inside the lines.","status":"content_archived","format":"","sourceUrl":"https://docs.google.com/document/d/1WjZlUTTYZn-DM8h3MJUDdlMach5Wev_3S7p63IqTdbM/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=33","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# New Meta Restrictions\n\n- Source: https://docs.google.com/document/d/1WjZlUTTYZn-DM8h3MJUDdlMach5Wev_3S7p63IqTdbM/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n.NEW META RESTRICTIONS.\n\n.GOH CONSULTING.\n\nGoal: lower the chances of your account getting flagged or restricted by the new Meta AI by following the steps in this SOP\n\nOverview\n\nMeta laid off hundreds of employees in their security sector and are implementing a new AI system to take down accounts which are flagged for spam or fraud.\n\nThey’re currently running an aggressive enforcement wave across the coaching, consulting and info space. Accounts are being restricted and permanently removed within hours, often with no warning and no successful appeal.\n\nMost of the bans we’ve seen are not caused by anything unusual. They’re caused by normal sales behaviour done inside the DMs: sending payment links, asking financial qualifying questions, and messaging people who don’t follow you.\n\nHere are 7 steps to avoid your account getting restricted:\n\n1. Payment in the DMs\n\nThis is the single fastest way to lose an account.\n\n- Never send a payment link in a DM: not Stripe, not PayPal, not a checkout page, not an invoice.\n\n- Never ask for money in the DMs: no deposits, no “send it over and I’ll get you started”.\n\n- Never send payment details: bank details, crypto wallets, payment handles.\n\nWhere payment happens instead:\n\n- On the call, screen-shared, with the client checking out live while you stay on Zoom.\n\n- Via email, sent from your business email address immediately after the call.\n\n- Via your CRM or contract tool (PandaDoc, DocuSign, HubSpot, GHL) which sends its own link.\n\nOn the call, tell them: “I’ll send everything over by email. Leep an eye on your inbox in the next 5 minutes.”\n\nThen confirm in the DM with no link and no numbers: “Just sent it across, let me know once you’ve got it.”\n\n2. Qualification Process\n\nFinancial qualifying language in DMs is being flagged automatically. That includes asking how much money someone has, what they can invest, or what they earn.\n\nThe rule: no currency symbols, no figures, no direct questions about someone’s finances.\n\nDON’T SAY | SAY INSTEAD\n\n“Do you have $5k to invest?” | “Are you in a position to move forward if it’s the right fit?”\n\n“What’s your budget for this?” | “Have you set aside resources for solving this?”\n\n“How much are you making per month?” | “Where are you at with the business right now?”\n\n“The programme is £4,000” | “I’ll walk you through how it works on the call.”\n\n“Can you afford it?” | “Is this something you’re ready to commit to?”\n\n“I can do a payment plan of 3 x £997” | “There are a couple of options: I’ll cover them on the call.”\n\nPricing, plans and figures are call conversations or email conversations. Never DM conversations.\n\n3. Sending Links\n\n- Never send the same link into multiple chats within the same hour. Repeated identical links across conversations is one of the strongest ban signals right now.\n\n- Space links out. Treat one link every 20–30 minutes as a ceiling, and only into conversations where the person has actively replied.\n\n- Vary the delivery. Where you must share something, alternate between DM, email, and “check my bio” rather than pasting the same URL repeatedly.\n\n- Assume link-sending can be revoked at any time. Accounts are being restricted from sending links entirely, which also breaks “link in bio” calls to action. Build a fallback route now (email capture, call booking on the phone, a second team account).\n\n- Never send a link to someone who hasn’t replied to you first.\n\n4. Cold Outreach\n\nMessaging people who don’t follow you is being banned very quickly. Volume outreach to cold accounts is currently the highest-risk activity on the platform.\n\n- Prioritise inbound: reply to story replies, comments, and people who DM you first.\n\n- Warm the lead before you message: they should have followed you, replied to a story, or engaged with a post.\n\n- Keep outreach volume low and human. Long gaps between messages, varied wording, no copy-paste blocks.\n\n- Never send the same opener word-for-word to multiple people.\n\n- If someone doesn’t reply, do not follow up more than twice.\n\n5. Turn Off Automation\n\nAutomated DM tools (ManyChat and similar) are being caught in this wave, especially where automations send links or sales language.\n\n- Audit every automation now: keyword triggers, story reply flows, comment-to-DM flows.\n\n- Turn off any flow that sends a link, a price, or sales language.\n\n- Keep only soft, conversational flows: and even then, run them at low volume.\n\n- Do not run bulk sends, mass DMs, or any third-party growth tool.\n\n6. Account Hygiene\n\n- Post consistently: dormant accounts that suddenly start DMing get flagged faster.\n\n- Don’t log in from multiple devices or locations on the same day.\n\n- Don’t use VPNs while running the account.\n\n- Enable two-factor authentication and make sure the recovery email and phone number are current and accessible.\n\n- Keep a backup account warm (posting occasionally, following your audience) so you’re not starting from zero if the main one goes.\n\n- Back up your content library and your DM lead list outside of Instagram: a CRM or a spreadsheet.\n\n7. If you get Restricted\n\n- Stop all DM activity immediately. Don’t test the limit: further activity escalates the restriction.\n\n- Appeal once through the in-app prompt. Keep it short and factual. Don’t submit repeat appeals.\n\n- Move active conversations to email or phone using contact details you already hold.\n\n- Keep posting normally: content activity generally isn’t what triggers these restrictions.\n\n- Wait out the restriction period before resuming outreach: then resume at roughly half your previous volume.\n"},{"badge":"34","group":"content","section":"Long-Form","title":"Master Client Interview","description":"The master document for running a client interview end to end.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1tz_IajUUlqMSLSewg5VPAt14RnUhFFUEbR-KqZQvvLA/edit?tab=t.0#heading=h.t77lmh1shudg","portalUrl":"https://gohconsulting.app/sops?sop=34","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Master Client Interview\n\n- Source: https://docs.google.com/document/d/1tz_IajUUlqMSLSewg5VPAt14RnUhFFUEbR-KqZQvvLA/edit?tab=t.0#heading=h.t77lmh1shudg\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### .MASTER CLIENT INTERVIEW SOP.\n\n#### Universal Framework + Niche-Specific Question Banks\n\nYour client's words are your most powerful marketing. This is how you extract gold from every interview.\n\n### PART 1: UNIVERSAL INTERVIEW STRUCTURE\n\n#### Works for Any Niche - YouTube Long-Form\n\n##### TIMING BREAKDOWN (30-40 Minutes Total)\n\nPHASE 1: THE HOOK (0-2 min) - 5%\n\nPHASE 2: THE BEFORE (3-8 min) - 20%\n\nPHASE 3: THE DECISION (9-14 min) - 20%\n\nPHASE 4: THE TRANSFORMATION (15-25 min) - 30%\n\nPHASE 5: LIFE IMPACT (26-32 min) - 15%\n\nPHASE 6: THE CTA (33-40 min) - 10%\n\n#### PHASE 1: THE HOOK (0-2 MINUTES)\n\nPurpose: Grab attention with shocking transformation + identity\n\n##### UNIVERSAL QUESTIONS:\n\nQ1: \"For those who don't know you, who are you and what do you do?\"\n\n- Extract: Name, niche, current status\n\nQ2: \"What's the transformation you made working together?\"\n\n- Extract: Before number → After number (make it shocking)\n\n- Example: \"$12K to $113K in 6 months\"\n\nQ3: \"How does it feel hitting [X milestone]?\"\n\n- Extract: Raw emotion, disbelief, gratitude\n\n- Listen for: \"unbelievable\", \"surreal\", \"never thought\"\n\n#### PHASE 2: THE BEFORE STATE (3-8 MINUTES)\n\nPurpose: Paint visceral pain - make them relive the struggle\n\n##### UNIVERSAL QUESTIONS:\n\nQ4: \"Take me back to [X months] ago. What was your day-to-day reality like?\"\n\n- Extract: Specific details, time commitments, frustration\n\n- Push for: \"What did a typical day look like?\"\n\nQ5: \"What were you struggling with most? What kept you up at night?\"\n\n- Extract: Identity-level pain, not surface frustration\n\n- Listen for: Fear, uncertainty, imposter syndrome\n\nQ6: \"How long had you been dealing with this problem?\"\n\n- Extract: Timeline of suffering, failed attempts\n\n- Push for: \"What had you tried before that didn't work?\"\n\nQ7: \"What did you think was the root cause back then?\"\n\n- Extract: False beliefs you'll reframe later\n\n- Listen for: Limiting mindsets, misdiagnosis\n\nQ8: \"Was there a specific moment where you hit rock bottom or said 'enough is enough'?\"\n\n- Extract: Emotional breaking point - GOLD for hooks\n\n- Push for: Specific incident, conversation, realization\n\nQ9: \"If nothing changed, where would you be today?\"\n\n- Extract: Nightmare scenario - agitation fuel\n\n- Listen for: Lost opportunities, regret, fear\n\n#### PHASE 3: THE DECISION (9-14 MINUTES)\n\nPurpose: Understand buying psychology + objection handling\n\n##### UNIVERSAL QUESTIONS:\n\nQ10: \"How did you first hear about me/the program?\"\n\n- Extract: Traffic source validation (YouTube, IG, referral)\n\n- Listen for: What made them stop scrolling\n\nQ11: \"What made you stop scrolling and actually pay attention?\"\n\n- Extract: Hook effectiveness, pattern interrupt\n\n- Listen for: Relatability, credibility triggers\n\nQ12: \"What was going through your mind when you were deciding whether to join?\"\n\n- Extract: Objections, hesitations, doubts\n\n- Push for: \"What almost stopped you?\"\n\nQ13: \"What finally pushed you over the edge to say yes?\"\n\n- Extract: The REAL close (usually emotional, not logical)\n\n- Listen for: Moment of conviction, leap of faith\n\nQ14: \"Did you have any doubts or fears right before you paid?\"\n\n- Extract: Last-minute objections to address in marketing\n\n- Listen for: Money fears, time commitment, skepticism\n\nQ15: \"Looking back, was there anything that almost stopped you from joining?\"\n\n- Extract: Friction points in sales process\n\n- Listen for: External influences (friends, family), price\n\n#### PHASE 4: THE TRANSFORMATION (15-25 MINUTES)\n\nPurpose: This is the MEAT - milk every detail\n\n##### UNIVERSAL QUESTIONS:\n\nQ16: \"Walk me through the first 30 days. What changed immediately?\"\n\n- Extract: Quick wins, momentum builders\n\n- Listen for: Aha moments, immediate shifts\n\nQ17: \"What was the biggest 'aha moment' you had early on?\"\n\n- Extract: Pattern interrupts, mindset shifts\n\n- Push for: Specific realization, paradigm shift\n\nQ18: \"What result or breakthrough surprised you most?\"\n\n- Extract: Unexpected benefits (use in bullets)\n\n- Listen for: \"I didn't expect...\", \"I thought... but actually...\"\n\nQ19: \"Can you give me a specific example of a win you had?\"\n\n- Extract: Story-based proof, numbers, tangible outcomes\n\n- Push for: Client testimonials, revenue jumps, time saved\n\nQ20: \"Walk me through the numbers - where did you start and where are you now?\"\n\n- Extract: Exact before/after metrics\n\n- Push for: Monthly breakdown if possible\n\nQ21: \"What was the biggest problem we solved for you?\"\n\n- Extract: Core transformation driver\n\n- Listen for: Systems, mindset, team, strategy\n\nQ22: \"What changed in your business systems/processes?\"\n\n- Extract: Tactical improvements (delegation, KPIs, team)\n\n- Listen for: Specific frameworks implemented\n\nQ23: \"If you could go back and talk to yourself [X months] ago, what would you say?\"\n\n- Extract: Reframing, wisdom nuggets\n\n- Listen for: Advice they wish they knew\n\n#### PHASE 5: LIFE IMPACT (26-32 MINUTES)\n\nPurpose: Beyond money - identity transformation\n\n##### UNIVERSAL QUESTIONS:\n\nQ24: \"How did this change your day-to-day life?\"\n\n- Extract: Lifestyle transformation (time, freedom, stress)\n\n- Listen for: Sleep quality, relationships, health\n\nQ25: \"What do people around you notice that's different now?\"\n\n- Extract: Social proof, external validation\n\n- Push for: Family reactions, friend comments\n\nQ26: \"How did your [parents/partner/family] react when you told them about [X result]?\"\n\n- Extract: Emotional validation stories\n\n- Listen for: Pride, disbelief, support\n\nQ27: \"What's now possible for you that wasn't before?\"\n\n- Extract: Expanded identity, new opportunities\n\n- Listen for: Future vision, bigger goals\n\nQ28: \"Where do you see yourself in the next 6-12 months?\"\n\n- Extract: Vision, next-level goals\n\n- Listen for: Conviction, ambition, clarity\n\n#### PHASE 6: THE CTA (33-40 MINUTES)\n\nPurpose: Close with social proof + direct call-to-action\n\n##### UNIVERSAL QUESTIONS:\n\nQ29: \"If someone's watching this and they're where you were [X months] ago, what would you tell them?\"\n\n- Extract: Direct CTA from peer (removes your selling)\n\n- Listen for: Urgency, conviction, advice\n\nQ30: \"Knowing what you know now, what do you wish you'd done sooner?\"\n\n- Extract: Urgency drivers, regret avoidance\n\n- Listen for: \"I should have...\", \"Don't wait...\"\n\nQ31: \"What's your favorite part about [the program/working together]?\"\n\n- Extract: Unique value props, differentiators\n\n- Listen for: Community, 1-on-1s, support, network\n\nQ32: \"If you had to tell someone on the fence about joining, what would you say?\"\n\n- Extract: Final objection handling\n\n- Listen for: ROI, investment mindset, life-changing\n\nQ33: \"Where can people find you?\"\n\n- Extract: Social handles, brand name\n\n- Format: \"You can find me at @[handle] on Instagram, YouTube, TikTok\"\n\n### PART 2: RAPID-FIRE REEL STRUCTURE\n\n#### (60-90 Second Instagram/TikTok Format)\n\n##### THE 5-QUESTION FORMULA:\n\nQ1: \"In one sentence — where were you [X months] ago?\"\n\n- Target Answer: 10-15 seconds\n\n- Example: \"I was broke, burned out, making $6K/month and ready to quit.\"\n\nQ2: \"What was the moment you decided enough was enough?\"\n\n- Target Answer: 10-15 seconds\n\n- Example: \"When I realized I was working 60 hours a week and barely surviving.\"\n\nQ3: \"What changed after joining [program]?\"\n\n- Target Answer: 15-20 seconds\n\n- Example: \"I got systems, I hired a team, and I tripled my revenue in 30 days.\"\n\nQ4: \"What's different about your life now?\"\n\n- Target Answer: 10-15 seconds\n\n- Example: \"I work 4 hours a day, I'm present with family, and I'm on track for 50K months.\"\n\nQ5: \"What would you tell someone who's hesitating?\"\n\n- Target Answer: 10-15 seconds\n\n- Example: \"Stop overthinking. The only thing between you and results is action.\"\n\n##### EDITING BLUEPRINT:\n\n0:00-0:05 → HOOK (text overlay of shocking stat)\n\n0:05-0:15 → PAIN (Q1 answer)\n\n0:15-0:30 → DECISION (Q2 answer)\n\n0:30-0:50 → TRANSFORMATION (Q3 + Q4)\n\n0:50-0:60 → CTA (Q5 answer + \"Link in bio\")\n\n### PART 3: NICHE-SPECIFIC QUESTION BANKS\n\n#### NICHE #1: FITNESS COACHING\n\n##### CLIENT EXAMPLES FROM TRANSCRIPTS:\n\n- Trey Howe: Former D1 football player, $15K → $45K/month\n\n- Jaden: $500/month → $10K/month\n\n##### NICHE-SPECIFIC QUESTIONS (Add to Universal Framework):\n\n###### BEFORE STATE - FITNESS SPECIFIC:\n\n- \"What was your relationship with training/your body like before?\"\n\n- \"What diet or program had you tried that didn't work?\"\n\n- \"When did you realize it wasn't just about calories/workouts?\"\n\n- \"How did your athletic background shape your approach?\"\n\n- \"What made you want to help others transform?\"\n\n###### TRANSFORMATION - FITNESS SPECIFIC:\n\n- \"What's changed physically? Mentally? Emotionally?\"\n\n- \"What can you do now that you couldn't do 6 months ago?\"\n\n- \"How has your relationship with training evolved?\"\n\n- \"What's your typical workout week look like now?\"\n\n- \"How do you balance coaching with your own training?\"\n\n###### RESULTS EXTRACTION - FITNESS SPECIFIC:\n\n- \"How many clients are you working with now vs before?\"\n\n- \"What's your average client transformation timeline?\"\n\n- \"What results are your clients seeing?\"\n\n- \"How has your delivery/coaching style improved?\"\n\n- \"What's your retention rate like now?\"\n\n###### IDENTITY HOOKS - FITNESS SPECIFIC:\n\n- Division 1 athlete background\n\n- Natural physique advocate\n\n- Blue-collar work ethic (trades, concrete work)\n\n- Discipline from sports\n\n- Overcoming injury (ACL stories)\n\n#### NICHE #2: UGC CREATORS / CONTENT COACHES\n\n##### CLIENT EXAMPLE FROM TRANSCRIPTS:\n\n- Andrew Shin: Laid off corporate → $12K → $113K/month UGC coach\n\n##### NICHE-SPECIFIC QUESTIONS:\n\n###### BEFORE STATE - UGC SPECIFIC:\n\n- \"How did you discover UGC?\"\n\n- \"What was your corporate job like before?\"\n\n- \"When did you realize you needed to escape the 9-5?\"\n\n- \"What made you think UGC could be a real business?\"\n\n- \"How big was your following when you started?\"\n\n###### TRANSFORMATION - UGC SPECIFIC:\n\n- \"What's different about your UGC approach vs others?\"\n\n- \"How did you scale your following?\"\n\n- \"What's your content creation process now?\"\n\n- \"How many creators have you helped transform?\"\n\n- \"What brands are your students working with?\"\n\n###### RESULTS EXTRACTION - UGC SPECIFIC:\n\n- \"What's your biggest following metric? (X followers)\"\n\n- \"How many UGC videos do you create per month?\"\n\n- \"What's your average brand deal rate?\"\n\n- \"How many students have you helped land their first brand deal?\"\n\n- \"What's the fastest someone went from 0 to paid UGC work?\"\n\n###### \n\n###### IDENTITY HOOKS - UGC SPECIFIC:\n\n- Corporate burnout story\n\n- Asian household breaking traditional path\n\n- Largest male UGC following\n\n- Got laid off → blessing in disguise\n\n- From paycheck-to-paycheck to 6-figures/month\n\n#### NICHE #3: TECH CAREER COACHING\n\n##### CLIENT EXAMPLE FROM TRANSCRIPTS:\n\n- Iman Musa: $6-8K/month → $50K/month (on track)\n\n##### NICHE-SPECIFIC QUESTIONS:\n\n###### BEFORE STATE - TECH SPECIFIC:\n\n- \"What made you want to help people break into tech?\"\n\n- \"How did you figure out the tech job market?\"\n\n- \"What's the biggest misconception about landing tech jobs?\"\n\n- \"What was your own journey into tech like?\"\n\n###### TRANSFORMATION - TECH SPECIFIC:\n\n- \"What's different about your approach vs other career coaches?\"\n\n- \"How do you help complete beginners transition?\"\n\n- \"What's the typical timeline for your students?\"\n\n- \"What types of tech roles are your students landing?\"\n\n###### RESULTS EXTRACTION - TECH SPECIFIC:\n\n- \"How many students have you helped land tech jobs?\"\n\n- \"What's the average salary increase your students see?\"\n\n- \"What companies are your students getting hired at?\"\n\n- \"What's your student success rate?\"\n\n- \"How long does it take on average to land their first role?\"\n\n###### IDENTITY HOOKS - TECH SPECIFIC:\n\n- Career transitioner specialist\n\n- Remote lifestyle advocate (location + financial freedom)\n\n- Tech industry insider (knows the game)\n\n- Young entrepreneur (19 years old crushing it)\n\n- Help people escape dead-end jobs\n\n#### NICHE #4: BUSINESS COACHING / CONSULTING\n\n##### UNIVERSAL FOR THIS NICHE (Based on Patterns):\n\n##### NICHE-SPECIFIC QUESTIONS:\n\n###### BEFORE STATE - BUSINESS SPECIFIC:\n\n- \"What was your monthly revenue when we started?\"\n\n- \"What was your biggest bottleneck - leads, sales, or fulfillment?\"\n\n- \"What offers were you running that weren't converting?\"\n\n- \"How many clients were you working with?\"\n\n- \"What did your team look like?\"\n\n###### TRANSFORMATION - BUSINESS SPECIFIC:\n\n- \"What's your revenue now?\"\n\n- \"What changed in your systems?\"\n\n- \"How much time are you saving per week?\"\n\n- \"How has your team grown?\"\n\n- \"What's your profit margin now vs before?\"\n\n###### RESULTS EXTRACTION - BUSINESS SPECIFIC:\n\n- \"Revenue increase (before → after)\"\n\n- \"Client count (before → after)\"\n\n- \"Time saved per week\"\n\n- \"Team size growth\"\n\n- \"Lifestyle improvements (vacations, flexibility)\"\n\n###### IDENTITY HOOKS - BUSINESS SPECIFIC:\n\n- Solo operator → team leader\n\n- Hustler → strategist\n\n- Brute forcing → systems-driven\n\n- Working IN business → working ON business\n\n#### NICHE #5: E-COMMERCE / PRODUCT BUSINESS\n\n##### NICHE-SPECIFIC QUESTIONS:\n\n###### BEFORE STATE - ECOM SPECIFIC:\n\n- \"What products were you selling when you started?\"\n\n- \"What was your biggest challenge - traffic, conversions, or fulfillment?\"\n\n- \"How were you sourcing/creating products?\"\n\n- \"What was your average order value?\"\n\n- \"What platforms were you selling on?\"\n\n###### TRANSFORMATION - ECOM SPECIFIC:\n\n- \"What's your monthly revenue now?\"\n\n- \"How has your product line evolved?\"\n\n- \"What's your conversion rate now vs before?\"\n\n- \"How did your fulfillment process change?\"\n\n- \"What's your customer acquisition cost now?\"\n\n###### RESULTS EXTRACTION - ECOM SPECIFIC:\n\n- \"Monthly revenue (before → after)\"\n\n- \"Average order value increase\"\n\n- \"Conversion rate improvement\"\n\n- \"Customer lifetime value\"\n\n- \"Number of SKUs/products\"\n\n#### NICHE #6: REAL ESTATE COACHING\n\n##### NICHE-SPECIFIC QUESTIONS:\n\n###### BEFORE STATE - REAL ESTATE SPECIFIC:\n\n- \"How many deals were you closing per month?\"\n\n- \"What was your biggest struggle - leads, conversions, or systems?\"\n\n- \"What was your average commission?\"\n\n- \"How were you generating leads?\"\n\n- \"What was your close rate?\"\n\n###### TRANSFORMATION - REAL ESTATE SPECIFIC:\n\n- \"What's your close rate now?\"\n\n- \"How many deals are you closing monthly?\"\n\n- \"What's your average commission now?\"\n\n- \"How has your lead generation changed?\"\n\n- \"What does your pipeline look like?\"\n\n###### RESULTS EXTRACTION - REAL ESTATE SPECIFIC:\n\n- \"Deals closed per month (before → after)\"\n\n- \"Average commission (before → after)\"\n\n- \"Lead flow consistency\"\n\n- \"Database size growth\"\n\n- \"Referral rate increase\"\n\n#### NICHE #7: MUSIC PRODUCTION / CREATIVE SERVICES\n\n##### NICHE-SPECIFIC QUESTIONS:\n\n###### BEFORE STATE - MUSIC/CREATIVE SPECIFIC:\n\n- \"What was holding you back from posting consistently?\"\n\n- \"What were you most afraid of in your creative process?\"\n\n- \"How were you finding clients/opportunities?\"\n\n- \"What was your pricing like?\"\n\n###### TRANSFORMATION - MUSIC/CREATIVE SPECIFIC:\n\n- \"What changed in your creative process?\"\n\n- \"How has your workflow evolved?\"\n\n- \"What results have you seen since going all-in?\"\n\n- \"What's your posting frequency now?\"\n\n###### RESULTS EXTRACTION - MUSIC/CREATIVE SPECIFIC:\n\n- \"Posting frequency increase\"\n\n- \"Engagement rate growth\"\n\n- \"Follower count\"\n\n- \"Income from content/services\"\n\n- \"Brand deals / opportunities\"\n\n#### NICHE #8: RELATIONSHIP COACHING\n\n##### NICHE-SPECIFIC QUESTIONS:\n\n###### BEFORE STATE - RELATIONSHIP SPECIFIC:\n\n- \"What was your relationship dynamic like before?\"\n\n- \"What were you fighting about most?\"\n\n- \"When did you realize you needed outside help?\"\n\n- \"What had you tried to fix things?\"\n\n###### TRANSFORMATION - RELATIONSHIP SPECIFIC:\n\n- \"What shifted first - communication, intimacy, or trust?\"\n\n- \"What does a typical week look like for you two now?\"\n\n- \"How has your conflict resolution changed?\"\n\n- \"What do your friends/family notice?\"\n\n###### RESULTS EXTRACTION - RELATIONSHIP SPECIFIC:\n\n- \"Communication quality improvement\"\n\n- \"Conflict resolution speed\"\n\n- \"Intimacy/connection improvements\"\n\n- \"Shared goals alignment\"\n\n- \"External validation (friends/family noticing)\"\n\n### PART 4: ADVANCED INTERVIEW TECHNIQUES\n\n#### TECHNIQUE #1: CONTRAST AMPLIFICATION\n\nCreate stark before → after differences\n\n##### HOW TO USE:\n\nAlways set up the \"before\" then immediately contrast with \"after\"\n\nExamples:\n\n- \"So back then you were making $3K/month working 60 hours...\"\n\n- [PAUSE]\n\n- \"And now you're at $20K working 20 hours. How does that feel?\"\n\nPattern:\n\n\"Back then you were [PAINFUL BEFORE]...\"\n\n[PAUSE - let it sink in]\n\n\"And now you're [AMAZING AFTER]. [EMOTIONAL QUESTION]\"\n\n#### TECHNIQUE #2: EMOTIONAL EXTRACTION\n\nGo deeper when answers are surface-level\n\n##### HOW TO USE:\n\nWhen they give generic answers, drill down to specific feelings\n\nBad Answer: \"Yeah, it was tough.\"\n\nYour Follow-Up: \"Help me understand what 'tough' felt like. Like... what were you thinking about at 2 AM when you couldn't sleep?\"\n\nPattern:\n\nGeneric answer → \"Help me understand what [EMOTION] felt like...\"\n\n→ \"What were you [SPECIFIC SCENARIO]?\"\n\nMore Examples:\n\n- \"Paint me a picture of what a typical day looked like...\"\n\n- \"Take me to that moment when you realized...\"\n\n- \"What was going through your head when...\"\n\n#### TECHNIQUE #3: IDENTITY TRANSFORMATION TRACKING\n\nHighlight who they BECAME, not just what they achieved\n\n##### HOW TO USE:\n\nPoint out changes in how they carry themselves, speak, think\n\nExamples:\n\n- \"The [NAME] sitting in front of me today is completely different from [X months] ago...\"\n\n- \"Even the way you carry yourself now... it's night and day\"\n\n- Your dad treats you like a grown man now, not a boy. How does that feel?\"\n\nPattern:\n\n\"I notice [IDENTITY SHIFT]... when did that change for you?\"\n\n#### TECHNIQUE #4: SOCIAL PROOF EXTRACTION\n\nGet third-party validation stories\n\n##### HOW TO USE:\n\nAsk about what OTHER PEOPLE noticed/said\n\nExamples:\n\n- \"What do people around you notice that's different?\"\n\n- \"How did your [mom/dad/partner/friend] react when you told them?\"\n\n- \"What did [SPECIFIC PERSON] say about your transformation?\"\n\nPattern:\n\n\"What did [SPECIFIC PERSON] say/notice about [TRANSFORMATION]?\"\n\n#### TECHNIQUE #5: OBJECTION REVERSAL\n\nUse past objections as teaching moments\n\n##### HOW TO USE:\n\nBring up their old doubts and contrast with current reality\n\nExamples:\n\n- \"You didn't think you could hit 50K... what changed your mind?\"\n\n- \"You almost refunded in the first week... what made you stay?\"\n\n- \"You were comfortable at 20K... what pushed you to scale?\"\n\nPattern:\n\n\"You used to [OLD LIMITING BELIEF]...\n\nwhat made you realize [NEW EMPOWERING BELIEF]?\"\n\n#### TECHNIQUE #6: THE NIGHTMARE SCENARIO\n\nPaint what would have happened if they didn't change\n\n##### HOW TO USE:\n\nAsk them to imagine the alternate timeline\n\nExamples:\n\n- \"If nothing changed, where would you be today?\"\n\n- \"What would your life look like if you didn't join?\"\n\n- \"Fast forward 5 years doing what you were doing - where does that lead?\"\n\nPattern:\n\n\"If [NEGATIVE SCENARIO], where would you be [TIME FRAME]?\"\n\n#### TECHNIQUE #7: THE MONEY REFRAME\n\nExtract lessons about investment mindset\n\n##### HOW TO USE:\n\nGet them to talk about ROI, investment vs expense\n\nExamples:\n\n- \"You invested [X amount] - how do you look at that now?\"\n\n- \"What made you realize money spent on growth isn't lost?\"\n\n- \"When did you stop being attached to the money in your bank?\"\n\nPattern:\n\n\"How did your relationship with [MONEY/INVESTMENT] change?\"\n\n### PART 5: PRE-INTERVIEW CHECKLIST\n\n#### SEND THIS TO CLIENT 24-48 HOURS BEFORE:\n\nHey [NAME],\n\nPumped for our interview [DAY/TIME]!\n\nQuick heads up on what to expect:\n\nPURPOSE:\n\nThis isn't about me or my program. This is about YOUR transformation.\n\nWe're documenting your story to inspire others who are where you were.\n\nFORMAT:\n\n- 30-40 minutes\n\n- Conversational (not scripted)\n\n- I'll ask questions that make you remember the journey\n\nWHAT TO BRING:\n\n- Good energy\n\n- Specific examples/numbers (we'll talk results)\n\n- Raw honesty (the messier the before, the more powerful the after)\n\nMINDSET:\n\nBe yourself. Be real. The best interviews are unfiltered.\n\nTechnical Setup:\n\n- Good lighting (natural light or ring light)\n\n- Clean background\n\n- Quality mic (even iPhone earbuds work)\n\n- Stable internet\n\nSee you soon!\n\n[YOUR NAME]\n\n#### DAY-OF CHECKLIST:\n\n##### BEFORE INTERVIEW:\n\n[ ] Review their transformation stats (before/after numbers) [ ] Review their niche/offer [ ] Review any DMs/testimonials they sent [ ] Prepare 3-5 custom questions based on their unique story [ ] Test recording equipment [ ] Have water nearby [ ] Set timer for 40 minutes\n\n##### DURING INTERVIEW:\n\n[ ] Record video + audio separately (backup) [ ] Take notes on best quotes [ ] Mark timestamps for key moments [ ] Watch their energy - match it [ ] Go deeper on good answers (don't rush) [ ] Get specific numbers/dates/examples\n\n##### AFTER INTERVIEW:\n\n[ ] Get their social handles [ ] Ask for any screenshots/testimonials [ ] Ask for 2-3 referrals (warm leads) [ ] Send thank you message [ ] Tag them when video goes live\n\n### PART 6: COMMON MISTAKES TO AVOID\n\n#### DON'T DO THIS:\n\n- Don't ask yes/no questions\n\n- BAD: \"Did you like the program?\"\n\n- \"What's your favorite part about the program?\"\n\n- Don't talk more than client\n\n- Your job: Ask → Listen → Extract\n\n- Not: Talk → Sell → Pitch\n\n- Don't accept surface-level answers\n\n- When they say \"it was good\" → drill deeper\n\n- \"Help me understand what 'good' meant for you...\"\n\n- Don't skip the emotion\n\n- Numbers are proof, emotion is persuasion\n\n- Always ask \"How did that feel?\"\n\n- Don't rush through transformation phase\n\n- This is 30% of the interview (15-25 min mark)\n\n- Milk every detail here\n\n- Don't forget the contrast\n\n- Always compare before → after\n\n- \"You were X... now you're Y... wild, right?\"\n\n- Don't skip social proof\n\n- \"What did your mom say?\"\n\n- \"What did people notice?\"\n\n- Third-party validation > self-reported\n\n- Don't end without clear CTA\n\n- \"Where can people find you?\"\n\n- \"What would you tell someone on the fence?\"\n\n### INTERVIEW FRAMEWORK SUMMARY\n\nHOOK (2 min)\n\n↓\n\nBEFORE STATE - Paint the pain (6 min)\n\n↓\n\nDECISION - Why they joined (5 min)\n\n↓\n\nTRANSFORMATION - The journey (10 min)\n\n↓\n\nLIFE IMPACT - Beyond money (6 min)\n\n↓\n\nLESSONS - What they learned (5 min)\n\n↓\n\nPROGRAM VALUE - What they loved (4 min)\n\n↓\n\nCTA - Advice to others (2 min)\n\nTotal: 40 minutes of pure gold\n\n### IMPLEMENTATION GUIDE\n\nYou now have:\n\n- Universal structure (works for any niche)\n\n- 8 niche-specific question banks\n\n- 60-second reel formula\n\n- 7 advanced extraction techniques\n\n- Pre-interview checklist\n\n- Common mistakes to avoid\n\nThese interviews will become your most powerful marketing assets. Use this framework to extract authentic transformation stories that convert prospects into clients.\n"},{"badge":"46","group":"content","section":"Story","title":"Testimonial Collection SOP","description":"How to actually collect testimonials, and what to ask for.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/11XgozJb1TN7AV7Oks80AHhYHVoEIYrCiU2rX95NdL7g/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=46","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Testimonial Collection SOP\n\n- Source: https://docs.google.com/document/d/11XgozJb1TN7AV7Oks80AHhYHVoEIYrCiU2rX95NdL7g/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### .Testimonial Collection SOP.\n\nApplies to: All active DWY and DFY clients, any stage of the program\n\n#### The Core Rule\n\nYou never ask for a testimonial when things are neutral. You only ask when the client is at an emotional peak. A record month. A big close. Their first paid speaking gig. The moment they finally cracked something they had been stuck on for weeks.\n\nIf the emotion isn't high, the testimonial will be flat. Flat testimonials don't convert. Wait for the spike.\n\n#### How to Spot the Moment\n\nWatch for any of the following in calls, DMs, or community posts:\n\n- Client mentions their best month or a new revenue record\n\n- They close a deal bigger than anything before\n\n- They report inbound leads from content for the first time\n\n- They say something like \"I never thought this would work this fast\"\n\n- They hit a milestone they mentioned wanting during onboarding\n\nWhen you see it, move within 24 hours. The window closes fast.\n\n#### Step 1: Celebrate First, Ask Second\n\nSend this or a close variation. Do not lead with the ask.\n\n\"Hey [Name], congrats on [specific achievement]. That is a big deal. Going to keep helping you build on this, let me know what you need from our side.\"\n\nWait for them to respond. Once they do:\n\n\"Also, if you ever have a minute, we would love to get a short testimonial from you. Would be sick to celebrate this properly and it genuinely helps us out a lot.\"\n\nKeep it casual. You are not begging. You are giving them a chance to be featured.\n\n#### Step 2: Once They Say Yes\n\nSend this immediately. Do not let the momentum die.\n\n\"Perfect, here is a simple structure you can follow. Keep it under 60 seconds, phone camera is totally fine, just find decent lighting and somewhere quiet.\n\nIntro — who are you, what do you do Before — what you were doing or making before the program After—where you are now Problems — what you were struggling with that brought you in  Thoughts—honestly, how much did this actually help you Close — whatever you want to say\n\nJake Seals just did one for us recently, you can use his as a reference: \u000b\u000bhttps://drive.google.com/file/d/14YbcQnOT8XQlZxABPeZvjNPi6zEhCVNV/view?usp=drive_link\"\n\n#### Step 3: The Follow-Up\n\nIf they said yes and you have not received it within 5 days, send one follow-up:\n\n\"Hey [Name], just a quick nudge on the testimonial. No pressure at all, just want to make sure you have everything you need.\"\n\nIf no response after that, drop it. You never push twice past the first follow-up. It kills the relationship and the quality of what you would get anyway.\n\n#### What a Good Testimonial Needs\n\nAt minimum, the video should hit:\n\n- A specific number (revenue before, revenue after, or a clear metric)\n\n- A real problem they had that others in your ICP will recognize\n\n- A genuine moment of credit that does not sound scripted\n\nIf the video does not have a number in it, follow up and ask if they can mention one. Something like: \"Would you be able to drop in a quick figure, even roughly? It helps people relate to the result.\"\n\n#### \n\n#### Timing by Program Stage\n\nStage | When to Ask\n\nWeeks 1-4 | Only if they have hit an unusually fast result and are openly excited\n\nMonth 2-3 | After their first clear win or progress milestone\n\nMonth 4+ (DWY) | After a record month or significant breakthrough\n\nMonth 4-6 (DFY) | Same as above, or right before renewal conversations begin\n\nPost-program | Any time they report a result tied back to the work done\n\nThe program stage does not matter as much as the emotional state. A client at week 6 who just had their best month is a better testimonial candidate than a client at month 5 who is coasting.\n\n#### Storage and Tracking\n\nLog every testimonial request in the CRM under the client's contact record. Tag it with one of three statuses:\n\n- Requested — ask sent, waiting\n\n- Received — video in hand\n\n- Passed — client declined or did not follow up\n\nSend all received videos to the Content Director within 24 hours of receipt for processing and storage.\n"},{"badge":"85","group":"content","section":"Strategy","title":"How to Master POV","description":"Miro board on POV - what you stand for and how it shows up in the content.","status":"link_only","format":"html","sourceUrl":"https://miro.com/app/board/uXjVJF3hFoc=/?share_link_id=1375048243","portalUrl":"https://gohconsulting.app/sops?sop=85","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# SOP 85 · How to Master POV\n\n[打开原始公开链接](https://miro.com/app/board/uXjVJF3hFoc=/?share_link_id=1375048243)\n\n- 栏目：content / Strategy\n- [SOP 门户入口](https://gohconsulting.app/sops?sop=85)\n- Miro 实际名称：Aura\n\nMiro board on POV - what you stand for and how it shows up in the content.\n\n按用户要求保留公开链接，作为本 SOP 的阅读入口。此链接需要联网打开。\n\n本地未保存来源的完整正文。\n"},{"badge":"86","group":"content","section":"Strategy","title":"Ideation, Storytelling, Scripting","description":"Miro board walking ideation through to a finished script.","status":"screenshot_partial","format":"html","sourceUrl":"https://miro.com/app/board/uXjVJgAqugc=/?share_link_id=734863742841","portalUrl":"https://gohconsulting.app/sops?sop=86","original":"","text":"","sourceDir":"supplements/86_How_to_Master_TOF","screenshotCount":6,"body":"# How to Master TOF · Ideation, Storytelling, Scripting\n\n- 门户条目：SOP 86 — Ideation, Storytelling, Scripting。\n- 白板名称：how to master TOF。\n- [打开原始 Miro 白板](https://miro.com/app/board/uXjVJgAqugc=/?share_link_id=734863742841) · [打开 SOP 门户](https://gohconsulting.app/sops?sop=86)。\n- 来源：用户提供的 6 张截图；截图原文件已复制到本文配套的 `images/` 目录。\n- 范围：仅覆盖截图中可见的区域，不代表整块白板已完整导出。\n- 整理方式：按截图顺序保留原图，再提取英文原文；重叠内容只转录一次。仅调整分段与列表格式，保留原文用词和语法。原图中的缺字方块在明确表示连接符时记为 `-`；模糊、被遮挡或截断的内容不补写。\n- 图中的观点、数字与评论均为原材料转录，未作事实核验；软件界面的注册提示不属于课程正文。\n\n## 1. TOF Not Working / Not Enough New Eyeballs\n\n### 原始截图 01\n\n![截图 01：TOF 问题、Mastering TOF content 与 ICP / DF 示意图](__SOP_ROOT__/supplements/86_How_to_Master_TOF/images/01.png)\n\n### 提取原文\n\n**1. TOF Not Working / Not Enough New Eyeballs**\n\nMany clients report that their top-of-funnel content is not generating reach, failing to attract new followers, or attracting the wrong people.\n\n#### Mastering TOF content\n\n**although we're building a personal brand about ourselves doesn't mean we should be posting everything about our lives**\n\ni.e\n\nif you're selling fitness but you like music doesn't mean you have to make content about playing the guitar or singing a song - it doesn't resonate\n\n#### That is what unintentional content looks like\n\nyou have to make content for your ideal viewers best interest which means you must always relate to the vehicle or end goal that they have\n\nthe reason why content is made unintentionally is because people think that the DF and ICP are the 2 completely different people\n\n**图中文字：**\n\nThey are the same people\n\n| ICP | DF |\n| --- | --- |\n| qualification levels | personal characteristics |\n| financial | beliefs |\n| occupational | interests |\n| | struggles |\n| | passions |\n\n图示关系：ICP 与 DF 两个方框的箭头共同指向上方的同一个人物。\n\nThis is one of the biggest reasons why a lot of you are posting a shit ton of content and you're also not getting the right ICP leads come through or the completely wrong audience is coming through\n\nso when creating TOF content always ask yourself **what will my ideal viewer get from this video?** what type of value will they get that deeply resonates with them?\n\nvalue -> entertainment, insight, resonance, relatability etc\n\n## 2. Why are people not following you?\n\n### 原始截图 02\n\n![截图 02：关注、互动与情绪强度](__SOP_ROOT__/supplements/86_How_to_Master_TOF/images/02.png)\n\n截图上半部的 ICP / DF 图，以及从 “This is one of the biggest reasons…” 到 “value -> entertainment…” 的段落，与截图 01 重叠；原文已收录在上一节。\n\n### 提取原文\n\n#### Even if you're doing this - why are people not following you?\n\nsimple your video doesn't push for engagement\n\nand how do we push for engagement -> capitalise on emotion\n\nhow you measure the value of your video is by how much you make your audience feel something:\n\n- education -> epiphany moment and a extreme sense of progress\n- entertainment -> make them laugh a lot\n\n**情绪刻度图下方文字：**\n\n- 左侧：No emotion your videos are dogshit\n- 右侧：they feel the emotion you intended them to feel strongest\n\nthis stems from understanding our viewers and always putting them first\n\n## 3. Track the data!\n\n### 原始截图 03\n\n![截图 03：观看量、涨粉与 SooWei Goh Reel Analytics 表格](__SOP_ROOT__/supplements/86_How_to_Master_TOF/images/03.png)\n\n### 提取原文\n\n#### Track the data!\n\n| 示例 | 截图中显示的观看量 | 图片下方原文 |\n| --- | --- | --- |\n| 左侧视频 | 251K | this video got 25 followers |\n| 右侧视频 | 15.6K | this video got over 100 followers |\n\nAlthough the hook, the script and the editing make up the video it's not what makes a video good - what makes a good video is whether or not it leaves a genuine lasting impression whether it be:\n\n- Relatable\n- Aggravating\n- Epiphany\n- Excitement\n- Motivated\n- Sadness\n\nThis is because emotions play a huge role in why humans take action - so the way we influence the viewer into making the decision to engage in our video hugely depends on the lasting emotional impression that we leave on the viewer\n\n**you can use this data as a tool to find out how what types of videos bring you the most of followers which will allow you to double down in video idea and formats that brought you the most follows**\n\n**which is why you shouldn't pay attention to the vanity metrics such as views because you can go viral for the wrong reasons -> however this does not mean that views matter as you still need a good amount of reach**\n\n> 转录注：上句 “does not mean that views matter” 按截图保留，没有代为修正其表述。\n\n#### SooWei Goh Reel Analytics\n\n可见表头：Video ID、Link to video、View Count、Followers Gained、Follower per view、Rating、Video Type、Content Type。\n\n下表转录截图中能辨认的 19 行。`Follower per view` 列的单位均为 **followers per 1,000 views**，沿用图中显示值，不重新计算。原图里的视频链接显示不全，未据此拼接 URL；星级图标保留在原图。底部下一行被截断，未收录为完整记录。\n\n| Video ID | View Count | Followers Gained | Followers per 1,000 views | Video Type | Content Type |\n| --- | ---: | ---: | ---: | --- | --- |\n| Mom's reaction to $150k | 677,571 | 5739 | 8.47 | Documentation | TOF |\n| $10k sale in the dessert | 154,181 | 1308 | 8.48 | Sales Call | MOF |\n| Client Testimonial Montage | 29,222 | 157 | 5.37 | Testimonials | MOF |\n| Reason Why I Make Money | 22,843 | 130 | 5.69 | Documentation | TOF |\n| $150k/m university student | 37,204 | 329 | 8.84 | Documentation | TOF |\n| What are my margins | 24,624 | 151 | 6.13 | business | MOF |\n| Is it possible for a 19 year old to make $150k/m | 46,550 | 824 | 17.7 | business | TOF |\n| I'm the only kid in malaysia making $100k/m | 20,368 | 65 | 3.19 | Documentation | TOF |\n| Post your sales calls | 21,293 | 49 | 2.30 | business | MOF |\n| Ideal Lifestyle | 16,803 | 16 | 0.95 | Documentation | TOF |\n| $10k sale and they don't speak english | 16,514 | 81 | 4.91 | Sales Call | MOF |\n| POV: you wanted to prove your dad wrong | 97,355 | 618 | 6.35 | Documentation | TOF |\n| POV: $151k/m entrepreneur explains why you should still go to school | 26,016 | 68 | 2.61 | Documentation | TOF |\n| POV: you spent $5k in the club and instantly regret it | 31,511 | 20 | 0.63 | Documentation | TOF |\n| POV: $151k/m 19 year old explains why buying dream car is stupid | 36,848 | 72 | 1.95 | Documentation | TOF |\n| Do it for the younger you | 26,466 | 20 | 0.76 | Documentation | TOF |\n| pov: studying for university exam | 96,526 | 546 | 5.66 | Documentation | TOF |\n| Free course | 403,822 | 4269 | 10.57 | business | TOF |\n| How I scaled to $151k/m studying in uni | 30,45?（末位不清） | 121 | 3.97 | business | TOF |\n\n> 表格字号较小，以上是截图转录，涉及引用具体数据时以原图为准。它不是对原始分析表的直接导出。\n\n## 4. Pay attention to genuine comments\n\n### 原始截图 04\n\n![截图 04：真实评论示例](__SOP_ROOT__/supplements/86_How_to_Master_TOF/images/04.png)\n\n### 提取原文\n\n#### pay attention to genuine comments\n\n**shotbydcl** · 5 w · 61 likes\n\n> Reading off script is so hard at first fr just reps like anything\n\n**mickey.mindset** · 1 w · 1 like\n\n> Hate using scripts, now I just decide the first line and the concept then wing it 😂\n>\n> But love the transition and music ❤️\n\n**fly_aarons** · 1 d · 2 likes\n\n> He's the reason why i chose to be Asian\n\n**fynnluhdorff** · 4 w · 1 like\n\n> motivational asf to see this transition\n\n**saimzsideo** · 1 d · 3 likes\n\n> once you're running a real operation, the game shifts from ‘how do I get leads?’ to ‘how do I manage the flow?’\n\n**m8183t** · 30 w · 205 likes\n\n> A word of advice.. though I know I may not be in the best position to give it.\n>\n> I agree with your mum. You're doing well with the income you're earning, but the most important thing is to avoid unethical actions, even when money is involved. Often, the hardest things to resist are the immoral temptations that arise once financial success is achieved.\n>\n> Nevertheless, enjoy what you doing. You are a filial son!\n\n**vrajgiri_gosai** · 5 w · 3 likes\n\n> \"Bro, you had the network and mindset that your parents or friends helped you build — that's why you became a millionaire at 16. But think about a boy who lives in the slums and has never even seen a $100 bill. How can he make it? You were lucky. Not everyone has that kind of luck, so don't go around telling everyone, ‘I'm a teenage millionaire’ and all that blah blah blah.\"\n\n**bashrvfx** · 6 w · 3 likes\n\n> going through something similar, and I really appreciate them, if I had been too comfortable, I would never had tried to make money\n\n## 5. How to ideate TOF content\n\n### 原始截图 05\n\n![截图 05：How to ideate TOF content 流程图](__SOP_ROOT__/supplements/86_How_to_Master_TOF/images/05.png)\n\n### 提取原文与箭头关系\n\n#### How to ideate TOF content\n\n主线：**DF → content research → SLA → Implement DF into the idea → execute → rephrase / reframe / reformat → test**。\n\n附加箭头：DF 还直接指向 “Implement DF into the idea”；execute 分别指向 rephrase、reframe、reformat，三个分支再汇入 test。\n\n| 节点 | 下方说明原文 |\n| --- | --- |\n| DF | identify dream follower and marketing angles you can get from them to feed ideas |\n| content research | research outlier videos - don't just pull videos that you think are good - steal proven videos |\n| SLA | don't just copy the video outright - how can you make it better |\n| SLA 下方第二级便签 | get creative - look for inspo outside of your niche |\n| Implement DF into the idea | how can you twist this idea to speak directly to the dream follower - do this and you make content for them |\n| execute | 无额外说明 |\n| rephrase | 无额外说明 |\n| reframe | 无额外说明 |\n| reformat | 无额外说明 |\n| test | 无额外说明 |\n\n> 转录注：截图没有写出 SLA 的全称，本文不自行补充定义。\n\n## 6. Different niche same idea\n\n### 原始截图 06\n\n![截图 06：跨领域创意示例与 Reviewing your TOF content 标题](__SOP_ROOT__/supplements/86_How_to_Master_TOF/images/06.png)\n\n### 提取原文\n\n#### different niche same idea\n\n上方两张视频截图以双向箭头连接；下方两张视频截图也以双向箭头连接。\n\n| 位置 | 可辨认的画面文字／数字 |\n| --- | --- |\n| 左上 | What's the difference? · $5k/m · $25k/m · $50k/m · per · 342K |\n| 右上 | $100 CTA · $1M CTA · stripe · $100.00 · VS · $1,000,000 · 100$ CTA's · 68.6K |\n| 左下 | 6,702 |\n| 右下 | 281.3K |\n\n右上示例的收款卡片还有更小的文字，无法可靠辨认；账号名称被红线遮挡，未转录。画面中的计数只按图中数字记录，不推断其是否属于播放量或点赞量。\n\n#### Reviewing your TOF content\n\n截图只显示这一标题，未提供该部分正文。\n"},{"badge":"87","group":"content","section":"Strategy","title":"Content, competence + workflow","description":"Miro board on the workflow that turns competence into published content.","status":"link_only","format":"html","sourceUrl":"https://miro.com/app/board/uXjVJ7xtUjY=/?share_link_id=406596502745","portalUrl":"https://gohconsulting.app/sops?sop=87","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# SOP 87 · Content, competence + workflow\n\n[打开原始公开链接](https://miro.com/app/board/uXjVJ7xtUjY=/?share_link_id=406596502745)\n\n- 栏目：content / Strategy\n- [SOP 门户入口](https://gohconsulting.app/sops?sop=87)\n- Miro 实际名称：Ideation, Storytelling, Scripting\n\nMiro board on the workflow that turns competence into published content.\n\n按用户要求保留公开链接，作为本 SOP 的阅读入口。此链接需要联网打开。\n\n本地未保存来源的完整正文。\n"},{"badge":"88","group":"content","section":"Funnel","title":"How to get Buyers","description":"Miro board on turning an audience into buyers rather than followers.","status":"link_only","format":"html","sourceUrl":"https://miro.com/app/board/uXjVJmzJMQU=/?share_link_id=553083592865","portalUrl":"https://gohconsulting.app/sops?sop=88","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# SOP 88 · How to get Buyers\n\n[打开原始公开链接](https://miro.com/app/board/uXjVJmzJM ewing a client.","status":"link_only","format":"","sourceUrl":"https://docs.google.com/document/d/13Q1jY8fSxM8_LWZmd0e-v-n1NoYgX-B9qIyXpxZ7n_A/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=102","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# SOP 102 · Client Interview Questions\n\n[打开原始公开链接](https://docs.google.com/document/d/13Q1jY8fSxM8_LWZmd0e-v-n1NoYgX-B9qIyXpxZ7n_A/edit?tab=t.0)\n\n- 栏目：content / Long-Form\n- [SOP 门户入口](https://gohconsulting.app/sops?sop=102)\n\nThe question bank to draw on when interviewing a client.\n\n按用户要求保留公开链接，作为本 SOP 的阅读入口。此链接需要联网打开。\n\n本地未保存来源的完整正文。\n"},{"badge":"32","group":"sales-setting","section":"Workflows","title":"Acquisition Mastery: Workflows","description":"The end-to-end acquisition workflows, start to finish.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/118LGbuncujMKwKglPRQ38E3zAplqGgrMaX22BVySb_0/edit?tab=t.0","portalUrl":"https://gohconsulting.app/sops?sop=32","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Acquisition Mastery: Workflows\n\n- Source: https://docs.google.com/document/d/118LGbuncujMKwKglPRQ38E3zAplqGgrMaX22BVySb_0/edit?tab=t.0\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Workflow\n\nWorkflow\n\nAcquisition Mastery\n\nGoal: Give you a well rounded SOP on the exact workflows each member of your team should be using in order to maintain a high standard and progress efficiently.\n\nWhy Is It Important To Have A Good Workflow: In order to progress team members need to ensure they have time to reflect while maintaining KPIs and high inputs. Likewise as a business owner you need time available to plan for the future of your business while making sure your team is executing. The best business owners have complete control of their sales teams while spending little time a week in the actual training process.\n\nRisks of Poor Workflow: With poor workflow burn out is inevitable. A hard working team member will be completely overwhelmed by KPIs and not last more than a couple months. If you have set KPIs correctly they should require a good workflow to complete without getting burnt out. As a business owner if you do not have an efficient workflow your business will stagnate. Simultaneously if you don’t know what's happening in your sales team because you’ve pulled yourself out too far, your team will begin to miss KPIs and you won’t be able to hold them accountable.\n\nSetter workflow\n\nThe Golden Rule: Workflow should be based on prioritising leads closest to buying\n\nCommon mistakes in setter workflows: Setters see KPIs (outbound, follow up, booked calls) and it's all they think about. They get straight in the DMs and start shooting messages in order to try and get their booking for the day. As a result they miss key leads that are already closer to buying. Their results don’t compound but instead every day their progress resets.\n\nWhat does a good setter workflow look like: A good setter workflow requires them to work down from those who are closest to buying to those who are furthest away. The same way a dialler would work through a smart view from most qualified leads to least, a setter should be doing this in their head.\n\nHow do I help my setter with their workflow: First your setter needs to understand the thought process behind the workflow. Ask them what they believe the correct workflow is. Next explain the concept of leads closest to buying, ask them what leads are closest to buying. Then show them this order.\n\nWorkflow order:\n\n- Pre-call notes\n\n- Cancel DQ calls\n\n- Follow up with booked calls (Postbooking) (set reminders to follow up for the calls)\n\n- Follow up with proposed calls\n\n- Clear inbox\n\n- Clear comments\n\n- Warm outbound\n\n- Follow ups (conversations that weren’t replied to)\n\nNext have them share their screen and go through their day to day and slot each section in.\n\nRules of thumb:\n\n- Prioritise leads closest to buying\n\n- Use their calendar to plan their day and organise themselves\n\nCloser workflow\n\nThe Golden Rule: Workflow should be based on prioritising leads closest to buying. Constant self-review is vital to progress.\n\nCommon mistakes in closer workflows: Many closers take too many calls per day (7+) and as a result have no time to improve. They burn out and they do not have any time for self-review or to join mentorship calls etc.\n\nWhat does a good closer workflow look like: A good closer workflow requires self review and involves communicating with all departments in a business.\n\nWorkflow\n\nMorning:\n\n- Pipeline review - You should have a list of the hottest leads and then use whatsapp business to follow up.\n\n- After following up and confirming calls for the day, check in with setters.\n\n- Next spend 20–30 minutes listening back to previous calls or training on one specific part of your closing calls.\n\nDay:\n\n- During the day the main goal should be being fully present on each call\n\n- Ensure you are updating the CRM immediately after calls, logging objections/patterns for the content side, and sending follow-ups / setting leads that reply\n\nEvening:\n\n- Self review - crunch your numbers (show rate, close rate, data, etc.) followed by a What Went Well and Even Better If that should be sent to the founder.\n\nManager Workflow\n\nGolden Rule: A manager must covering all responsibilities, every day, efficiently\n\nAs we know a manager’s responsibilities can be cut into 6 aspects:\n\n- Training - ensuring reps progress in skill level\n\n- Quality control - ensuring quality of sales is high\n\n- Quantity control - ensuring reps are putting in necessary inputs\n\n- Tracking - ensuring metrics are accurate at all times\n\n- Alignment - ensuring reps are aligned with the offer at all times\n\n- Hiring and firing\n\nOn a day to day we need to account for training, quality and quantity control, tracking and alignment.\n\nWorkflow Musts\n\n- Training: group training calls and conversation review for days with no training.\n\n- Q&Q Control: End of day report review\n\n- Tracking: Dashboard checks\n\n- Alignment: Training calls, morning messages to the team\n\nA good managers workflow example:\n\nFounder Workflow\n\nGolden Rule: With so many different areas to focus on, you need to create focus blocks.\n\nAs far as sales go, this is the only part of the process that you can truly pull yourself out of. Fulfillment will often be tied to your 1-1 time at the highest level to an extent and content needs to be filmed and ideated even with a creative director.\u000b\u000bAs a result, having an efficient workflow in terms of managing the sales side of your business is one of the most effective levers you can pull. Ultimately at the highest level your workflow for sales needs to look like 2 full sales team calls per week.\n\nThat being said, in order for this workflow to be successful and for you to know what is actually happening, you need to structure your team calls properly and have responsibility delegated. As long as your team members are following their designated workflow, your workflow will be simple.\n\nFocus Blocks: Focus blocks is also a method you can use to manage all areas of your business effectively. Sales meetings and anything sales will be portioned off into part of the day, along with content and fulfillment. That way you can effectively focus on one thing at a time.\n"},{"badge":"40","group":"sales-setting","section":"Team","title":"EOD Reporting and KPI Management SOP","description":"End-of-day reporting and the KPIs that actually get managed.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/187j5SwYqVhtf6X8wB-GX10IgETrmondE3UkFB4Znjdo/edit?tab=t.0#heading=h.u2istkjs0omv","portalUrl":"https://gohconsulting.app/sops?sop=40","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# EOD Reporting and KPI Management SOP\n\n- Source: https://docs.google.com/document/d/187j5SwYqVhtf6X8wB-GX10IgETrmondE3UkFB4Znjdo/edit?tab=t.0#heading=h.u2istkjs0omv\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### End-of-Day (EOD) Reporting & KPI Management\n\nVersion: 1.0\n\nPurpose:\u000b To maintain full operational visibility on daily setter performance through standardized KPI reporting. This ensures management can track lead flow, identify bottlenecks, and make real-time data-driven decisions for conversion and efficiency improvements.\n\n#### Inputs Required\n\nInput | Description | Example\n\nDaily KPI Sheet / Notion Tracker | Centralized performance log for all setters | “Setter Daily KPI Tracker” (Google Sheets / Notion)\n\nCRM / DM Platform | Source for daily message and booking counts | Instagram, Discord, WhatsApp\n\nCalendar Access | Verify all scheduled calls and show-ups | Google Calendar / Calendly\n\nLead Tag System | Used to classify “Proposed,” “Booked,” “Follow-Up” statuses | CRM lead tags\n\nTime Tracking App | Optional — records total active setting hours | Toggl, Clockify\n\n#### Step-by-Step Workflow\n\n##### Step 1 — Prepare Data\n\nGoal: Gather all metrics and notes from the day’s activity.\u000b Actions:\n\n- Open CRM or inbox to confirm total outbound DMs sent, replies, and proposed calls.\n\n- Cross-check calendar for calls booked today and calls scheduled for tomorrow.\n\n- Note any no-shows or cancellations.\u000b Output: Verified daily metric totals ready for entry.\n\n##### Step 2 — Fill Out EOD KPI Sheet\n\nGoal: Log quantitative data consistently across the team.\u000b Actions:\n\n- In the sheet, complete all columns:\n\n- Outbound Sent (#)\n\n- Replies / Conversations Started (#)\n\n- Proposed Calls (#)\n\n- Booked Calls (#)\n\n- Show-Up Rate (%)\n\n- Follow-Ups Sent (#)\n\n- New Leads Added (#)\n\n- Observations / Notes (qualitative insights)\n\n- Use whole numbers only (no decimals).\u000b Output: Completed, standardized EOD record in tracker.\n\n##### Step 3 — Add Qualitative Notes\n\nGoal: Capture contextual insight for coaching and process improvements.\u000b Actions:\n\n- Under “Notes,” briefly describe patterns, objections, or unusual results (2–3 lines max).\n\n- Example: “More price objections after ad push,” or “Leads from new reel converting faster.”\n\n- If you encounter tech issues, note them with time stamps.\u000b Output: Qualitative insight available for manager review.\n\n##### Step 4 — Submit & Confirm Receipt\n\nGoal: Ensure report visibility for the leadership team.\u000b Actions:\n\n- Once complete, paste the tracker row summary in the team’s reporting channel (Slack / Discord).\n\n- Use this format:\u000b\u000b\u000b 🧮 [Date] — [Name]\u000b Outbound: [X] | Replies: [Y] | Proposed: [Z] | Booked: [A] | Show-Up: [B%]\u000b Notes: [1 sentence observation]\n\n- Tag your Setter Manager to confirm visibility.\u000b Output: EOD report publicly acknowledged and timestamped.\n\n##### Step 5 — Manager Review (Next Morning)\n\nGoal: Verify accuracy and highlight coaching opportunities.\u000b Actions:\n\n- Manager compares entries to CRM/Calendar data for random audit (5–10% sample).\n\n- Spot-check for: missed updates, inflated numbers, duplicate bookings.\n\n- Note coaching points directly in the sheet comment column.\u000b Output: Validated data with feedback provided to setter within 24 hrs.\n\n#### Quality Assurance (QA) Checklist\n\nQA Item | Description | Responsible\n\nAll required metrics filled | No blank or “0” fields unless genuinely zero activity | Setter\n\nTime of submission | Report submitted by 11:59 PM local time | Setter\n\nNotes section completed | Minimum one qualitative observation per day | Setter\n\nData accuracy verified | Random audit completed | Manager\n\nSummary posted in public channel | Confirms accountability | Setter\n\n#### Roles & Responsibilities\n\nRole | Duties | Stage Involved\n\nSetter | Collect metrics, log EOD data, post report | Steps 1–4\n\nSetter Manager | Audit reports, provide feedback, monitor trends | Step 5\n\nOps Lead | Maintain tracker integrity, update formulas, archive weekly | Ongoing\n\nCloser / Coach | Review notes to identify call quality or lead issues | Weekly review\n\n#### Common Errors & Fixes\n\nError | Cause | Solution\n\nMissing or inflated numbers | Manual counting or guesswork | Reconcile with CRM stats before submission\n\nLate report submission | Poor end-of-day routine | Set recurring 10 PM reminder\n\nNotes omitted | Setter rushing submission | Require “Notes” cell as mandatory (use Google Sheet data validation)\n\nDuplicate bookings | Same lead counted twice | Cross-check Calendly + CRM name list\n\n#### Tools & Automations\n\n- Google Sheets / Notion Database — KPI logging\n\n- Slack / Discord — Report posting & acknowledgment\n\n- Zapier / Make (Integromat) — Optional automation to pull daily CRM stats\n\n- Calendly / Google Calendar — Booking verification\n\n- Toggl / Clockify — Optional productivity tracking\n\n#### Outputs\n\n- Completed and timestamped EOD report in master tracker\n\n- Daily summary message in reporting channel\n\n- Validated dataset for weekly performance dashboard\n\n#### Definition of Done (DOD)\n\n✅ All daily metrics accurately logged in KPI tracker\u000b ✅ Notes field includes at least one qualitative observation\u000b ✅ Summary message posted in public reporting channel\u000b ✅ Manager has reviewed and acknowledged within 24 hours\n"},{"badge":"41","group":"sales-setting","section":"Booking","title":"Proposed → Booked Conversion Process","description":"Move a proposed call to a booked one instead of letting it drift.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1dgMwJWw7saSqBTGmCbd7a5Bswd65ihG7Z_kCnBJzvfg/edit?tab=t.0#heading=h.spf47gb7z6oh","portalUrl":"https://gohconsulting.app/sops?sop=41","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Proposed → Booked Conversion Process\n\n- Source: https://docs.google.com/document/d/1dgMwJWw7saSqBTGmCbd7a5Bswd65ihG7Z_kCnBJzvfg/edit?tab=t.0#heading=h.spf47gb7z6oh\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### Proposed → Booked Conversion Process\n\nVersion: 1.0\n\nPurpose:\u000b To standardize the follow-up and conversion process for all leads who were proposed a call but have not yet booked.\u000b This ensures no warm lead falls through the cracks, increases daily booking efficiency, and improves the overall proposed-to-booked conversion rate (target: 70%+).\n\n#### Inputs Required\n\nInput | Description | Example\n\nCRM / DM Platform | System used for tracking all conversation statuses | Instagram DMs, Discord, Slack\n\nLead Tag System | Tags or labels used to mark conversation stages | “Proposed,” “Booked,” “Follow-Up,” “DQ”\n\nCalendar Link | Booking calendar used to confirm qualified calls | Calendly, Google Calendar\n\nReminder Scheduler | Automation or manual tracker for follow-ups | Google Tasks, Zapier, or Notion Reminder\n\nSetter KPI Sheet | Tracker for counting Proposed & Booked conversions | “Setter KPI Tracker” tab\n\n#### Step-by-Step Workflow\n\n##### Step 1 — Identify Proposed Leads\n\nGoal: Locate all leads tagged as “Proposed” but not yet booked.\u000b Actions:\n\n- Open CRM or DM inbox filter: Tag = Proposed.\n\n- Review conversations from the past 7 days.\n\n- Verify that no call link has been clicked or scheduled.\u000b Output: Curated list of active “Proposed” leads to follow up with.\n\n##### Step 2 — Review Conversation Context\n\nGoal: Re-familiarize yourself with where each convo ended.\u000b Actions:\n\n- Scroll up 2–3 messages to understand tone and objections.\n\n- Identify if lead’s last response was:\n\n- Positive: “Yeah sounds good” → send gentle nudge.\n\n- Uncertain: “Maybe next week” → handle objection.\n\n- Silent: no response → restart sequence.\u000b Output: Tailored follow-up tone per lead type (positive / uncertain / silent).\n\n##### Step 3 — Apply the 4-Touch Follow-Up Sequence\n\nGoal: Convert proposed leads to booked calls without sounding pushy.\u000b Actions:\u000b Use the following message flow depending on stage:\n\n###### Day 1 — Gentle Reminder\n\n“Hey [Name], just checking in — still want me to send times for that call?”\n\n###### Day 2 — Reframe the Value\n\n“You mentioned [pain point / goal]. I know it’s easy to get busy, but let’s at least plan it out — 20 mins could clarify everything.”\n\n###### Day 3 — Urgency Frame\n\n“Schedule’s filling up for the week — want me to reserve a spot for you before it’s gone?”\n\n###### Day 4 — Polite Close-Out\n\n“No stress if now’s not the right time. Want me to nudge you next week when things calm down?”\n\nOutput:\n\n- Clear outcome per lead: Booked ✅ / Declined ❌ / No Response 💤\n\n- Updated tags in CRM to reflect new status.\n\n##### Step 4 — Handle Common Objections\n\nGoal: Address resistance efficiently without sounding salesy.\u000b Actions:\n\nObjection | Response Example\n\n“I’m too busy right now.” | “Totally fair — quick call might actually save you time by mapping what’s working and what’s not. Want to grab a 15-min slot this weekend?”\n\n“Can you just send info here?” | “Happy to — though what we do’s tailored to your situation, so the call helps us make sure it fits. Takes 20 mins max.”\n\n“I don’t know if I can afford it.” | “Completely get that. The first call’s just to see if it even makes sense for you — no pressure either way.”\n\nOutput: Objection overcome and booking link resent.\n\n##### Step 5 — Book & Confirm\n\nGoal: Secure confirmed booking in the calendar and prevent drop-off.\u000b Actions:\n\n- Once they agree, immediately drop the link:\u000b\u000b\u000b “Perfect — here’s the booking link: [Calendly URL]. Grab whatever time works best for you.”\n\n- After they book, reply:\u000b\u000b\u000b “Got it, just saw it come through — looking forward to the chat! I’ll send reminders closer to the time.”\n\n- Update tag: Proposed → Booked.\u000b Output: Call scheduled and confirmed via CRM + calendar entry.\n\n##### Step 6 — Record KPI\n\nGoal: Track success rate for data accuracy and performance coaching.\u000b Actions:\n\n- Update the Setter KPI Sheet with new numbers:\n\n- Proposed Calls (total attempted)\n\n- Booked Calls (converted)\n\n- Proposed→Booked % (formula auto-calculated)\u000b Output: Updated metrics visible to manager in daily dashboard.\n\n#### Quality Assurance (QA) Checklist\n\nQA Item | Description | Responsible\n\n100% of “Proposed” leads followed up within 48 hrs | No inactive leads remain uncontacted | Setter\n\n4-touch sequence applied | All leads receive full follow-up sequence | Setter\n\nObjection-handling used when applicable | Custom reply used instead of canned text | Setter\n\nTag status updated | CRM reflects “Booked,” “Declined,” or “No Response” | Setter\n\nKPI sheet updated by EOD | Conversion ratio visible for daily performance | Setter Manager\n\n#### Roles & Responsibilities\n\nRole | Duties | Stage Involved\n\nSetter | Execute follow-up sequence, log conversions | Steps 1–6\n\nSetter Manager | Review conversion %, coach on objections | QA Review\n\nOps Lead | Maintain tagging integrity and reporting automations | Ongoing\n\nCloser | Receive updated list of booked calls daily | Post-booking handoff\n\n#### Common Errors & Fixes\n\nError | Cause | Solution\n\nFollowing up too aggressively | Sending all 4 messages in 1 day | Follow 1-per-day rule\n\nLosing track of “Proposed” leads | No consistent tagging system | Use CRM filters + color-coded tags\n\nForgetting to update KPI sheet | Rush at EOD | Link KPI sheet in daily checklist\n\nLeads ghost after agreeing | No reminder / weak confirmation message | Always send post-booking acknowledgment\n\n#### Tools & Automations\n\n- CRM / DM Platform: Instagram, Discord, or Slack\n\n- Calendly / Google Calendar: Booking link & confirmation tracking\n\n- Google Sheets / Notion: KPI tracking\n\n- Zapier / Make: Auto-tag leads who click Calendly link\n\n- Google Tasks / Reminder App: 48h “Proposed follow-up” reminders\n\n#### Outputs\n\n- Converted “Proposed → Booked” leads\n\n- Updated CRM tags and status\n\n- Updated KPI tracker metrics\n\n- Manager visibility on daily conversion rate\n\n#### Definition of Done (DOD)\n\n✅ All proposed leads from past 7 days followed up\u000b ✅ Each received full 4-touch sequence or marked DQ\u000b ✅ Every booked lead confirmed via calendar + message\u000b ✅ KPI sheet updated with new Proposed→Booked %\u000b ✅ Manager has visibility in dashboard or Slack summary\n"},{"badge":"42","group":"sales-setting","section":"DMs","title":"DM Framework & Conversation Flow (Lead → Proposed)","description":"The DM framework that carries a lead to a proposed call.","status":"archived","format":"docx","sourceUrl":"https://docs.google.com/document/d/1GCuUDFO-rXf_56B2aUYDoS-TkPbTA7JSCPrEEQTA85w/edit?tab=t.0#heading=h.e9tnzqus0ezk","portalUrl":"https://gohconsulting.app/sops?sop=42","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# DM Framework & Conversation Flow (Lead → Proposed)\n\n- Source: https://docs.google.com/document/d/1GCuUDFO-rXf_56B2aUYDoS-TkPbTA7JSCPrEEQTA85w/edit?tab=t.0#heading=h.e9tnzqus0ezk\n- Capture: Google Docs API, all returned tabs\n- Tab count: 1\n\n## Tab 1\n\n### DM Framework & Conversation Flow (Lead → Proposed)\n\nVersion: 1.0\n\nPurpose: \u000b To define the complete conversational process for turning new leads (inbound or outbound) into qualified call proposals using high-trust, curiosity-based messaging.\u000b This SOP ensures every setter follows a replicable framework that builds rapport, finds pain, qualifies fit, and earns permission to propose a call — not force one.\n\n#### Inputs Required\n\nInput | Description | Example\n\nOffer Context | Clear understanding of the program, transformation, and cmimmmmmm mm mm mm k mm mmm I'm mm mmlient outcomes | “6-Month Mentorship for Coaches scaling to $10–30k/mo”\n\nICP Sheet | Target client demographics, pain points, desires | “Fitness coaches 21–35; want freedom & consistent clients”\n\nDM Script Framework | Conversation model with flexible prompts | “Awareness → Discovery → Value → Call Pitch” flow\n\nCRM or Inbox Access | Messaging platform used for outreach | Instagram, Discord, Slack\n\nDaily KPI Sheet | For tracking convos started & calls proposed | “Setter KPI Tracker”\n\n#### Step-by-Step Workflow\n\n##### Step 1 — Start the Conversation\n\nGoal: Create natural connection and open dialogue.\u000b Actions:\n\n- For inbound leads:\u000b\u000b\u000b Completely depends on what the inbound message is\n\n- For outbound leads:\u000b\u000b\u000b “Yoo been seeing your reels, how do you know X mutual? Saw you guys follow eachother”\n\n- Engage based on real profile context (location, sport, or shared interest).\u000b Output: Active conversation with rapport built within 2–3 exchanges.\n\nThe outbound should always be:\n\n- Hyper specific\n\n- Rapport based\n\n- Something the biz owner would actually be interested in / something you would actually pu to\n\n- Have a clear idea/path to transition to biz\n\nExamples:\n\nYoo been seeing your reels, how do you know X person? Saw you guys follow eachother\n\nBro where tf u based never will see a gym this empty in london it’s cooked\n\nYou've been seeing your reels pop up, they look clean, what type of camera are you using?\n\n##### Step 2 — Build Micro-Rapport\n\nGoal: Establish trust quickly through genuine curiosity.\u000b Actions:\n\nFor B2B everyone just wants to pitch and get in front of as many biz owners as possible\n\nInstead > get your leads to like you first\n\n- Use mirroring + validation in responses (“Haha, makes sense bro — same when I started”).\n\n- show genuine interest\n\n- always unique over script\n\n- say it out loud and think if it sounds like a setter\n\n- dont force the talk about biz\n\n- Ask 1–2 easy “surface” questions (location, how long they’ve been doing X).\u000b\u000b Output: Lead comfortable enough to share goals.\n\nThings to build rapport about:\n\n- location\n\n- real world events\n\n- fitness\n\n- Biz owners interests\n\n- cars\n\n- watches\n\n- taxes\n\n- Asia\n\n- Uni\n\n- vlogging\n\n- show interest in their offer (if unique)\n\n##### Step 3 — Transition to Biz\n\nGoal: don't raise sales resistance when moving into biz talk\n\nGREAT rapport is where they mess with you > check out ur page > ask you something about biz\n\nif you've done a lot of rapport and you're still chilling in non-biz talk you can just ask a transitioning question\n\nthink of it like a real convo after one subject slowly dies down you just transition\n\nTypes of Transition:\n\n- Lead brings biz up\n\n- Hard transition when enough rapport has been built\n\n- Soft transition from business rapport\n\n- get them to talk about what they do\n\n- ask a question showing interest in what they do to keep sales pressure low\n\n- then ask them how its been going so far\n\nOutput: transitioned from rapport to speaking about business without looking salesy\n\n##### Step 4 — Understanding leads issues\n\nGoal: Make the lead or confirm the lead is problem aware in their business\n\nActions:\n\n- Ask:\u000b\u000b\u000b “How's it going?” when you're in biz talk and you will get 1 of these:\n\n- Opens up about their pain\n\n- Says their biz is going well but could be better\n\n- Says its not going well\n\n- Says the biz is going well\n\nReplies to each:\n\n- Dig into their pain\n\n- fire bro/acknowledgement\n\nwdym could it be better though?\n\n- Oh damn bro your XYZ is so fire would’ve thought you’re crushing it, how come its not going well?\n\n- Here you need to read the lead because either\n\nA) they think they're doing well (check their IG and identify issue to see if they're lying) or complacent with where they're at\n\nB) there's too much sales pressure and they're saying 'i'm not ready to tell u my problems'\n\n>>>>\n\nA) Fire, how long have you been running it for now?\n\nlead replies\u000bDamn nice man you must be at like 50k pm by now\n\nB) go back to biz rapport where you build more trust and allow them to open up instead of pushing and them airing the convo\n\nNext you need to actually understand what direction you’re taking in the convo in so you need to know what their issue is\n\nDifferent Issues That Leads Experience:\n\nSymptoms of Issues:\n\n- Low lead flow\n\n- Dq leads\n\n- Low conversion rate\n\n- Limiting beliefs (already doing good, complacency, blaming external circumstances like algorithm not pushing content, people need free clients or charge super low to grow, need to grow personal brand before charging low ticket)\n\nReasons Behind Issues:\n\n- Too much working in the biz\n\n- No clarity on what to work on\n\n- For low lead flow, bad TOF content\n\n- For DQ leads, bad MOF and not hitting ICP\n\n- For low conversion rate, bad sales process + middle of funnel\n\nHow Do We Find These Issues?\n\n- Check profile in detail, all links, content, engagement, highlights, check youtube\n\n- How’s it going? (any sign of it being bad we dig deeper)\n\n##### Step 5 — Solution Awareness\n\nGoal: see if they know the solution to their issue + their perspective on the current plan they've been doing\n\nActions:\u000b\u000bFirstly > why do you think XYZ is an issue?\n\n- build doubt e.g how comes doing XYZ? > understand why they're cho osing to do things the way they are\n\n- curiosity and starting to make problem solutions aware with - how comes not doing XYZ?\n\nMaking them solution aware is the last thing before a pitch\n\nyou do this once you know their full perspective so you can make sure they don't disagree and you have the frame\n\nthe situations are:\n\nEither they know the solution or they don’t\n\n- If they know the solution: Agree + sauce\n\n- If they don’t know and they say they don’t know: Give them sauce\n\n- They say the wrong thing: Challenge + sauce\n\nwhen giving sauce you need to go in detail but it n
