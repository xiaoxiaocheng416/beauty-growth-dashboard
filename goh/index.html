:root {
  --ink: #111110;
  --ink-soft: #343431;
  --paper: #fcfbf9;
  --paper-deep: #f1efe9;
  --surface: #fffefa;
  --line: #e7e5df;
  --line-dark: #c2c1b9;
  --muted: #7f7e78;
  --accent: #d8ff67;
  --accent-soft: #f1ffc9;
  --accent-ink: #24300c;
  --success: #34634b;
  --warning: #8a641c;
  --danger: #a13a2d;
  --radius-control: .5rem;
  --radius-panel: .875rem;
  --container: 76.25rem;
  --gutter: 2.5rem;
  --shadow: 0 1.125rem 3.375rem rgba(45, 46, 38, .1);
  --ease: cubic-bezier(.2, .7, .2, 1);
  --sans: Arial, Helvetica, "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 20rem;
  color: var(--ink);
  background: var(--paper);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { color: inherit; }
a { color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible {
  outline: .18rem solid var(--accent-ink);
  outline-offset: .2rem;
}
.skip-link {
  position: fixed;
  z-index: 40;
  top: .75rem;
  left: .75rem;
  padding: .65rem .9rem;
  color: white;
  background: var(--ink);
  transform: translateY(-150%);
}
.skip-link:focus { transform: translateY(0); }
.grain {
  position: fixed;
  z-index: -1;
  inset: 0;
  opacity: .035;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.17'/%3E%3C/svg%3E");
}

.app-bar {
  position: sticky;
  z-index: 30;
  top: 0;
  display: flex;
  align-items: center;
  width: min(calc(100% - (var(--gutter) * 2)), var(--container));
  height: 4rem;
  margin: 0 auto;
  border-bottom: 1px solid var(--line);
  background: rgba(252, 251, 249, .94);
  backdrop-filter: blur(1rem);
}
.brand { display: inline-flex; align-items: center; gap: .7rem; text-decoration: none; }
.brand-mark {
  display: grid;
  place-items: center;
  width: 2.5rem;
  aspect-ratio: 1;
  border-radius: var(--radius-control);
  color: var(--accent);
  background: var(--ink);
  font-size: .62rem;
  font-weight: 800;
  letter-spacing: .02em;
}
.brand-name { font-size: .82rem; font-weight: 700; letter-spacing: -.015em; white-space: nowrap; }
.product-nav { display: flex; align-self: stretch; align-items: center; gap: 1.8rem; margin-left: auto; margin-right: 2rem; }
.product-nav a {
  position: relative;
  display: grid;
  place-items: center;
  height: 100%;
  color: var(--muted);
  font-size: .75rem;
  font-weight: 650;
  text-decoration: none;
}
.product-nav a:hover, .product-nav a.is-active { color: var(--ink); }
.product-nav a.is-active::after { position: absolute; right: 0; bottom: 0; left: 0; height: 2px; background: var(--ink); content: ""; }
.app-status { display: flex; align-items: center; }
.mode-indicator { display: inline-flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .65rem; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; }
.mode-indicator::before { width: .42rem; height: .42rem; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 .22rem color-mix(in srgb, var(--success) 12%, transparent); content: ""; }

.app-shell { width: min(calc(100% - (var(--gutter) * 2)), var(--container)); min-height: calc(100vh - 8rem); margin: 0 auto; padding: 3.2rem 0 5rem; }
.kicker { margin: 0; color: var(--muted); font-size: .66rem; font-weight: 700; line-height: 1.4; letter-spacing: .1em; text-transform: uppercase; }
.page-heading { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--line-dark); }
.page-heading h1 { max-width: 17ch; margin: .75rem 0 .8rem; font-size: clamp(2.55rem, 5vw, 5.2rem); line-height: .98; letter-spacing: -.05em; }
.page-heading p:not(.kicker) { max-width: 43rem; margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.7; }
.snapshot-card { min-width: 17rem; padding: 1.35rem 1.5rem; border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--surface); box-shadow: var(--shadow); }
.snapshot-card strong { display: block; margin-top: .45rem; font-size: 1.8rem; letter-spacing: -.04em; }
.snapshot-card span { color: var(--muted); font-size: .74rem; }

.signal-row { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.signal-row > div { display: grid; gap: .25rem; padding: 1.25rem 1.1rem 1.25rem 0; border-right: 1px solid var(--line); }
.signal-row > div + div { padding-left: 1.4rem; }
.signal-row > div:last-child { border-right: 0; }
.signal-row strong { font-size: 1.65rem; letter-spacing: -.04em; }
.signal-row span { color: var(--muted); font-size: .69rem; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; }

.phase-rail { display: flex; gap: .45rem; margin: 2rem 0 1.2rem; padding-bottom: .35rem; overflow-x: auto; scrollbar-width: thin; }
.phase-tab { flex: 0 0 auto; display: grid; grid-template-columns: auto 1fr; gap: .75rem; min-width: 11.5rem; padding: .85rem 1rem; border: 1px solid var(--line); border-radius: .7rem; background: transparent; text-align: left; cursor: pointer; transition: background 180ms var(--ease), border-color 180ms var(--ease), transform 180ms var(--ease); }
.phase-tab:hover { border-color: var(--line-dark); transform: translateY(-1px); }
.phase-tab.is-active { border-color: var(--ink); background: var(--ink); color: white; }
.phase-tab .phase-num { color: var(--muted); font-size: .65rem; font-weight: 700; }
.phase-tab.is-active .phase-num { color: var(--accent); }
.phase-tab strong { display: block; font-size: .76rem; }
.phase-tab small { display: block; margin-top: .18rem; color: var(--muted); font-size: .65rem; }
.phase-tab.is-active small { color: #aaa9a3; }

.roadmap-panel { display: grid; grid-template-columns: minmax(16rem, .62fr) minmax(0, 1.38fr); gap: 2.5rem; padding: 2.1rem; border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--surface); }
.phase-intro { align-self: start; position: sticky; top: 6rem; }
.phase-intro .phase-label { color: var(--muted); font-size: .68rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
.phase-intro h2 { margin: .8rem 0 .7rem; font-size: clamp(2rem, 3vw, 3.2rem); line-height: 1; letter-spacing: -.045em; }
.phase-intro > p { color: var(--muted); line-height: 1.7; }
.progress-track { height: .35rem; margin-top: 1.5rem; border-radius: 99px; background: var(--paper-deep); overflow: hidden; }
.progress-track i { display: block; height: 100%; border-radius: inherit; background: var(--accent-ink); }
.progress-copy { display: flex; justify-content: space-between; margin-top: .6rem; color: var(--muted); font-size: .68rem; }
.step-list { display: grid; gap: .6rem; }
.roadmap-step { border: 1px solid var(--line); border-radius: .65rem; background: var(--paper); overflow: hidden; }
.roadmap-step summary { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; align-items: center; gap: .9rem; min-height: 4.25rem; padding: .75rem 1rem; cursor: pointer; list-style: none; }
.roadmap-step summary::-webkit-details-marker { display: none; }
.roadmap-step summary:hover { background: var(--paper-deep); }
.step-check { display: grid; place-items: center; width: 1.65rem; height: 1.65rem; border: 1px solid var(--line-dark); border-radius: 50%; color: transparent; font-size: .74rem; font-weight: 800; }
.roadmap-step.is-done .step-check { border-color: var(--accent-ink); color: var(--accent); background: var(--ink); }
.step-title { font-size: .9rem; font-weight: 700; }
.step-title small { display: block; margin-top: .2rem; color: var(--muted); font-size: .67rem; font-weight: 500; line-height: 1.45; }
.step-arrow { color: var(--muted); transition: transform 180ms var(--ease); }
.roadmap-step[open] .step-arrow { transform: rotate(90deg); }
.step-body { padding: .25rem 1rem 1.25rem 3.9rem; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: .88rem; }
.step-body p { max-width: 48rem; line-height: 1.7; white-space: pre-line; }
.resource-row, .article-actions { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1rem; }
.resource-link, .article-action { display: inline-flex; align-items: center; min-height: 2.25rem; padding: .45rem .75rem; border: 1px solid var(--line-dark); border-radius: var(--radius-control); background: var(--surface); font-size: .72rem; font-weight: 650; text-decoration: none; }
.resource-link:hover, .article-action:hover { border-color: var(--ink); background: var(--accent-soft); }
.resource-link.is-sop { border-color: var(--ink); background: var(--ink); color: white; }

.library-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.5rem; align-items: end; padding: 1.5rem 0; }
.search-wrap label { display: block; margin-bottom: .55rem; color: var(--muted); font-size: .7rem; font-weight: 700; }
.search-box { position: relative; }
.search-box input { width: 100%; min-height: 3rem; padding: .75rem 3rem .75rem 1rem; border: 1px solid var(--line-dark); border-radius: var(--radius-control); color: var(--ink); background: var(--surface); outline: none; }
.search-box input:focus { border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
.search-box span { position: absolute; top: 50%; right: 1rem; color: var(--muted); transform: translateY(-50%); }
.result-count { color: var(--muted); font-size: .72rem; white-space: nowrap; }
.filter-row { display: flex; gap: .45rem; padding-bottom: 1.4rem; overflow-x: auto; }
.filter-chip { flex: 0 0 auto; padding: .5rem .8rem; border: 1px solid var(--line); border-radius: 99px; background: transparent; color: var(--muted); font-size: .68rem; font-weight: 650; cursor: pointer; }
.filter-chip:hover, .filter-chip.is-active { border-color: var(--ink); color: var(--ink); background: var(--accent); }
.library-layout { display: grid; grid-template-columns: minmax(18rem, .68fr) minmax(0, 1.32fr); min-height: 42rem; border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--surface); overflow: clip; }
.sop-list { max-height: calc(100vh - 13rem); overflow-y: auto; border-right: 1px solid var(--line); }
.sop-item { display: grid; grid-template-columns: 2.65rem minmax(0, 1fr) auto; align-items: center; gap: .85rem; width: 100%; padding: .95rem 1rem; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
.sop-item:hover { background: var(--paper-deep); }
.sop-item.is-active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--ink); }
.sop-badge { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: .45rem; color: var(--accent); background: var(--ink); font-size: .66rem; font-weight: 800; }
.sop-item strong { display: block; font-size: .78rem; line-height: 1.35; }
.sop-item small { display: block; margin-top: .22rem; color: var(--muted); font-size: .64rem; }
.status-dot { width: .45rem; height: .45rem; border-radius: 50%; background: var(--success); }
.status-dot.link { background: var(--warning); }
.empty-list { padding: 3rem 1.25rem; color: var(--muted); text-align: center; }
.sop-detail { min-width: 0; max-height: calc(100vh - 13rem); overflow-y: auto; }
.article-head { position: sticky; z-index: 5; top: 0; padding: 1.7rem 2rem 1.25rem; border-bottom: 1px solid var(--line); background: rgba(255, 254, 250, .96); backdrop-filter: blur(.7rem); }
.article-meta { display: flex; align-items: center; gap: .6rem; color: var(--muted); font-size: .67rem; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
.article-head h2 { margin: .7rem 0 .45rem; font-size: clamp(1.7rem, 3vw, 2.8rem); line-height: 1.05; letter-spacing: -.04em; }
.article-head > p { margin: 0; color: var(--muted); font-size: .86rem; line-height: 1.6; }
.article-action.primary { border-color: var(--ink); color: white; background: var(--ink); }
.article-body { max-width: 52rem; padding: 2rem; color: var(--ink-soft); font-size: 1rem; line-height: 1.75; }
.article-body h1, .article-body h2, .article-body h3, .article-body h4 { color: var(--ink); line-height: 1.2; letter-spacing: -.025em; }
.article-body h1 { margin: 0 0 1.5rem; font-size: 2rem; }
.article-body h2 { margin: 2.7rem 0 1rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: 1.5rem; }
.article-body h3 { margin: 2rem 0 .7rem; font-size: 1.18rem; }
.article-body h4 { margin: 1.6rem 0 .6rem; font-size: 1rem; }
.article-body p { margin: .75rem 0; }
.article-body ul, .article-body ol { padding-left: 1.4rem; }
.article-body li { margin: .35rem 0; }
.article-body img { display: block; max-width: 100%; height: auto; margin: 1.5rem auto; border: 1px solid var(--line); border-radius: .6rem; background: white; }
.article-body a { text-decoration-thickness: 1px; text-underline-offset: .18em; }
.article-body blockquote { margin: 1.4rem 0; padding: .85rem 1.1rem; border-left: 3px solid var(--accent-ink); background: var(--accent-soft); }
.article-body code { padding: .14rem .3rem; border-radius: .25rem; background: var(--paper-deep); font-size: .88em; }
.article-body pre { overflow-x: auto; padding: 1rem; border-radius: .55rem; color: #f5f4ef; background: var(--ink); }
.article-body pre code { padding: 0; background: transparent; }
.article-body table { width: 100%; margin: 1.25rem 0; border-collapse: collapse; font-size: .86rem; }
.article-body th, .article-body td { padding: .65rem .7rem; border: 1px solid var(--line); text-align: left; vertical-align: top; }
.article-body th { background: var(--paper-deep); }
.article-note { margin: 0 2rem 2rem; padding: 1rem; border: 1px solid #ecd5a2; border-radius: .55rem; color: var(--warning); background: #fff9eb; font-size: .8rem; }

.app-footer { display: flex; justify-content: space-between; width: min(calc(100% - (var(--gutter) * 2)), var(--container)); margin: 0 auto; padding: 1.4rem 0 2rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .65rem; }

@media (max-width: 900px) {
  :root { --gutter: 1rem; }
  .app-status { display: none; }
  .product-nav { margin-right: 0; }
  .page-heading { grid-template-columns: 1fr; }
  .snapshot-card { min-width: 0; }
  .roadmap-panel { grid-template-columns: 1fr; gap: 1.4rem; padding: 1.25rem; }
  .phase-intro { position: static; }
  .library-layout { grid-template-columns: 1fr; }
  .sop-list { max-height: 24rem; border-right: 0; border-bottom: 1px solid var(--line); }
  .sop-detail { max-height: none; }
  .article-head { position: static; }
}

@media (max-width: 620px) {
  .brand-name { display: none; }
  .product-nav { gap: 1rem; }
  .app-shell { padding-top: 2rem; }
  .page-heading h1 { font-size: 2.6rem; }
  .signal-row { grid-template-columns: repeat(2, 1fr); }
  .signal-row > div:nth-child(2) { border-right: 0; }
  .signal-row > div:nth-child(3), .signal-row > div:nth-child(4) { border-top: 1px solid var(--line); }
  .library-toolbar { grid-template-columns: 1fr; gap: .6rem; }
  .roadmap-step summary { grid-template-columns: 1.7rem minmax(0, 1fr) auto; padding: .7rem; }
  .step-body { padding-left: 3.15rem; }
  .article-head, .article-body { padding-right: 1.15rem; padding-left: 1.15rem; }
  .article-note { margin-right: 1.15rem; margin-left: 1.15rem; }
  .app-footer { display: grid; gap: .35rem; }
}

</style>

ot  work  for  you  \n \n \n\n\n### Page 2\n\n3)  Growth  \n●  Before  \n \n \n\n\n### Page 3\n\n●  After  \n \n\n### Page 4\n\nI  tried:  \n-  Talking  head  videos  -  Miro  board  videos  -  Vlogs  -  Raw  talks  -  Scripted  videos  -  VSL-style  video  -  Broad  angle  -  Niche  angle   \nLanded  on  two:  \n-  Miro  value  videos  -  Vlogs  \n Miro  value:  \n●  Great  at  talking  \nVlogs:  \n●  Natural  yapper,  can  talk  all  day  ●  Entertaining,  people  like  my  personality  \nFind  and  leverage  a  format  to  emphasize  why  people  should  buy  \ninto\n \nyou\n \nReverse  engineer  why  your  clients  bought  from  you  \n \n4)  Onboarding  Form :  https://form.typeform.com/to/LhaammKH \nDuplicate  this  and  send  it  to  your  clients  \n-  \nFind  the  3  most  common  patterns  people  choose  you  and  spend  30  \nmins\n \nbrainstorming\n \nand\n \nreverse\n \nengineering\n \nit\n \n \n\n### Page 5\n\nExample:  Asian  \n-  Thinks  im  naturally  smarter  -  Miro  board  video  going  more  in  depth  on  breaking  down  \nmy\n \nstrategy\n -  Show  more  systems  and  processes  i  use  in  my  business  \nthat\n \nthey\n \nare\n \nmissing\n -  Use  more  stats  and  data  to  back  up  my  points  -  Morals  and  values  -  “You  don’t  show  the  ﬂashy  lifestyle  and  drive  a  lambo  like  \nall\n \nthe\n \nonline\n \ngurus\n \nI\n \nsee.\n \nYou’re\n \nmore\n \ndown\n \nto\n \nearth\n \nand\n \ngenuine”\n -  Me  giving  back  to  my  family  -  Me  helping  my  family  -  Me  talking  to  my  family  \n \nLook  at  your  competitors  and  see  what  format/  style  of  content  \nthey’re\n \nripping\n \n●  Will  that  type  of  format  help  you  emphasize  the  common  \npatterns\n \nof\n \nwhy\n \nyour\n \nclients\n \nchose\n \nyou?\n \n \n5)  Hop  on  a  call  with  your  top  3  clients  \n●  Review  content  together  \n"},{"badge":"01","group":"content","section":"Strategy","title":"Clipping Viral Content","description":"Find, clip, and repurpose viral moments to ride attention that already exists.","status":"archived","format":"pdf","sourceUrl":"https://gohconsulting.app/sops/clipping-viral-content.pdf","portalUrl":"https://gohconsulting.app/sops?sop=01","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Clipping Viral Content\n\n- Source: https://gohconsulting.app/sops/clipping-viral-content.pdf\n- Category: content / Strategy\n- Captured: 2026-09-21T14:01:40.525373+00:00\n\n\n### Page 1\n\n         \n.CLIPPING  VIRAL  CONTENT.   .GOH  CONSULTING.\n \n \n \nGoal\n \nwith\n \nClipping\n  Ensure  every  short-form  clip  is  intentional,  high-value,  on-brand,  and  sent  to  the  \nright\n \nchannel.\n \nWe\n \ndon't\n \nclip\n \nrandomly,\n \nwe\n \ndon't\n \npost\n \nﬁller,\n \nand\n \nevery\n \nclip\n \npasses\n \nthe\n \nﬁlter\n \nbefore\n \nit's\n \nposted.\n \n  \nW ho\n \nYou’re\n \nClipping\n \nFor\n \n  Our  ICP  is  coaches,  consultants,  and  founders  with  a  personal  brand  doing  \n50k+/month\n \nwho\n \nwant\n \nto\n \nscale\n \nseriously.\n \nEvery\n \nclip\n \neither\n \nspeaks\n \ndirectly\n \nto\n \nthem,\n \nor\n \nis\n \nintentional\n \ntop-of-funnel\n \nlikeability\n \ncontent\n \nthat\n \nwidens\n \nreach.\n \n  Be  clear  on  your  ICP  and  ensure  every  clip  speaks  to  them.   \n \nStep\n \n1\n \n-\n \nIdentify\n \nKey\n \nM om ents\n \n  When  reviewing  long-form  content  (YouTube,  calls,  vlogs,  interviews),  mark  5  to  \n10\n \ntimestamps\n \nwhere\n \na\n \nmoment\n \nhas:\n ●  A  strong  opinion,  an  emotional  reaction,  or  clear  tension  or  conﬂict.  ●  A  clear  lesson,  an  authority  statement,  or  a  unique  mechanism  or  \nframework.\n  A  moment  is  clip-worthy  when  the  sentence  is  quotable,  it  challenges  a  belief,  it  \nimplies\n \nmoney,\n \nscale,\n \nrisk,\n \nor\n \ngrowth,\n \nor\n \nit\n \nfeels\n \nlike\n \na\n \nturning\n \npoint.\n \nIf\n \nyou\n \ncan\n \nturn\n \nit\n \ninto\n \na\n \nheadline\n \nin\n \nunder\n \n5\n \nseconds,\n \nit's\n \nstrong.\n  \nStep\n \n2\n \n-\n \nClassify\n \nthe\n \nchannel\n \n  \nEvery\n \nclip\n \nis\n \neither\n \nMain\n \nchannel\n \nor\n \nSecond\n \nchannel.\n \nDecide\n \nthis\n \nbefore\n \nanything\n \nelse,\n \nbecause\n \nthe\n \nstandard\n \nis\n \ndifferent.\n \n \n\n### Page 2\n\n●  Main  channel:  highly  selective.  Broad  hook,  one  clear  message,  high  value,  \nand\n \npackaging\n \nthat\n \ncan\n \ncarry\n \nit.\n \nThis\n \nis\n \nour\n \nbest\n \nwork\n \nonly.\n ●  Second  channel:  niche  is  ﬁne,  and  the  bar  is  lower,  but  it  still  has  to  be  \nintentional\n \nand\n \nstill\n \nneeds\n \na\n \nhook\n \n(a\n \nniche\n \nhook\n \nis\n \nﬁne).\n ●  The  rule:  if  you're  uncertain  whether  it's  main-worthy,  it's  a  Second  channel  \nclip.\n \nNever\n \nsend\n \na\n \nborderline\n \nclip\n \nup\n \nfor\n \nmain\n \nreview.\n ●  If  a  long-form  video  has  no  main  channel  worthy  clips,  say  so  explicitly.  \nNever\n \nclip\n \nfor\n \nthe\n \nsake\n \nof\n \nposting.\n \n   \nStep\n \n3\n \n-\n \nChoosing\n \nthe\n \nHook\n \n The  hook  starts  broad  to  stop  the  maximum  number  of  people,  while  still  \nappealing\n \nto\n \nthe\n \nICP.\n \nThe\n \nvideo\n \nstarts\n \nbroad,\n \nhooks\n \na\n \nwide\n \naudience,\n \nthen\n \nnarrows\n \nto\n \nthe\n \nspeciﬁc\n \nICP\n \nas\n \nit\n \nprogresses.\n \n ●  Broad  opening:  as  broad  as  possible  without  being  irrelevant.  Address  a  \npain\n \nor\n \nexperience\n \nthe\n \nICP\n \nfeels\n \nthat\n \na\n \nmuch\n \nwider\n \naudience\n \nalso\n \nrelates\n \nto.\n ●  Creates  immediate  curiosity:  opens  a  loop,  withholds  key  information,  and  \nforces\n \nthe\n \nviewer\n \nto\n \nneed\n \ncontext.\n ●  Points  of  interest  to  look  for:  recency  (a  recent  or  ongoing  event),  relevancy  \n(fear,\n \ndesire,\n \nchallenge,\n \nor\n \na\n \npersonal\n \nstory\n \nthat\n \ncarries\n \na\n \nfeeling),\n \nassociations\n \n(celebrity\n \njacking),\n \nconﬂict\n \n(controversial),\n \nand\n \nunusual\n \n(just\n \nweird).\n ●  Does  a  new  hook  need  to  be  recorded?  For  main-channel  clips,  if  the  \nspoken\n \nopener\n \nisn't\n \nstrong\n \nenough\n \nto\n \nstop\n \nthe\n \nscroll,\n \nﬂag\n \nit\n \nso\n \nSooWei\n \ncan\n \nrecord\n \na\n \nfresh\n \nhook.\n \nDon't\n \nsubmit\n \na\n \nclip\n \nwithout\n \na\n \nstrong\n \nhook.\n \n \nStep\n \n4\n \n-\n \n4\n \nP oint\n \nCheck\n \n \n For  every  clip,  answer  these  four  questions.  1.  Is  it  entertaining?  ●  Does  it  hold  attention  in  the  ﬁrst  1  to  2  seconds?  ●  Is  there  tension,  conﬁdence,  directness,  or  a  pattern  interrupt?  \n\n### Page 3\n\n●  Would  you  personally  stop  scrolling  for  this?  2.  Does  it  spark  emotion?  ●  Curiosity,  urgency,  ego  check,  conﬁdence,  stress,  relief,  inspiration,  or  \nvalidation.\n \nIf\n \nit\n \ndoesn't\n \nmake\n \nsomeone\n \nfeel\n \nsomething,\n \nit\n \nwon't\n \nperform.\n 3.  Would  you  pay  $5  for  this  insight?  ●  Is  the  takeaway  genuinely  valuable?  Would  a  50k+/month  business  owner  \nget\n \nsomething\n \nactionable,\n \nmore\n \nthan\n \nsurface-level\n \nmotivation?\n 4.  Is  it  one  clear  message?  ●  One  core  takeaway,  one  clear  lesson,  one  clear  emotional  thread.  If  there  \nare\n \nthree\n \nideas\n \nin\n \n45\n \nseconds,\n \nit's\n \nmessy.\n ●  If  removing  a  sentence  doesn't  weaken  the  message,  remove  it.   Important  distinction:  checks  1  to  3  judge  the  moment's  raw  potential,  you  can't  \nﬁx\n \nthose,\n \nthe\n \nmoment\n \neither\n \nhas\n \nit\n \nor\n \nit\n \ndoesn't.\n \nCheck\n \n4\n \njudges'\n \nexecution,\n \nand\n \nit's\n \nalmost\n \nalways\n \nﬁxable\n \nin\n \nthe\n \nedit.\n \nSo\n \na\n \nclip\n \nthat\n \nfails\n \nonly\n \non\n \na\n \nmessage\n \nisn't\n \nbad,\n \nit\n \nmust\n \nbe\n \nre-clipped.\n \nA\n \nclip\n \nthat\n \nfails\n \nany\n \nof\n \nchecks\n \n1\n \nto\n \n3,\n \ndiscard\n \nthe\n \nclip.\n  \nStep\n \n5\n \n-\n \nP ackage\n \nit\n \nA  clip  can  pass  all  four  checks  and  still  die  on  weak  packaging.  Packaging  is  \nmost\n \nof\n \nthe\n \ngame.\n ●  First  frame:  the  opening  frame  has  to  stop  the  scroll  on  its  own.  Never  open  \non\n \na\n \nrandom\n \nmid-sentence\n \nline.\n ●  On-screen  hook  text:  under  10  words,  broad,  curiosity-driven,  and  readable  \nin\n \nthe\n \nﬁrst\n \nsecond.\n ●  Format  choice:  pick  the  format  that  ﬁts  the  moment  (see  the  Format  \nGuide)\n ●  Caption:  written  to  the  ICP,  adds  context,  and  carries  a  soft  CTA  where  it  \nﬁts.\n ●  Feel  different  from  the  last  few  posts:  vary  the  b-roll,  text  style,  framing,  and  \nmusic.\n \nThe\n \npage\n \nshould\n \nnever\n \nlook\n \nlike\n \none\n \nclipping\n \ntemplate\n \non\n \nrepeat.\n \n \n \n \n\n### Page 4\n\nStep\n \n6\n \n-\n \nScore\n \nthe\n \nclip\n \nLabel  each  clip  against  the  4-Point  Check:  ●  4/4,  ready  to  post.  ●  3/4,  needs  work.  If  the  only  miss  is  message,  reclip  it.  If  the  miss  is  \nentertaining,\n \nemotion,\n \nor\n \nvalue,\n \nit\n \nlikely\n \ncan't\n \nbe\n \nsaved.\n ●  2/4  or  below,  not  good  enough.  Only  4/4  clips  get  scheduled  on  the  main  channel    Format  Guide  Match  the  moment  to  the  format  so  the  feed  stays  varied.  ●  Value  or  lesson:  clipped  value  reel  (our  staple).  ●  Strong  opinion  or  personal  story:  iPhone  raw  talk.  ●  Before-and-after  or  progress:  transformation  reel.  ●  Multi-point  framework:  carousel  (personal  or  value).  ●  Aesthetic  or  lifestyle:  b-roll  montage.   Trial  Reels  &  Reformatting  ●  Reformat  our  best-performing  reels  with  minimal  changes  so  the  \nalgorithm\n \ndoesn't\n \nrecognise\n \nthem,\n \nthen\n \nrepost\n \nas\n \ntrial\n \nreels.\n ●  Post  3  to  4  trial  reels  a  day  to  test  reach.  ●  Judge  trial  reels  on  follow  efﬁciency,  not  raw  views.    \nIntentional\n \nExecution\n \n \nMusic  ●  Avoid  generic,  overused  tracks.  Music  must  match  the  tone  and  overall  \nvibe.\n Pacing  ●  Remove  ﬁller,  repetition,  and  weak  transitions.  Tighten  silence  unless  the  \nsilence\n \nis\n \nintentional\n \ntension.\n B-roll  ●  Every  shot  must  be  intentional  (emotion,  context,  transition,  or  proof).  See  the  B-Roll  SOP.  Don't  reuse  the  same  b-roll  across  a  batch,  that's  what  makes  the  page  feel  stale.   \n\n### Page 5\n\nThe  Metric  That  Matters  A  strong  clip  drives  follows  and  ICP  leads,  not  just  views.  Judge  performance  on  \nfollow\n \nrate\n \nand\n \nlead\n \nquality,\n \nnot\n \nvanity\n \nviews.\n \nA\n \nlow-view\n \nclip\n \nwith\n \na\n \nhigh\n \nfollow\n \nrate\n \nbeats\n \na\n \nhigh-view\n \nclip\n \nthat\n \ngrows\n \nnothing.\n  \nClaude\n \nClipping\n \nP rom pt\n \n \nYou  are  a  content  strategist  and  clipping  editor  for  a  high-level  business  \ncoaching\n \nbrand\n \ntargeting\n \ncoaches,\n \nconsultants,\n \nand\n \nfounders\n \nwith\n \na\n \npersonal\n \nbrand\n \ndoing\n \n50k+/month.\n \n[insert\n \nyour\n \nICP\n \nhere)\n \n Below  you  will  ﬁnd  two  things:  (1)  the  Clipping  SOP,  your  complete  criteria  and  \nrules;\n \nand\n \n(2)\n \nthe\n \ntranscript,\n \nthe\n \nraw\n \ncontent\n \nto\n \nanalyse.\n \nRead\n \nthe\n \nSOP\n \nfully\n \nbefore\n \nreviewing\n \nthe\n \ntranscript.\n \nApply\n \nevery\n \nﬁlter\n \nto\n \neach\n \nmoment\n \nyou\n \nidentify.\n \nDo\n \nnot\n \nclip\n \nanything\n \nthat\n \ndoesn't\n \npass\n \nthe\n \nfull\n \ncriteria.\n  For  each  clip  you  identify,  return:  ●  Timestamp  range  ●  Channel:  Main  or  Second,  with  a  one-line  reason  ●  Suggested  on-screen  hook  (the  ﬁrst  line  as  it  would  appear  on  screen,  \nunder\n \n10\n \nwords)\n ●  New  hook  needed?  Yes  or  no  (for  main-channel  clips,  whether  a  fresh  hook  \nshould\n \nbe\n \nrecorded)\n ●  Recommended  format  (value  reel,  raw  talk,  transformation,  carousel,  \nb-roll\n \nmontage)\n ●  Score:  4/4,  3/4,  or  fail  ●  Which  checks  it  passed  (entertaining,  sparks  emotion,  worth  $5,  one  clean  \nmessage)\n ●  One  sentence  on  why  it  works  or  what  needs  to  change   Only  return  clips  that  score  4/4  or  3/4.  Do  not  list  anything  that  fails.  If  the  \ntranscript\n \nyields\n \nzero\n \nmain-channel\n \nclips,\n \nsay\n \nso\n \nexplicitly.\n CLIPPING  SOP:  [paste  full  SOP  here]  TRANSCRIPT:  [paste  video  transcript  here]  \n \n"},{"badge":"02","group":"content","section":"Strategy","title":"Reverse Engineering & Doubling Down On Outliers","description":"Analyze your top-performing posts and systematically scale what works.","status":"archived","format":"pdf","sourceUrl":"https://gohconsulting.app/sops/reverse-engineering-outliers.pdf","portalUrl":"https://gohconsulting.app/sops?sop=02","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Reverse Engineering & Doubling Down On Outliers\n\n- Source: https://gohconsulting.app/sops/reverse-engineering-outliers.pdf\n- Category: content / Strategy\n- Captured: 2026-09-21T14:01:48.652069+00:00\n\n\n### Page 1\n\n.REVERSE  ENGINEERING. .VIRAL  VIDEOS.  \n.GOH  CONSULTING\n.\n  Goal:  Turn  your  best-performing  videos  into  a  repeatable  engine  for  views  and  ICP  \nleads,\n \nby\n \nsystematically\n \nbreaking\n \ndown\n \nWHY\n \nthey\n \nworked\n \nand\n \nre-running\n \nthem\n \nas\n \niterations\n \ninstead\n \nof\n \nguessing\n \nat\n \nnew\n \nideas.\n  \nW hat\n \nthis\n \nis\n \nWhat  is  an  Outlier:  any  video  that  performs  3-5x  better  than  your  average  piece  of  \ncontent\n  This  is  the  exact  framework  we  follow  to  leverage  our  existing  data  and  generate  \nover\n \n5\n \nMillion\n \nviews\n \nevery\n \nsingle\n \nmonth.\n  Every  viral  video  that  has  ever  worked  can  be  broken  down  into  a  repeatable  \nframework.\n \nOnce\n \nyou\n \nunderstand\n \nthe\n \nframework,\n \nyou\n \ncan\n \nreplicate\n \nthe\n \nresult.\n \n  \nW hy\n \nthis\n \nmatters\n \n\n\n### Page 2\n\nMost  creators  treat  every  video  as  a  fresh  gamble.  Every  time  they  post,  they’re  just  \nthrowing\n \nan\n \nidea\n \nat\n \na\n \nwall\n \nand\n \nhoping\n \nit\n \nsticks.\n  An  outlier  is  your  audience  telling  you  exactly  which  topic,  hook,  and  format  they  \nrespond\n \nto.\n \nThese\n \nare\n \nproven\n \npatterns\n \nyou\n \ncan\n \ndouble\n \ndown\n \non\n \nin\n \nyour\n \norganic\n \nto\n \ngenerate\n \npredictable\n \nresults.\n  \nW hat\n \nyou\n \nneed\n \nThere  are  3  Main  systems  you  need  in  place  to  be  able  to  efﬁciently  double  down  on  \nyour\n \noutliers:\n  1.  Growth  Tracker  This  is  a  sheet  which  breaks  down  the  key  components  of  your  best  \nperforming\n \nvideos\n \nand\n \nshould\n \nbe\n \nupdated\n \nby\n \na\n \nmember\n \nof\n \nyour\n \ncontent\n \nteam\n \nevery\n \n30\n \ndays.\n \nIt\n \nprimarily\n \nworks\n \nbest\n \nfor\n \ntracking\n \nwhich\n \nTOF\n \nContent\n \ndrives\n \nthe\n \nmost\n \nreach.\n  2.  ICP  Tracker  This  tracks  which  videos  are  bringing  in  ICP  followers  allowing  you  to  build  \nan\n \naudience\n \nof\n \nqualiﬁed\n \nbuyers.\n \nIt\n \nprimarily\n \nworks\n \nbest\n \nfor\n \ntracking\n \nwhich\n \nMOF\n \nContent\n \ndrives\n \nthe\n \nmost\n \nconversions.\n  3.  Average  View  Count  Calculate  the  average  number  of  views  you  generate  per  video  so  you  can  \ndetermine\n \nwhich\n \nvideos\n \nare\n \noutliers\n \nand\n \nwhich\n \nvideos\n \nare\n \nsimply\n \nunderperforming.\n \nThis\n \nwill\n \nallow\n \nyou\n \nto\n \nclearly\n \ncompare\n \nthe\n \ndifference\n \nbetween\n \nthe\n \ntwo.\n  Here  you  can  access  the  templates  for  the  Growth  Tracker and  ICP  Tracker.  \n\n### Page 3\n\n \nOverview\n \nThe  goal  of  this  section  is  to  identify  your  winning  videos,  understand  exactly  why  \nthey\n \nwon,\n \nand\n \nturn\n \neach\n \none\n \ninto\n \nmultiple\n \nnew\n \nvideos\n \nthat\n \nfollow\n \nthe\n \nsame\n \nproven\n \nframework.\n  Step  1:  Track  the  Data  Refer  back  to  your  Growth  Tracker  &  ICP  Tracker  and  pinpoint  your  best  performing  \nvideos.\n  Ideally,  ﬁnd  outliers  that  have  both  generated  views  and  attracted  ICP  followers  as  \nthese\n \nwill\n \nbe\n \nyour\n \ngolden\n \nformats.\n  Step  2:  Deconstruct  the  Outlier  Now  you  need  to  actually  understand  WHY  the  video  performed.  \nTake  each  outlier  and  run  it  through  the  Deconstruction  Framework .  Seven  layers,  \nevery\n \ntime:\n \n1.  The  Format  \nThis  is  the  way  the  creator  actually  delivers  the  message.  For  example:  Raw  Talk  \niPhone\n \nVideo\n \nor\n \nTier\n \nList\n \n\n\n### Page 4\n\n \n2.  The  Hook  \nThis  is  the  highest  lever  you  can  pull  to  determine  whether  a  video  goes  viral.  \nIdentify  the  3  Types  of  Hooks:  a  visual  hook  (thumbnail  or  opening  frame),  a  \ntext\n \nhook\n \n(bold\n \nﬁrst\n \nline\n \nof\n \ncopy),\n \nor\n \na\n \nverbal\n \nhook\n \n(opening\n \nspoken\n \nline)\n \n \n3.  The  Emotion  \nWhat  emotional  trigger  does  the  video  activate?  \nAspiration  (viewers  want  what  the  creator  has)  Curiosity  (they  need  to  know  \nhow\n \nit\n \nends),\n \nor\n \nControversy\n \n(it\n \nchallenges\n \na\n \ncommon\n \nbelief)\n \n \n4.  The  CTA  &  Payoff  \nWhat  action  it  makes  the  viewer  take.  \nDoes  it  prompt  a  strong  opinion  in  the  comments?  Does  it  make  you  save  it,  \nshare\n \nit,\n \nor\n \nfollow?\n \n \n5.  The  Shareability  Factor  \nShares  are  the  most  valuable  metric,  because  the  algorithm  is  designed  to  \nkeep\n \npeople\n \non\n \nthe\n \nplatform.\n \nDoes  it  say  something  the  viewer  wishes  they'd  said?  Does  it  make  a  bold  claim  \nthe\n \nviewer\n \nwants\n \nto\n \nprove\n \nor\n \ndisprove?\n \n \n6.  The  Proof  Layer  \nWhat  makes  the  viewer  believe  the  claim?  \nIs  there  a  visible  result  shown  (revenue,  physique,  outcome)  with  a  speciﬁc  \nnumber,\n \ndate,\n \nor\n \nmetric?\n \nThe  easiest  way  to  do  this  is  a  payment  dashboard  or  a  message  from  a  client.  \n \n7.  The  Trend  Layer  \n\n### Page 5\n\nIs  it  using  a  trending  audio,  format,  or  phrase?  Does  it  reference  a  news  event,  \nmeme,\n \ncultural\n \nmoment,\n \nor\n \ntopic\n \npeople\n \nare\n \nactively\n \nsearching\n \nfor?\n \nTapping  into  trends  increases  your  TAM,  because  you  start  appealing  to  \naudiences\n \noutside\n \nyour\n \nniche.\n \n \nWrite  the  answer  to  all  seven  down  for  each  of  your  outlier  videos.  If  you  cannot  \narticulate\n \nwhy\n \nit\n \nwon,\n \nyou\n \ncannot\n \nrepeat\n \nit.\n \n Step  3:  Create  Iterations  An  iteration  is  a  small  adaptation  of  an  already-proven  concept,  so  you  generate  the  \nsame\n \nresult,\n \nif\n \nnot\n \nbetter.\n  This  is  exactly  how  we  turn  one  proven  video  into  a  backlog  of  new  ones.  Change  \none\n \nvariable\n \nat\n \na\n \ntime:\n  1.  Hook  Iteration  Same  topic,  same  format,  new  hook.  You  already  know  the  topic  resonates,  \nso\n \nall\n \nyou\n \nare\n \ndoing\n \nis\n \ntesting\n \na\n \nnew\n \nentry\n \npoint.\n For  example:  a  Bold  Claim,  a  Direct  Question,  or  a  Story  Opener.   2.  Angle  Iteration  There  are  5  angles  you  can  take  when  scripting:  Controversy  →  challenge  a  conventional  belief  in  your  niche.  Case  Study  →  prove  the  concept  through  a  real  result.  Step-by-Step  →  break  down  the  process  behind  the  original  insight.  Reaction  →  react  to  a  common  belief,  mistake,  or  trend.  Storytelling  →  use  your  own  journey  to  embody  the  principle.   3.  Format  Iteration  Delivering  the  same  message  with  different  visuals,  for  example:  a  Raw  Talk  \niPhone\n \nvideo\n \nversus\n \na\n \nBlack\n \nBorder\n \nTalking\n \nHead\n \nvideo.\n \n\n### Page 6\n\nBe  mindful  of  which  format  you  choose  and  how  it  links  back  to  the  \nmessaging:\n \nthe\n \nformat\n \ncarries\n \na\n \ntone,\n \nand\n \nthe\n \nwrong\n \ntone\n \nkills\n \na\n \nstrong\n \nscript.\n   \nQuick\n \nchecklist\n \nRun  this  every  30  Days.  Every  answer  should  be  yes.   ●  Growth  Tracker  ﬁlled  out  with  this  month's  outliers  (3-5x  your  average)  by  the  \nContent\n \nTeam?\n ●  ICP  Tracker  ﬁlled  out  daily  by  the  Appointment  Setter,  with  every  ICP  follower  \nmapped\n \nto\n \na\n \nvideo?\n ●  Have  you  selected  up  to  10  outliers  to  iterate  on?  ●  Has  every  one  of  those  been  deconstructed  across  all  7  layers  (Format,  Hook,  \nEmotion,\n \nCTA\n \n&\n \nPayoff,\n \nShareability,\n \nProof,\n \nTrend)?\n ●  Is  the  WHY  written  down,  not  just  held  in  someone's  head?  ●  Does  each  iteration  change  only  ONE  variable  (hook,  angle,  or  format)?  ●  Are  the  iterations  briefed  into  the  pipeline  with  an  editor  assigned?  ●  Are  you  judging  results  on  ICP  followers,  not  only  views?   \n"},{"badge":"03","group":"content","section":"Production","title":"Content Production Workflow","description":"The end-to-end system for producing high-quality content at volume.","status":"archived","format":"pdf","sourceUrl":"https://gohconsulting.app/sops/content-production-workflow.pdf","portalUrl":"https://gohconsulting.app/sops?sop=03","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Content Production Workflow\n\n- Source: https://gohconsulting.app/sops/content-production-workflow.pdf\n- Category: content / Production\n- Captured: 2026-09-21T14:01:49.519399+00:00\n\n\n### Page 1\n\n.CONTENT  PRODUCTION. .WORKFLOW.  \n.GOH  CONSULTING\n.\n  Goal:  Turn  raw  footage  into  short  and  long-form  content  that  retains  and  converts  \nleveraging\n \na\n \nrepeatable\n \nproduction\n \nline\n \nthat\n \nruns\n \non\n \nautopilot.\n  In  this  SOP,  we’ll  cover  everything  from:  the  exact  systems  we  use,  how  content  \nﬂows\n \nand\n \ngets\n \ntracked,\n \nthe\n \npost\n \nproduction\n \nprocess,\n \nand\n \nhow\n \nwe\n \nrepurpose\n \nlong-form\n \nvideos\n \ninto\n \nshort-form.\n  \nOverview\n \nThere  are  3  Main  Parts  to  our  Content  Production  Workﬂow.   -  Hiring  &  Management:  building  a  Creative  Team  of  A  Players  and  the  tool  \nstack\n \nrequired\n -  Content  Systems  &  Tracking:  the  pipeline  from  idea  to  posted,  and  how  we  \nmeasure\n \nperformance\n -  Clipping  Process:  turn  every  long-form  video  into  a  backlog  of  intentional  \nshort-form\n \nvideos\n  \n1\n \n-\n \nHiring\n \n&\n \nM anagement\n \n Our  team  and  system  runs  completely  on  autopilot.  This  is  the  exact  team  and  tool  \nstack\n \nwe\n \nleverage\n \nto\n \nensure\n \ncontent\n \ngets\n \nﬁlmed,\n \nclipped,\n \nedited\n \nand\n \nposted\n \nwith\n \nminimal\n \nfriction.\n  The  Team  \n\n### Page 2\n\nFinding  talent  is  easy  when  you  have  a  personal  brand.  Anyone  who  applies  from  \nyour\n \naudience\n \nis\n \nalready\n \nsold\n \non\n \nyou\n \nand\n \nthe\n \nbrand,\n \nso\n \nexpectations\n \nare\n \neasy\n \nto\n \nset.\n \nEvery\n \nsingle\n \nperson\n \nin\n \nmy\n \nteam\n \ncame\n \nthrough\n \nthe\n \nbrand.\n  If  we’re  looking  to  hire  for  a  speciﬁc  role,  we  run  a  simple  story  sequence  that  looks  \nsomething\n \nlike\n \nthis:\n  \n  Hiring  Story  Framework  -  Line  1:  Name  the  role  you  are  hiring  for  -  Line  2:  List  the  expectations  for  that  role   -  Line  3:  List  your  role  experience  &  understanding  requirements  -  Line  4:  CTA  to  apply  (Link  or  DM)   Alternatively,  you  can  access  our  Private  Talent  Database  below:   \n\n\n### Page 3\n\nhttps://nickel-binder-b69.notion.site/26bd2a33e63381749ecfe88a6a7a828e?v=26bd2a33e633804f947d000c7038a124&source=copy_link  Make  sure  to  use  the  ﬁlters  to  ﬁnd  someone  who  aligns  with  your  company  and  \nwhat\n \nyou\n \nare\n \nlooking\n \nfor.\n  Eg.  able  to  work  5+  hours  per  day  and  edits  on  Premier  Pro  &  After  Effects    Team  Structure   As  you  scale  your  brand  and  build  your  team,  it  should  be  structured  something  like  \nthis:\n  -  Short  Form  Editor:  average  rate  is  $20  -  $30  Per  Video  -  Long  Form  Editor:  average  rate  is  $100  -  $250  Per  Video  depending  on  the  \nformat\n \nand\n \ncomplexity\n -  Thumbnail  Designer:  initially  this  can  be  the  long  form  editor.  A  base  rate  per  \nvideo\n \nfor\n \nmultiple\n \nthumbnail\n \nvariations\n \nif\n \n$100-$250\n -  Clipper:  initially  this  can  just  be  the  short  form  editor  but  should  be  hired  \nwhen\n \nyou’re\n \npushing\n \ncontent\n \nat\n \nscale.\n \nThey\n \nare\n \nusually\n \noffered\n \na\n \nbase\n \nrate.\n  DON’T  HIRE  a  creative  director  until  you’ve  scaled  upwards  of  $100k/month.   The  reason  why  is  because  you’re  still  the  brain  behind  the  brand  and  you’d  have  to  \nlead\n \na\n \nCD\n \nanyway.\n \nIf\n \nyou\n \ndon’t\n \nhave\n \na\n \nstrong\n \nunderstanding\n \nof\n \nyour\n \nbrand,\n \nit’s\n \njust\n \na\n \ncase\n \nof\n \nthe\n \nblind\n \nleading\n \nthe\n \nblind.\n  Here’s  an  overview  of  our  Internal  Team  and  their  Responsibilities:   \n\n### Page 4\n\n  Team  Management  When  managing  a  team,  you  need  to  set  very  clear  expectations  and  have  a  strong  \naccountability\n \nsystem\n \nin\n \nplace.\n \nTo\n \ndo\n \nthis,\n \nwe\n \nrecommend\n \nhaving\n \n2\n \nkey\n \nsystems\n \nin\n \nplace:\n  1.  Team  Calls  -  This  is  by  far  the  most  important  factor  when  actually  building  team  \nculture\n -  We  like  to  host  3x  Calls  per  week  with  our  Creative  Team  on  Monday,  \nWednesday\n \nand\n \nFriday\n -  Note:  the  Mon/Wed  call  should  include  ALL  Team  Members  \nwhere\n \nas\n \nthe\n \nFriday\n \ncall\n \nshould\n \nbe\n \nfor\n \nSenior\n \nTeam\n \nMembers\n \nONLY\n  2.  EOW  Report  -  Creatives  like  to  work  at  their  own  speed  and  don’t  want  to  have  to  ﬁll  \nin\n \na\n \nform\n \nat\n \nthe\n \nend\n \nof\n \neach\n \nday\n \n(contrary\n \nto\n \nsales\n \nteams)\n \nso\n \nwe\n \nfound\n \nan\n \nEOW\n \nform\n \nallows\n \nus\n \nto\n \nhold\n \nthe\n \nteam\n \naccountable\n \nwithout\n \ndraining\n \nthem\n -  Here’s  the  Questions  we  ask  and  KPIs  we  track  in  our  EOW  Report  \n\n\n### Page 5\n\n-  Number  of  Videos  Completed  -  Number  of  Videos  Edited  -  Number  of  Videos  Revised  -  What  are  you  working  on  at  the  moment?  -  What  do  you  need  help  with?   Tools  These  are  the  exact  tools  we  use  to  streamline  the  production  process  and  ensure  \nour\n \ncreatives\n \nhave\n \naccess\n \nto\n \neverything\n \nthey\n \nneed:\n  Frame.io  →  Review  System  Notion  →  Main  Content  Dashboard  VidIQ  →  YouTube  SEO   Canva  →  Design  Scheduling  &  Analytics  (Optional)  →  Metricool   \n2\n \n-\n \nContent\n \nSystems\n \n&\n \nTracking\n \nOnce  you  have  the  team  in  place,  it  is  crucial  that  you  have  systems  that  are  \noptimised\n \nfor\n \nproducing\n \ncontent\n \nat\n \nscale.\n \nThis\n \nis\n \nan\n \noverview\n \nof\n \nthe\n \nexact\n \nsystems\n \nwe\n \nuse\n \nin\n \nour\n \nday\n \nto\n \nday\n \ncontent\n \nproduction.\n \nWe’ve\n \nspent\n \nover\n \n2+\n \nyears\n \nperfecting\n \nthese.\n  Main  Dashboard  We  hold  everything  in  a  centralised  Notion  Dashboard.  This  includes:  ideation,  \nediting\n \nand\n \ntracking.\n  Below  is  our  Editor  Dashboard.  This  allows  us  to  assign  editors  videos  and  see  what  \nvideos\n \nare\n \nin\n \nthe\n \npipeline.\n  Here’s  step-by-step  how  we  use  this:   \n\n### Page 6\n\n1.  We  upload  the  raw  footage  to  Frame,  create  a  share  link,  and  create  a  new  \ntab\n \non\n \nNotion\n 2.  In  this  tab,  we  link  the  Raw  Footage,  tag  an  Editor  so  they  are  notiﬁed  they  \nhave\n \na\n \nvideo\n \nto\n \nedit\n \nand\n \nsometimes\n \nlink\n \na\n \nReference\n \nVideo\n \nso\n \nthey\n \nunderstand\n \nhow\n \nto\n \nexecute\n \nthe\n \nediting\n 3.  As  the  editor  completes  the  work,  they  will  add  a  link  to  the  edited  video  and  \nmove\n \nthe\n \ntab\n \nalong\n \nthe\n \npipeline\n  And  that’s  the  exact  system  we  use  to  go  from  raw  footage  to  edited  video.   \n  Tracking  Once  we’ve  published  the  content,  it  is  extremely  important  that  we  track  the  \nperformance.\n \nThis\n \nallows\n \nus\n \nto\n \nunderstand\n \nwhat\n \nvideos\n \nperform\n \nwell\n \nversus\n \nwhat\n \nvideos\n \ndo\n \nnot\n \nand\n \nconsistently\n \nadapt\n \nour\n \nstrategy.\n \n\n\n### Page 7\n\n We’ve  built  2  Main  Trackers  that  allow  us  to  generate  predictable  views  and  lead  \nﬂow\n \nby\n \nbeing\n \nintentional\n \nwith\n \nour\n \ncontent:\n  1.  Growth  Tracker  →  here  we  take  all  of  our  outlier  videos  and  reverse  engineer  \nwhy\n \nthey\n \nperformed\n \nwell\n -  We  track  everything  from  the  hook,  transcript,  topic,  format  etc  so  we  \nknow\n \nwhat\n \nto\n \ndouble\n \ndown\n \non\n \nin\n \nour\n \nfuture\n \nvideos\n -  This  gets  ﬁlled  out  by  a  member  of  our  Content  Team  at  the  end  of  \nevery\n \nmonth\n  \n  2.  ICP  Tracker  →  here  we  list  every  ICP  Follower  we  have  generated  and  track  \nwhich\n \nvideos\n \nthey\n \ncame\n \nfrom\n -  This  allows  us  to  double  down  on  the  videos  that  generate  the  most  \nICP\n \nFollowers\n \nresulting\n \nin\n \nus\n \nhaving\n \npredictable\n \nlead\n \nﬂow\n \n -  This  gets  ﬁlled  out  by  our  Appointment  Setter  at  the  end  of  every  day   \n\n\n### Page 8\n\n  Below  is  a  template  where  you  can  access  our  Content  Dashboard  and  Tracking  \nSystems:\n  Content  Dashboard  https://nickel-binder-b69.notion.site/Client-Dashboard-328d2a33e63380b8815de0d3d8d3eb66?source=copy_link  Growth  Tracker  https://nickel-binder-b69.notion.site/Growth-Tracker-be0d2a33e63382ea9a5c01c5c518c8ff?source=copy_link  ICP  Tracker  https://nickel-binder-b69.notion.site/36ad2a33e63381818c8eee57acdd9bb6?v=36ad2a33e63381b98d43000c357a95e5&source=copy_link   \n3\n \n-\n \nClipping\n \nP rocess\n \n\n\n### Page 9\n\nChances  are,  you’re  tight  for  time  when  producing  content.  Maybe  it’s  because  \nyou’re\n \nstill\n \nin\n \nschool\n \nor\n \nyou’re\n \nfocused\n \non\n \nfulﬁllment\n \nbut\n \nin\n \nreality,\n \nthere’s\n \nno\n \nexcuse\n \nnot\n \nto\n \nbe\n \nposting\n \nquality\n \ncontent\n \nconsistently.\n  That’s  why  we  developed  a  clipping  process  that  allows  us  to  take  long  form  videos  \nand\n \nconvert\n \nthem\n \ninto\n \nintentional\n \nshort\n \nform\n \nclips\n \nthat\n \nspeak\n \ndirectly\n \nto\n \nour\n \nICP\n \nand\n \nhave\n \nviral\n \npotential.\n  You  can  access  the  exact  Clipping  SOP  we  use  below:  https://docs.google.com/document/d/1lO6FfBNDqO9BdYDqJ3lWbL8RV2uWhn0HWCHTR99-Kfw/edit?usp=sharing  Here’s  how  it  works:  -  Drop  the  long-form  transcript  into  Claude  -  It  pulls  the  strongest  moments  and  scores  them  -  Then  the  clipper  cuts  each  one  and  hands  it  off  to  a  Short  Form  Editor    \nQuick\n \nchecklist\n \n Run  this  when  setting  up  your  Content  Workﬂow.  Every  box  should  be  a  yes:   Team  &  Management   Every  creative  role  you  need  is  ﬁlled  (short  form  editor,  long  form  editor,  thumbnail  designer,  clipper)   You're  hiring  from  your  own  audience  ﬁrst  via  the  Hiring  Story  Framework  (role  →  expectations  →  requirements  →  CTA)   Team  calls  are  scheduled  3x/week  (Mon/Wed  for  all,  Fri  for  seniors  only)   EOW  Report  is  live  and  tracking:  videos  completed,  edited,  revised,  current  focus,  blockers   Tool  stack  is  set  up  and  the  team  has  access:  Frame.io,  Notion,  VidIQ,  Canva  \n\n### Page 10\n\n Content  System  &  Tracking   Centralised  Notion  dashboard  holds  ideation,  editing,  and  tracking  in  one  place   Raw  footage  ﬂows:  uploaded  to  Frame  →  share  link  →  new  Notion  tab  →  editor  tagged  →  reference  video  linked  where  needed   Editors  move  tabs  along  the  pipeline  and  attach  the  edited  link  as  they  go   Growth  Tracker  is  being  ﬁlled  monthly  by  the  Content  Team  (hook,  transcript,  topic,  format  on  every  outlier)   ICP  Tracker  is  being  ﬁlled  daily  by  the  Appointment  Setter  (every  ICP  follower  mapped  back  to  the  video  that  drove  them)   \n"},{"badge":"04","group":"content","section":"Production","title":"Master B-Roll","description":"Build a reusable B-roll library so edits are faster and more dynamic.","status":"archived","format":"pdf","sourceUrl":"https://gohconsulting.app/sops/master-b-roll.pdf","portalUrl":"https://gohconsulting.app/sops?sop=04","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Master B-Roll\n\n- Source: https://gohconsulting.app/sops/master-b-roll.pdf\n- Category: content / Production\n- Captured: 2026-09-21T14:01:52.655607+00:00\n\n\n### Page 1\n\n \n.MASTER  B-ROLL.  .GOH  CONSULTING.   B-roll  footage  is  a  game-changer  for  enhancing  the  visual  appeal  and  engagement  \nof\n \nyour\n \ncontent.\n \nThis\n \nSOP\n \ncovers\n \nhow\n \nto\n \neffectively\n \nincorporate\n \nb-roll\n \ninto\n \nyour\n \ncontent.\n \n The  average  human  attention  span  is   8  seconds.  To  combat  this,  use  b-roll  to  \ncaptivate\n \nand\n \nhold\n \nyour\n \naudience's\n \nfocus.\n \nBy\n \nincorporating\n \nconcise\n \nand\n \nengaging\n \nfootage,\n \nyou\n \ncan\n \nsigniﬁcantly\n \nboost\n \nyour\n \nchances\n \nof\n \nretaining\n \nviewer\n \nattention\n \nand\n \nconveying\n \nyour\n \nmessage\n \neffectively.\n  \nW hat\n \nis\n \nB-Roll?\n \n B-roll  footage  refers  to  supplementary  video  clips  that  complement  your  main  \nfootage,\n \nadding\n \ndepth,\n \ncontext,\n \nand\n \nvisual\n \ninterest\n \nto\n \nyour\n \nstory.\n \nIt\n \ncan\n \ninclude\n \ncutaways,\n \ntransitions,\n \nand\n \nadditional\n \nscenes\n \nthat\n \nenhance\n \nthe\n \nnarrative\n \nand\n \nkeep\n \nviewers\n \nengaged.\n  \nW hy\n \nuse\n \nB-Roll?\n \n ●  Break  up  talking  heads:  B-roll  helps  to  diversify  your  content,  breaking  up  \nmonotonous\n \ntalking-head\n \nsegments\n \nand\n \nkeeping\n \nviewers\n \ninterested.\n ●  Add  context  and  depth:  B-roll  footage  provides  additional  context,  helping  \nviewers\n \nunderstand\n \ncomplex\n \nconcepts\n \nand\n \nideas.\n ●  Enhance  storytelling:  B-roll  adds  an  extra  layer  of  storytelling,  allowing  you  to  \nconvey\n \nemotions,\n \nsettings,\n \nand\n \natmospheres.\n ●  Increase  engagement:  B-roll  keeps  viewers  engaged,  encouraging  them  to  \nwatch\n \nuntil\n \nthe\n \nend.\n  \n\n### Page 2\n\nTypes\n \nof\n \nB-Roll\n \n ●  Emotion:  faces,  reactions,  effort,  feeling.  Close-ups  that  connect  the  viewer  to  \nyou\n \nas\n \na\n \nperson\n ●  Context:  establishing  shots  that  set  the  world:  the  villa,  the  city,  the  space.  ●  Transition:  motion  and  movement  clips  that  carry  the  edit  from  one  beat  to  \nthe\n \nnext\n \nand\n \nkeep\n \npacing\n \ntight.\n ●  Proof:  payment  screenshots,  testimonials,  client  wins  etc.    \n  \nTips\n \nfor\n \neffective\n \nB-Roll\n \n ●  Keep  it  relevant:  Ensure  B-roll  aligns  with  your  content  and  messaging.  ●  Use  a  mix  of  shots:  Vary  your  B-roll  with  different  angles,  close-ups,  and  wide  \nshots.\n ●  Experiment  with  speed:  Adjust  the  speed  of  your  B-roll  to  match  the  tone  and  \npace\n \nof\n \nyour\n \nvideo.\n ●  Don't  overdo  it:  Balance  B-roll  with  your  main  footage,  avoiding  overwhelming  \nviewers.\n  \n \n \n\n\n### Page 3\n\nYour\n \nB-Roll\n \nShot\n \nList\n \n(Getting\n \nStarted)\n \n \n ●  Establishing  shots  of  your  workspace   ●  Footage  of  team  members  working  ●  Aerial/Drone  footage  of  you  ●  Footage  of  you  working  ○  Writing  ○  Drawing  on  whiteboard  ○  On  laptop  ○  On  phone  ○  Hiking  ○  Biking  ●  Footage  of  you  in  nature  ○  Beach  ○  Forest  ○  Running  ●  Footage  of  you  in  the  gym   ●  Footage  of  you  reading  ●  Traveling  ○  Airports  ○  Villa  shots   ○  Swimming   ○  Sunrise/Sunset  ●  Cutaways  of  computer  screens  ●  Client  interviews   ●  Dapping  up  team  members/clients   ●  Team  activities  ●  Team  retreats   ●  Hanging  out  with  the  team  ●  Drawing  on  the  whiteboard  or  mapping  out  a  plan  ●  Filming  content  BTS  ●  Old  footage  in  your  iPhone  over  the  years  \n\n### Page 4\n\n●  Milestone  achievements  (awards,  recognition)  ●  Before-and-after  footage  ●  Customer  success  stories  ●  How-it's-made  footage  ●  Behind-the-scenes  moments  ●  Emotions  ○  Happy   ○  Stressed  ○  Sad  ○  Focused   ○  Thinking  ●  Payment  Screenshots  ●  Payments  on  screen/phone   Organize  Your  B-Roll  in  Frame.IO  \n  The  easiest  way  to  create  folders  for  your  B-Roll  is  to  make  a  list  of  all  the  activities,  \nactions\n \nand\n \nemotions\n \nyou\n \ndo\n \nover\n \nthe\n \ncourse\n \nof\n \na\n \nmonth.\n \nThese\n \nbecome\n \nyour\n \nmost\n \ncommonly\n \nused\n \nB-Roll\n \nfolders\n \nwhich\n \nyou\n \nplace\n \nyour\n \nfootage\n \nin.\n \nYou\n \ncan\n \nalways\n \ncreate\n \nmore\n \norganised\n \nfolders\n \nas\n \nyou\n \nﬁlm\n \nmore\n \nfootage.\n \n  \n\n\n### Page 5\n\n \nHow\n \nto\n \nFilm\n \nB-Roll\n \n Dedicated  sessions,  ﬁlmed  in  blocks.   ●  Book  a  dedicated  b-roll  session  rather  than  grabbing  what  you  can  every  time  \nyou\n \nshoot.\n \n(When\n \ntime\n \nis\n \ntight,\n \ncapture\n \non\n \nthe\n \nmove,\n \nbut\n \na\n \nfocused\n \nsession\n \nis\n \nwhere\n \nthe\n \nlibrary\n \ngets\n \nbuilt)\n ●  For  every  moment,  get  multiple  shot  types:  ○  a  wide  to  establish  the  scene    ○  a  medium  for  the  subject   ○  and  a  close-up  or  detail  for  emotion   ○  More  coverage  now  means  more  edit  ﬂexibility  later  and  fewer  \nreshoots\n \n \nGear\n \nfor\n \nB-Roll\n \n \n Camera  +  Tripod  Locked-off  establishing  and  static  shots  \nGimbal  Smooth  movement,  tracking,  following  a  subject   \nMagic  Arm  Creative  and  unique  perspectives  \nSuction  Mount  Car  and  window  perspectives   \nDrone   Aerial  and  establishing  shots     \nShot\n \nTypes\n \n&\n \nFram ing\n  Wide  Establishes  the  space  and  the  world  \nMedium  The  subject  in  context,  often  the  hero  shot  \nClose-up  Draws  the  viewer  in,  the  subject's  expression  \n\n### Page 6\n\nExtreme  close-up   Emotion  and  texture:  face,  sweat,  hands,  detail  \nDetail  /  cutaway  The  small  stuff  editors  live  on:  textures,  light,  objects  \nAerial  /  Drone  Location  perspective   \nPOV  Unique  perspective  on  what's  happening  in  the  shot     \nShot\n \nList\n \nTem plate\n  Use  Your  Storyboard  to  Create  a  Shot  List  As  you  write  the  script  in  a  Google  Doc,  add  shot-list  comments  against  each  line.  \nThose\n \ncomments\n \nbecome\n \nthe\n \nstoryboard\n \nand\n \nthe\n \nB-roll\n \nlist\n \nthe\n \nteam\n \nﬁlms\n \nagainst.\n Example  (B-Roll  for  Sweden  Mastermind):  https://experienced-munchkin-ee3.notion.site/Sweden-B-Roll-Shot-List-2f450efb64558025bce1c4f28e180123?source=copy_link\n \n \nShot\n \nList\n \nAI\n \nP rom pt\n \n You  are  a  creative  director  building  a  cinematic  B-roll  shot  list.  I'm  a  solo  creator  ﬁlming  myself.  Location:  [describe]  Time  of  day:  [morning  /  afternoon  /  evening]  Mood:  [calm  /  focused  /  intense  /  aspirational]  Platform:  [YT  \\  IG]  Gear:  [camera  or  phone,  lenses,  tripod  /  gimbal]  The  video  is  about:  [topic]  ICP:  [who  you  serve]  Give  me  a  shot  list  across  the  4  B-roll  categories:  Emotion  -  faces,  reactions,  feeling;  close-ups  that  connect  \n\n### Page 7\n\nContext  -  the  environment  and  world  around  me;  establishing  shots  Transition  -  movement  that  cuts  one  shot  into  the  next  Proof  -  screens,  results,  the  work;  backs  up  my  claims  For  each  shot  give:  subject,  angle  or  movement,  and  location.  Mix  wide,  medium  and  close-up  shots.  Prioritise  composition,  lighting  and  depth.  \nOnly\n \nconcrete\n \nshots\n \nI\n \ncan\n \nﬁlm\n \n-\n \nno\n \ngeneric\n  \nW here\n \nto\n \nfind\n \ninspiration\n \n ●  Save  B-roll  you  love  from  creators  you  admire  ●  Build  a  swipe  folder  of  shots,  angles  and  transitions  ●  Pull  from  ﬁlms,  music  videos  and  ads  -  not  just  coaches  \n"},{"badge":"05","group":"content","section":"Production","title":"Short Form Editor Training SOP","description":"Train editors to cut high-retention short-form video to your standard.","status":"archived","format":"pdf","sourceUrl":"https://gohconsulting.app/sops/short-form-editor-training-sop.pdf","portalUrl":"https://gohconsulting.app/sops?sop=05","original":"","text":"","sourceDir":"text","screenshotCount":0,"body":"# Short Form Editor Training SOP\n\n- Source: https://gohconsulting.app/sops/short-form-editor-training-sop.pdf\n- Category: content / Production\n- Captured: 2026-09-21T14:01:48.847401+00:00\n\n\n### Page 1\n\n.SHORT  FORM  EDITOR. .TRAINING.  \n.GOH  CONSULTING\n.\n  Goal:  Help  you  achieve  our  exact  editing  style  by  following  our  step-by-step  \nworkﬂow\n \nwhen\n \nediting\n \nShort\n \nForm\n \nvideos.\n  \nW hat\n \nthis\n \nis\n \n \nBelow  are  some  examples  of  our  Short  Form  Editing  Style.  It  consists  primarily  of  A  \nRoll,\n \nB\n \nRoll\n \nand\n \nUI\n \nAnimations.\n  Examples:   -  https://www.instagram.com/reel/DaLqduuBFF8/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA== -  https://www.instagram.com/reel/DaBdUDcMXxV/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA== -  https://www.instagram.com/reel/DZlEUIhMou5/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==  In  this  SOP,  we  will  break  down  exactly  how  to  replicate  this  style,  the  workﬂow  to  \nachieve\n \nthis\n \nand\n \nresources\n \nrequired.\n  \nStep\n \n1\n \n-\n \nClipping\n \nThis  is  the  ﬁrst  and  most  important  step  of  the  editing  process  as  it  will  directly  \naffect\n \nthe\n \nperformance\n \nof\n \nthe\n \nvideo\n \nonce\n \nposted.\n \nThere\n \nare\n \ntwo\n \nmain\n \nparts\n \nto\n \nthe\n \nclipping\n \nprocess:\n  1.  Maximising  Viral  Potential  2.  Removing  Fluff  &  Errors  \n\n### Page 2\n\n 1.  Maximising  Viral  Potential  When  clipping  Long  Form  Videos  and  converting  them  into  Short  Form  Videos,  we  \nwant\n \nto\n \nmake\n \nsure\n \nwe\n \nare\n \nintentional\n \nwith\n \nwhat\n \nwe\n \nchoose\n \nto\n \ninclude\n \nin\n \nthe\n \nvideo\n \nand\n \nwhat\n \nwe\n \nchoose\n \nto\n \nremove.\n  The  video  should  not  just  be  edited  chronologically,  it  should  be  structured  in  a  way  \nthat\n \nmaximises\n \nretention\n \nand\n \nkeeps\n \nthe\n \nviewer\n \nhooked.\n  We’ve  implemented  AI  into  our  Clipping  Process  allowing  us  to  clip  videos  at  scale.   You  can  access  the  exact  SOP  we  use  here:  Clipping  SOP  2.  Removing  Fluff  &  Errors  We  also  should  be  looking  to  remove  ﬂuff  from  the  video.  This  is  any  segment  that  \ndoesn’t\n \nadd\n \nany\n \nlasting\n \nmessage\n \nor\n \nvalue\n \nto\n \nthe\n \nvideo\n \nor\n \nwhere\n \nthe\n \ncreator\n \nrepeats\n \nsomething\n \nthey\n \nhave\n \nalready\n \nsaid.\n  To  streamline  the  video,  also  remove  any  errors  where  the  creator  is  stuttering,  \npronounces\n \nwords\n \nwrong\n \nor\n \nif\n \nthere\n \nis\n \na\n \nlong\n \npause.\n  Video  Tutorial  -   \nStep\n \n2\n \n-\n \nColour\n \nGrade\n \nIf  the  footage  was  ﬁlmed  in  LOG,  chances  are  it  will  look  something  like  Version  A  in  \nthe\n \nimage\n \nbelow.\n  To  achieve  the  look  of  Version  B,  we’ve  created  a  custom  SooWei  LUT  that  will  save  \nyou\n \nhours\n \nof\n \ncolour\n \ngrading\n \nand\n \nallow\n \nyou\n \nto\n \nreplicate\n \nour\n \naesthetic:\n  Download  Link  to  Custom  SooWei  LUT  \n\n### Page 3\n\nOnce  you’ve  downloaded  the  LUT,  select  your  footage  in  your  timeline  and  head  \nover\n \nto\n \nthe\n \nLumetri\n \nColour\n \nPanel.\n \nUnder\n \nBasic\n \nCorrection,\n \nclick\n \nInput\n \nLUT\n \nand\n \nbrowse.\n  \n  Then  select  the  LUT  from  your  Downloads  and  it  will  be  applied  to  the  footage.    Video  Tutorial  -   \nStep\n \n3\n \n-\n \nAudio\n \nEnhancem ent\n \nIf  the  quality  of  the  audio  isn’t  optimal,  there  are  a  couple  tools  we  can  use  to  make  \nit\n \nsound\n \nsharper.\n \nThis\n \nshould\n \nbe\n \nused\n \nif:\n \nthe\n \naudio\n \nis\n \nmufﬂed,\n \nthe\n \nvideo\n \nwas\n \nﬁlmed\n \nin\n \nwindy\n \nconditions\n \nor\n \nif\n \nthere\n \nis\n \nbackground\n \nnoise.\n  First,  export  the  raw  audio  as  an  MP3  File  in  Premier  Pro.  Your  export  settings  \nshould\n \nlook\n \nsomething\n \nlike\n \nthis:\n  \n\n\n### Page 4\n\n  Next,  head  over  to  Adobe  Podcast  Speech  Enhancement and  upload  the  audio  ﬁle.  You  will  have  FREE  Access  to  this  tool  with  your  existing  Adobe  subscription.   Once  you’ve  uploaded  the  audio  ﬁle,  adjust  the  settings  until  the  audio  quality  is  \nimproved.\n \n  These  are  the  typical  settings  we  recommend  f
