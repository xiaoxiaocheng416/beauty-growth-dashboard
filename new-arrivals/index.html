": 227, "gmv7": 227}]}}, "updated_at": 1772040996}}</script>
<script>
const DATA = JSON.parse(document.getElementById('kbdata').textContent);
const HISTORY = DATA.history || { products: {} };

function shopValues() {
  const s = DATA.shops || {};
  return Object.values(s);
}

function norm(s) { return (s||'').toString().toLowerCase(); }

function withinWindow(ts, days) {
  if (!ts) return false;
  const now = Math.floor(Date.now()/1000);
  return ts >= (now - days*86400);
}

function flattenItems(days, q, brandFilter, showZeros) {
  const shops = shopValues();
  const out = [];
  for (const sh of shops) {
    const brand = sh.brand || '';
    const shop = sh.shop || '';
    const shop_key = sh.shop_key || (brand + ' — ' + shop);
    if (brandFilter && norm(brand) !== norm(brandFilter)) continue;
    const items = sh.items || [];
    for (const it of items) {
      const ts = it.launch_time;
      if (!withinWindow(ts, days)) continue;
      const title = it.title || '';
      if (q && !norm(title).includes(norm(q))) continue;

      const g7 = Number(it.gmv7 || 0);
      const g28 = Number(it.gmv28 || 0);
      if (!showZeros && !(g7 > 0 || g28 > 0)) continue;

      out.push({
        brand, shop, shop_key,
        product_id: it.product_id,
        title,
        tiktok_pdp: it.tiktok_pdp,
        launch_time: ts,
        rating: it.rating,
        image_url: it.image_url,
        gmv28: it.gmv28,
        gmv7: it.gmv7,
        gmv28_show: it.gmv28_show,
        gmv7_show: it.gmv7_show,
        sold7: it.sold7,
        sold7_show: it.sold7_show,
      });
    }
  }
  return out;
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts*1000);
  return d.toISOString().slice(0,10);
}

function pct(a,b){
  if (!a || !b) return null;
  const x = Number(a), y = Number(b);
  if (!isFinite(x) || !isFinite(y) || y<=0) return null;
  return (x/y)*100;
}

function sparkline(vals){
  const ticks = ['▁','▂','▃','▄','▅','▆','▇','█'];
  const xs = vals.filter(v=>v!==null && v!==undefined).map(Number).filter(v=>isFinite(v));
  if (xs.length<2) return '';
  const min=Math.min(...xs), max=Math.max(...xs);
  const span = (max-min) || 1;
  return vals.map(v=>{
    if (v===null || v===undefined) return '·';
    const n=Number(v);
    if (!isFinite(n)) return '·';
    const t=Math.max(0,Math.min(0.999,(n-min)/span));
    return ticks[Math.floor(t*ticks.length)];
  }).join('');
}

function historySeries(pid){
  const rec = (HISTORY.products||{})[pid];
  const series = rec && rec.series ? rec.series : [];
  // last 90 points max
  const pts = series.slice(-90);
  return pts.map(p=>p.gmv28);
}

function imgProxy(url){
  if(!url) return url;
  // If url is already a local path (relative), use as-is.
  if(!/^https?:\/\//.test(url)) return url;
  // Use a public image proxy to avoid hotlink/referrer/CORS issues on GitHub Pages.
  // weserv expects URL without scheme.
  const u = url.replace(/^https?:\/\//,'');
  return `https://images.weserv.nl/?url=${encodeURIComponent(u)}&w=360&fit=cover&output=webp`;
}

function render() {
  const days = parseInt(document.getElementById('window').value, 10);
  const q = document.getElementById('q').value || '';
  const sort = document.getElementById('sort').value;
  const brand = window.__brandFilter || '';
  const showZeros = document.getElementById('zeros')?.value === 'show';

  const items = flattenItems(days, q, brand, showZeros);
  items.sort((a,b)=> (sort==='old' ? (a.launch_time||0)-(b.launch_time||0) : (b.launch_time||0)-(a.launch_time||0)));

  const list = document.getElementById('list');
  list.innerHTML = '';

  document.getElementById('headline').textContent = brand ? ('品牌：' + brand) : '全部品牌';
  document.getElementById('stats').textContent = `窗口：${days}天 · 条目：${items.length}`;

  if (items.length===0) {
    list.innerHTML = `<div class="itemMeta">没有结果（试试更长时间窗口或清空筛选）</div>`;
    return;
  }

  for (const it of items) {
    const el = document.createElement('div');
    el.className='item';
    const r = (it.rating && it.rating>0) ? ` <span class="pill">⭐ ${it.rating}</span>` : '';
    const img = it.image_url ? `
      <div class="itemMeta" style="margin-top:10px">
        <img
          src="${imgProxy(it.image_url)}"
          data-orig="${it.image_url}"
          alt="cover"
          referrerpolicy="no-referrer"
          loading="lazy"
          onerror="this.onerror=null; this.src=this.dataset.orig;"
          style="max-width:180px;border-radius:10px;border:1px solid rgba(36,48,65,.6)"/>
      </div>
    ` : '';

    const weeklyShare = (() => { const p = pct(it.gmv7, it.gmv28); return (p!==null) ? p.toFixed(1) : null; })();
    // trend removed by request

    el.innerHTML = `
      <div class="itemTitle"><strong>${it.title}</strong></div>
      <div class="itemMeta">
        <span class="pill">${formatDate(it.launch_time)}</span>
        <span class="pill">${it.shop_key}</span>
        ${r}
        ${it.gmv7_show ? `<span class="pill">GMV(7d): ${it.gmv7_show}</span>` : ''}
        ${it.gmv28_show ? `<span class="pill">GMV(28d): ${it.gmv28_show}</span>` : ''}
        ${weeklyShare ? `<span class="pill">Share (7d/28d): ${weeklyShare}%</span>` : ''}
        <a class="pill" href="${it.tiktok_pdp}" target="_blank" rel="noreferrer">打开 TikTok PDP</a>
      </div>
      ${img}
    `;
    list.appendChild(el);
  }
}

function renderBrands() {
  const days = parseInt(document.getElementById('window').value, 10);
  const q = document.getElementById('q').value || '';
  const showZeros = document.getElementById('zeros')?.value === 'show';
  const brandsDiv = document.getElementById('brands');
  const shops = shopValues();

  const counts = new Map();
  for (const sh of shops) {
    const brand = sh.brand || '';
    const items = sh.items || [];
    let c=0;
    for (const it of items) {
      if (!withinWindow(it.launch_time, days)) continue;
      if (q && !norm(it.title||'').includes(norm(q))) continue;
      c++;
    }
    counts.set(brand, (counts.get(brand)||0) + c);
  }

  const brands = Array.from(counts.entries()).sort((a,b)=> (b[1]-a[1]) || a[0].localeCompare(b[0]));
  brandsDiv.innerHTML='';

  const make = (name, count, isAll=false) => {
    const row=document.createElement('div');
    const active = isAll ? (!window.__brandFilter) : (window.__brandFilter && norm(window.__brandFilter)===norm(name));
    row.className='brand' + (active ? ' active' : '');
    row.innerHTML = `<span>${name||'(unknown)'}</span><span class="count">${count}</span>`;
    row.onclick=()=>{
      if (isAll) window.__brandFilter = '';
      else window.__brandFilter = (window.__brandFilter && norm(window.__brandFilter)===norm(name)) ? '' : name;
      renderBrands();
      render();
    };
    return row;
  };

  brandsDiv.appendChild(make('(All)', flattenItems(days, q, '', showZeros).length, true));
  for (const [name,count] of brands) {
    brandsDiv.appendChild(make(name, count));
  }
}

// persist UI prefs
const PREF_KEY = 'kb_new_arrivals_prefs_v1';
function loadPrefs(){
  try { return JSON.parse(localStorage.getItem(PREF_KEY) || '{}') || {}; } catch(e){ return {}; }
}
function savePrefs(p){
  try { localStorage.setItem(PREF_KEY, JSON.stringify(p||{})); } catch(e){}
}
const prefs = loadPrefs();
if (prefs.window) document.getElementById('window').value = String(prefs.window);
if (prefs.sort) document.getElementById('sort').value = String(prefs.sort);

['window','q','sort'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener(id==='q' ? 'input' : 'change', ()=>{
    const p = loadPrefs();
    p.window = document.getElementById('window').value;
    p.sort = document.getElementById('sort').value;
    savePrefs(p);
    renderBrands();
    render();
  });
});

renderBrands();
render();
</script>
