<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@ty_kodes Links</title>
  <style>
    :root {
      --ink: #171717;
      --muted: #71757c;
      --line: #e6e1d9;
      --green: #0b7b62;
      --paper: #fbfaf7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .panel {
      width: min(720px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 34px;
    }
    .label {
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 12px 0 24px;
      font-size: clamp(40px, 7vw, 74px);
      line-height: .94;
      letter-spacing: 0;
    }
    .row {
      display: grid;
      gap: 12px;
    }
    a {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px 20px;
      color: inherit;
      text-decoration: none;
      background: #fff;
    }
    a strong {
      font-size: 22px;
    }
    a span {
      color: var(--muted);
      font-size: 14px;
    }
    a:hover {
      border-color: var(--green);
      color: var(--green);
    }
    @media (max-width: 620px) {
      .panel { padding: 24px; }
      a { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="label">4-20-26</div>
    <h1>@ty_kodes</h1>
    <div class="row">
      <a href="product-4-20-26/">
        <strong>Product</strong>
        <span>/ty_kodes/product-4-20-26/</span>
      </a>
      <a href="framework-4-20-26/">
        <strong>Framework</strong>
        <span>/ty_kodes/framework-4-20-26/</span>
      </a>
    </div>
  </main>
</body>
</html>
